// Package codegraph.ui.v1 defines codegraph ui's wire protocol: a Connect
// RPC service over the repository's own read-only internal/query.Engine
// (RPC-01, RPC-02). This is a SECOND proto surface, independent of
// internal/schema/graph.proto's on-disk graph-store record format — this
// package never appears on disk, only on the loopback wire.
//
// Additive-only discipline (D-02a, inherited from internal/schema):
// within this package, a field number is never renumbered and never
// reused. When a field is retired, its number is added to a `reserved`
// clause instead of being deleted or repurposed.
//
// Deliberate omission — Query vs Search (plan 01-08): internal/query.Engine
// exposes both Query (full node records for an exact name/kind match) and
// Search (the lightweight Location-only projection of the same match).
// Only Search is exposed here. Query's fuller shape — calls, called-by, and
// the multi-definition candidate set — is strictly subsumed by plan
// 01-09's GetNodeDetail rpc, which covers node lookup; Search covers
// discovery. Exposing both Query and Search on the wire would give the UI
// two overlapping name-lookup rpcs with different result shapes and no
// rule about which to reach for. This service's contract is "every read
// the UI needs", not "every exported method on Engine" — this is that
// contract applied, not an oversight.
//
// Plan 01-10's attachment (RPC-05, D-11/D-12/D-13): a `SourceBlob`-typed
// source field on three messages plan 01-09 declared, at each message's
// next free field number as of the end of 01-09 — exactly the numbers
// 01-09 recorded here as intent, spent now:
//   - GetNodeDetailResponse: source = 9
//   - NodeDefinition: source = 5
//   - ExploreGroup: source = 4
// Plan 01-09's Task 3 known-number fixture (internal/uiserver/readonly_test.go)
// pinned every number allocated through 01-09; this plan EXTENDS that
// fixture with these three plus SourceBlob's own six, and every entry
// 01-09 wrote still holds afterward.
syntax = "proto3";

package codegraph.ui.v1;

option go_package = "github.com/seanb4t/codegraph-go/internal/uiproto/uiv1;uiv1";

// UIService is codegraph ui's RPC surface. Plan 01-01 (the phase's tracer)
// defined GetStatus alone, proving the whole transport end-to-end. Plan
// 01-08 adds the six mechanical structured-result reads — Search, Files,
// Callers, Callees, Impact, Affected — bringing the surface to seven of
// the nine total methods, one rpc per task so the tree builds after every
// task. GetNodeDetail and Explore are plan 01-09's, at which point the
// full nine-method, read-only set is asserted by equality (T-01-04).
// Every rpc opens, uses, and closes its own Engine via internal/uiserver's
// withEngine seam (SRV-04).
service UIService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Files(FilesRequest) returns (FilesResponse);
  rpc Callers(CallersRequest) returns (CallersResponse);
  rpc Callees(CalleesRequest) returns (CalleesResponse);
  rpc Impact(ImpactRequest) returns (ImpactResponse);
  rpc Affected(AffectedRequest) returns (AffectedResponse);
  rpc GetNodeDetail(GetNodeDetailRequest) returns (GetNodeDetailResponse);
  rpc Explore(ExploreRequest) returns (ExploreResponse);
  // GetPermalink is plan 03-05's tenth rpc (D-06): it turns a repo-relative
  // path and an optional line/end_line anchor into a GitHub blob URL
  // pinned to the commit the index was built at. Read-only: it performs
  // no network operation and mutates nothing (SRV-03). Its path argument
  // is confined by the SAME gate GetNodeDetailRequest.file uses
  // ((*query.Engine).ValidateRepoRelativePath, SRV-05) — no second
  // confinement implementation.
  rpc GetPermalink(GetPermalinkRequest) returns (GetPermalinkResponse);
  // GetHealth is plan 04-03's eleventh rpc (D-01): it projects
  // internal/query.StatusResult's richer per-language file counts,
  // per-kind node/edge counts, pending-change tallies, index-health
  // block and worktree-mismatch detection onto the wire. It exists
  // SEPARATELY from GetStatus, deliberately: GetStatus is fetched on
  // every navigation by the client's status gate (Phase 3's
  // createStatusGate) and must stay cheap, so none of this richer data
  // is added to GetStatusResponse (D-01). Confining
  // gitmeta.DetectIndexMismatch's up-to-four git subprocess cost to this
  // rpc's response shape, rather than GetStatusResponse, is D-02. Read-
  // only and additive per D-02a — it performs no network operation and
  // mutates nothing (SRV-03).
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  // FileGraph is plan 05-02's twelfth rpc (ENG-03/GRF-02/GRF-04): it
  // projects internal/query.Engine.FileGraph()'s file-granularity
  // dependency rollup onto the wire for the /graph view — every file
  // node, every aggregated source-file-to-target-file edge with its
  // sparse per-kind counts, the three exclusion counters that keep
  // D-03's and D-08's omissions visible rather than silent, and the
  // total cycle count. The rollup is computed FRESH per call from the
  // existing edges (D-05/D-09) — no precomputed projection, no new
  // record kind, no re-indexing. Cycle membership is computed
  // SERVER-SIDE (D-06), so the answer is independent of whichever
  // renderer GRF-01 selects — this is what protects GRF-05's swappable
  // seam. Read-only and additive per D-02a — it performs no network
  // operation and mutates nothing (SRV-03).
  rpc FileGraph(FileGraphRequest) returns (FileGraphResponse);
  // FileSymbols is plan 05-06's thirteenth rpc (GRF-03): it projects
  // internal/query.Engine.FileSymbols's per-file symbol enumeration onto
  // the wire — ordered, capped and counted. It exists SEPARATELY from
  // GetNodeDetail, deliberately: GetNodeDetail's file mode is fetched on
  // every Browse file navigation and carries a path and a source blob
  // only (internal/query.FileDetail has exactly two fields) — it does
  // not enumerate symbols, and hanging a symbol list off it would make
  // every navigation pay for data that view does not render. path is
  // confined by the SAME gate GetNodeDetailRequest.file and
  // GetPermalinkRequest.path use ((*query.Engine).ValidateRepoRelativePath,
  // SRV-05) — no second confinement implementation. Read-only and
  // additive per D-02a — it performs no network operation and mutates
  // nothing (SRV-03).
  rpc FileSymbols(FileSymbolsRequest) returns (FileSymbolsResponse);
  // WatchGraph is this service's fourteenth rpc (RPC-04): the service's
  // FIRST streaming method. It is a server-streaming rpc that pushes one
  // WatchGraphEvent every time the store's authoritative change signal
  // — Meta.last_sync_unix_ms — actually changes, so a client learns of a
  // re-index without polling. It is read-only by construction: it
  // accepts only a resume cursor and mutates nothing, performs no
  // network operation, and is proven so by this package's two existing
  // read-only guards (set-equality against wantUIServiceMethods and the
  // mutating-verb substring check), both re-extended to cover it. Its
  // name was chosen and verified CLEAN against the live mutatingVerbs
  // fixture before being written here — WatchIndex, IndexEvents,
  // StreamIndex and LiveUpdates were all rejected by that same fixture.
  rpc WatchGraph(WatchGraphRequest) returns (stream WatchGraphEvent);
}

// Node is the shared wire projection of a graph symbol record — the
// fields a UI view actually renders, mirroring internal/schema/graph.proto's
// Node message field-for-field (minus its reserved 50-59 annotation
// range, which has no consumer yet on either surface). Defined once here
// and reused across every response that needs a full node rather than a
// bare Location, so Phases 3-6 never have to reconcile divergent
// per-response node shapes for the same underlying record.
message Node {
  string id = 1;
  string kind = 2;
  string name = 3;
  string qualified_name = 4;
  string file_path = 5;
  string language = 6;
  int32 start_line = 7;
  int32 end_line = 8;
  int32 start_col = 9;
  int32 end_col = 10;
  string signature = 11;
  string docstring = 12;
  string visibility = 13;
  bool is_exported = 14;
  string return_type = 15;
}

// Location is the shared wire projection of internal/query.Location — a
// lightweight name/kind/file/line-only reference, with no source body or
// signature. Every traversal rpc's repeated result (Search, Callers,
// Callees, Impact, Affected) reuses this one message rather than a
// per-rpc variant.
message Location {
  string name = 1;
  string kind = 2;
  string file_path = 3;
  int32 start_line = 4;
}

// GetStatusRequest is presently empty of consulted fields — v1's server
// binds exactly one repository at startup (uiserver.Options.RepoPath, an
// unwired field per D-08) and every rpc reports on that repository.
message GetStatusRequest {
  // path is RESERVED for a future milestone where one server process
  // answers for more than one repository; the v1 handler does not read
  // it — every response reports on the server's own configured
  // RepoPath regardless of this field's value. Declared now, rather
  // than left for a later field-number addition, so the wire shape is
  // stable before any client depends on it.
  string path = 1;
}

// GetStatusResponse is the uiv1 projection of internal/query.StatusResult
// (D-06): a bounded subset sufficient for this tracer's health check,
// not the full CLI `status --json` shape. The mapping table lives in
// internal/uiserver/handlers.go's GetStatus doc comment.
message GetStatusResponse {
  // initialized mirrors StatusResult.Initialized: true whenever this
  // response was produced from a successfully opened Engine. False in
  // BOTH SRV-04 degrade cases (D-16, plan 01-11) — a not-initialized
  // repository and a store locked past graphstore.Open's retry budget —
  // which is exactly why store_exists (field 8) exists as a SEPARATE
  // field: it is what distinguishes the two false-initialized states
  // from each other.
  bool initialized = 1;

  // version mirrors StatusResult.Version — the schema version string
  // (fmt.Sprintf("%d", schema.SchemaVersion)), not a codegraph-go
  // release version (D-06, status.go's mapping table).
  string version = 2;

  // node_count mirrors StatusResult.NodeCount, a live graphstore.Reader
  // scan result. Absent (zero value: 0) means the store reported no
  // nodes, not "unknown" — this plan's GetStatus never returns a
  // zero-valued node_count for any other reason, since a failed Engine
  // open never reaches message construction in this plan.
  int64 node_count = 3;

  // edge_count mirrors StatusResult.EdgeCount, the same discipline as
  // node_count.
  int64 edge_count = 4;

  // file_count mirrors StatusResult.FileCount, the same discipline as
  // node_count.
  int64 file_count = 5;

  // stale mirrors StatusResult.Stale (D-04a): true when a sync is
  // pending (the watcher/daemon signal file exists, or the newest
  // on-disk source mtime is newer than the last recorded sync).
  bool stale = 6;

  // commit_sha (ENG-04, D-05/D-06) is the git commit this graph was
  // indexed at, read through (*query.Engine).IndexMeta and
  // schema.IndexedCommitSHA. Empty means the graph predates Meta field 8
  // (a pre-upgrade graph) or the index was built outside a git checkout
  // — both cases are "unknown", never an error, and the client must
  // render "unknown" rather than treating an empty value as a failure.
  string commit_sha = 7;

  // store_exists (SRV-04, D-16) reports whether query.ResolveCodegraphDir
  // found a .codegraph/ directory at all, independent of whether the
  // store inside it could actually be opened — ResolveCodegraphDir only
  // os.Stats the directory, so it succeeds regardless of a contended
  // store lock. False only in the not-initialized degrade case (no
  // .codegraph/ anywhere up the directory walk); true both in the
  // ordinary successful-open case AND in the indexing-in-progress
  // degrade case below, since in both of those the directory was found.
  // node_count/edge_count/file_count are zeroed whenever this response
  // was NOT produced from a successfully opened Engine (initialized ==
  // false).
  bool store_exists = 8;

  // indexing_in_progress (SRV-04, D-14/D-16) is true when store_exists is
  // true but the store stayed locked past graphstore.Open's bounded
  // retry budget — read as "a re-index is in progress", never as an
  // error condition. initialized is false whenever this is true: the
  // Engine was never successfully opened for this response.
  bool indexing_in_progress = 9;
}

// SearchRequest carries internal/query.Engine.Search's three arguments
// unchanged. limit is passed straight through: validateLimit and MaxLimit
// already bound it server-side for every caller, so this rpc adds no
// second copy of that rule that could drift from the Engine's own.
message SearchRequest {
  string term = 1;
  string kind = 2;
  int32 limit = 3;
}

// SearchResponse carries Search's Location matches, in the same order
// Engine.Search returns them.
message SearchResponse {
  repeated Location locations = 1;
}

// FileEntry is the wire projection of internal/query.FileEntry: one
// browsed file's identity plus its stored aggregate symbol/edge counts.
message FileEntry {
  string path = 1;
  string language = 2;
  int64 node_count = 3;
  int64 edge_count = 4;
}

// FileTreeNode is the wire projection of internal/query.FileTreeNode —
// one node of the "tree" format's nested directory projection. A
// directory node carries name, is_dir=true, and children, and NO path or
// language; a leaf (file) node carries name, is_dir=false, path and
// language, and NO children. A client that assumes every node carries a
// path will break on the first directory — this asymmetry is the wire
// shape's defining property, not an omission.
message FileTreeNode {
  string name = 1;
  bool is_dir = 2;
  string path = 3;
  string language = 4;
  repeated FileTreeNode children = 5;
}

// FilesRequest carries internal/query.FilesOptions' fields unchanged.
// depth and format are passed straight through: Engine.Files' own
// validateFilesDepth and format rejection already bound them
// server-side for every caller, so this rpc adds no second copy of
// either rule.
message FilesRequest {
  string pattern = 1;
  string filter = 2;
  string dir = 3;
  int32 depth = 4;
  string format = 5;
}

// FilesResponse is the wire projection of internal/query.FilesResult — a
// UNION, not two independent collections: format selects which ONE of
// files (the "flat" format) or tree (the "tree" format) is populated: a
// "flat" response carries a populated files and an EMPTY tree; a "tree"
// response carries a populated tree and an EMPTY files. A client must
// read format before deciding which field to render, exactly as
// internal/query/files.go's own FilesResult contract already requires
// its CLI/MCP callers to do.
message FilesResponse {
  string format = 1;
  repeated FileEntry files = 2;
  repeated FileTreeNode tree = 3;
}

// CallersRequest carries internal/query.Engine.Callers' two arguments
// unchanged. limit is passed straight through — validateLimit and
// MaxLimit already bound it server-side for every caller.
message CallersRequest {
  string symbol = 1;
  int32 limit = 2;
}

// CallersResponse mirrors internal/query.CallersResult's shape.
message CallersResponse {
  string symbol = 1;
  repeated Location callers = 2;
}

// CalleesRequest carries internal/query.Engine.Callees' two arguments
// unchanged, the same discipline as CallersRequest.
message CalleesRequest {
  string symbol = 1;
  int32 limit = 2;
}

// CalleesResponse mirrors internal/query.CalleesResult's shape.
message CalleesResponse {
  string symbol = 1;
  repeated Location callees = 2;
}

// ImpactRequest carries internal/query.Engine.Impact's two arguments
// unchanged. depth is passed straight through — validateDepth and
// clampDepth already bound/clamp it server-side for every caller.
message ImpactRequest {
  string symbol = 1;
  int32 depth = 2;
}

// ImpactResponse mirrors internal/query.ImpactResult's shape. depth is
// the CLAMPED depth Impact actually used (clampDepth's return value,
// echoed back by the Engine itself), not the caller's raw request value.
message ImpactResponse {
  string symbol = 1;
  int32 depth = 2;
  int32 node_count = 3;
  int32 edge_count = 4;
  repeated Location affected = 5;
}

// AffectedRequest carries internal/query.Engine.Affected's two
// arguments unchanged. depth is passed straight through — validateDepth
// and clampAffectedDepth already bound/clamp it server-side for every
// caller (a DIFFERENT default than Impact's clampDepth — see
// clampAffectedDepth's doc comment — so this is deliberately its own
// message, not a reuse of ImpactRequest).
message AffectedRequest {
  repeated string files = 1;
  int32 depth = 2;
}

// AffectedResponse mirrors internal/query.AffectedResult's shape.
message AffectedResponse {
  repeated string files = 1;
  repeated Location affected_tests = 2;
}

// NodeDetailMode discriminates which of GetNodeDetailResponse's three
// shapes is populated, mirroring internal/query.NodeDetailMode's three
// constants exactly (D-02). NODE_DETAIL_MODE_UNSPECIFIED is the required
// proto3 zero value and is never a mode NodeDetail itself produces.
enum NodeDetailMode {
  NODE_DETAIL_MODE_UNSPECIFIED = 0;
  NODE_DETAIL_MODE_FILE = 1;
  NODE_DETAIL_MODE_SINGLE_DEF = 2;
  NODE_DETAIL_MODE_MULTI_DEF = 3;
}

// GetNodeDetailRequest carries internal/query.Engine.NodeDetail's three
// arguments unchanged. line is `optional` (proto3 presence tracking) so
// the wire can distinguish "no line hint" (line unset, mapping to the
// Engine's nil *int) from an explicit line 0 — collapsing the two would
// silently disable NODE-03's line-narrowing for a caller that means to
// pass line zero.
message GetNodeDetailRequest {
  string symbol = 1;
  string file = 2;
  optional int32 line = 3;
}

// SourceBlob is RPC-05's bounded, two-unit projection of a verbatim
// source read (D-11, D-12, plan 01-10's checkpoint): every source blob
// leaving this process, at every attachment point below, is one of
// these — never a raw, unbounded byte string. Fields 1 through 6 are
// spent permanently (D-02a); reserved 50 to 59 mirrors the identical
// clause on internal/schema/graph.proto's Node and Edge messages and this
// file's own Meta-equivalent precedent: the band sits far above organic
// field numbering so a future pre-agreed field (payload metadata such as
// compression, encoding hints, or syntax-highlight spans) lands at an
// agreed number instead of colliding with whatever the next organic field
// would be.
//
// content is `bytes`, not `string`, and the UTF-8 guarantee it carries is
// SCOPED, never universal: if the input was valid UTF-8, content is too,
// because the byte cut never splits a rune — but indexed source is not
// guaranteed valid UTF-8, and a proto3 `string` field would fail to
// marshal such a file rather than serving it, turning an ordinary source
// view into a server error for one oddly-encoded file anywhere in the
// repository.
//
// Line counting (total_lines and returned_lines) follows one rule,
// applied identically to both: the count is the number of newline
// characters in the content, plus one when the content is non-empty and
// does not end in a newline. Worked examples: "" is 0 lines; "\n" is 1
// line; "a\nb\n" is 2 lines; "a\nb" (an unterminated final line) is 2
// lines. See internal/uiserver/truncate.go's countLines for the one
// implementation both the total and the returned count go through.
//
// truncated is never an error signal (D-12): the client always receives
// usable content, whether or not either cap fired, and renders "showing
// first N of M" using total_lines/total_bytes for M and
// returned_lines/returned_bytes for N.
message SourceBlob {
  bytes content = 1;
  bool truncated = 2;
  int32 total_lines = 3;
  int32 total_bytes = 4;
  int32 returned_lines = 5;
  int32 returned_bytes = 6;

  // Reserved band for future payload metadata (compression, encoding hints,
  // syntax-highlight spans). Mirrors the identical clauses on Node, Edge and
  // Meta in internal/schema/graph.proto: the band sits far above organic field
  // numbering so a pre-agreed future field lands at an agreed number instead of
  // colliding with whatever the next organic field would be. Maintainer ruling
  // at plan 01-10's one-way checkpoint; permanent under D-02a.
  reserved 50 to 59;
}

// NodeDefinition carries one multi-definition candidate (D-02). Every
// candidate in a GetNodeDetailResponse's definitions list carries its own
// node; detail_gathered distinguishes a candidate whose calls/called_by
// were actually fetched (one of the first uiMultiDefCap matches, see
// internal/uiserver/handlers.go) from one merely LISTED beyond the cap —
// for a listed-only candidate, calls and called_by are both empty and
// detail_gathered is false, so a client rendering "showing N of M" can
// tell which entries are complete without inferring it from emptiness
// alone (an in-cap candidate that genuinely calls and is called by
// nothing would otherwise be indistinguishable from an out-of-cap one).
// source (RPC-05, plan 01-10) is this candidate's verbatim, bounded source
// blob — populated whenever detail_gathered is true (the same lazy
// per-candidate lookup that fetches calls/called_by also fetches source,
// see internal/query.DefinitionDetail.Source); unset for a listed-only
// candidate, the same discipline calls/called_by already follow.
message NodeDefinition {
  Node node = 1;
  repeated Node calls = 2;
  repeated Node called_by = 3;
  bool detail_gathered = 4;
  SourceBlob source = 5;
}

// GetNodeDetailResponse is the discriminated wire projection of
// internal/query.NodeDetail's three shapes (D-02): mode identifies which
// group of fields below is populated; every field belonging to the other
// two groups is left at its zero value, never an error. A client reading
// the wrong field for the current mode gets a zero value, not a panic or
// a wire error — this asymmetry is the whole reason mode exists as its
// own field rather than being inferred from which fields are non-empty.
//
//	mode                      | populated fields
//	--------------------------|--------------------------------------------
//	NODE_DETAIL_MODE_FILE       | path, source
//	NODE_DETAIL_MODE_SINGLE_DEF | node, calls, called_by, source
//	NODE_DETAIL_MODE_MULTI_DEF  | symbol, definitions, total_candidates
//
// total_candidates is the TRUE total candidate count
// (len(NodeDetail.Multi.Matches)) regardless of how many entries in
// definitions actually carry gathered detail — the UI's own
// uiMultiDefCap bounds gathering, never the reported total, so a client
// can always render "showing N of M" accurately.
//
// source (RPC-05, plan 01-10) is the ONE new field this plan adds to this
// message, shared by both the file mode and the single-def mode — never
// both populated in the same response, since mode discriminates which is
// active. Multi-def mode carries its source per-candidate instead, on
// NodeDefinition.source, because a single response-level blob would lose
// which candidate it belongs to.
message GetNodeDetailResponse {
  NodeDetailMode mode = 1;

  // path is populated only in NODE_DETAIL_MODE_FILE.
  string path = 2;

  // node, calls and called_by are populated only in
  // NODE_DETAIL_MODE_SINGLE_DEF.
  Node node = 3;
  repeated Node calls = 4;
  repeated Node called_by = 5;

  // symbol, definitions and total_candidates are populated only in
  // NODE_DETAIL_MODE_MULTI_DEF.
  string symbol = 6;
  repeated NodeDefinition definitions = 7;
  int32 total_candidates = 8;

  // source is populated in NODE_DETAIL_MODE_FILE (the whole file's
  // verbatim content) and in NODE_DETAIL_MODE_SINGLE_DEF (the
  // definition's own file, read via (*query.Engine).SourceFor — a
  // deliberate wire-layer read the CLI's single-definition path does not
  // perform, going through the same repo-root confinement gate). Unset
  // in NODE_DETAIL_MODE_MULTI_DEF.
  SourceBlob source = 9;
}

// ExploreRequest carries internal/query.Engine.ExploreDetail's two
// arguments unchanged. max_files is passed straight through:
// Engine.ExploreDetail's own validateMaxFiles/clampMaxFiles/H21 adaptive
// budget already bound it server-side for every caller, so this rpc adds
// no second copy of that rule.
message ExploreRequest {
  string query = 1;
  int32 max_files = 2;
}

// ExploreGroup is the wire projection of internal/query.ExploreFileGroup:
// one matched file's path plus every matched symbol defined in it, in
// ranked-match order. skeletonized mirrors whether this group's path is
// present in internal/query.ExploreResult.SkeletonFiles — a per-group
// boolean carries the same information a second client-side lookup would
// need, without requiring one.
//
// source (RPC-05, plan 01-10) is this group's own bounded verbatim source
// blob, looked up by this group's OWN path key in
// internal/query.ExploreResult.Sources — never by position — mirroring
// skeletonized's lookup discipline exactly.
message ExploreGroup {
  string path = 1;
  repeated Node symbols = 2;
  bool skeletonized = 3;
  SourceBlob source = 4;
}

// BlastEntry is the wire projection of internal/query.ExploreBlast: one
// blast-radius bullet's matched symbol, its total caller count, and the
// distinct test files among those callers.
message BlastEntry {
  Node symbol = 1;
  int32 caller_count = 2;
  repeated string test_files = 3;
}

// ExploreResponse is the wire projection of internal/query.ExploreResult
// (D-01, D-02). empty mirrors ExploreResult.Empty: a query matching
// nothing is a SUCCESSFUL response with empty=true and zero groups, never
// an error — Explore()'s five distinct "no results" pipeline stages all
// funnel through this one representation, and turning it into an error
// would make an ordinary "no results" indistinguishable from a genuine
// failure. When empty is true, groups and blasts are both empty and
// symbol_count is 0.
//
// Each ExploreGroup carries its OWN matched symbols and skeletonized
// flag — internal/query.ExploreResult.Sources is a map keyed by each
// group's own Path, which is exactly why the source that plan 01-10
// attaches lands on ExploreGroup itself (see this file's header comment)
// rather than as a single response-level blob: a response-level blob
// would lose which file each blob belongs to, and a parallel unkeyed
// list would make the association positional and therefore fragile.
message ExploreResponse {
  string query = 1;
  bool empty = 2;
  bool stale = 3;
  int32 symbol_count = 4;
  repeated ExploreGroup groups = 5;
  repeated BlastEntry blasts = 6;
}

// IndexingInProgress is the typed Connect error detail SRV-04's degrade
// path (D-14) attaches to a CodeUnavailable response when the graph
// store stays locked past graphstore.Open's retry budget. Populated by
// plan 01-11's internal/uiserver/degrade.go (errIndexingInProgress) for
// every non-GetStatus rpc's degraded response; GetStatus itself never
// returns this detail — it degrades to a successful GetStatusResponse
// instead (D-16).
message IndexingInProgress {
  // message is a GENERIC, human-readable status string — never an OS
  // lock-file path, PID, or other host-local detail (Information
  // Disclosure risk to an unauthenticated loopback caller, T-01-06).
  // Absent (zero value: "") never occurs in practice: the later plan
  // that constructs this message always sets a non-empty generic
  // constant.
  string message = 1;
}

// GetPermalinkRequest carries the repo-relative path and optional line
// anchor GetPermalink needs to build a GitHub blob URL pinned to the
// indexed commit (D-06, D-09). path is confined by the same gate
// GetNodeDetailRequest.file goes through
// ((*query.Engine).ValidateRepoRelativePath, a delegating wrapper over
// the existing resolveSourcePath gate — SRV-05's reuse, never a second
// implementation). line and end_line are both `optional` (proto3
// presence) so the wire can distinguish "no anchor at all" (line unset)
// from an explicit line 0: when end_line is also set the anchor is a
// range (D-09), when line alone is set the anchor is a single line, and
// when line itself is unset there is no anchor at all.
message GetPermalinkRequest {
  string path = 1;
  optional int32 line = 2;
  optional int32 end_line = 3;
}

// PermalinkAvailability is a CLOSED, three-valued classification of a
// permalink's trustworthiness (D-07) — deliberately never a boolean and
// never an open string: collapsing "checked and not observed" into
// "could not check" would render a transient git failure as a confident
// claim that no link exists. PERMALINK_AVAILABILITY_UNSPECIFIED is the
// required proto3 zero value and is never a state GetPermalink itself
// produces.
//
//   - LINKABLE: the commit was OBSERVED on a remote-tracking branch
//     (`git branch -r --contains`, local knowledge only — no fetch is
//     ever performed). url is populated.
//   - LINKABLE_UNVERIFIED: url is populated, but the containment check
//     either ran and found no remote-tracking branch containing the
//     commit, or could not run at all (git absent, non-repo directory,
//     timeout). Both degrade to this SAME wire value deliberately: from
//     the caller's perspective the link is equally uncertain either way,
//     and reason names which case it was. This is never a claim the
//     commit is absent from the remote — only that this local clone does
//     not know it is there (D-07's one-directional-soundness rule).
//   - NO_LINK: url is empty. No GitHub remote could be resolved (no
//     origin, non-GitHub or lookalike host, malformed remote, git
//     absent — D-08) or the index carries no commit_sha at all (D-05, a
//     pre-upgrade graph). reason always names the specific cause.
enum PermalinkAvailability {
  PERMALINK_AVAILABILITY_UNSPECIFIED = 0;
  PERMALINK_AVAILABILITY_LINKABLE = 1;
  PERMALINK_AVAILABILITY_LINKABLE_UNVERIFIED = 2;
  PERMALINK_AVAILABILITY_NO_LINK = 3;
}

// GetPermalinkResponse answers honestly in every availability situation
// (D-07): no combination of these three fields is ever an error — an
// ordinary "no link here" is a SUCCESSFUL response, the same
// successful-empty-result discipline ExploreResponse.empty already
// follows for Explore's own five "no results" cases.
message GetPermalinkResponse {
  // url is populated when availability is LINKABLE or
  // LINKABLE_UNVERIFIED, and empty when availability is NO_LINK. Each
  // path segment is percent-encoded before being joined, so a path
  // containing a URL-significant character (#, ?, a space) never
  // silently produces a link to a different location than requested.
  string url = 1;
  PermalinkAvailability availability = 2;
  // reason is populated whenever availability is not LINKABLE, naming
  // the specific cause (unsupported/lookalike host, no remote
  // configured, unverified commit, absent commit_sha, git absent) so a
  // caller can act on it rather than receiving one undifferentiated
  // refusal.
  string reason = 3;
}

// GetHealthRequest is presently unread of any consulted field, mirroring
// GetStatusRequest's own shape (D-01, 04-03 Task 1 checkpoint).
message GetHealthRequest {
  // path is declared for a future milestone in which one server process
  // answers for more than one repository; the v1 handler does not read
  // it — every response reports on the server's own configured
  // RepoPath regardless of this field's value. This is NOT a protobuf
  // `reserved` declaration: the field IS on the wire and IS serialized
  // by every client, it is simply not read by this version's handler.
  string path = 1;
}

// WorktreeMismatch is the uiv1 projection of internal/gitmeta.Mismatch,
// field-for-field (04-03 Task 1 checkpoint). A PLAIN message field on
// GetHealthResponse, not `optional`: proto3 message fields are
// presence-tracked by construction, so the generated Go field is already
// a nil-able pointer with no extra keyword needed. Populated (non-nil)
// only when internal/query.Engine.WorktreeMismatch detects a genuine
// mismatch between the caller's working tree and the resolved index
// root (D-02/WORK-01); nil for a clean, in-tree repository. Deliberately
// carries host-absolute paths — the ONE scoped exception to this
// service's project_path/index_path privacy stance, because the warning
// is useless without naming both trees, and a clean tree still leaks
// nothing (T-04-09, accepted; extends the same exception already
// granted on the MCP surface).
message WorktreeMismatch {
  string worktree_root = 1;
  string index_root = 2;
}

// PendingChanges is the uiv1 projection of internal/query.PendingChanges
// (status.go:70-74), field-for-field (04-03 Task 1 checkpoint). Kept
// unprefixed despite shadowing the Go domain type name of the same
// name — handlers.go's mapper disambiguates via package qualifiers
// (query.PendingChanges vs uiv1.PendingChanges), the same discipline
// query.Location/uiv1.Location already establish in that file.
message PendingChanges {
  int32 added = 1;
  int32 modified = 2;
  int32 removed = 3;
}

// IndexHealth is the uiv1 projection of internal/query.IndexHealth
// (status.go:76-86), field-for-field (04-03 Task 1 checkpoint). Kept
// unprefixed for the same reason PendingChanges is — see that message's
// comment.
message IndexHealth {
  string built_with_version = 1;
  uint32 built_with_extraction_version = 2;
  uint32 current_extraction_version = 3;
  bool reindex_recommended = 4;
  string state = 5;
  int32 pending_refs = 6;
}

// GetHealthResponse is the uiv1 projection of internal/query.StatusResult
// (status.go:47-65), frozen field-for-field at the 04-03 Task 1
// checkpoint (a maintainer-approved one-way door, D-02a). Every field
// here mirrors its StatusResult counterpart exactly, mapped by the named
// healthToProto function in internal/uiserver/handlers.go — never an
// inline literal at the handler call site, so the mapping cannot drift
// from its source silently.
//
// project_path/index_path are DELIBERATELY ABSENT, matching
// GetStatusResponse's existing privacy stance (status.go's mapping
// table): they are blanked everywhere to avoid leaking host-local
// absolute paths, except for worktree_mismatch below, the one
// maintainer-approved scoped exception (T-04-09).
//
// commit_sha is deliberately DUPLICATED from GetStatusResponse (Task 1
// checkpoint sub-decision 2): the health page reads freshness from this
// rpc alone, without a second GetStatus round trip. It is computed by
// the SAME (*query.Engine).IndexMeta + schema.IndexedCommitSHA +
// schema.IsCommitSHA validation gate GetStatus applies — never a second,
// independently-drifting derivation.
message GetHealthResponse {
  // initialized mirrors StatusResult.Initialized. GetHealth does not
  // degrade-and-answer (unlike GetStatus's documented single exception,
  // D-16) — an unopenable store is an ordinary withEngine error for this
  // rpc, so initialized is always true on any successful response.
  bool initialized = 1;

  // version mirrors StatusResult.Version.
  string version = 2;

  // file_count mirrors StatusResult.FileCount.
  int64 file_count = 3;

  // node_count mirrors StatusResult.NodeCount.
  int64 node_count = 4;

  // edge_count mirrors StatusResult.EdgeCount.
  int64 edge_count = 5;

  // db_size_bytes mirrors StatusResult.DbSizeBytes (D-07).
  int64 db_size_bytes = 6;

  // backend mirrors StatusResult.Backend (the literal "pebble").
  string backend = 7;

  // files_by_language mirrors StatusResult.FilesByLanguage.
  map<string, int64> files_by_language = 8;

  // languages mirrors StatusResult.Languages.
  repeated string languages = 9;

  // nodes_by_kind mirrors StatusResult.NodesByKind.
  map<string, int64> nodes_by_kind = 10;

  // edges_by_kind mirrors StatusResult.EdgesByKind.
  map<string, int64> edges_by_kind = 11;

  // pending_changes mirrors StatusResult.PendingChanges.
  //
  // NOTE: inert placeholder — internal/query/status.go's StatusResult
  // composite literal never assigns PendingChanges, so this is always
  // the zero value {0,0,0} on every response (see status.go:34's own
  // mapping-table entry and files_status_test.go's "PendingChanges
  // stays an inert placeholder" subtest, which locks it). CR-02
  // (04-REVIEW.md) found the health page rendering this as if it were
  // a live trust signal; the fix removed that rendering rather than
  // populating this field. Computing a real value is engine work
  // (re-running Sync's diff at Status() time) — do not surface this
  // field again until that lands.
  PendingChanges pending_changes = 12;

  // index_health mirrors StatusResult.Index.
  IndexHealth index_health = 13;

  // worktree_mismatch mirrors StatusResult.WorktreeMismatch — see the
  // WorktreeMismatch message comment above for its privacy disposition.
  WorktreeMismatch worktree_mismatch = 14;

  // stale mirrors StatusResult.Stale (D-04a). This is the raw signal
  // only — GetHealth defines no second staleness or trust verdict; the
  // verdict is the client's, computed by classifyStatus (D-04).
  bool stale = 15;

  // commit_sha is duplicated from GetStatusResponse — see this
  // message's doc comment above for why and how it is validated.
  string commit_sha = 16;
}

// FileGraphRequest is presently unread of any consulted field, mirroring
// GetHealthRequest's own shape (05-02 Task 1 checkpoint).
message FileGraphRequest {
  // path is declared for a future milestone in which one server process
  // answers for more than one repository; the v1 handler does not read
  // it — every response reports on the server's own configured
  // RepoPath regardless of this field's value. This is NOT a protobuf
  // `reserved` declaration: the field IS on the wire and IS serialized
  // by every client, it is simply not read by this version's handler.
  string path = 1;
}

// FileGraphNode is the uiv1 projection of internal/query.FileGraphNode,
// field-for-field (05-02 Task 1 checkpoint).
message FileGraphNode {
  // path mirrors FileGraphNode.Path.
  string path = 1;

  // language mirrors FileGraphNode.Language.
  string language = 2;

  // symbol_count mirrors FileGraphNode.SymbolCount.
  int64 symbol_count = 3;

  // cycle_id mirrors FileGraphNode.CycleID: 0 for a file in no
  // strongly-connected cycle, else a 1-based component identifier
  // (GRF-04, D-06).
  int32 cycle_id = 4;
}

// FileGraphEdge is the uiv1 projection of internal/query.FileGraphEdge,
// field-for-field (05-02 Task 1 checkpoint).
message FileGraphEdge {
  // source_file mirrors FileGraphEdge.SourceFile.
  string source_file = 1;

  // target_file mirrors FileGraphEdge.TargetFile.
  string target_file = 2;

  // kind_counts mirrors FileGraphEdge.KindCounts, mirroring
  // GetHealthResponse.edges_by_kind's map field exactly, including its
  // sparse convention: a kind with zero observed edges is ABSENT from
  // the map, never present with value 0.
  map<string, int64> kind_counts = 3;

  // total_count mirrors FileGraphEdge.TotalCount.
  int64 total_count = 4;

  // in_cycle mirrors FileGraphEdge.InCycle: true when both this edge's
  // endpoints carry the same non-zero cycle_id. Deliberately redundant
  // with cycle_id on both endpoints — see 05-02 Task 1 checkpoint
  // sub-decision 2 for why: D-06's whole point is that GRF-04's
  // correctness must not be re-implemented by whatever renders the
  // graph, and a client-derived edge flag is exactly that
  // re-implementation in miniature.
  bool in_cycle = 5;
}

// FileGraphResponse is the uiv1 projection of internal/query.FileGraphResult
// (internal/query/traverse.go), frozen field-for-field at the 05-02 Task 1
// checkpoint (a maintainer-approved one-way door, D-02a). Every field
// here mirrors its FileGraphResult counterpart exactly, mapped by the
// named fileGraphToProto function in internal/uiserver/handlers.go —
// never an inline literal at the handler call site, so the mapping
// cannot drift from its source silently.
//
// The three excluded_* counters are on the wire deliberately (05-02
// Task 1 checkpoint sub-decision 1): D-03 drops contains edges and
// file-level self-edges and D-08 drops synthetic package pseudo-nodes;
// putting the counts on the response is what lets the UI state plainly
// what it is not showing, rather than silently misleading by omission.
message FileGraphResponse {
  // nodes mirrors FileGraphResult.Nodes.
  repeated FileGraphNode nodes = 1;

  // edges mirrors FileGraphResult.Edges.
  repeated FileGraphEdge edges = 2;

  // excluded_package_node_count mirrors FileGraphResult.ExcludedPackageNodes
  // (D-08).
  int64 excluded_package_node_count = 3;

  // excluded_self_edge_count mirrors FileGraphResult.ExcludedSelfEdges
  // (D-03).
  int64 excluded_self_edge_count = 4;

  // excluded_contains_edge_count mirrors FileGraphResult.ExcludedContainsEdges
  // (D-03).
  int64 excluded_contains_edge_count = 5;

  // cycle_count mirrors FileGraphResult.CycleCount (GRF-04, D-06).
  int32 cycle_count = 6;
}

// FileSymbolsRequest is the uiv1 projection of
// internal/query.Engine.FileSymbols's input (05-06 Task 1 checkpoint).
message FileSymbolsRequest {
  // path is a repo-relative file path, confined by the same
  // ValidateRepoRelativePath gate GetNodeDetailRequest.file and
  // GetPermalinkRequest.path use (SRV-05). There is no limit field in
  // v1: the response is capped server-side by query.MaxFileSymbols, and
  // a limit can be added additively later if a caller ever needs a
  // smaller page — a field added speculatively can never be taken back.
  string path = 1;
}

// FileSymbolsResponse is the uiv1 projection of
// internal/query.FileSymbolsResult (internal/query/filesymbols.go),
// frozen field-for-field at the 05-06 Task 1 checkpoint (a
// maintainer-approved one-way door, D-02a). Mapped by a named mapper in
// internal/uiserver/handlers.go — never an inline literal at the handler
// call site, so the mapping cannot drift from its source silently.
message FileSymbolsResponse {
  // symbols mirrors FileSymbolsResult.Symbols. Reuses the EXISTING
  // shared Node message rather than a new, narrower symbol shape (05-06
  // Task 1 checkpoint sub-decision 1): a repository has one symbol
  // shape, and a second one is how two vocabularies for the same domain
  // object start.
  repeated Node symbols = 1;

  // total_count mirrors FileSymbolsResult.Total: the TRUE number of
  // symbols the file has, whether or not the list below was capped.
  int32 total_count = 2;

  // truncated mirrors FileSymbolsResult.Truncated: true exactly when the
  // returned list was capped by query.MaxFileSymbols (05-06 Task 1
  // checkpoint sub-decision 2). A capped list is never returned without
  // both total_count and this flag riding along, so a partial answer is
  // never presented as complete.
  bool truncated = 3;
}

// WatchGraphRequest is the request for the service's only streaming rpc
// (RPC-04). since_generation is the resume point a
// reconnecting client sends: the last generation number it saw before
// disconnecting, so the server can decide what a resumed stream owes the
// client (Claude's Discretion, 06-CONTEXT.md). Zero means "no prior
// generation seen" — a fresh subscription.
message WatchGraphRequest {
  int64 since_generation = 1;
}

// WatchGraphEvent is WatchGraph's push payload (D-07, which corrects an
// earlier draft's field set): it mirrors GetStatusResponse's own field
// NAMES exactly — initialized, stale, store_exists, indexing_in_progress,
// commit_sha — so the browser's existing status-classification logic can
// consume this event directly, with no second representation of the
// same state. node_count, edge_count, healthy and health_message are
// deliberately ABSENT: no shipped view renders them, and views that need
// full data re-fetch through the rpc they already use rather than having
// their wire shape duplicated into this event.
//
// The change this event announces is detected server-side by comparing
// the store's own change signal across wakeups; that signal is never
// itself a field here, because detecting a change and describing the
// new state are two different jobs. This message is the latter.
message WatchGraphEvent {
  // generation is a monotonic counter, incremented once per emitted
  // event, so a reconnecting client's since_generation (above) has
  // something to resume from.
  int64 generation = 1;

  // initialized mirrors GetStatusResponse.initialized.
  bool initialized = 2;

  // stale mirrors GetStatusResponse.stale.
  bool stale = 3;

  // store_exists mirrors GetStatusResponse.store_exists.
  bool store_exists = 4;

  // indexing_in_progress mirrors GetStatusResponse.indexing_in_progress.
  bool indexing_in_progress = 5;

  // commit_sha mirrors GetStatusResponse.commit_sha.
  string commit_sha = 6;
}
