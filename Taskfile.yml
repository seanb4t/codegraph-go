# Single local-build/CI-invocation definition site (D-01, D-02). CI workflow
# `run:` steps call `task <target>` — they no longer own command bodies
# themselves. See go.tool.mod / go.tool-lint.mod for why the tools this
# Taskfile shells out to are pinned via isolated -modfile builds rather than
# `go install` or a marketplace action.
version: "3"

vars:
  GO_TOOL: GOWORK=off go tool -modfile=go.tool.mod
  GO_TOOL_LINT: GOWORK=off go tool -modfile=go.tool-lint.mod

tasks:
  default:
    desc: List available targets (does not build, test, or lint anything).
    silent: true
    cmds:
      - task --list

  build:
    desc: Build every package (compile check only, no binary retained).
    cmds:
      - go build ./...

  build:release:
    desc: >-
      Local convenience build producing ./codegraph with release-shaped
      ldflags (version metadata, -trimpath). This is NOT a release artifact —
      goreleaser (task check:goreleaser / .goreleaser.yaml / release.yml)
      builds, signs, and SBOMs what actually ships. Use this only to
      sanity-check a version-stamped local binary.
    cmds:
      - |
        set -euo pipefail
        VERSION=$(git describe --tags --always --dirty)
        COMMIT=$(git rev-parse HEAD)
        # TZ=UTC + git's own date formatter avoids GNU-vs-BSD `date -d`
        # incompatibility between Linux CI and macOS/BSD contributor
        # machines — no shell `date` binary is invoked at all.
        DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
        go build -trimpath -ldflags "-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=${VERSION} -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}" -o ./codegraph ./cmd/codegraph

  test:unit:
    desc: >-
      go test over every package except internal/daemon (isolated separately
      — see task test:daemon).
    cmds:
      - |
        set -euo pipefail
        # IN-08 (03-REVIEW.md): `set -e` does not propagate a failure out of
        # a process substitution — `mapfile -t pkgs < <(go list ... | grep
        # ...)` would succeed regardless of go list's own exit status, so a
        # partial emission before a failure could silently test a subset of
        # packages under a green check. Materialize the list first so go
        # list's exit code is checked by set -e before anything consumes it.
        pkgs_raw=$(go list ./...)
        mapfile -t pkgs < <(printf '%s\n' "$pkgs_raw" | grep -v '/internal/daemon$')
        go test "${pkgs[@]}"

  test:golden:
    desc: >-
      Golden parity suite (testdata/golden) — NOT covered by go list ./...
      (GOLDEN-01: the go tool ignores any directory named "testdata" when
      expanding ./...), so this is its own explicit target.
    cmds:
      - go test ./testdata/golden/...

  test:integration:
    desc: >-
      Subprocess integration harness (test/integration) — already reached by
      go list ./... (it's a normal package, not testdata/), but this explicit
      target guards against a future refactor of test:unit's filtered go list
      line silently dropping it too.
    cmds:
      - go test ./test/integration/...

  test:wireoracle:
    desc: >-
      Wire-level regression oracle (test/wireoracle) — spawns the real
      binary over real stdio and byte-compares normalized transcripts
      against testdata/wireoracle/transcripts/*.golden. Pre-migration wire
      regression baseline (VRFY-01/VRFY-04): must never be relaxed or
      re-baselined during the SDK swap in Phase 2. Measured 2026-08-05:
      ~5.8s wall-clock on the frozen single-scenario tree.
    cmds:
      - go test ./test/wireoracle/...

  test:daemon:
    desc: >-
      internal/daemon, isolated (-count=1). TestSoak and the flush-lock tests
      are a documented, PRE-EXISTING flake under full-suite parallel load
      (STATE.md, 08-CONTEXT.md "Flake note") — isolating them here is the
      documented handling; the tests are NOT removed or skipped, just run
      without contention from the rest of the suite.
    cmds:
      - go test ./internal/daemon/ -count=1

  test:race:
    desc: >-
      Concurrency packages under the race detector. -p 1 preserves the same
      no-parallel-package-contention isolation test:daemon relies on — do not
      run this concurrently with test:daemon (see the test wrapper's comment).
    cmds:
      # internal/mcp added during phase-01 UAT (01-UAT.md test 2): the
      # session-line hook in server.go writes to a shared caller-supplied
      # io.Writer from AddAfterInitialize, which fires once per initialize
      # across concurrent sessions — a genuine concurrency seam that had
      # neither a test nor race-detector coverage. The seam's own regression
      # test (TestSessionLineSurvivesConcurrentAndRepeatedInitialize) fails
      # deterministically without -race; this entry is the fallback net for
      # the races it cannot model.
      - go test -race -count=1 -p 1 ./internal/daemon/... ./internal/watch/... ./internal/cli/... ./internal/mcp/...

  vet:
    desc: >-
      go vet ./... — NEW enforcement as of this target (DEV-01): plain
      `go vet ./...` has never run in CI before; only two package-scoped
      GOOS=windows vets did, and those retired with native Windows support
      (quick task 260807-gho). Findings surfaced on first run are fixed,
      not suppressed.
    cmds:
      - go vet ./...

  vuln:
    desc: >-
      ADVISORY (VULN-01/VULN-03; D-04 superseded 04-01 Task 1 checkpoint —
      see 04-01-SUMMARY.md): govulncheck -mode=binary over the four tool
      binaries built from go.tool.mod (task, goreleaser, govulncheck) and
      go.tool-lint.mod (actionlint) — the 357 measured third-party modules
      that execute as credentialed CI tooling (repository write access and
      secrets) and were previously scanned by nothing (D-05: this target
      used to run `govulncheck ./...` over the main module only, a no-op
      duplicate of ci.yml's own gate that never touched either tool
      modfile). Reports, but never fails the build — this target was
      designed BLOCKING and was demoted to advisory after its own first
      real run found that goreleaser's binary carries a real,
      permanently-unfixed, symbol-reachable match for GO-2026-5932 (110
      vulnerable symbols in golang.org/x/crypto/openpgp, reached via
      goreleaser/cmd -> pipe/ko -> google/ko -> sigstore/cosign/oci ->
      sigstore/rekor/pkg/pki/pgp; goreleaser never imports openpgp
      directly, the ko pipe compiles into every goreleaser binary
      regardless of config, and the upstream package is unmaintained,
      Fixed in: N/A). Shipped blocking, this gate would have been
      permanently red from its first run on real in-scope tooling — worse
      than the no-op it replaces. All four binaries stay in scope (no
      allowlist, no exclusion): the point is detection, not build-failure,
      so a NEW finding in any binary is exactly as visible as this known
      one. -mode=binary is also symbol-level, NOT call-graph-aware: per
      govulncheck's own documentation, "Because Go binaries do not contain
      detailed call information, govulncheck cannot show the call graphs...
      It may also report false positives for code that is in the binary but
      unreachable" — a materially weaker guarantee than the source-mode
      analysis ci.yml's "govulncheck (DIST-03, blocking)" job performs over
      the main module, which this target does not replace or modify and
      which stays blocking, unchanged. Exit-code classification still
      drives what gets reported: 0 is clean (or a module-level-only match
      govulncheck itself does not consider a symbol hit); 3 is a
      symbol-matched vulnerability; any other status (usage error,
      vuln.go.dev unreachable) is also reported distinctly, never silently
      folded into "clean" — but none of the three fails this task. See
      vuln:selftest for the non-vacuity proof that DETECTION (not build
      failure) still fires.
    cmds:
      - |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "${scratch}"' EXIT

        echo "==> Building tool binaries (GOWORK=off; go.tool.mod x3, go.tool-lint.mod x1)"
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/task" github.com/go-task/task/v3/cmd/task
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/goreleaser" github.com/goreleaser/goreleaser/v2
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/govulncheck" golang.org/x/vuln/cmd/govulncheck
        GOWORK=off go build -modfile=go.tool-lint.mod -o "${scratch}/actionlint" github.com/rhysd/actionlint/cmd/actionlint

        # ADVISORY (D-04 superseded): every outcome below is REPORTED, never
        # fails this task. See this target's desc: for why — goreleaser's
        # binary carries a real, permanently-unfixed, symbol-reachable
        # vulnerability (GO-2026-5932) that would otherwise make a blocking
        # gate permanently red.
        for name in task goreleaser govulncheck actionlint; do
          set +e
          out=$({{.GO_TOOL}} govulncheck -mode=binary "${scratch}/${name}" 2>&1)
          status=$?
          set -e
          case "${status}" in
            0)
              echo "    ${name}: CLEAN (exit 0 — no symbol-matched vulnerability, or a module-level-only match govulncheck does not consider a symbol hit)"
              ;;
            3)
              echo "::warning::${name}: DETECTED — govulncheck -mode=binary exited 3 (symbol-matched vulnerability; advisory, does not fail the build)"
              echo "${out}"
              ;;
            *)
              echo "::warning::${name}: SCAN ERROR — govulncheck -mode=binary exited ${status} (usage error or vuln.go.dev unreachable; reported distinctly, never folded into CLEAN)"
              echo "${out}"
              ;;
          esac
        done

  vuln:selftest:
    desc: >-
      Non-vacuity proof for `vuln` (VULN-02): builds the permanent red-proof
      program (testdata/vulnredpoc — see its own doc comment) from
      go.tool.mod and asserts the underlying govulncheck -mode=binary scan
      exits EXACTLY 3 and names GO-2026-5932. Unlike `vuln` itself, THIS
      target is allowed to fail the build: a failure here means govulncheck's
      own exit-3/advisory-ID classification broke — a detection-mechanism
      regression, not a new vulnerability finding — which is exactly the
      failure `vuln`'s advisory stance cannot surface on its own (an
      advisory job that silently stops detecting is worse than a blocking
      one). testdata/vulnredpoc is excluded from `go list ./...`
      (GOLDEN-01) and built only here, by explicit path against
      go.tool.mod — it never enters the main module's package graph and
      adds no requirement to the root go.mod.
    cmds:
      - |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "${scratch}"' EXIT

        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/vulnredpoc" ./testdata/vulnredpoc

        set +e
        out=$({{.GO_TOOL}} govulncheck -mode=binary "${scratch}/vulnredpoc" 2>&1)
        status=$?
        set -e

        echo "${out}"

        if [ "${status}" -ne 3 ]; then
          echo "::error::vuln:selftest FAILED — govulncheck -mode=binary exited ${status} (want 3) scanning the deliberately-vulnerable testdata/vulnredpoc binary; the tool-modfile vulnerability gate's detection mechanism could not be proven able to fire"
          exit 1
        fi

        if ! printf '%s' "${out}" | grep -q "GO-2026-5932"; then
          echo "::error::vuln:selftest FAILED — scan exited 3 but its output does not name GO-2026-5932; a different advisory firing is not accepted as proof this specific detection path works"
          exit 1
        fi

        echo "vuln:selftest: PASS — govulncheck -mode=binary exited 3 and named GO-2026-5932 against testdata/vulnredpoc"

  check:darwin-toolchain:
    desc: >-
      Prove a native darwin host can CGo-build both release arches — the D-08
      canary. release.yml builds both darwin targets on a native macOS runner
      with Xcode's own clang (no zig, no osxcross) because a Linux-hosted CGo
      cross-link to darwin risks silently breaking libresolv-based DNS
      resolution in a binary that makes real HTTPS calls (`codegraph
      upgrade`). release.yml fires only on a `v*` tag push, so without this
      target nothing exercises that toolchain until a release is already
      being cut. Reports the SDK version deliberately: a newer SDK can
      produce a binary that builds, signs, and attests cleanly yet refuses to
      launch on an older macOS — the one failure here that is silent rather
      than loud.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "check:darwin-toolchain must run on a native darwin host — that is the property it exists to verify (D-08). Run it on macOS locally, or dispatch the darwin-toolchain-canary workflow."
      - sh: command -v clang
        msg: "clang not found. Install Xcode or the Command Line Tools: xcode-select --install"
    cmds:
      - sw_vers
      - uname -m
      - clang --version
      - xcrun --sdk macosx --show-sdk-version
      # Both arches, mirroring release.yml's matrix: arm64 is native, amd64 is
      # an arch-only cross on the same host and SDK (Go passes clang the right
      # -arch for GOARCH). -o /dev/null because only the link is being proven.
      - CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/codegraph
      - CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/codegraph

  check:darwin-release-build:
    desc: >-
      Prove GoReleaser itself can drive the darwin release build on a native
      darwin host (D-08). check:darwin-toolchain proves the *toolchain* with a
      plain `go build`; this target proves the *composition* release.yml
      actually runs — `goreleaser build --single-target` for both darwin
      arches, so .goreleaser.yaml's CGO_ENABLED=1 env, -trimpath, version
      ldflags and mod_timestamp are exercised on the macOS host instead of
      inferred from a linux run. It exists because release.yml fires only on a
      `v*` tag push, which means its first darwin GoReleaser invocation
      otherwise happens during a release that is already underway, on the one
      leg where the host OS is a correctness input rather than a speed choice.
      Uses --snapshot deliberately: a PR or dispatch HEAD carries no tag and
      GoReleaser hard-fails ("git tag ... was not made against commit ...")
      without one. The resolved version string is the only thing --snapshot
      changes, and the version string is not the property this target verifies.

      LOCAL-ONLY SINCE 2026-08-08 — this target is still NO LONGER RUN IN CI,
      but the reason changed (D-18, LOCKED, maintainer 2026-08-09): plan
      01-02 originally activated `binary_signs:` inside the BUILD pipeline,
      which forced `goreleaser build` (no `--skip=sign` exists for the build
      command) through a cosign KEYLESS OIDC call this canary cannot supply.
      Plan 02-02 moved cosign to the RELEASE-scoped `signs:` pipe — which is
      registered well after GoReleaser's hardcoded BuildPipeline entirely
      (internal/pipeline/pipeline.go, pinned goreleaser/v2@v2.17.1) — so
      `goreleaser build` NO LONGER REACHES ANY cosign call, and this target
      no longer needs a browser-driven keyless-signing flow or an OIDC
      token to complete.

      BUILD CLASS (plan 02-02's goreleaser-caller enumeration): this target's
      `goreleaser build --single-target` DOES still reach the notarize:
      pipe — `notary.MacOS{}` is registered INSIDE BuildPipeline, so it runs
      on every `goreleaser build` invocation regardless of `--skip`. The
      notarize skip key (`--skip=notarize`) is valid for the RELEASE command
      and NOT for the build command (internal/skips/skips.go, pinned
      goreleaser/v2@v2.17.1) — this target has NO escape hatch other than
      notarize.macos[0].enabled's five-term credential conjunction
      (MACOS_SIGN_P12/MACOS_SIGN_PASSWORD/MACOS_NOTARY_ISSUER_ID/
      MACOS_NOTARY_KEY_ID/MACOS_NOTARY_KEY, .goreleaser.yaml). On this
      canary's unprivileged environment none of those five are set, so
      `enabled:` resolves false and the pipe no-ops; do not mistake the
      absence of a `--skip=sign`-style flag for protection here — the
      credential guard is the ONLY thing stopping this target from reaching
      Apple. Was still covered pre-D-18 by `task release:dry-run` in
      linux-cross-canary's `cross-build` job on the same macOS profile
      (`goreleaser release` DOES accept `--skip=sign`); still true post-D-18.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "check:darwin-release-build must run on a native darwin host — that is the property it exists to verify (D-08). Run it on macOS locally, or dispatch the darwin-toolchain-canary workflow."
      - sh: command -v clang
        msg: "clang not found. Install Xcode or the Command Line Tools: xcode-select --install"
    cmds:
      - |
        set -euo pipefail

        # Build GoReleaser NATIVELY, with no GOOS/GOARCH in the environment,
        # and invoke that binary per-arch below. This ordering is load-bearing,
        # not stylistic: `go tool -modfile=go.tool.mod goreleaser` builds the
        # TOOL for whatever GOOS/GOARCH is set, so the obvious one-liner
        # (`GOARCH=amd64 {{.GO_TOOL}} goreleaser build ...`) yields an x86_64
        # GoReleaser running under Rosetta, whose child `xcrun` then resolves
        # as x86_64 and cannot load the arm64-only libxcrun.dylib from
        # CommandLineTools. That fails as a confusing `# runtime/cgo`
        # architecture error that reads like a broken toolchain but is really
        # a cross-built tool. release.yml does not hit this because
        # goreleaser-action installs a native prebuilt binary — which is
        # exactly the shape reproduced here.
        GORELEASER_BIN="$(mktemp -d)/goreleaser"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")"' EXIT
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        for arch in arm64 amd64; do
          echo "==> goreleaser build --single-target darwin/${arch}"
          GOOS=darwin GOARCH="${arch}" "${GORELEASER_BIN}" build \
            --single-target --snapshot --clean

          # Locate the built binary exactly as release.yml's rename step does:
          # dist/artifacts.json first (GoReleaser's own documented stable
          # lookup — dist/ subdirectory names are not guaranteed stable across
          # versions), with find(1) as the same defensive fallback.
          BIN=""
          if [ -f dist/artifacts.json ] && command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg a "${arch}" \
              '[.[] | select(.type=="Binary" and .goos=="darwin" and .goarch==$a)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::goreleaser produced no darwin/${arch} binary under dist/"
            exit 1
          fi

          # Assert the object is actually Mach-O of the requested arch. A
          # wrong-host build is the quiet failure this whole canary exists for:
          # it still produces something that builds, signs, and attests.
          DESC=$(file -b "${BIN}")
          echo "    ${BIN}: ${DESC}"
          case "${arch}:${DESC}" in
            arm64:*Mach-O*arm64*) ;;
            amd64:*Mach-O*x86_64*) ;;
            *) echo "::error::darwin/${arch} produced the wrong object: ${DESC}"; exit 1 ;;
          esac
        done

        rm -rf dist

  release:dry-run:
    desc: >-
      Prove the FULL `goreleaser release` composition — all four
      .goreleaser.yaml build entries (linux/amd64, linux/arm64, darwin/amd64,
      darwin/arm64) in ONE invocation — on a native darwin host, without
      publishing or signing anything (D-06, REL-05 enabling change).
      check:darwin-release-build already proves GoReleaser can drive a
      `build --single-target` darwin invocation; this target is the first
      thing in this repo to exercise `goreleaser release` itself, the
      single-runner shape the migrated release.yml (plan 01-03) will use.
      Uses --snapshot deliberately: a PR or dispatch HEAD carries no tag and
      GoReleaser hard-fails ("git tag ... was not made against commit ...")
      without one — the resolved version string is the only thing --snapshot
      changes, not the property this target verifies. Uses
      --skip=publish,sign so nothing is published to GitHub and no signing
      key/OIDC token is needed locally.

      RELEASE CLASS, notarize reachable (plan 02-02's goreleaser-caller
      enumeration): `--skip=sign` skips the release-scoped `signs:` pipe
      (cosign), but `notarize:` has its OWN skip key (`--skip=notarize`,
      valid for the release command — unlike the build command, see
      check:darwin-release-build's comment) that this target does NOT pass.
      `notary.MacOS{}` therefore DOES run here, because it is registered
      inside BuildPipeline and `goreleaser release` always runs
      BuildPipeline first. What stops it from reaching Apple on this
      unprivileged canary is ONLY notarize.macos[0].enabled's five-term
      credential conjunction (MACOS_SIGN_P12 and 4 siblings,
      .goreleaser.yaml) evaluating false — never `--skip=sign`, which is a
      different pipe.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:dry-run must run on a native darwin host — that is the runner class the migrated single-job release.yml (plan 01-03) uses (D-01). Run it on macOS locally, or dispatch the linux-cross-canary workflow, which runs this same target on namespace-profile-macos-6x14-tahoe."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml now cross-compile via zig cc/zig c++ (REL-05). CI installs zig 0.15.1 via mlugg/setup-zig; locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. --skip=publish,sign only skips the SIGN pipe — it does NOT skip the sboms: pipe. .goreleaser.yaml's sboms: block shells out to syft, and this precondition turns that into a named, actionable halt instead of a confusing mid-pipe failure (review HIGH-4). CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. Same forward reasoning as the syft precondition above: --skip=publish,sign skips the release-scoped signs: pipe today, but the permanent linux-cross-canary installs cosign before invoking it as defense-in-depth. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        # Build GoReleaser NATIVELY, with no GOOS/GOARCH in the environment,
        # exactly as check:darwin-release-build does and for the same
        # reason: a GOARCH-cross-built GoReleaser runs under Rosetta and its
        # child `xcrun` then resolves as x86_64, which cannot load the
        # arm64-only libxcrun.dylib from CommandLineTools — a confusing
        # "# runtime/cgo" architecture error that reads like a broken
        # toolchain but is really a cross-built tool. release.yml does not
        # hit this because goreleaser-action installs a native prebuilt
        # binary — reproduced here by building the tool with no GOOS/GOARCH
        # override.
        GORELEASER_BIN="$(mktemp -d)/goreleaser"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")"' EXIT
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        # zig cc/zig c++ default their LOCAL cache directory to a path next
        # to the C source file being compiled unless overridden. This
        # project's CGo tree-sitter dependencies compile from Go's module
        # cache (GOMODCACHE), which is read-only by design — without this
        # override, zig fails with "unable to open local cache directory
        # ...: AccessDenied" the first time either linux build id's zig cc
        # override actually runs. Point both the local and global cache at
        # a scratch dir cleaned up by the same trap as GORELEASER_BIN above.
        ZIG_CACHE_ROOT="$(mktemp -d)"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")" "${ZIG_CACHE_ROOT}"' EXIT
        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # No GOOS/GOARCH set here: unlike `build --single-target`,
        # `goreleaser release` resolves every target from each builds:
        # entry's own goos:/goarch: list, not from the environment. A
        # leftover GOOS/GOARCH would be at best a no-op and at worst mask a
        # misconfiguration (RESEARCH.md Pattern 5 / Pitfall 2).
        echo "==> goreleaser release --snapshot --skip=publish,sign --clean"
        "${GORELEASER_BIN}" release --snapshot --skip=publish,sign --clean

        # Assert via dist/artifacts.json (GoReleaser's own documented stable
        # lookup, same as check:darwin-release-build) that exactly four
        # released Binary entries exist, one per (goos,goarch) pair — a
        # green exit code alone is explicitly NOT the check (RESEARCH.md
        # anti-pattern). `goreleaser release` records type=="Binary" TWICE
        # per platform: once for the raw `go build` output (named literally
        # "codegraph", extra.Builder set, no extra.Format) and once for the
        # archives: pipe's renamed/copied release asset (extra.Format ==
        # "binary", the codegraph_<tag>_<goos>_<goarch> shape
        # internal/upgrade.releaseAssetName() expects) — filtering on
        # extra.Format=="binary" selects the actual release asset, not the
        # intermediate build artifact.
        if [ ! -f dist/artifacts.json ]; then
          echo "::error::goreleaser release produced no dist/artifacts.json"
          exit 1
        fi

        BINARY_COUNT=$(jq -r '[.[] | select(.type=="Binary" and .extra.Format=="binary")] | length' dist/artifacts.json)
        if [ "${BINARY_COUNT}" != "4" ]; then
          echo "::error::dist/artifacts.json has ${BINARY_COUNT} released Binary entries (extra.Format==\"binary\"), want exactly 4"
          exit 1
        fi

        for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${pair%/*}"
          GOARCH="${pair#*/}"

          BIN=""
          if command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg goos "${GOOS}" --arg goarch "${GOARCH}" \
              '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos==$goos and .goarch==$goarch)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph -path "*${GOOS}*${GOARCH}*" 2>/dev/null | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::goreleaser release produced no ${pair} binary under dist/"
            exit 1
          fi

          # Assert the object is the right machine — the failure mode a
          # green `goreleaser release` exit code alone cannot catch.
          DESC=$(file -b "${BIN}")
          echo "    ${pair}: ${BIN}: ${DESC}"
          case "${GOOS}:${GOARCH}:${DESC}" in
            linux:amd64:*ELF*x86-64*) ;;
            linux:arm64:*ELF*aarch64*) ;;
            darwin:amd64:*Mach-O*x86_64*) ;;
            darwin:arm64:*Mach-O*arm64*) ;;
            *) echo "::error::${pair} produced the wrong object: ${DESC}"; exit 1 ;;
          esac
        done

        echo "release:dry-run: four correctly-typed binaries produced in one goreleaser release invocation."

  release:dry-run-signed:
    desc: >-
      Sibling of release:dry-run — but does NOT skip sign. release:dry-run
      skips BOTH publish and sign, so signs:'s upgrade-sidecar naming
      template is never resolved except by a static assertion until the
      production release, where a wrong answer cannot be withdrawn (D-07).
      Resolves it early against a THROWAWAY LOCAL cosign key (no OIDC) — the
      reason plan 01-05's merge checkpoint can clear. Same run also proves
      sboms: documents: (--skip=publish does not skip SBOM). Pass condition:
      FOUR DISTINCT PUBLISHED NAMES per pipe from dist/artifacts.json — never
      a green exit code, never an on-disk listing (cycle-3 review HIGH-A).

      RELEASE CLASS, notarize reachable (plan 02-02's goreleaser-caller
      enumeration): identically to release:dry-run, `notarize:` is registered
      inside BuildPipeline and runs here regardless of the `--skip=publish`
      this target passes — the throwaway cosign key above rehearses ONLY the
      signs: pipe, not notarize:, which needs its own five Apple credential
      variables (MACOS_SIGN_P12 and siblings, .goreleaser.yaml) and is
      stopped on this canary by `enabled:` evaluating false, not by any
      `--skip` flag.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:dry-run-signed must run on a native darwin host — that is the runner class the migrated single-job release.yml (plan 01-03) uses (D-01). Run it on macOS locally, or dispatch the linux-cross-canary workflow, which runs this same target on namespace-profile-macos-6x14-tahoe."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml now cross-compile via zig cc/zig c++ (REL-05). CI installs zig 0.15.1 via mlugg/setup-zig; locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. This target's release invocation exercises the sboms: pipe (--skip=publish does not skip it). CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. This target's release invocation exercises the signs: pipe against a throwaway local key. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        # The config under test must be exactly what shipped.
        if ! git diff --quiet HEAD -- .goreleaser.yaml; then
          echo "::error::.goreleaser.yaml has uncommitted changes — the config under test must be exactly the committed one, or the SIGN-EVIDENCE/SBOM-EVIDENCE observation below is invalid"
          exit 1
        fi

        # ONE run-scoped temp dir tree for everything this rehearsal
        # generates — key material, the generated config copy, and the
        # native GoReleaser tool binary — never dist/ (--clean wipes it)
        # and never the working tree. Removed on exit via a single trap.
        SIGNTEST_DIR="$(mktemp -d)"
        GORELEASER_DIR="$(mktemp -d)"
        GORELEASER_BIN="${GORELEASER_DIR}/goreleaser"
        ZIG_CACHE_ROOT="$(mktemp -d)"
        cleanup() { rm -rf "${SIGNTEST_DIR}" "${GORELEASER_DIR}" "${ZIG_CACHE_ROOT}"; }
        trap cleanup EXIT

        # A THROWAWAY LOCAL cosign key pair, generated fresh in this temp
        # dir and used once — makes the sign pipe RUN. Not the production
        # identity; signs nothing anyone will verify. Production signing
        # (signs: carries no --key) stays keyless-OIDC, untouched.
        export COSIGN_PASSWORD="${COSIGN_PASSWORD:-codegraph-throwaway-rehearsal-password-not-for-verification}"
        cosign generate-key-pair --output-key-prefix "${SIGNTEST_DIR}/cosign" >/dev/null

        # Inject --key into a GENERATED COPY of .goreleaser.yaml — the whole
        # mechanism, not optional. COSIGN_PASSWORD DECRYPTS a key; it does
        # not SELECT one — without --key, cosign sign-blob falls through to
        # the keyless Fulcio/OIDC flow this job is denied (no id-token:
        # write anywhere in this composition), hanging or hard-failing
        # (cycle-2 review HIGH-1). Confirmed against the pinned
        # goreleaser/v2@v2.17.1 module that the sign pipe's subprocess
        # already inherits the full process environment (pkg/context:
        # Env = ToEnv(append(os.Environ(), ...))), so COSIGN_PASSWORD needs
        # no per-pipe env: addition — this one inserted line is the delta.
        GENERATED_CONFIG="${SIGNTEST_DIR}/.goreleaser.signtest.yaml"
        awk -v keyline="      - \"--key=${SIGNTEST_DIR}/cosign.key\"" '
          { print }
          /^      - "sign-blob"$/ { print keyline }
        ' .goreleaser.yaml > "${GENERATED_CONFIG}"

        # Assert the copy is a MINIMAL, ADDITIONS-ONLY delta before
        # invoking anything, so the rehearsal cannot silently drift into
        # testing a different configuration than the one that ships. `<`
        # lines in default diff(1) output are deletions/replacements —
        # their presence is a hard failure. Every `>` (added) line must
        # carry --key= or COSIGN_PASSWORD.
        DIFF_OUT="$(diff .goreleaser.yaml "${GENERATED_CONFIG}" || true)"
        if printf '%s\n' "${DIFF_OUT}" | grep -q '^<'; then
          echo "::error::${GENERATED_CONFIG} differs from the committed .goreleaser.yaml by more than additions:"
          printf '%s\n' "${DIFF_OUT}"
          exit 1
        fi
        BAD_ADDITIONS="$(printf '%s\n' "${DIFF_OUT}" | grep '^> ' | grep -v -- '--key=' | grep -v 'COSIGN_PASSWORD' || true)"
        if [ -n "${BAD_ADDITIONS}" ]; then
          echo "::error::${GENERATED_CONFIG} has additions not matching --key= or COSIGN_PASSWORD:"
          printf '%s\n' "${BAD_ADDITIONS}"
          exit 1
        fi
        echo "generated config differs from the committed .goreleaser.yaml by additions only:"
        printf '%s\n' "${DIFF_OUT}"

        # Build GoReleaser NATIVELY, no GOOS/GOARCH in the environment —
        # identical reasoning to release:dry-run's own comment: a
        # GOARCH-cross-built GoReleaser runs under Rosetta and its child
        # xcrun then resolves as x86_64, which cannot load the arm64-only
        # libxcrun.dylib from CommandLineTools.
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        # Same zig-cache AccessDenied trap release:dry-run already hit
        # (01-01-SUMMARY.md Rule-3 deviation): this invocation still
        # cross-compiles all four targets before the sign/sbom pipes run.
        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # Invoke against the GENERATED copy — --skip=publish ONLY. `sign`
        # is deliberately NOT skipped: that is the entire point of this
        # target. Because the config now lives outside the repo root,
        # assert immediately after that dist/artifacts.json exists AT THE
        # REPO ROOT — GoReleaser resolves `dist` relative to the process
        # working directory, but a silent relocation would make every
        # assertion below vacuous.
        echo "==> goreleaser release -f ${GENERATED_CONFIG} --snapshot --skip=publish --clean"
        "${GORELEASER_BIN}" release -f "${GENERATED_CONFIG}" --snapshot --skip=publish --clean

        if [ ! -f dist/artifacts.json ]; then
          echo "::error::dist/artifacts.json not found at the repo root after the run — goreleaser resolves dist relative to the process working directory"
          exit 1
        fi

        # ASSERT FROM dist/artifacts.json, NOT FROM A FILENAME GLOB, and
        # treat a green exit code as no evidence at all.
        #
        # Why the source of truth is the metadata file and not the
        # filesystem (cycle-3 review HIGH-A): GoReleaser expands ${artifact}
        # from art.Path when it decides WHERE to write the signature
        # (sign.go:179-182), then re-expands the same template with
        # env["artifact"] = art.Name to compute the artifact record it will
        # PUBLISH (sign.go:274-276); the release pipe uploads by
        # artifact.Name. For a formats: [binary] archive the rename lives
        # only in metadata (archive.go:308-310 — Name: finalName, Path:
        # binary.Path), so no renamed file is ever written to disk. The
        # on-disk basename is therefore identical under BOTH the broken
        # configuration and the correct remediation — a filesystem oracle
        # would false-RED the preferred fix and is structurally blind to
        # the SBOM collision in the neighbouring pipe. Confirmed against
        # the pinned goreleaser/v2@v2.17.1 module: the `type` field written
        # to dist/artifacts.json (internal/pipe/metadata/metadata.go:
        # writeArtifacts) is the literal strings "Signature" and "SBOM".
        OK=1

        SIGN_COUNT=$(jq -r '[.[] | select(.type=="Signature")] | length' dist/artifacts.json)
        if [ "${SIGN_COUNT}" = "0" ]; then
          echo "::error::0 Signature-typed records in dist/artifacts.json — a filter matching nothing is a HARD FAILURE, not a pass: GoReleaser logs 'no artifacts matching the given filters found' and returns nil, and goreleaser check does not validate the artifacts: enum at all"
          OK=0
        fi
        SIGN_NAMES=$(jq -r '[.[] | select(.type=="Signature") | .name] | join(",")' dist/artifacts.json)
        SIGN_DISTINCT=$(jq -r '[.[] | select(.type=="Signature") | .name] | unique | length' dist/artifacts.json)
        if [ "${SIGN_COUNT}" != "0" ] && [ "${SIGN_DISTINCT}" != "${SIGN_COUNT}" ]; then
          echo "::error::Signature records are not distinct: ${SIGN_COUNT} records, ${SIGN_DISTINCT} distinct names (${SIGN_NAMES}) — a PATH-derived template collides to one name per platform; this is D-14's exact failure mode"
          OK=0
        fi
        if [ "${SIGN_COUNT}" != "0" ]; then
          for pair in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            MATCHED=$(jq -r --arg suf "_${pair}.sigstore.json" \
              '[.[] | select(.type=="Signature") | select(.name | startswith("codegraph_")) | select(.name | endswith($suf))] | length' \
              dist/artifacts.json)
            if [ "${MATCHED}" != "1" ]; then
              echo "::error::expected exactly 1 Signature name matching codegraph_<tag>_${pair}.sigstore.json, found ${MATCHED} (names=${SIGN_NAMES})"
              OK=0
            fi
          done
        fi

        SBOM_COUNT=$(jq -r '[.[] | select(.type=="SBOM")] | length' dist/artifacts.json)
        if [ "${SBOM_COUNT}" = "0" ]; then
          echo "::error::0 SBOM-typed records in dist/artifacts.json — a filter matching nothing is a HARD FAILURE, not a pass: GoReleaser logs 'no artifacts matching the given filters found' and returns nil, and goreleaser check does not validate the artifacts: enum at all"
          OK=0
        fi
        SBOM_NAMES=$(jq -r '[.[] | select(.type=="SBOM") | .name] | join(",")' dist/artifacts.json)
        SBOM_DISTINCT=$(jq -r '[.[] | select(.type=="SBOM") | .name] | unique | length' dist/artifacts.json)
        if [ "${SBOM_COUNT}" != "0" ] && [ "${SBOM_DISTINCT}" != "${SBOM_COUNT}" ]; then
          echo "::error::SBOM records are not distinct: ${SBOM_COUNT} records, ${SBOM_DISTINCT} distinct names (${SBOM_NAMES}) — a PATH-derived template collides to one name per platform; this is HIGH-B's exact failure mode"
          OK=0
        fi
        if [ "${SBOM_COUNT}" != "0" ]; then
          for pair in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            MATCHED=$(jq -r --arg suf "_${pair}.spdx.json" \
              '[.[] | select(.type=="SBOM") | select(.name | startswith("codegraph_")) | select(.name | endswith($suf))] | length' \
              dist/artifacts.json)
            if [ "${MATCHED}" != "1" ]; then
              echo "::error::expected exactly 1 SBOM name matching codegraph_<tag>_${pair}.spdx.json, found ${MATCHED} (names=${SBOM_NAMES})"
              OK=0
            fi
          done
        fi

        # Two machine-parseable summary lines, as the LAST things printed —
        # mirroring plan 01-01's REL05-EVIDENCE convention. Emitted on BOTH
        # the pass and the fail path: a RED observation is the most
        # valuable output this target can produce, and a signature failure
        # must not short-circuit the SBOM line, because the two
        # remediations are independent.
        echo "SIGN-EVIDENCE count=${SIGN_COUNT} distinct=${SIGN_DISTINCT} names=${SIGN_NAMES}"
        echo "SBOM-EVIDENCE count=${SBOM_COUNT} distinct=${SBOM_DISTINCT} names=${SBOM_NAMES}"

        if [ "${OK}" != "1" ]; then
          exit 1
        fi

  release:goreleaser:
    desc: >-
      Cut a REAL release: one `goreleaser release --clean` invocation —
      publishes to GitHub Releases, notarizes both darwin binaries with
      Apple (quill, in-process), signs every binary with cosign keyless
      (OIDC), and emits SBOMs. The single definition release.yml's
      collapsed `release` job calls (plan 01-03, DEV-01); not currently
      bound by TestWorkflowRunBodiesInvokeTask's inScopeJobs fixture (D-08
      exception) — applied deliberately, not because a test requires it.
      Meant to run in CI on a tag push, NOT casually from a laptop. For the
      local, non-publishing equivalent, use `task release:dry-run`.

      RELEASE CLASS, BOTH reachable (plan 02-02's goreleaser-caller
      enumeration): this is the one target where `notarize:` and the
      release-scoped `signs:` (cosign) pipe are BOTH live and BOTH expected
      to fire — this target's whole job is running them for real. The
      release-scoped signs: pipe still shells out to cosign for a real
      keyless OIDC signature, so its precondition below is unchanged and
      kept. notarize:'s five Apple credential variables (MACOS_SIGN_P12 and
      siblings) are supplied as CI secrets on release.yml's single
      `id-token: write` job's env: (D-14/D-17: never on any
      pull_request-triggerable workflow) — not by a precondition here, since
      this target is meant to run only from that job.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:goreleaser must run on a native darwin host — the linux legs cross-compile via zig from here (D-01/D-02) and darwin must build natively; a linux host would silently produce a cross-linked darwin binary (libresolv/DNS-resolution risk). Use `task release:dry-run` or the linux-cross-canary workflow instead."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml cross-compile via zig cc/zig c++ (CI pins 0.15.1 via mlugg/setup-zig). Install locally: brew install zig."
      - sh: command -v cosign
        msg: "cosign not found. .goreleaser.yaml's signs: pipe shells out to it. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
      - sh: command -v syft
        msg: "syft not found. .goreleaser.yaml's sboms: pipe shells out to it. CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: git describe --exact-match --tags HEAD
        msg: "no tag found at HEAD. `goreleaser release` hard-fails without one. For a tagless, non-publishing run of the same composition, use `task release:dry-run` instead."
      - sh: '[ -n "${GITHUB_TOKEN:-}" ]'
        msg: "GITHUB_TOKEN is not set. GoReleaser's release: pipe reads GITHUB_TOKEN — NOT GH_TOKEN, which is the gh CLI's own variable. Set GITHUB_TOKEN before running this target."
    cmds:
      - |
        set -euo pipefail

        # ONE prefer-then-build algorithm (C6): prefer a `goreleaser` on
        # PATH (CI path — goreleaser-action install-only already put the
        # pinned build there, so nothing compiles inside the OIDC job);
        # else build go.tool.mod's pin as the LOCAL fallback. Either way,
        # `goreleaser --version` is asserted against the pin below.
        # awk, NOT `go list -f '{{.Version}}'`: Task renders every cmds: string
        # through Go text/template BEFORE the shell sees it, so a literal
        # {{.Version}} here is consumed by TASK, not passed to go list. Task has
        # no .Version variable, so it rendered to empty — turning the command
        # into `go list -f ''`, which falls back to go's default module format
        # and yielded "github.com/goreleaser/goreleaser/v2 v2.17.1" instead of
        # "v2.17.1". The comparison below could then never be equal, and it
        # failed the v0.5.0 release before `goreleaser release` ever ran. The
        # bug was invisible outside Task (the same command in a plain shell
        # prints v2.17.1) and this target runs ONLY from release.yml on a tag
        # push, so nothing exercised it until the real release. `go list -m`
        # with no -f prints "<module> <version>", so field 2 is the version.
        PINNED_VERSION="$(GOWORK=off go list -m -modfile=go.tool.mod github.com/goreleaser/goreleaser/v2 | awk '{print $2}')"
        PINNED_VERSION="${PINNED_VERSION#v}"
        if [ -z "${PINNED_VERSION}" ]; then
          echo "::error::could not resolve goreleaser's pinned version from go.tool.mod — refusing to release against an unverified toolchain (MAINT-03)"
          exit 1
        fi

        CLEANUP_DIR=""
        cleanup() { [ -n "${CLEANUP_DIR}" ] && rm -rf "${CLEANUP_DIR}"; }
        trap cleanup EXIT

        if command -v goreleaser >/dev/null 2>&1; then
          GORELEASER_BIN="$(command -v goreleaser)"
        else
          # Build NATIVELY, no GOOS/GOARCH in the environment — same
          # reasoning as release:dry-run's identical comment: a
          # GOARCH-cross-built GoReleaser runs under Rosetta and its child
          # xcrun then resolves as x86_64, which cannot load the
          # arm64-only libxcrun.dylib from CommandLineTools.
          CLEANUP_DIR="$(mktemp -d)"
          GORELEASER_BIN="${CLEANUP_DIR}/goreleaser"
          GOWORK=off go build -modfile=go.tool.mod \
            -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2
        fi

        # Assert the resolved binary's version (`goreleaser --version`)
        # matches the go.tool.mod pin before invoking release — keeps
        # prefer-then-build honest at the point of use (MAINT-03).
        #
        # BOTH sides are v-stripped, and that is load-bearing: the two install
        # paths this target supports report DIFFERENT formats for the same
        # version. goreleaser-action's prebuilt binary (the CI path) reports
        # `GitVersion: 2.17.1`, while the from-source `go build` fallback (the
        # local path) reports `GitVersion: v2.17.1`. Normalizing only the pin
        # would make this assertion pass in CI and fail on every contributor
        # machine that lacks goreleaser on PATH.
        RESOLVED_VERSION="$("${GORELEASER_BIN}" --version 2>&1 | grep -m1 '^GitVersion:' | awk '{print $2}')"
        RESOLVED_VERSION="${RESOLVED_VERSION#v}"
        if [ -z "${RESOLVED_VERSION}" ] || [ "${RESOLVED_VERSION}" != "${PINNED_VERSION}" ]; then
          echo "::error::resolved goreleaser (${GORELEASER_BIN}) reports version '${RESOLVED_VERSION}', want '${PINNED_VERSION}' (go.tool.mod's pin, MAINT-03). A stale goreleaser on PATH would otherwise silently hollow out TestGoreleaserPinParity's guarantee at the point of use."
          exit 1
        fi

        # No GOOS/GOARCH set here: unlike `build --single-target`,
        # `goreleaser release` resolves every target from each builds:
        # entry's own goos:/goarch: list, not from the environment. A
        # carried-over GOOS/GOARCH would be at best a no-op and at worst
        # mask a misconfiguration.
        "${GORELEASER_BIN}" release --clean

        # Emit the checksums-file hash as a $GITHUB_OUTPUT `hashes` value
        # when running under GitHub Actions (GITHUB_OUTPUT is only set
        # there — a no-op locally). release.yml's provenance: job still
        # consumes this output until plan 01-04 removes both together.
        # PRECISION (2026-08-01): provenance attests over the SIX
        # BINARIES, not the checksums file itself; this base64-encodes the
        # file's *contents* as the subject-list transport the SLSA generic
        # generator parses. Folded in here, rather than a second
        # release.yml step, so the release job's Release step keeps
        # exactly one run: body (T-01-14).
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          TAG="$(git describe --exact-match --tags HEAD)"
          CHECKSUMS_FILE="dist/codegraph_${TAG}_checksums.txt"
          if [ ! -f "${CHECKSUMS_FILE}" ]; then
            echo "::error::${CHECKSUMS_FILE} not found — expected GoReleaser's checksum: pipe to have produced it"
            exit 1
          fi
          echo "hashes=$(base64 -w0 < "${CHECKSUMS_FILE}")" >> "${GITHUB_OUTPUT}"
        fi

  check:linux-cross-export:
    desc: >-
      Resolve both linux binaries the just-run `goreleaser release`
      (task release:dry-run) produced from dist/artifacts.json and copy
      each to a fixed, documented export path under dist/export/, named
      <goos>-<goarch>. Exists because actions/upload-artifact's `path:`
      input is a literal glob, not a shell — it cannot itself run the
      dist/artifacts.json jq lookup, and GoReleaser writes binaries under
      generated, build-id-nested dist/ paths that are not stable enough to
      hard-code as a glob (review LOW, Codex Plan-01). These export paths
      are a CONTRACT with linux-cross-canary.yml's two exec jobs and with
      check:linux-cross-exec's default CODEGRAPH_BIN path — do not rename
      dist/export/linux-amd64 or dist/export/linux-arm64 without updating
      all three.
    cmds:
      - |
        set -euo pipefail

        if [ ! -f dist/artifacts.json ]; then
          echo "::error::dist/artifacts.json not found — run task release:dry-run first"
          exit 1
        fi

        mkdir -p dist/export

        for pair in linux/amd64 linux/arm64; do
          GOOS="${pair%/*}"
          GOARCH="${pair#*/}"

          BIN=""
          if command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg goos "${GOOS}" --arg goarch "${GOARCH}" \
              '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos==$goos and .goarch==$goarch)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph -path "*${GOOS}*${GOARCH}*" 2>/dev/null | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::could not resolve the ${pair} binary from dist/artifacts.json — run task release:dry-run first"
            exit 1
          fi

          EXPORT="dist/export/${GOOS}-${GOARCH}"
          cp "${BIN}" "${EXPORT}"
          chmod +x "${EXPORT}"
          echo "    ${pair}: ${BIN} -> ${EXPORT}"
        done

  check:linux-cross-exec:
    desc: >-
      Convert "the linker accepted the cross-compiled object" into "the CGo
      tree-sitter parse path works on this OS and arch" — REL-05's real
      evidence bar (review synthesis finding S1). Takes the path to an
      already-built codegraph binary via CODEGRAPH_BIN (default
      dist/export/linux-<GOHOSTARCH>, the check:linux-cross-export
      contract), chmod +x's it, asserts its file(1) ELF machine matches the
      HOST architecture (a wrong-arch artifact fails loudly here instead of
      as a confusing exec-format error a few lines later), then runs the
      binary's real `init` subcommand against the checked-out repository
      working tree and asserts `codegraph status --json`'s exact numeric
      fileCount/nodeCount JSON fields (not rendered text — review
      suggestion, Codex Plan-01) are non-zero. A zero-count graph, an empty
      output, or a bare exit code is a FAIL — that is the whole point of
      the criterion. Emits exactly one machine-parseable REL05-EVIDENCE
      line as the last thing it prints; the target itself asserts both
      counts are non-zero and exits non-zero otherwise, so "a green step
      with no counts" is a structural impossibility.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "check:linux-cross-exec proves REL-05's real-Linux-execution half — it must run on a real Linux host, never emulated (D-02). Dispatch linux-cross-canary.yml, which runs this on namespace-profile-linux-amd64-4x8 / namespace-profile-linux-arm64-4x8."
      - sh: command -v jq
        msg: "jq not found — required to parse codegraph status --json's numeric fields."
    cmds:
      - |
        set -euo pipefail

        HOST_ARCH="$(go env GOHOSTARCH)"
        BIN="${CODEGRAPH_BIN:-dist/export/linux-${HOST_ARCH}}"
        if [ ! -f "${BIN}" ]; then
          echo "::error::codegraph binary not found at ${BIN} — set CODEGRAPH_BIN or run task check:linux-cross-export first"
          exit 1
        fi
        chmod +x "${BIN}"

        HOST_MACHINE="$(uname -m)"
        DESC="$(file -b "${BIN}")"
        echo "    binary: ${BIN}"
        echo "    host uname -m: ${HOST_MACHINE}"
        echo "    file -b: ${DESC}"

        # A wrong-arch artifact must fail loudly HERE, not a few lines
        # below as a confusing exec-format error.
        case "${HOST_MACHINE}:${DESC}" in
          x86_64:*ELF*x86-64*) ELF_MACHINE="x86-64" ;;
          aarch64:*ELF*aarch64*) ELF_MACHINE="aarch64" ;;
          *)
            echo "::error::${BIN} (${DESC}) does not match the host architecture (uname -m: ${HOST_MACHINE})"
            exit 1
            ;;
        esac

        # The real REL-05 evidence: index THIS checked-out repository — a
        # real, multi-language tree — not `--version`, not an exit code.
        REPO_ROOT="$(pwd)"
        rm -rf "${REPO_ROOT}/.codegraph"
        "${BIN}" init "${REPO_ROOT}"

        STATUS_JSON="$("${BIN}" status --json --path "${REPO_ROOT}")"
        FILES=$(printf '%s' "${STATUS_JSON}" | jq -r '.fileCount')
        SYMBOLS=$(printf '%s' "${STATUS_JSON}" | jq -r '.nodeCount')

        if ! [[ "${FILES}" =~ ^[0-9]+$ ]] || [ "${FILES}" -eq 0 ]; then
          echo "::error::codegraph status --json reports fileCount=${FILES} — REL-05 requires a non-zero count, not a green exit code"
          exit 1
        fi
        if ! [[ "${SYMBOLS}" =~ ^[0-9]+$ ]] || [ "${SYMBOLS}" -eq 0 ]; then
          echo "::error::codegraph status --json reports nodeCount=${SYMBOLS} — REL-05 requires a non-zero count, not a green exit code"
          exit 1
        fi

        echo "REL05-EVIDENCE uname=${HOST_MACHINE} elf=${ELF_MACHINE} files=${FILES} symbols=${SYMBOLS}"

  check:goreleaser:
    desc: >-
      Validate .goreleaser.yaml (DIST-01). CHECK CLASS (plan 02-02's
      goreleaser-caller enumeration): `goreleaser check` runs no pipes at
      all — neither notarize: nor signs: executes, so this target never
      reaches Apple or cosign and needs no credentials. It also does NOT
      semantically validate the notarize:/signs: block contents (this
      repo's own config comments already document that `goreleaser check`
      does not validate the artifacts: enum; the same class of blind spot
      is not independently confirmed for notarize: either) — a clean run
      here is config-shape validation only, never evidence that the pipe
      fires correctly.
    cmds:
      - "{{.GO_TOOL}} goreleaser check"

  verify:release-assets:
    desc: >-
      Re-prove REL-06/REL-07/REL-08's asset-set, checksum, cosign, and
      attestation claims against assets RE-DOWNLOADED from the PUBLISHED
      release named by $TAG — never a local dist/ copy, which never passes
      through the real GitHub Releases upload path, the Sigstore
      transparency log, or the attestation subject binding. Driven by
      .github/workflows/post-release-verify.yml's verify-supply-chain job on
      every future release; $TAG must already be resolved and validated
      (that job's resolve-tag dependency), never head_branch re-read here.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:release-assets requires TAG (the resolved, validated release tag) in the environment — post-release-verify.yml's resolve-tag job supplies it via needs.resolve-tag.outputs.tag."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:release-assets requires REPO (owner/repo) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a supply-chain break rather than a missing credential."
      - sh: command -v gh
        msg: "gh CLI not found. This target assumes the runner image ships it (matching GitHub-hosted runner images); locally: brew install gh / apt install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh's --json output with it. CI runner images ship it; locally: brew install jq."
      - sh: command -v cosign
        msg: "cosign not found. This target verifies the published cosign bundle with it. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        echo "verify:release-assets: TAG=${TAG} REPO=${REPO}"

        REQUIRED_RAW_SUFFIXES="linux_amd64 linux_arm64 darwin_amd64 darwin_arm64"

        # --- REQUIRED / ALLOWED / UNCLASSIFIED classification, never a
        # fixed total: this workflow re-fires on every future release, and
        # Phase 2 notarization / Phase 3 Homebrew cask artifacts may
        # legitimately add assets.
        ALLOWED_ASSETS=""
        # ^ intentionally EMPTY in this phase. Adding an asset here is a
        # deliberate edit, not a default — see the header comment in
        # post-release-verify.yml.

        # --- Bounded wait for asset visibility. Even after release.yml
        # reports success, GitHub's release-asset API and CDN can lag
        # briefly. Poll until the REQUIRED set is present, with a hard
        # attempt ceiling — a visibility-lag tolerance, never a substitute
        # for the workflow_run trigger's own ordering guarantee.
        MAX_ATTEMPTS=10
        SLEEP_SECONDS=6
        ATTEMPT=1
        NAMES=""
        while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
          ASSETS_JSON="$(gh release view "${TAG}" --repo "${REPO}" --json assets 2>/dev/null || echo '{"assets":[]}')"
          NAMES="$(printf '%s' "${ASSETS_JSON}" | jq -r '.assets[].name')"
          MISSING=""
          printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_checksums.txt" || MISSING="${MISSING} checksums"
          for suf in ${REQUIRED_RAW_SUFFIXES}; do
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}" || MISSING="${MISSING} raw:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.zip" || MISSING="${MISSING} zip:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.sigstore.json" || MISSING="${MISSING} sig:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.spdx.json" || MISSING="${MISSING} sbom:${suf}"
          done
          if [ -z "${MISSING}" ]; then
            echo "verify:release-assets: all required assets visible after ${ATTEMPT} attempt(s)"
            break
          fi
          echo "verify:release-assets: attempt ${ATTEMPT}/${MAX_ATTEMPTS} — still missing:${MISSING}"
          if [ "${ATTEMPT}" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::error::required assets still missing after ${MAX_ATTEMPTS} attempts (${SLEEP_SECONDS}s apart):${MISSING}"
            exit 1
          fi
          ATTEMPT=$((ATTEMPT + 1))
          sleep "${SLEEP_SECONDS}"
        done

        TOTAL_COUNT=$(printf '%s\n' "${NAMES}" | grep -c . || true)
        echo "verify:release-assets: OBSERVED ${TOTAL_COUNT} total published assets (recorded, not asserted — REQUIRED/ALLOWED/UNCLASSIFIED below is the real check)"

        UNCLASSIFIED=""
        for name in ${NAMES}; do
          case "${name}" in
            "codegraph_${TAG}_checksums.txt") continue ;;
          esac
          IS_REQUIRED=0
          for suf in ${REQUIRED_RAW_SUFFIXES}; do
            case "${name}" in
              "codegraph_${TAG}_${suf}"|"codegraph_${TAG}_${suf}.zip"|"codegraph_${TAG}_${suf}.sigstore.json"|"codegraph_${TAG}_${suf}.spdx.json")
                IS_REQUIRED=1
                ;;
            esac
          done
          if [ "${IS_REQUIRED}" = "1" ]; then
            continue
          fi
          IS_ALLOWED=0
          for allowed in ${ALLOWED_ASSETS}; do
            if [ "${name}" = "${allowed}" ]; then
              IS_ALLOWED=1
            fi
          done
          if [ "${IS_ALLOWED}" = "1" ]; then
            continue
          fi
          UNCLASSIFIED="${UNCLASSIFIED} ${name}"
        done
        if [ -n "${UNCLASSIFIED}" ]; then
          echo "::error::UNCLASSIFIED published asset(s), not in REQUIRED or ALLOWED:${UNCLASSIFIED} — an unexpected asset on a supply-chain release is a finding, not noise; add it to ALLOWED_ASSETS deliberately if it is expected"
          exit 1
        fi

        # Exact set equality on REQUIRED, both directions: every required
        # member present exactly once.
        for suf in ${REQUIRED_RAW_SUFFIXES}; do
          for kind_suffix in "" ".zip" ".sigstore.json" ".spdx.json"; do
            NAME="codegraph_${TAG}_${suf}${kind_suffix}"
            COUNT=$(printf '%s\n' "${NAMES}" | grep -cx "${NAME}" || true)
            if [ "${COUNT}" != "1" ]; then
              echo "::error::expected exactly 1 published asset named ${NAME}, found ${COUNT}"
              exit 1
            fi
          done
        done
        CHECKSUMS_COUNT=$(printf '%s\n' "${NAMES}" | grep -cx "codegraph_${TAG}_checksums.txt" || true)
        if [ "${CHECKSUMS_COUNT}" != "1" ]; then
          echo "::error::expected exactly 1 codegraph_${TAG}_checksums.txt, found ${CHECKSUMS_COUNT}"
          exit 1
        fi

        # --- Download every raw + zip payload and the checksums file into a
        # temp dir; assert coverage and sha256sum -c.
        DL_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "codegraph_${TAG}_checksums.txt"
        for suf in ${REQUIRED_RAW_SUFFIXES}; do
          gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
            --pattern "codegraph_${TAG}_${suf}"
          gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
            --pattern "codegraph_${TAG}_${suf}.zip"
        done

        CHECKSUMS_FILE="${DL_DIR}/codegraph_${TAG}_checksums.txt"
        LINE_COUNT=$(wc -l < "${CHECKSUMS_FILE}" | tr -d ' ')
        if [ "${LINE_COUNT}" != "8" ]; then
          echo "::error::${CHECKSUMS_FILE} has ${LINE_COUNT} lines, want exactly 8"
          exit 1
        fi

        # Both-directions set equality between the checksums file's named
        # entries and the 8 downloaded payloads; no sidecar or
        # self-reference line (D-12).
        CHECKSUM_NAMES="$(awk '{print $2}' "${CHECKSUMS_FILE}" | sed 's/^\*//' | sort)"
        DOWNLOADED_NAMES="$(cd "${DL_DIR}" && ls -1 | grep -v "^codegraph_${TAG}_checksums\.txt$" | sort)"
        if [ "${CHECKSUM_NAMES}" != "${DOWNLOADED_NAMES}" ]; then
          echo "::error::checksums file's named entries do not set-equal the 8 downloaded payloads"
          echo "checksums names: ${CHECKSUM_NAMES}"
          echo "downloaded names: ${DOWNLOADED_NAMES}"
          exit 1
        fi
        if printf '%s\n' "${CHECKSUM_NAMES}" | grep -Eq '\.(sigstore|spdx)\.json$|_checksums\.txt$'; then
          echo "::error::checksums file names a sidecar or itself — D-12 exclusion violated"
          exit 1
        fi

        (cd "${DL_DIR}" && sha256sum -c "$(basename "${CHECKSUMS_FILE}")")

        # --- Download the cosign bundle into a SEPARATE directory, never
        # into DL_DIR. DL_DIR's contents are themselves an assertion: the
        # set-equality check above compares the checksums file's named
        # entries against `ls DL_DIR`, so DL_DIR must hold exactly the 8
        # payloads and nothing else. Downloading the sidecar into it would
        # trade this target's original bug (cosign reading a .sigstore.json
        # that was never downloaded — the v0.5.1 post-release-verify failure)
        # for a spurious set-equality failure. Two temp dirs, two meanings.
        SIG_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}" "${SIG_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${SIG_DIR}" \
          --pattern "codegraph_${TAG}_linux_amd64.sigstore.json"
        if [ ! -f "${SIG_DIR}/codegraph_${TAG}_linux_amd64.sigstore.json" ]; then
          echo "::error::cosign bundle codegraph_${TAG}_linux_amd64.sigstore.json was not downloaded — cannot verify the signature"
          exit 1
        fi

        # --- cosign verify-blob, VERBATIM flags from docs/RELEASE.md § a —
        # a looser regex here would prove less than the published
        # instruction claims (REL-08 criterion 3, D-11a).
        cosign verify-blob \
          --bundle "${SIG_DIR}/codegraph_${TAG}_linux_amd64.sigstore.json" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp \
            '^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^[:space:]]*$' \
          "${DL_DIR}/codegraph_${TAG}_linux_amd64"
        echo "verify:release-assets: cosign verify-blob: Verified OK"

        # --- Attestation verification, the command plan 01-04 selected.
        gh attestation verify "${DL_DIR}/codegraph_${TAG}_linux_amd64" -R "${REPO}"

        echo "verify:release-assets: PASS — checksums, cosign, and attestation all verified against re-downloaded published assets for ${TAG}"

  verify:self-upgrade:
    desc: >-
      Re-prove REL-08's self-upgrade claim (D-08): a genuinely shipped PRIOR
      release binary self-upgrades via `codegraph upgrade "$TAG"` to the
      published release named by $TAG, and the resulting binary's sha256
      equals the published asset's — asserted by byte identity, never an
      exit code. Driven by .github/workflows/post-release-verify.yml's
      self-upgrade matrix (darwin/arm64, linux/amd64) on every future
      release.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:self-upgrade requires TAG (the resolved, validated release tag) in the environment — post-release-verify.yml's resolve-tag job supplies it via needs.resolve-tag.outputs.tag."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:self-upgrade requires REPO (owner/repo) in the environment."
      - sh: '[ -n "${GOOS:-}" ]'
        msg: "GOOS is not set. verify:self-upgrade requires GOOS (darwin or linux) in the environment."
      - sh: '[ -n "${GOARCH:-}" ]'
        msg: "GOARCH is not set. verify:self-upgrade requires GOARCH (amd64 or arm64) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a supply-chain break rather than a missing credential."
      - sh: command -v gh
        msg: "gh CLI not found. This target assumes the runner image ships it (matching GitHub-hosted runner images); locally: brew install gh / apt install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh api output with it. CI runner images ship it; locally: brew install jq."
    cmds:
      - |
        set -euo pipefail

        echo "verify:self-upgrade: TAG=${TAG} REPO=${REPO} GOOS=${GOOS} GOARCH=${GOARCH}"

        # macOS ships no sha256sum by default (BSD userland); shasum -a 256
        # is the native equivalent. Prefer sha256sum when present (Linux),
        # fall back to shasum (darwin) — this target's matrix runs on both.
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 1. Resolve the PRIOR release by SEMANTIC-VERSION PREDECESSOR
        # ORDER, never gh's publication-chronology list order (cycle-2
        # review MEDIUM/Codex) — a historical dispatch of an old $TAG must
        # not select a release NEWER than $TAG, and an RC must not select
        # the wrong stable/prerelease neighbour.
        RELEASES_JSON="$(gh api "repos/${REPO}/releases" --paginate)"

        DRAFT_TAGS="$(printf '%s' "${RELEASES_JSON}" | jq -r '.[] | select(.draft == true) | .tag_name')"
        if [ -n "${DRAFT_TAGS}" ]; then
          echo "verify:self-upgrade: dropping draft release(s) — a draft has no downloadable asset and cannot be upgraded from:"
          printf '%s\n' "${DRAFT_TAGS}" | sed 's/^/    /'
        fi
        NON_DRAFT_JSON="$(printf '%s' "${RELEASES_JSON}" | jq -c '[.[] | select(.draft == false)]')"

        # Drop releases carrying ZERO downloadable assets, for exactly the
        # reason drafts are dropped above: you cannot upgrade FROM a release
        # that ships nothing. This is not hypothetical — v0.5.0 published
        # empty (the release pipeline aborted on its own version assertion
        # before goreleaser ran), and D-07 keeps such a release in the list
        # permanently rather than deleting it. Without this filter the
        # predecessor search happily selects it and then dies on
        # `gh release download` with "no assets to download", which reads as
        # a supply-chain failure when it is really "that release is empty".
        EMPTY_TAGS="$(printf '%s' "${NON_DRAFT_JSON}" | jq -r '.[] | select((.assets | length) == 0) | .tag_name')"
        if [ -n "${EMPTY_TAGS}" ]; then
          echo "verify:self-upgrade: dropping release(s) with no downloadable assets — cannot upgrade from an empty release:"
          printf '%s\n' "${EMPTY_TAGS}" | sed 's/^/    /'
        fi
        NON_DRAFT_JSON="$(printf '%s' "${NON_DRAFT_JSON}" | jq -c '[.[] | select((.assets | length) > 0)]')"

        SEMVER_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

        TAG_PARSED="$(printf '%s' "${TAG}" | jq -R -c \
          'capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9A-Za-z.-]+))?$")')"
        if [ -z "${TAG_PARSED}" ] || [ "${TAG_PARSED}" = "null" ]; then
          echo "::error::TAG '${TAG}' under verification does not parse as major.minor.patch[-prerelease] — cannot resolve a predecessor"
          exit 1
        fi
        TAG_MAJOR="$(printf '%s' "${TAG_PARSED}" | jq -r '.major | tonumber')"
        TAG_MINOR="$(printf '%s' "${TAG_PARSED}" | jq -r '.minor | tonumber')"
        TAG_PATCH="$(printf '%s' "${TAG_PARSED}" | jq -r '.patch | tonumber')"
        TAG_PRE="$(printf '%s' "${TAG_PARSED}" | jq -r '.pre // ""')"

        UNPARSEABLE="$(printf '%s' "${NON_DRAFT_JSON}" | jq -r --arg re "${SEMVER_RE}" \
          '[.[] | select(.tag_name | test($re) | not) | .tag_name] | .[]')"
        if [ -n "${UNPARSEABLE}" ]; then
          echo "verify:self-upgrade: skipping unparseable tag(s) (not major.minor.patch[-prerelease]), never silently ignored:"
          printf '%s\n' "${UNPARSEABLE}" | sed 's/^/    /'
        fi

        PARSED_JSON="$(printf '%s' "${NON_DRAFT_JSON}" | jq -c \
          '[.[] | . as $r
             | ($r.tag_name | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9A-Za-z.-]+))?$")?) as $p
             | select($p != null)
             | {tag: $r.tag_name, major: ($p.major|tonumber), minor: ($p.minor|tonumber), patch: ($p.patch|tonumber), pre: ($p.pre // ""), api_prerelease: ($r.prerelease == true)}]')"

        # Filter to versions strictly LESS THAN $TAG under semver ordering.
        # A prerelease sorts below its own release (1.0.0-rc1 < 1.0.0).
        # Comparing two prereleases of the IDENTICAL major.minor.patch
        # falls back to a lexical comparison of the prerelease string — a
        # documented, accepted simplification; no full semver-precedence
        # library is available in this shell/jq environment.
        LESS_THAN_JSON="$(printf '%s' "${PARSED_JSON}" | jq -c \
          --argjson tmaj "${TAG_MAJOR}" --argjson tmin "${TAG_MINOR}" --argjson tpat "${TAG_PATCH}" --arg tpre "${TAG_PRE}" \
          '[.[] | select(
              (.major < $tmaj)
              or (.major == $tmaj and .minor < $tmin)
              or (.major == $tmaj and .minor == $tmin and .patch < $tpat)
              or (.major == $tmaj and .minor == $tmin and .patch == $tpat and .pre != "" and $tpre == "")
              or (.major == $tmaj and .minor == $tmin and .patch == $tpat and .pre != "" and $tpre != "" and .pre < $tpre)
           )]')"
        CANDIDATE_COUNT="$(printf '%s' "${LESS_THAN_JSON}" | jq 'length')"

        # Prerelease policy (a decision, not an implementation detail):
        # when $TAG is a stable version (no prerelease component), prefer
        # the greatest STABLE predecessor and fall back to a prerelease
        # predecessor only if no stable one exists. When $TAG is itself a
        # prerelease, allow either.
        #
        # "Stable" means BOTH no semver prerelease component AND not flagged
        # prerelease by the GitHub API. Checking only `.pre == ""` was a real
        # bug: v0.5.0 carries no semver suffix, so it read as stable and was
        # selected as v0.5.1's predecessor even though it is API-flagged
        # prerelease precisely BECAUSE it shipped empty. A maintainer who
        # marks a release prerelease is making exactly the statement this
        # policy needs to hear, and the tag string cannot carry it.
        POLICY="prerelease"
        FILTERED_JSON="${LESS_THAN_JSON}"
        if [ -z "${TAG_PRE}" ]; then
          STABLE_ONLY_JSON="$(printf '%s' "${LESS_THAN_JSON}" | jq -c '[.[] | select(.pre == "" and .api_prerelease == false)]')"
          STABLE_COUNT="$(printf '%s' "${STABLE_ONLY_JSON}" | jq 'length')"
          if [ "${STABLE_COUNT}" -gt 0 ]; then
            FILTERED_JSON="${STABLE_ONLY_JSON}"
            POLICY="stable"
          fi
        fi
        FILTERED_COUNT="$(printf '%s' "${FILTERED_JSON}" | jq 'length')"
        if [ "${FILTERED_COUNT}" -eq 0 ]; then
          echo "::error::no prior release exists to upgrade FROM (${CANDIDATE_COUNT} strictly-earlier candidate(s) before the prerelease policy filter) — this reads as 'no prior release', not a supply-chain failure. The first release ever cut has nothing to upgrade from."
          exit 1
        fi

        # Select the MAXIMUM of what remains: sort ascending by
        # [major, minor, patch, (stable > prerelease at the same base), pre],
        # take the last.
        PRIOR_TAG="$(printf '%s' "${FILTERED_JSON}" | jq -r \
          '[.[] | . + {rank: (if .pre == "" then 1 else 0 end)}] | sort_by([.major, .minor, .patch, .rank, .pre]) | last | .tag')"

        echo "PRIOR-RELEASE tag=${PRIOR_TAG} policy=${POLICY} candidates=${FILTERED_COUNT}"

        # --- 2. Download the prior release's raw asset for
        # GOOS/GOARCH — a genuinely shipped binary, which is the whole
        # point of the claim.
        DL_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}"' EXIT

        PRIOR_ASSET="codegraph_${PRIOR_TAG}_${GOOS}_${GOARCH}"
        gh release download "${PRIOR_TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "${PRIOR_ASSET}"
        PRIOR_BIN="${DL_DIR}/${PRIOR_ASSET}"
        chmod +x "${PRIOR_BIN}"
        PRIOR_SHA256="$(sha256_of "${PRIOR_BIN}")"

        # --- 3. Run the real codegraph upgrade invocation against it, with
        # $TAG EXPLICIT as the positional version argument — an
        # argument-less invocation would instead resolve GitHub's
        # timing-sensitive "latest" endpoint (internal/upgrade/release.go)
        # and could silently verify the wrong release under concurrent tag
        # activity (review MEDIUM, Codex Plan-05).
        "${PRIOR_BIN}" upgrade "${TAG}"
        UPGRADED_SHA256="$(sha256_of "${PRIOR_BIN}")"

        # --- 4. Assert byte identity against the NEW release's raw asset
        # for the same platform, re-downloaded independently — not
        # "upgrade exited 0".
        NEW_ASSET="codegraph_${TAG}_${GOOS}_${GOARCH}"
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "${NEW_ASSET}" --clobber
        PUBLISHED_SHA256="$(sha256_of "${DL_DIR}/${NEW_ASSET}")"

        echo "SELF-UPGRADE-EVIDENCE goos=${GOOS} goarch=${GOARCH} prior_tag=${PRIOR_TAG} prior_sha256=${PRIOR_SHA256} upgraded_sha256=${UPGRADED_SHA256} published_sha256=${PUBLISHED_SHA256}"

        if [ "${UPGRADED_SHA256}" != "${PUBLISHED_SHA256}" ]; then
          echo "::error::upgraded binary sha256 (${UPGRADED_SHA256}) does not equal the published ${TAG} asset's sha256 (${PUBLISHED_SHA256})"
          exit 1
        fi

        # --- 5. Assert the upgraded binary reports the new version.
        REPORTED_VERSION="$("${PRIOR_BIN}" version --json | jq -r '.version')"
        if [ "${REPORTED_VERSION}" != "${TAG}" ]; then
          echo "::error::upgraded binary reports version '${REPORTED_VERSION}', want '${TAG}'"
          exit 1
        fi

        echo "verify:self-upgrade: PASS — ${GOOS}/${GOARCH} self-upgraded from ${PRIOR_TAG} to ${TAG} byte-identically to the published asset"

  verify:gatekeeper:
    desc: >-
      SIGN-03's tracer: an Apple Gatekeeper verdict on one PUBLISHED darwin
      release asset, never a local dist/ copy and never a locally rebuilt
      binary. The single definition both the SIGN-03 RED baseline (plan
      02-01 Task 2/3, against v0.5.1's deliberately un-notarized assets) and
      the post-release GREEN check (plan 02-06) call — GATEKEEPER_EXPECT
      selects which. Per D-19 (LOCKED, 02-RESEARCH.md) the oracle is
      `spctl -a -vv -t install`, NEVER `-t exec` — `-t exec` rejects a bare
      Mach-O on SHAPE before notarization is considered at all, which is why
      it would stay red after notarization for a completely different
      reason than the RED baseline's. The verdict is the EXIT STATUS alone
      (0=accepted, 3=rejected), never a substring search — "accepted"
      matches inside "rejected (the code is valid but does not seem to be
      an app)" and inside origin= lines. `syspolicy_check distribution` is
      recorded as a NON-GATING observation only: its verdict is fatal for
      anything unstapled, and stapling is permanently out of scope
      (D-16/DIST-06), so gating on it would be a gate that can never pass.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:gatekeeper requires TAG (the release tag whose darwin asset is assessed) in the environment — e.g. TAG=v0.5.1 for the RED baseline."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:gatekeeper requires REPO (owner/repo, e.g. seanb4t/codegraph-go) in the environment."
      - sh: '[ -n "${GOOS:-}" ]'
        msg: "GOOS is not set. verify:gatekeeper requires GOOS (darwin) in the environment — the asset name is codegraph_${TAG}_${GOOS}_${GOARCH}, matching internal/upgrade.releaseAssetName's contract."
      - sh: '[ -n "${GOARCH:-}" ]'
        msg: "GOARCH is not set. verify:gatekeeper requires GOARCH (amd64 or arm64) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a Gatekeeper break rather than a missing credential."
      - sh: '[ -n "${GATEKEEPER_EXPECT:-}" ]'
        msg: "GATEKEEPER_EXPECT is not set. Must be one of: accepted, rejected. The RED baseline (plan 02-01) uses rejected against v0.5.1's un-notarized assets; the post-release GREEN check (plan 02-06) uses accepted."
      - sh: '[ "${GATEKEEPER_EXPECT:-}" = "accepted" ] || [ "${GATEKEEPER_EXPECT:-}" = "rejected" ]'
        msg: "GATEKEEPER_EXPECT is set to a value other than 'accepted' or 'rejected'. An unvalidated value would fail safe but confusingly, turning every observation into a mismatch regardless of what spctl actually reports — value must be exactly one of the two allowed strings."
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "verify:gatekeeper must run on a native darwin host — spctl/syspolicy_check/xattr are macOS-only and this is not a build toolchain that can be cross-compiled around. Run it on macOS locally, or dispatch it on namespace-profile-macos-6x14-tahoe, the CI runner class release.yml and post-release-verify.yml use."
      - sh: command -v gh
        msg: "gh CLI not found. This target downloads the published release asset with it. CI runner images ship it; locally: brew install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh release view --json assets output with it, to cross-check GitHub's own recorded per-asset digest against the recomputed sha256 — the provenance strengthening that turns 'the bytes I assessed' into 'the bytes the release serves'. CI runner images ship it; locally: brew install jq."
      - sh: command -v xattr
        msg: "xattr not found. This target applies and reads back the com.apple.quarantine extended attribute with it. macOS built-in — if missing, the host is misconfigured."
      - sh: command -v spctl
        msg: "spctl not found. This target's oracle IS spctl -a -vv -t install (D-19) — macOS built-in. If missing, the host is misconfigured."
    cmds:
      - |
        set -euo pipefail

        echo "verify:gatekeeper: TAG=${TAG} REPO=${REPO} GOOS=${GOOS} GOARCH=${GOARCH} expect=${GATEKEEPER_EXPECT}"

        # macOS ships no sha256sum by default (BSD userland); shasum -a 256
        # is the native equivalent — mirrors verify:self-upgrade's sha256_of.
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 1. Resolve the asset name: the raw binary, matching
        # internal/upgrade.releaseAssetName's contract. Never the .zip.
        ASSET_NAME="codegraph_${TAG}_${GOOS}_${GOARCH}"

        # --- 2. Read the asset's metadata from the published release
        # listing and extract its recorded digest. An asset absent from the
        # listing is a hard failure naming the asset and the tag.
        ASSETS_JSON="$(gh release view "${TAG}" --repo "${REPO}" --json assets)"
        ASSET_ENTRY="$(printf '%s' "${ASSETS_JSON}" | jq -c --arg name "${ASSET_NAME}" '[.assets[] | select(.name == $name)] | first // empty')"
        if [ -z "${ASSET_ENTRY}" ]; then
          echo "::error::asset ${ASSET_NAME} not found among ${TAG}'s published assets — cannot assess an asset that was never published"
          exit 1
        fi
        GH_DIGEST_RAW="$(printf '%s' "${ASSET_ENTRY}" | jq -r '.digest // empty')"
        GH_DIGEST="${GH_DIGEST_RAW#sha256:}"

        # --- 3. Download it with gh release download into a mktemp -d
        # cleaned by a single trap. Downloading is not optional and a local
        # dist/ copy is never acceptable — plan 01-05's false negatives came
        # from a verifier that read an artifact it never downloaded.
        DL_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" --pattern "${ASSET_NAME}"
        ASSET_PATH="${DL_DIR}/${ASSET_NAME}"

        # --- 4. Recompute the sha256 and cross-check it against GitHub's
        # recorded digest from step 2 — the provenance cross-check that
        # makes the assessed bytes identifiable. A mismatch is always a
        # hard failure. A MISSING digest is bound to GATEKEEPER_EXPECT
        # (deliberate asymmetry, not an inconsistency):
        #   - expect=accepted (GREEN, plan 02-06's CI job): a missing or
        #     malformed digest is a HARD FAILURE. GREEN is the claim that
        #     carries weight, so its provenance must be established, not
        #     assumed. Sentinel-and-continue on a verification step is this
        #     repository's single most-repeated failure class.
        #   - expect=rejected (RED, this plan's baseline against a
        #     preserved older release, where the API may genuinely predate
        #     per-asset digests): record the sentinel and continue, but
        #     WARN loudly and set digest_match=unknown so the downgrade is
        #     visible in the evidence rather than silent.
        SHA256="$(sha256_of "${ASSET_PATH}")"
        DIGEST_MATCH="unknown"
        if [ -n "${GH_DIGEST}" ]; then
          if [ "${GH_DIGEST}" = "${SHA256}" ]; then
            DIGEST_MATCH="true"
          else
            DIGEST_MATCH="false"
          fi
        fi
        if [ "${DIGEST_MATCH}" = "false" ]; then
          echo "::error::sha256 mismatch: downloaded ${ASSET_NAME} hashes to ${SHA256}, GitHub's recorded digest is ${GH_DIGEST} — the bytes assessed are NOT provably the bytes the release serves"
          exit 1
        fi
        if [ "${DIGEST_MATCH}" = "unknown" ]; then
          if [ "${GATEKEEPER_EXPECT}" = "accepted" ]; then
            echo "::error::GitHub's recorded digest for ${ASSET_NAME} is unavailable on the GREEN path (GATEKEEPER_EXPECT=accepted) — provenance cannot be established, and GREEN is the claim that carries weight. This is a HARD FAILURE, not sentinel-and-continue (deliberate D-19/plan-02-01 asymmetry, stated here rather than left as an inconsistency)."
            exit 1
          fi
          echo "::warning::GitHub's recorded digest for ${ASSET_NAME} is unavailable on the RED path (GATEKEEPER_EXPECT=rejected — a preserved older release whose API may predate per-asset digests). Recording digest_match=unknown and continuing. Deliberate scope decision, not an oversight."
        fi

        # --- 5. Assess the file BEFORE applying any xattr and record that
        # verdict on its own labelled line as the explicit NON-EVIDENCE
        # control — the observation that makes "spctl on a
        # never-quarantined file" visibly distinct rather than silently
        # conflated with the real verdict below.
        set +e
        PRE_XATTR_OUT="$(spctl -a -vv -t install "${ASSET_PATH}" 2>&1)"
        PRE_XATTR_EXIT=$?
        set -e
        echo "GATEKEEPER-PRE-XATTR-CONTROL (NON-EVIDENCE — file was never quarantined at this point) exit=${PRE_XATTR_EXIT}"
        echo "${PRE_XATTR_OUT}"

        # --- 6. Apply a SYNTHETIC com.apple.quarantine xattr — Apple's
        # documented four-field flags;timestamp;agent;event-uuid form,
        # flags=0081 (downloaded-and-first-launch). Built in plain shell,
        # via printf/uuidgen — no Go-template braces anywhere in this
        # target, for the reason release:dry-run-signed has none: `task`
        # renders every cmds: string through Go text/template BEFORE the
        # shell sees it, and a stray double-brace template marker here
        # would be eaten (the defect that shipped v0.5.0 empty). Called
        # SYNTHETIC in every comment, label and evidence field — it is a
        # simulation until Task 2's checkpoint confirms it behaves like an
        # actual browser download; naming it anything else before that
        # comparison would prejudge the one open question (assumption A2)
        # this plan exists to settle.
        QUARANTINE_HEX_TS="$(printf '%x' "$(date +%s)")"
        QUARANTINE_UUID="$(uuidgen)"
        QUARANTINE_VALUE="0081;${QUARANTINE_HEX_TS};Safari;${QUARANTINE_UUID}"
        xattr -w com.apple.quarantine "${QUARANTINE_VALUE}" "${ASSET_PATH}"

        # --- 7. Read the attribute back and HARD-FAIL if it is absent or
        # empty. An assessment that runs without this confirmation is not
        # evidence, and the target must refuse to produce one.
        XATTR_READBACK="$(xattr -p com.apple.quarantine "${ASSET_PATH}" 2>/dev/null || true)"
        if [ -z "${XATTR_READBACK}" ]; then
          echo "::error::com.apple.quarantine xattr (SYNTHETIC) is absent or empty on ${ASSET_PATH} immediately after writing it — an assessment without this confirmation is not evidence, refusing to run spctl"
          exit 1
        fi
        XATTR_PRESENT="true"
        echo "GATEKEEPER-XATTR-SYNTHETIC value=${QUARANTINE_VALUE} readback=${XATTR_READBACK}"

        # --- 8. Run the D-19 oracle: spctl -a -vv -t install (never -t
        # exec — see this target's desc: for why). Capture stdout, stderr
        # (spctl writes its verdict to stderr) and exit status without
        # letting set -e abort the run — a rejection is the expected
        # outcome on the RED path and must be reported, not crashed on.
        set +e
        SPCTL_OUT="$(spctl -a -vv -t install "${ASSET_PATH}" 2>&1)"
        SPCTL_EXIT=$?
        set -e
        echo "GATEKEEPER-SPCTL exit=${SPCTL_EXIT}"
        echo "${SPCTL_OUT}"

        # --- 9. Derive the observed verdict from the EXIT STATUS ALONE: 0
        # is accepted, 3 is rejected, anything else is unclassifiable and
        # therefore a hard failure — NEVER a grep/case over the output
        # text, which would classify wrongly (a substring search for
        # "accepted" matches inside "rejected (the code is valid but does
        # not seem to be an app)" and inside origin= lines), not merely
        # weakly. Measured on macOS 27.0 while the CI runner is
        # Tahoe-class, so a future version drift is anticipated: it
        # surfaces here as a loud, unclassifiable-exit failure, never a
        # silently wrong verdict.
        OK=1
        case "${SPCTL_EXIT}" in
          0) OBSERVED="accepted" ;;
          3) OBSERVED="rejected" ;;
          *)
            echo "::error::spctl exit status ${SPCTL_EXIT} is neither 0 (accepted) nor 3 (rejected) — unclassifiable, hard failure"
            OBSERVED="unclassifiable"
            OK=0
            ;;
        esac

        # source_assertion is captured SEPARATELY from observed: whether
        # the output names the notarized-Developer-ID source string. NOT
        # part of the verdict — a deliberate SECOND, INDEPENDENT assertion,
        # so rejecting exit 0 when the source line is absent does not read
        # as a contradiction of "exit status is the oracle."
        if printf '%s' "${SPCTL_OUT}" | grep -q 'source=Notarized Developer ID'; then
          SOURCE_ASSERTION="pass"
        else
          SOURCE_ASSERTION="fail"
        fi

        # Truth table (mechanical, not left to interpretation): only an
        # off-diagonal pair fails.
        #   observed=accepted -> source_assertion MUST be pass
        #   observed=rejected -> source_assertion MUST be fail (the
        #     notarized-source line is legitimately ABSENT on the RED
        #     path, and its absence is correct — a naive "must be pass"
        #     reading would break the phase's first gate)
        SOURCE_MISMATCH=0
        if [ "${OBSERVED}" = "accepted" ] && [ "${SOURCE_ASSERTION}" != "pass" ]; then
          SOURCE_MISMATCH=1
        elif [ "${OBSERVED}" = "rejected" ] && [ "${SOURCE_ASSERTION}" != "fail" ]; then
          SOURCE_MISMATCH=1
        fi
        if [ "${SOURCE_MISMATCH}" = "1" ]; then
          echo "::error::SOURCE-ASSERTION-MISMATCH observed=${OBSERVED} source_assertion=${SOURCE_ASSERTION} — two independent assertions (observed from exit status alone; source_assertion from output text) disagree off the required diagonal"
          OK=0
        fi

        # --- 10. Run syspolicy_check distribution and record its exit
        # status and output verbatim under a labelled line. It MUST NOT
        # gate: D-19 removes it as a gating check because its Fatal
        # verdict is definitionally unreachable while stapling is out of
        # scope (D-16/DIST-06), and a gate that can never pass is one of
        # the two failure families this phase exists to close. If the
        # binary is absent, record the sentinel and continue.
        if command -v syspolicy_check >/dev/null 2>&1; then
          set +e
          SYSPOLICY_OUT="$(syspolicy_check distribution "${ASSET_PATH}" 2>&1)"
          SYSPOLICY_EXIT=$?
          set -e
        else
          SYSPOLICY_OUT="syspolicy_check not found on this host"
          SYSPOLICY_EXIT="not-found"
        fi
        echo "GATEKEEPER-SYSPOLICY-CHECK (NON-GATING — see this target's desc: for why gating on it is forbidden) exit=${SYSPOLICY_EXIT}"
        echo "${SYSPOLICY_OUT}"

        # --- 11. Compare the observed verdict against GATEKEEPER_EXPECT.
        if [ "${OBSERVED}" != "${GATEKEEPER_EXPECT}" ]; then
          echo "::error::observed verdict '${OBSERVED}' does not match GATEKEEPER_EXPECT='${GATEKEEPER_EXPECT}'"
          OK=0
        fi

        # --- 12. Emit the evidence line as the LAST line printed, on BOTH
        # the pass and the fail path — a RED observation is the most
        # valuable output this target can produce. schema=1 first, fixed
        # key order, sentinels for anything unavailable (never omitted).
        echo "GATEKEEPER-EVIDENCE schema=1 tag=${TAG} goos=${GOOS} goarch=${GOARCH} sha256=${SHA256} gh_digest=${GH_DIGEST:-not-found} digest_match=${DIGEST_MATCH} expect=${GATEKEEPER_EXPECT} observed=${OBSERVED} exit=${SPCTL_EXIT} xattr_present=${XATTR_PRESENT} source_assertion=${SOURCE_ASSERTION} syspolicy_exit=${SYSPOLICY_EXIT}"

        if [ "${OK}" != "1" ]; then
          exit 1
        fi

        echo "verify:gatekeeper: PASS — observed=${OBSERVED} matches GATEKEEPER_EXPECT=${GATEKEEPER_EXPECT}"

  check:cross:
    desc: >-
      4-target go list -mod=readonly sanity sweep (D-15) — the same pre-tag
      gate release-please.yml's pretag-gate job runs before a tag can be
      created. Run this locally before pushing to main to catch a
      platform-specific go.sum/build-constraint failure your own GOOS/GOARCH
      can't see (the exact failure class that reached the v0.1 rc.1 release
      candidate). The pair list is machine-held set-equal to
      .goreleaser.yaml's builds: targets by
      TestCheckCrossMatchesGoreleaserTargets, so the windows pairs left here
      in lockstep with the build entries (quick task 260807-gho).
    cmds:
      - |
        set -euo pipefail
        for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${pair%/*}" GOARCH="${pair#*/}" go list -mod=readonly ./... > /dev/null || {
            echo "::error::go list -mod=readonly ./... failed for GOOS=${pair%/*} GOARCH=${pair#*/}"
            exit 1
          }
        done

  lint:actions:
    desc: Lint GitHub Actions workflows (workflow static analysis).
    cmds:
      - "{{.GO_TOOL_LINT}} actionlint .github/workflows/*.yml"

  check:transcript-freeze:
    desc: >-
      D-03 anti-regeneration guard, ADVISORY since 03-02 (v0.3.0 Phase 3):
      reports, but never fails the build, when a pull request's merge-base
      diff changes a frozen wire-oracle transcript together with
      internal/mcp/*.go or the MCP dependency line in go.mod. Became
      advisory because the guard's own "split into two pull requests"
      remedy is structurally unavailable in this repository (03-CONTEXT.md
      D-06: a server-change-only PR fails the required wire-oracle leg, and
      a transcripts-only PR has no mergeable base) — the control that
      applies instead is the reviewed-diff pass D-06 mandates: capture the
      wire oracle before and after, read every changed line, name every
      cause in the commit message. SDK-01's swap still carries its own
      self-expiring exemption notice keyed to the mark3labs-to-go-sdk
      go.mod transition (02-CONTEXT.md D-01/D-02/D-03). Requires
      TRANSCRIPT_FREEZE_BASE (a ref name, e.g. origin/main) so the diff is
      computed against the merge-base rather than a per-commit comparison —
      pull-request granularity is what survives this repository's
      squash-merge model.
    cmds:
      - |
        set -euo pipefail
        if [ -z "${TRANSCRIPT_FREEZE_BASE:-}" ]; then
          echo "::error::TRANSCRIPT_FREEZE_BASE is not set — check:transcript-freeze needs a base ref to compute the merge-base diff against (e.g. TRANSCRIPT_FREEZE_BASE=origin/main task check:transcript-freeze)."
          exit 1
        fi
        git rev-parse --verify "${TRANSCRIPT_FREEZE_BASE}" >/dev/null
        mb=$(git merge-base "${TRANSCRIPT_FREEZE_BASE}" HEAD)
        CHANGED_LIST=$(mktemp)
        GOMOD_DIFF=$(mktemp)
        trap 'rm -f "$CHANGED_LIST" "$GOMOD_DIFF"' EXIT
        # --name-status with rename/copy detection (-M -C), NOT --name-only:
        # both sides of a renamed transcript or a renamed transcripts
        # directory must reach the classifier.
        git diff --name-status -M -C "$mb" HEAD > "$CHANGED_LIST"
        git diff "$mb" HEAD -- go.mod > "$GOMOD_DIFF"
        go run ./tools/transcriptfreeze -changed-list "$CHANGED_LIST" -gomod-diff "$GOMOD_DIFF"

  diag:cpu:
    desc: >-
      CPU/memory/storage topology diagnostic (10-04-PLAN, Rule 2 deviation
      — NOT a gate; never called by ci.yml, and the only callers in
      bench.yml are its non-gating, manually-dispatched cpu-diag-* jobs).
      Reports CPU (nproc, a Go process's own
      runtime.NumCPU()/GOMAXPROCS(0), the cgroup CPU quota, /proc/cpuinfo
      model/family/stepping/count, cpufreq scaling info), memory (free -b
      or /proc/meminfo MemTotal), and storage (df -T for the workspace
      and TMPDIR, block-device rotational flags, and a real
      sequential-write+read-back throughput probe against TMPDIR — the
      exact directory tools/bench/runner materializes its corpus into,
      since os.MkdirTemp("", ...) resolves there). Exists to A/B two
      competing explanations for bench throughput variance that showed up
      with rock-stable peak RSS (0.56%) but a much wider wall-clock spread
      (4.36% session medians, ~30% full 14-trial range): (1) CPU-count
      oversubscription — refuted in an earlier pass, NumCPU already
      matches nproc/cgroup on Namespace — and (2) I/O-bound variance from
      unequal or noisier storage/memory between runner classes, which same
      work + stable memory + different wall-clock is the classic signature
      of. Linux-only by nature (cgroup/proc paths); the precondition below
      fails loud with a pointer to the dispatchable workflow rather than
      printing confusing "file not found" output on a contributor's
      non-Linux machine.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "diag:cpu reads Linux cgroup/proc paths and is meant to run on the CI runner under investigation, not a contributor machine. Dispatch it instead: Actions -> bench -> Run workflow -> job: cpu-diag (both cpu-diag-github and cpu-diag-namespace run side by side)."
    cmds:
      - echo "=== CPU ==="
      - echo "--- nproc ---"
      - nproc
      - echo "--- go process view (runtime.NumCPU / runtime.GOMAXPROCS(0)) ---"
      - go run ./tools/bench/cpudiag
      - echo "--- cgroup CPU quota ---"
      - |
        set -euo pipefail
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          echo "cgroup v2 cpu.max:"
          cat /sys/fs/cgroup/cpu.max
        elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
          echo "cgroup v1 cpu.cfs_quota_us / cpu.cfs_period_us:"
          cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us
          cat /sys/fs/cgroup/cpu/cpu.cfs_period_us
        else
          echo "no cgroup CPU quota file found at either the v2 or v1 path"
        fi
      - echo "--- /proc/cpuinfo model/family/stepping/count ---"
      - |
        set -euo pipefail
        if [ -f /proc/cpuinfo ]; then
          grep -m1 "model name"  /proc/cpuinfo || echo "no 'model name' line in /proc/cpuinfo"
          grep -m1 "cpu family"  /proc/cpuinfo || echo "no 'cpu family' line in /proc/cpuinfo"
          grep -m1 "stepping"    /proc/cpuinfo || echo "no 'stepping' line in /proc/cpuinfo"
          echo "processor count: $(grep -c '^processor' /proc/cpuinfo)"
        else
          echo "/proc/cpuinfo not present"
        fi
      - echo "--- cpufreq scaling (cpu0) ---"
      - |
        set -euo pipefail
        CPUFREQ_DIR=/sys/devices/system/cpu/cpu0/cpufreq
        if [ -d "$CPUFREQ_DIR" ]; then
          for f in scaling_governor scaling_cur_freq scaling_min_freq scaling_max_freq; do
            if [ -f "$CPUFREQ_DIR/$f" ]; then
              echo "${f}: $(cat "$CPUFREQ_DIR/$f")"
            else
              echo "${f}: not present"
            fi
          done
        else
          echo "no cpufreq sysfs directory at $CPUFREQ_DIR (common inside a VM/container without frequency-scaling passthrough — itself a data point)"
        fi
      - echo "=== Memory ==="
      - |
        set -euo pipefail
        if command -v free >/dev/null 2>&1; then
          free -b
        else
          echo "free not found; falling back to /proc/meminfo"
          grep MemTotal /proc/meminfo
        fi
      - echo "=== Storage ==="
      - echo "--- df -T (workspace and TMPDIR) ---"
      - |
        set -euo pipefail
        echo "workspace ($(pwd)):"
        df -T .
        echo "TMPDIR (${TMPDIR:-/tmp}), the directory tools/bench/runner materializes its corpus into:"
        df -T "${TMPDIR:-/tmp}"
      - echo "--- block device rotational flags (0=SSD/NVMe, 1=spinning) ---"
      - |
        set -euo pipefail
        shopt -s nullglob 2>/dev/null || true
        found=0
        for f in /sys/block/*/queue/rotational; do
          found=1
          dev=$(basename "$(dirname "$(dirname "$f")")")
          val=$(cat "$f" 2>/dev/null || echo "unreadable")
          echo "${dev}: rotational=${val}"
        done
        if [ "$found" -eq 0 ]; then
          echo "no /sys/block/*/queue/rotational entries found"
        fi
      - echo "--- sequential write+read-back probe against TMPDIR (2GiB) ---"
      - |
        set -euo pipefail
        SCRATCH_DIR="${TMPDIR:-/tmp}"
        SCRATCH_FILE="${SCRATCH_DIR%/}/codegraph-diag-ddtest.bin"
        trap 'rm -f "$SCRATCH_FILE"' EXIT
        echo "write:"
        if dd if=/dev/zero of="$SCRATCH_FILE" bs=1M count=2048 conv=fdatasync oflag=direct 2>write.log; then
          echo "(oflag=direct supported)"
        else
          echo "(oflag=direct NOT supported on this filesystem — falling back to buffered write)"
          dd if=/dev/zero of="$SCRATCH_FILE" bs=1M count=2048 conv=fdatasync 2>write.log
        fi
        cat write.log
        echo "read-back:"
        if dd if="$SCRATCH_FILE" of=/dev/null bs=1M iflag=direct 2>read.log; then
          echo "(iflag=direct supported)"
        else
          echo "(iflag=direct NOT supported on this filesystem — falling back to buffered read)"
          dd if="$SCRATCH_FILE" of=/dev/null bs=1M 2>read.log
        fi
        cat read.log
        rm -f write.log read.log

  diag:storage-fit:
    desc: >-
      tmpfs sizing diagnostic (10-04-PLAN, Rule 2 deviation — NOT a gate;
      never called by ci.yml, and the only callers in bench.yml are its
      non-gating, manually-dispatched cpu-diag-* jobs). Reports the
      candidate tmpfs mount's available capacity (df -h /dev/shm) and
      then materializes ONE real PERF-02/INDX-06 synthetic corpus
      (tools/bench/gencorpus, seed 42, count 120000 — the exact
      seed/count tools/bench/runner's regression mode uses) and runs a
      real `codegraph init` + `codegraph index --force --quiet` against
      it, reporting `du -sh` on both the corpus and the resulting
      .codegraph/ Pebble store. Exists to answer, with real numbers
      rather than estimates, whether pointing the regression scratch
      directory at tmpfs (candidate fix for I/O-bound throughput
      variance — see diag:cpu's doc comment) is even viable before
      wiring it in: a tmpfs mount that can't hold the corpus + store
      would make the fix worse than the problem. Everything this target
      creates lives under a temp directory removed on exit; it never
      writes to the real tmpfs default tools/bench/runner would use in
      production, only measures what WOULD fit there.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "diag:storage-fit reads Linux-only paths (/dev/shm) and is meant to run on the CI runner under investigation, not a contributor machine. Dispatch it instead: Actions -> bench -> Run workflow -> job: cpu-diag."
    cmds:
      - echo "--- /dev/shm availability and size ---"
      - |
        set -euo pipefail
        if [ -d /dev/shm ]; then
          df -h /dev/shm
        else
          echo "/dev/shm does not exist on this host"
        fi
      - echo "--- materializing one real PERF-02 corpus (seed 42, count 120000) ---"
      - |
        set -euo pipefail
        WORKDIR=$(mktemp -d)
        trap 'rm -rf "$WORKDIR"' EXIT
        go build -o "$WORKDIR/gencorpus" ./tools/bench/gencorpus
        go build -o "$WORKDIR/codegraph" ./cmd/codegraph
        CORPUS_DIR="$WORKDIR/corpus"
        "$WORKDIR/gencorpus" -seed 42 -out "$CORPUS_DIR" -count 120000
        echo "corpus size:"
        du -sh "$CORPUS_DIR"
        "$WORKDIR/codegraph" init "$CORPUS_DIR"
        "$WORKDIR/codegraph" index "$CORPUS_DIR" --force --quiet
        echo ".codegraph store size:"
        du -sh "$CORPUS_DIR/.codegraph"
        echo "total (corpus + store):"
        du -sh "$WORKDIR"

  check:reproducibility:
    desc: >-
      linux/amd64 double-build hash-diff (DIST-04, BLOCKING leg) — ports
      ci.yml's reproducibility job's canonical double build character-for-
      character. Reads SOURCE_DATE_EPOCH/COMMIT from the environment (what
      ci.yml's own "Compute determinism inputs" step exports via env:);
      when either is unset, defaults locally to the same two commands that
      step runs (git log -1 --format=%ct / git rev-parse HEAD) so this
      target is runnable on a contributor checkout without inventing
      different inputs. Uses GNU date -d (matching ci.yml's own script
      verbatim, D-15-style byte-fidelity) — a Linux host, or GNU coreutils
      on PATH as `date`, is required; BSD/macOS date does not accept -d.
    cmds:
      - |
        set -euo pipefail
        SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
        COMMIT="${COMMIT:-$(git rev-parse HEAD)}"
        DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=ci-repro -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}"
        build() {
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "$1" ./cmd/codegraph
        }
        build /tmp/codegraph_build1
        build /tmp/codegraph_build2
        H1=$(sha256sum /tmp/codegraph_build1 | cut -d' ' -f1)
        H2=$(sha256sum /tmp/codegraph_build2 | cut -d' ' -f1)
        echo "build1=$H1"
        echo "build2=$H2"
        if [ "$H1" != "$H2" ]; then
          echo "::error::REPRODUCIBILITY GATE FAILED: linux/amd64 build is non-deterministic ($H1 != $H2)"
          exit 1
        fi
        echo "linux/amd64 double-build matched: $H1"

  check:reproducibility:arm64:
    desc: >-
      linux/arm64 cross-target double-build hash-diff (DIST-04, REPORTED
      ONLY — non-blocking per D-03). Ports ci.yml's cross-target leg
      character-for-character, including its ::warning:: (not ::error::)
      branch and non-failing exit — a mismatch here is reported, never
      gated. Same SOURCE_DATE_EPOCH/COMMIT local-defaulting as
      check:reproducibility. This leg is non-blocking in CI, which makes a
      silent local skip especially dangerous ("I ran it and it was fine"
      would actually mean "it never ran") — the zig precondition below
      exists specifically to fail loud instead.
    preconditions:
      - sh: command -v zig
        msg: "zig not found on PATH — check:reproducibility:arm64 cross-compiles via zig cc (aarch64-linux-gnu). Install per CONTRIBUTING.md's Building section (https://ziglang.org/download/), or run `task check:reproducibility` (the blocking linux/amd64 leg) alone if you don't need the cross-target report."
    cmds:
      - |
        set -euo pipefail
        SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
        COMMIT="${COMMIT:-$(git rev-parse HEAD)}"
        DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=ci-repro -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}"
        build() {
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC="zig cc -target aarch64-linux-gnu" \
            CXX="zig c++ -target aarch64-linux-gnu" \
            go build -trimpath -ldflags "$LDFLAGS" -o "$1" ./cmd/codegraph
        }
        build /tmp/codegraph_arm1
        build /tmp/codegraph_arm2
        H1=$(sha256sum /tmp/codegraph_arm1 | cut -d' ' -f1)
        H2=$(sha256sum /tmp/codegraph_arm2 | cut -d' ' -f1)
        echo "build1=$H1"
        echo "build2=$H2"
        if [ "$H1" != "$H2" ]; then
          echo "::warning::linux/arm64 cross-target double-build did NOT match (reported only, non-blocking per D-03)"
        else
          echo "linux/arm64 cross-target double-build matched (reported only, non-blocking per D-03)"
        fi

  bench:regression:
    desc: >-
      Local invocation of the PERF-02/INDX-06 regression gate (D-14) —
      wraps ci.yml's perf-regression job's invocation verbatim. This gate
      is deliberately unrunnable as a REAL check on a developer machine:
      internal/bench.CheckRegression refuses any comparison whose
      GOOS/GOARCH, runner, or scratch_fs identity doesn't match the
      committed tools/bench/baseline.json, and a developer machine is
      essentially never that exact combination. When that refusal fires,
      this target explains why in prose (tools/bench/BASELINE.md has the
      full rationale) and still exits non-zero — it never remaps or
      swallows the underlying exit status; the explanation is additive
      output only. No -rebless flag is reachable from this or any other
      task target (D-13) — baseline.json is written only by bench.yml's
      manually-dispatched rebless job.
    cmds:
      - |
        set -euo pipefail
        if OUTPUT=$(go run ./tools/bench/runner -mode regression \
          -baseline tools/bench/baseline.json \
          -trials 3 \
          -ceiling-bytes 4294967296 2>&1); then
          STATUS=0
        else
          STATUS=$?
        fi
        echo "$OUTPUT"
        if [ "$STATUS" -ne 0 ] && printf '%s' "$OUTPUT" | grep -qE 'platform mismatch|runner mismatch|scratch filesystem mismatch'; then
          echo ""
          echo "This gate refused the comparison above as a category error: it compares"
          echo "against tools/bench/baseline.json, which is bound to a specific runner class"
          echo "and scratch filesystem class, and it is deliberately not runnable as a real"
          echo "gate on a developer machine. See tools/bench/BASELINE.md for the full"
          echo "rationale and how to re-bless the baseline (bench.yml's rebless job only —"
          echo "no local -rebless target exists, see CONTRIBUTING.md)."
        fi
        exit "$STATUS"

  # --- Contributor-only coarse wrappers (D-02) --------------------------
  #
  # CI NEVER calls these two targets — ci.yml calls the fine-grained
  # targets above directly, one per named step. A wrapper that forgets a
  # leg costs a contributor convenience, but cannot weaken CI coverage,
  # because CI never reads this list. Do not "simplify" ci.yml onto these
  # wrappers — that would reintroduce exactly the silent-drop risk D-02
  # designed out. See TestTaskfileWrapperIsSerial (internal/upgrade) for
  # the set-equality guard that keeps the `test` wrapper's leg list honest.

  test:
    desc: >-
      Contributor wrapper: the six host-only legs (test:unit, test:golden,
      test:integration, test:wireoracle, test:daemon, test:race), run
      SERIALLY via a list of sub-task commands (never deps:, which go-task
      runs concurrently). test:daemon and test:race both pass -p 1
      specifically to avoid cross-test contention; running the two
      concurrently with each other would reintroduce exactly the flakiness
      those flags exist to prevent.
    cmds:
      - task: test:unit
      - task: test:golden
      - task: test:integration
      - task: test:wireoracle
      - task: test:daemon
      - task: test:race

  lint:
    desc: "Contributor wrapper: vet and lint:actions, run serially."
    cmds:
      - task: vet
      - task: lint:actions
