# Single local-build/CI-invocation definition site (D-01, D-02). CI workflow
# `run:` steps call `task <target>` — they no longer own command bodies
# themselves. See go.tool.mod / go.tool-lint.mod for why the tools this
# Taskfile shells out to are pinned via isolated -modfile builds rather than
# `go install` or a marketplace action.
version: "3"

vars:
  GO_TOOL: GOWORK=off go tool -modfile=go.tool.mod
  GO_TOOL_LINT: GOWORK=off go tool -modfile=go.tool-lint.mod

tasks:
  default:
    desc: List available targets (does not build, test, or lint anything).
    silent: true
    cmds:
      - task --list

  build:
    desc: Build every package (compile check only, no binary retained).
    cmds:
      - go build ./...

  build:release:
    desc: >-
      Local convenience build producing ./codegraph with release-shaped
      ldflags (version metadata, -trimpath). This is NOT a release artifact —
      goreleaser (task check:goreleaser / .goreleaser.yaml / release.yml)
      builds, signs, and SBOMs what actually ships. Use this only to
      sanity-check a version-stamped local binary.
    cmds:
      - |
        set -euo pipefail
        VERSION=$(git describe --tags --always --dirty)
        COMMIT=$(git rev-parse HEAD)
        # TZ=UTC + git's own date formatter avoids GNU-vs-BSD `date -d`
        # incompatibility between Linux CI and macOS/BSD contributor
        # machines — no shell `date` binary is invoked at all.
        DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
        go build -trimpath -ldflags "-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=${VERSION} -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}" -o ./codegraph ./cmd/codegraph

  test:unit:
    desc: >-
      go test over every package except internal/daemon (isolated separately
      — see task test:daemon).
    cmds:
      - |
        set -euo pipefail
        # IN-08 (03-REVIEW.md): `set -e` does not propagate a failure out of
        # a process substitution — `mapfile -t pkgs < <(go list ... | grep
        # ...)` would succeed regardless of go list's own exit status, so a
        # partial emission before a failure could silently test a subset of
        # packages under a green check. Materialize the list first so go
        # list's exit code is checked by set -e before anything consumes it.
        pkgs_raw=$(go list ./...)
        mapfile -t pkgs < <(printf '%s\n' "$pkgs_raw" | grep -v '/internal/daemon$')
        go test "${pkgs[@]}"

  test:golden:
    desc: >-
      Golden parity suite (testdata/golden) — NOT covered by go list ./...
      (GOLDEN-01: the go tool ignores any directory named "testdata" when
      expanding ./...), so this is its own explicit target.
    cmds:
      - go test ./testdata/golden/...

  golden:regen:
    desc: >-
      Regenerate all Go-side golden fixtures (gocapture) — the reviewed
      one-command re-freeze entrypoint (02-03, FIXT-06). Runs corpora fetch,
      integrity assert, then gocapture. Every capture goes through
      capture-to-temp-then-move (Pattern 2) and fails closed on a missing
      mandatory source.
    deps:
      - corpora:fetch
    cmds:
      - task corpora:assert
      - go run ./testdata/golden/gocapture


  test:integration:
    desc: >-
      Subprocess integration harness (test/integration) — already reached by
      go list ./... (it's a normal package, not testdata/), but this explicit
      target guards against a future refactor of test:unit's filtered go list
      line silently dropping it too.
    cmds:
      - go test ./test/integration/...

  test:wireoracle:
    desc: >-
      Wire-level regression oracle (test/wireoracle) — spawns the real
      binary over real stdio and byte-compares normalized transcripts
      against testdata/wireoracle/transcripts/*.golden. Pre-migration wire
      regression baseline (VRFY-01/VRFY-04): must never be relaxed or
      re-baselined during the SDK swap in Phase 2. Measured 2026-08-05:
      ~5.8s wall-clock on the frozen single-scenario tree.
    cmds:
      - go test ./test/wireoracle/...

  test:daemon:
    desc: >-
      internal/daemon, isolated (-count=1). TestSoak and the flush-lock tests
      are a documented, PRE-EXISTING flake under full-suite parallel load
      (STATE.md, 08-CONTEXT.md "Flake note") — isolating them here is the
      documented handling; the tests are NOT removed or skipped, just run
      without contention from the rest of the suite.
    cmds:
      - go test ./internal/daemon/ -count=1

  test:race:
    desc: >-
      Concurrency packages under the race detector. -p 1 preserves the same
      no-parallel-package-contention isolation test:daemon relies on — do not
      run this concurrently with test:daemon (see the test wrapper's comment).
    cmds:
      # internal/mcp added during phase-01 UAT (01-UAT.md test 2): the
      # session-line hook in server.go writes to a shared caller-supplied
      # io.Writer from AddAfterInitialize, which fires once per initialize
      # across concurrent sessions — a genuine concurrency seam that had
      # neither a test nor race-detector coverage. The seam's own regression
      # test (TestSessionLineSurvivesConcurrentAndRepeatedInitialize) fails
      # deterministically without -race; this entry is the fallback net for
      # the races it cannot model.
      - go test -race -count=1 -p 1 ./internal/daemon/... ./internal/watch/... ./internal/cli/... ./internal/mcp/...

  vet:
    desc: >-
      go vet ./... — NEW enforcement as of this target (DEV-01): plain
      `go vet ./...` has never run in CI before; only two package-scoped
      GOOS=windows vets did, and those retired with native Windows support
      (quick task 260807-gho). Findings surfaced on first run are fixed,
      not suppressed.
    cmds:
      - go vet ./...

  vuln:
    desc: >-
      ADVISORY (VULN-01/VULN-03; D-04 superseded 04-01 Task 1 checkpoint —
      see 04-01-SUMMARY.md): govulncheck -mode=binary over the four tool
      binaries built from go.tool.mod (task, goreleaser, govulncheck) and
      go.tool-lint.mod (actionlint) — the 357 measured third-party modules
      that execute as credentialed CI tooling (repository write access and
      secrets) and were previously scanned by nothing (D-05: this target
      used to run `govulncheck ./...` over the main module only, a no-op
      duplicate of ci.yml's own gate that never touched either tool
      modfile). Reports, but never fails the build — this target was
      designed BLOCKING and was demoted to advisory after its own first
      real run found that goreleaser's binary carries a real,
      permanently-unfixed, symbol-reachable match for GO-2026-5932 (110
      vulnerable symbols in golang.org/x/crypto/openpgp, reached via
      goreleaser/cmd -> pipe/ko -> google/ko -> sigstore/cosign/oci ->
      sigstore/rekor/pkg/pki/pgp; goreleaser never imports openpgp
      directly, the ko pipe compiles into every goreleaser binary
      regardless of config, and the upstream package is unmaintained,
      Fixed in: N/A). Shipped blocking, this gate would have been
      permanently red from its first run on real in-scope tooling — worse
      than the no-op it replaces. All four binaries stay in scope (no
      allowlist, no exclusion): the point is detection, not build-failure,
      so a NEW finding in any binary is exactly as visible as this known
      one. -mode=binary is also symbol-level, NOT call-graph-aware: per
      govulncheck's own documentation, "Because Go binaries do not contain
      detailed call information, govulncheck cannot show the call graphs...
      It may also report false positives for code that is in the binary but
      unreachable" — a materially weaker guarantee than the source-mode
      analysis ci.yml's "govulncheck (DIST-03, blocking)" job performs over
      the main module, which this target does not replace or modify and
      which stays blocking, unchanged. Exit-code classification still
      drives what gets reported: 0 is clean (or a module-level-only match
      govulncheck itself does not consider a symbol hit); 3 is a
      symbol-matched vulnerability; any other status (usage error,
      vuln.go.dev unreachable) is also reported distinctly, never silently
      folded into "clean" — but none of the three fails this task. See
      vuln:selftest for the non-vacuity proof that DETECTION (not build
      failure) still fires.
    cmds:
      - |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "${scratch}"' EXIT

        echo "==> Building tool binaries (GOWORK=off; go.tool.mod x3, go.tool-lint.mod x1)"
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/task" github.com/go-task/task/v3/cmd/task
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/goreleaser" github.com/goreleaser/goreleaser/v2
        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/govulncheck" golang.org/x/vuln/cmd/govulncheck
        GOWORK=off go build -modfile=go.tool-lint.mod -o "${scratch}/actionlint" github.com/rhysd/actionlint/cmd/actionlint

        # ADVISORY (D-04 superseded): every outcome below is REPORTED, never
        # fails this task. See this target's desc: for why — goreleaser's
        # binary carries a real, permanently-unfixed, symbol-reachable
        # vulnerability (GO-2026-5932) that would otherwise make a blocking
        # gate permanently red.
        for name in task goreleaser govulncheck actionlint; do
          set +e
          out=$({{.GO_TOOL}} govulncheck -mode=binary "${scratch}/${name}" 2>&1)
          status=$?
          set -e
          case "${status}" in
            0)
              echo "    ${name}: CLEAN (exit 0 — no symbol-matched vulnerability, or a module-level-only match govulncheck does not consider a symbol hit)"
              ;;
            3)
              echo "::warning::${name}: DETECTED — govulncheck -mode=binary exited 3 (symbol-matched vulnerability; advisory, does not fail the build)"
              echo "${out}"
              ;;
            *)
              echo "::warning::${name}: SCAN ERROR — govulncheck -mode=binary exited ${status} (usage error or vuln.go.dev unreachable; reported distinctly, never folded into CLEAN)"
              echo "${out}"
              ;;
          esac
        done

  vuln:selftest:
    desc: >-
      Non-vacuity proof for `vuln` (VULN-02): builds the permanent red-proof
      program (testdata/vulnredpoc — see its own doc comment) from
      go.tool.mod and asserts the underlying govulncheck -mode=binary scan
      exits EXACTLY 3 and names GO-2026-5932. Unlike `vuln` itself, THIS
      target is allowed to fail the build: a failure here means govulncheck's
      own exit-3/advisory-ID classification broke — a detection-mechanism
      regression, not a new vulnerability finding — which is exactly the
      failure `vuln`'s advisory stance cannot surface on its own (an
      advisory job that silently stops detecting is worse than a blocking
      one). testdata/vulnredpoc is excluded from `go list ./...`
      (GOLDEN-01) and built only here, by explicit path against
      go.tool.mod — it never enters the main module's package graph and
      adds no requirement to the root go.mod.
    cmds:
      - |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "${scratch}"' EXIT

        GOWORK=off go build -modfile=go.tool.mod -o "${scratch}/vulnredpoc" ./testdata/vulnredpoc

        set +e
        out=$({{.GO_TOOL}} govulncheck -mode=binary "${scratch}/vulnredpoc" 2>&1)
        status=$?
        set -e

        echo "${out}"

        if [ "${status}" -ne 3 ]; then
          echo "::error::vuln:selftest FAILED — govulncheck -mode=binary exited ${status} (want 3) scanning the deliberately-vulnerable testdata/vulnredpoc binary; the tool-modfile vulnerability gate's detection mechanism could not be proven able to fire"
          exit 1
        fi

        if ! printf '%s' "${out}" | grep -q "GO-2026-5932"; then
          echo "::error::vuln:selftest FAILED — scan exited 3 but its output does not name GO-2026-5932; a different advisory firing is not accepted as proof this specific detection path works"
          exit 1
        fi

        echo "vuln:selftest: PASS — govulncheck -mode=binary exited 3 and named GO-2026-5932 against testdata/vulnredpoc"

  check:darwin-toolchain:
    desc: >-
      Prove a native darwin host can CGo-build both release arches — the D-08
      canary. release.yml builds both darwin targets on a native macOS runner
      with Xcode's own clang (no zig, no osxcross) because a Linux-hosted CGo
      cross-link to darwin risks silently breaking libresolv-based DNS
      resolution in a binary that makes real HTTPS calls (`codegraph
      upgrade`). release.yml fires only on a `v*` tag push, so without this
      target nothing exercises that toolchain until a release is already
      being cut. Reports the SDK version deliberately: a newer SDK can
      produce a binary that builds, signs, and attests cleanly yet refuses to
      launch on an older macOS — the one failure here that is silent rather
      than loud.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "check:darwin-toolchain must run on a native darwin host — that is the property it exists to verify (D-08). Run it on macOS locally, or dispatch the darwin-toolchain-canary workflow."
      - sh: command -v clang
        msg: "clang not found. Install Xcode or the Command Line Tools: xcode-select --install"
    cmds:
      - sw_vers
      - uname -m
      - clang --version
      - xcrun --sdk macosx --show-sdk-version
      # Both arches, mirroring release.yml's matrix: arm64 is native, amd64 is
      # an arch-only cross on the same host and SDK (Go passes clang the right
      # -arch for GOARCH). -o /dev/null because only the link is being proven.
      - CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/codegraph
      - CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/codegraph

  check:darwin-release-build:
    desc: >-
      Prove GoReleaser itself can drive the darwin release build on a native
      darwin host (D-08). check:darwin-toolchain proves the *toolchain* with a
      plain `go build`; this target proves the *composition* release.yml
      actually runs — `goreleaser build --single-target` for both darwin
      arches, so .goreleaser.yaml's CGO_ENABLED=1 env, -trimpath, version
      ldflags and mod_timestamp are exercised on the macOS host instead of
      inferred from a linux run. It exists because release.yml fires only on a
      `v*` tag push, which means its first darwin GoReleaser invocation
      otherwise happens during a release that is already underway, on the one
      leg where the host OS is a correctness input rather than a speed choice.
      Uses --snapshot deliberately: a PR or dispatch HEAD carries no tag and
      GoReleaser hard-fails ("git tag ... was not made against commit ...")
      without one. The resolved version string is the only thing --snapshot
      changes, and the version string is not the property this target verifies.

      LOCAL-ONLY SINCE 2026-08-08 — this target is still NO LONGER RUN IN CI,
      but the reason changed (D-18, LOCKED, maintainer 2026-08-09): plan
      01-02 originally activated `binary_signs:` inside the BUILD pipeline,
      which forced `goreleaser build` (no `--skip=sign` exists for the build
      command) through a cosign KEYLESS OIDC call this canary cannot supply.
      Plan 02-02 moved cosign to the RELEASE-scoped `signs:` pipe — which is
      registered well after GoReleaser's hardcoded BuildPipeline entirely
      (internal/pipeline/pipeline.go, pinned goreleaser/v2@v2.17.1) — so
      `goreleaser build` NO LONGER REACHES ANY cosign call, and this target
      no longer needs a browser-driven keyless-signing flow or an OIDC
      token to complete.

      BUILD CLASS (plan 02-02's goreleaser-caller enumeration): this target's
      `goreleaser build --single-target` DOES still reach the notarize:
      pipe — `notary.MacOS{}` is registered INSIDE BuildPipeline, so it runs
      on every `goreleaser build` invocation regardless of `--skip`. The
      notarize skip key (`--skip=notarize`) is valid for the RELEASE command
      and NOT for the build command (internal/skips/skips.go, pinned
      goreleaser/v2@v2.17.1) — this target has NO escape hatch other than
      notarize.macos[0].enabled's five-term credential conjunction
      (MACOS_SIGN_P12/MACOS_SIGN_PASSWORD/MACOS_NOTARY_ISSUER_ID/
      MACOS_NOTARY_KEY_ID/MACOS_NOTARY_KEY, .goreleaser.yaml). On this
      canary's unprivileged environment none of those five are set, so
      `enabled:` resolves false and the pipe no-ops; do not mistake the
      absence of a `--skip=sign`-style flag for protection here — the
      credential guard is the ONLY thing stopping this target from reaching
      Apple. Was still covered pre-D-18 by `task release:dry-run` in
      linux-cross-canary's `cross-build` job on the same macOS profile
      (`goreleaser release` DOES accept `--skip=sign`); still true post-D-18.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "check:darwin-release-build must run on a native darwin host — that is the property it exists to verify (D-08). Run it on macOS locally, or dispatch the darwin-toolchain-canary workflow."
      - sh: command -v clang
        msg: "clang not found. Install Xcode or the Command Line Tools: xcode-select --install"
    cmds:
      - |
        set -euo pipefail

        # Build GoReleaser NATIVELY, with no GOOS/GOARCH in the environment,
        # and invoke that binary per-arch below. This ordering is load-bearing,
        # not stylistic: `go tool -modfile=go.tool.mod goreleaser` builds the
        # TOOL for whatever GOOS/GOARCH is set, so the obvious one-liner
        # (`GOARCH=amd64 {{.GO_TOOL}} goreleaser build ...`) yields an x86_64
        # GoReleaser running under Rosetta, whose child `xcrun` then resolves
        # as x86_64 and cannot load the arm64-only libxcrun.dylib from
        # CommandLineTools. That fails as a confusing `# runtime/cgo`
        # architecture error that reads like a broken toolchain but is really
        # a cross-built tool. release.yml does not hit this because
        # goreleaser-action installs a native prebuilt binary — which is
        # exactly the shape reproduced here.
        GORELEASER_BIN="$(mktemp -d)/goreleaser"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")"' EXIT
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        for arch in arm64 amd64; do
          echo "==> goreleaser build --single-target darwin/${arch}"
          GOOS=darwin GOARCH="${arch}" "${GORELEASER_BIN}" build \
            --single-target --snapshot --clean

          # Locate the built binary exactly as release.yml's rename step does:
          # dist/artifacts.json first (GoReleaser's own documented stable
          # lookup — dist/ subdirectory names are not guaranteed stable across
          # versions), with find(1) as the same defensive fallback.
          BIN=""
          if [ -f dist/artifacts.json ] && command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg a "${arch}" \
              '[.[] | select(.type=="Binary" and .goos=="darwin" and .goarch==$a)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::goreleaser produced no darwin/${arch} binary under dist/"
            exit 1
          fi

          # Assert the object is actually Mach-O of the requested arch. A
          # wrong-host build is the quiet failure this whole canary exists for:
          # it still produces something that builds, signs, and attests.
          DESC=$(file -b "${BIN}")
          echo "    ${BIN}: ${DESC}"
          case "${arch}:${DESC}" in
            arm64:*Mach-O*arm64*) ;;
            amd64:*Mach-O*x86_64*) ;;
            *) echo "::error::darwin/${arch} produced the wrong object: ${DESC}"; exit 1 ;;
          esac
        done

        rm -rf dist

  release:dry-run:
    desc: >-
      Prove the FULL `goreleaser release` composition — all four
      .goreleaser.yaml build entries (linux/amd64, linux/arm64, darwin/amd64,
      darwin/arm64) in ONE invocation — on a native darwin host, without
      publishing or signing anything (D-06, REL-05 enabling change).
      check:darwin-release-build already proves GoReleaser can drive a
      `build --single-target` darwin invocation; this target is the first
      thing in this repo to exercise `goreleaser release` itself, the
      single-runner shape the migrated release.yml (plan 01-03) will use.
      Uses --snapshot deliberately: a PR or dispatch HEAD carries no tag and
      GoReleaser hard-fails ("git tag ... was not made against commit ...")
      without one — the resolved version string is the only thing --snapshot
      changes, not the property this target verifies. Uses
      --skip=publish,sign so nothing is published to GitHub and no signing
      key/OIDC token is needed locally.

      RELEASE CLASS, notarize reachable (plan 02-02's goreleaser-caller
      enumeration): `--skip=sign` skips the release-scoped `signs:` pipe
      (cosign), but `notarize:` has its OWN skip key (`--skip=notarize`,
      valid for the release command — unlike the build command, see
      check:darwin-release-build's comment) that this target does NOT pass.
      `notary.MacOS{}` therefore DOES run here, because it is registered
      inside BuildPipeline and `goreleaser release` always runs
      BuildPipeline first. What stops it from reaching Apple on this
      unprivileged canary is ONLY notarize.macos[0].enabled's five-term
      credential conjunction (MACOS_SIGN_P12 and 4 siblings,
      .goreleaser.yaml) evaluating false — never `--skip=sign`, which is a
      different pipe.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:dry-run must run on a native darwin host — that is the runner class the migrated single-job release.yml (plan 01-03) uses (D-01). Run it on macOS locally, or dispatch the linux-cross-canary workflow, which runs this same target on namespace-profile-macos-6x14-tahoe."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml now cross-compile via zig cc/zig c++ (REL-05). CI installs zig 0.15.1 via mlugg/setup-zig; locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. --skip=publish,sign only skips the SIGN pipe — it does NOT skip the sboms: pipe. .goreleaser.yaml's sboms: block shells out to syft, and this precondition turns that into a named, actionable halt instead of a confusing mid-pipe failure (review HIGH-4). CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. Same forward reasoning as the syft precondition above: --skip=publish,sign skips the release-scoped signs: pipe today, but the permanent linux-cross-canary installs cosign before invoking it as defense-in-depth. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        # Build GoReleaser NATIVELY, with no GOOS/GOARCH in the environment,
        # exactly as check:darwin-release-build does and for the same
        # reason: a GOARCH-cross-built GoReleaser runs under Rosetta and its
        # child `xcrun` then resolves as x86_64, which cannot load the
        # arm64-only libxcrun.dylib from CommandLineTools — a confusing
        # "# runtime/cgo" architecture error that reads like a broken
        # toolchain but is really a cross-built tool. release.yml does not
        # hit this because goreleaser-action installs a native prebuilt
        # binary — reproduced here by building the tool with no GOOS/GOARCH
        # override.
        GORELEASER_BIN="$(mktemp -d)/goreleaser"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")"' EXIT
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        # zig cc/zig c++ default their LOCAL cache directory to a path next
        # to the C source file being compiled unless overridden. This
        # project's CGo tree-sitter dependencies compile from Go's module
        # cache (GOMODCACHE), which is read-only by design — without this
        # override, zig fails with "unable to open local cache directory
        # ...: AccessDenied" the first time either linux build id's zig cc
        # override actually runs. Point both the local and global cache at
        # a scratch dir cleaned up by the same trap as GORELEASER_BIN above.
        ZIG_CACHE_ROOT="$(mktemp -d)"
        trap 'rm -rf "$(dirname "${GORELEASER_BIN}")" "${ZIG_CACHE_ROOT}"' EXIT
        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # No GOOS/GOARCH set here: unlike `build --single-target`,
        # `goreleaser release` resolves every target from each builds:
        # entry's own goos:/goarch: list, not from the environment. A
        # leftover GOOS/GOARCH would be at best a no-op and at worst mask a
        # misconfiguration (RESEARCH.md Pattern 5 / Pitfall 2).
        echo "==> goreleaser release --snapshot --skip=publish,sign --clean"
        "${GORELEASER_BIN}" release --snapshot --skip=publish,sign --clean

        # Assert via dist/artifacts.json (GoReleaser's own documented stable
        # lookup, same as check:darwin-release-build) that exactly four
        # released Binary entries exist, one per (goos,goarch) pair — a
        # green exit code alone is explicitly NOT the check (RESEARCH.md
        # anti-pattern). `goreleaser release` records type=="Binary" TWICE
        # per platform: once for the raw `go build` output (named literally
        # "codegraph", extra.Builder set, no extra.Format) and once for the
        # archives: pipe's renamed/copied release asset (extra.Format ==
        # "binary", the codegraph_<tag>_<goos>_<goarch> shape
        # internal/upgrade.releaseAssetName() expects) — filtering on
        # extra.Format=="binary" selects the actual release asset, not the
        # intermediate build artifact.
        if [ ! -f dist/artifacts.json ]; then
          echo "::error::goreleaser release produced no dist/artifacts.json"
          exit 1
        fi

        BINARY_COUNT=$(jq -r '[.[] | select(.type=="Binary" and .extra.Format=="binary")] | length' dist/artifacts.json)
        if [ "${BINARY_COUNT}" != "4" ]; then
          echo "::error::dist/artifacts.json has ${BINARY_COUNT} released Binary entries (extra.Format==\"binary\"), want exactly 4"
          exit 1
        fi

        for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${pair%/*}"
          GOARCH="${pair#*/}"

          BIN=""
          if command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg goos "${GOOS}" --arg goarch "${GOARCH}" \
              '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos==$goos and .goarch==$goarch)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph -path "*${GOOS}*${GOARCH}*" 2>/dev/null | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::goreleaser release produced no ${pair} binary under dist/"
            exit 1
          fi

          # Assert the object is the right machine — the failure mode a
          # green `goreleaser release` exit code alone cannot catch.
          DESC=$(file -b "${BIN}")
          echo "    ${pair}: ${BIN}: ${DESC}"
          case "${GOOS}:${GOARCH}:${DESC}" in
            linux:amd64:*ELF*x86-64*) ;;
            linux:arm64:*ELF*aarch64*) ;;
            darwin:amd64:*Mach-O*x86_64*) ;;
            darwin:arm64:*Mach-O*arm64*) ;;
            *) echo "::error::${pair} produced the wrong object: ${DESC}"; exit 1 ;;
          esac
        done

        echo "release:dry-run: four correctly-typed binaries produced in one goreleaser release invocation."

  release:dry-run-signed:
    desc: >-
      Sibling of release:dry-run — but does NOT skip sign. release:dry-run
      skips BOTH publish and sign, so signs:'s upgrade-sidecar naming
      template is never resolved except by a static assertion until the
      production release, where a wrong answer cannot be withdrawn (D-07).
      Resolves it early against a THROWAWAY LOCAL cosign key (no OIDC) — the
      reason plan 01-05's merge checkpoint can clear. Same run also proves
      sboms: documents: (--skip=publish does not skip SBOM). Pass condition:
      FOUR DISTINCT PUBLISHED NAMES per pipe from dist/artifacts.json — never
      a green exit code, never an on-disk listing (cycle-3 review HIGH-A).

      RELEASE CLASS, notarize reachable (plan 02-02's goreleaser-caller
      enumeration): identically to release:dry-run, `notarize:` is registered
      inside BuildPipeline and runs here regardless of the `--skip=publish`
      this target passes — the throwaway cosign key above rehearses ONLY the
      signs: pipe, not notarize:, which needs its own five Apple credential
      variables (MACOS_SIGN_P12 and siblings, .goreleaser.yaml) and is
      stopped on this canary by `enabled:` evaluating false, not by any
      `--skip` flag.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:dry-run-signed must run on a native darwin host — that is the runner class the migrated single-job release.yml (plan 01-03) uses (D-01). Run it on macOS locally, or dispatch the linux-cross-canary workflow, which runs this same target on namespace-profile-macos-6x14-tahoe."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml now cross-compile via zig cc/zig c++ (REL-05). CI installs zig 0.15.1 via mlugg/setup-zig; locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. This target's release invocation exercises the sboms: pipe (--skip=publish does not skip it). CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. This target's release invocation exercises the signs: pipe against a throwaway local key. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        # The config under test must be exactly what shipped.
        if ! git diff --quiet HEAD -- .goreleaser.yaml; then
          echo "::error::.goreleaser.yaml has uncommitted changes — the config under test must be exactly the committed one, or the SIGN-EVIDENCE/SBOM-EVIDENCE observation below is invalid"
          exit 1
        fi

        # ONE run-scoped temp dir tree for everything this rehearsal
        # generates — key material, the generated config copy, and the
        # native GoReleaser tool binary — never dist/ (--clean wipes it)
        # and never the working tree. Removed on exit via a single trap.
        SIGNTEST_DIR="$(mktemp -d)"
        GORELEASER_DIR="$(mktemp -d)"
        GORELEASER_BIN="${GORELEASER_DIR}/goreleaser"
        ZIG_CACHE_ROOT="$(mktemp -d)"
        cleanup() { rm -rf "${SIGNTEST_DIR}" "${GORELEASER_DIR}" "${ZIG_CACHE_ROOT}"; }
        trap cleanup EXIT

        # A THROWAWAY LOCAL cosign key pair, generated fresh in this temp
        # dir and used once — makes the sign pipe RUN. Not the production
        # identity; signs nothing anyone will verify. Production signing
        # (signs: carries no --key) stays keyless-OIDC, untouched.
        export COSIGN_PASSWORD="${COSIGN_PASSWORD:-codegraph-throwaway-rehearsal-password-not-for-verification}"
        cosign generate-key-pair --output-key-prefix "${SIGNTEST_DIR}/cosign" >/dev/null

        # Inject --key into a GENERATED COPY of .goreleaser.yaml — the whole
        # mechanism, not optional. COSIGN_PASSWORD DECRYPTS a key; it does
        # not SELECT one — without --key, cosign sign-blob falls through to
        # the keyless Fulcio/OIDC flow this job is denied (no id-token:
        # write anywhere in this composition), hanging or hard-failing
        # (cycle-2 review HIGH-1). Confirmed against the pinned
        # goreleaser/v2@v2.17.1 module that the sign pipe's subprocess
        # already inherits the full process environment (pkg/context:
        # Env = ToEnv(append(os.Environ(), ...))), so COSIGN_PASSWORD needs
        # no per-pipe env: addition — this one inserted line is the delta.
        GENERATED_CONFIG="${SIGNTEST_DIR}/.goreleaser.signtest.yaml"
        awk -v keyline="      - \"--key=${SIGNTEST_DIR}/cosign.key\"" '
          { print }
          /^      - "sign-blob"$/ { print keyline }
        ' .goreleaser.yaml > "${GENERATED_CONFIG}"

        # Assert the copy is a MINIMAL, ADDITIONS-ONLY delta before
        # invoking anything, so the rehearsal cannot silently drift into
        # testing a different configuration than the one that ships. `<`
        # lines in default diff(1) output are deletions/replacements —
        # their presence is a hard failure. Every `>` (added) line must
        # carry --key= or COSIGN_PASSWORD.
        DIFF_OUT="$(diff .goreleaser.yaml "${GENERATED_CONFIG}" || true)"
        if printf '%s\n' "${DIFF_OUT}" | grep -q '^<'; then
          echo "::error::${GENERATED_CONFIG} differs from the committed .goreleaser.yaml by more than additions:"
          printf '%s\n' "${DIFF_OUT}"
          exit 1
        fi
        BAD_ADDITIONS="$(printf '%s\n' "${DIFF_OUT}" | grep '^> ' | grep -v -- '--key=' | grep -v 'COSIGN_PASSWORD' || true)"
        if [ -n "${BAD_ADDITIONS}" ]; then
          echo "::error::${GENERATED_CONFIG} has additions not matching --key= or COSIGN_PASSWORD:"
          printf '%s\n' "${BAD_ADDITIONS}"
          exit 1
        fi
        echo "generated config differs from the committed .goreleaser.yaml by additions only:"
        printf '%s\n' "${DIFF_OUT}"

        # Build GoReleaser NATIVELY, no GOOS/GOARCH in the environment —
        # identical reasoning to release:dry-run's own comment: a
        # GOARCH-cross-built GoReleaser runs under Rosetta and its child
        # xcrun then resolves as x86_64, which cannot load the arm64-only
        # libxcrun.dylib from CommandLineTools.
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        # Same zig-cache AccessDenied trap release:dry-run already hit
        # (01-01-SUMMARY.md Rule-3 deviation): this invocation still
        # cross-compiles all four targets before the sign/sbom pipes run.
        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # Invoke against the GENERATED copy — --skip=publish ONLY. `sign`
        # is deliberately NOT skipped: that is the entire point of this
        # target. Because the config now lives outside the repo root,
        # assert immediately after that dist/artifacts.json exists AT THE
        # REPO ROOT — GoReleaser resolves `dist` relative to the process
        # working directory, but a silent relocation would make every
        # assertion below vacuous.
        echo "==> goreleaser release -f ${GENERATED_CONFIG} --snapshot --skip=publish --clean"
        "${GORELEASER_BIN}" release -f "${GENERATED_CONFIG}" --snapshot --skip=publish --clean

        if [ ! -f dist/artifacts.json ]; then
          echo "::error::dist/artifacts.json not found at the repo root after the run — goreleaser resolves dist relative to the process working directory"
          exit 1
        fi

        # ASSERT FROM dist/artifacts.json, NOT FROM A FILENAME GLOB, and
        # treat a green exit code as no evidence at all.
        #
        # Why the source of truth is the metadata file and not the
        # filesystem (cycle-3 review HIGH-A): GoReleaser expands ${artifact}
        # from art.Path when it decides WHERE to write the signature
        # (sign.go:179-182), then re-expands the same template with
        # env["artifact"] = art.Name to compute the artifact record it will
        # PUBLISH (sign.go:274-276); the release pipe uploads by
        # artifact.Name. For a formats: [binary] archive the rename lives
        # only in metadata (archive.go:308-310 — Name: finalName, Path:
        # binary.Path), so no renamed file is ever written to disk. The
        # on-disk basename is therefore identical under BOTH the broken
        # configuration and the correct remediation — a filesystem oracle
        # would false-RED the preferred fix and is structurally blind to
        # the SBOM collision in the neighbouring pipe. Confirmed against
        # the pinned goreleaser/v2@v2.17.1 module: the `type` field written
        # to dist/artifacts.json (internal/pipe/metadata/metadata.go:
        # writeArtifacts) is the literal strings "Signature" and "SBOM".
        OK=1

        SIGN_COUNT=$(jq -r '[.[] | select(.type=="Signature")] | length' dist/artifacts.json)
        if [ "${SIGN_COUNT}" = "0" ]; then
          echo "::error::0 Signature-typed records in dist/artifacts.json — a filter matching nothing is a HARD FAILURE, not a pass: GoReleaser logs 'no artifacts matching the given filters found' and returns nil, and goreleaser check does not validate the artifacts: enum at all"
          OK=0
        fi
        SIGN_NAMES=$(jq -r '[.[] | select(.type=="Signature") | .name] | join(",")' dist/artifacts.json)
        SIGN_DISTINCT=$(jq -r '[.[] | select(.type=="Signature") | .name] | unique | length' dist/artifacts.json)
        if [ "${SIGN_COUNT}" != "0" ] && [ "${SIGN_DISTINCT}" != "${SIGN_COUNT}" ]; then
          echo "::error::Signature records are not distinct: ${SIGN_COUNT} records, ${SIGN_DISTINCT} distinct names (${SIGN_NAMES}) — a PATH-derived template collides to one name per platform; this is D-14's exact failure mode"
          OK=0
        fi
        if [ "${SIGN_COUNT}" != "0" ]; then
          for pair in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            MATCHED=$(jq -r --arg suf "_${pair}.sigstore.json" \
              '[.[] | select(.type=="Signature") | select(.name | startswith("codegraph_")) | select(.name | endswith($suf))] | length' \
              dist/artifacts.json)
            if [ "${MATCHED}" != "1" ]; then
              echo "::error::expected exactly 1 Signature name matching codegraph_<tag>_${pair}.sigstore.json, found ${MATCHED} (names=${SIGN_NAMES})"
              OK=0
            fi
          done
        fi

        SBOM_COUNT=$(jq -r '[.[] | select(.type=="SBOM")] | length' dist/artifacts.json)
        if [ "${SBOM_COUNT}" = "0" ]; then
          echo "::error::0 SBOM-typed records in dist/artifacts.json — a filter matching nothing is a HARD FAILURE, not a pass: GoReleaser logs 'no artifacts matching the given filters found' and returns nil, and goreleaser check does not validate the artifacts: enum at all"
          OK=0
        fi
        SBOM_NAMES=$(jq -r '[.[] | select(.type=="SBOM") | .name] | join(",")' dist/artifacts.json)
        SBOM_DISTINCT=$(jq -r '[.[] | select(.type=="SBOM") | .name] | unique | length' dist/artifacts.json)
        if [ "${SBOM_COUNT}" != "0" ] && [ "${SBOM_DISTINCT}" != "${SBOM_COUNT}" ]; then
          echo "::error::SBOM records are not distinct: ${SBOM_COUNT} records, ${SBOM_DISTINCT} distinct names (${SBOM_NAMES}) — a PATH-derived template collides to one name per platform; this is HIGH-B's exact failure mode"
          OK=0
        fi
        if [ "${SBOM_COUNT}" != "0" ]; then
          for pair in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            MATCHED=$(jq -r --arg suf "_${pair}.spdx.json" \
              '[.[] | select(.type=="SBOM") | select(.name | startswith("codegraph_")) | select(.name | endswith($suf))] | length' \
              dist/artifacts.json)
            if [ "${MATCHED}" != "1" ]; then
              echo "::error::expected exactly 1 SBOM name matching codegraph_<tag>_${pair}.spdx.json, found ${MATCHED} (names=${SBOM_NAMES})"
              OK=0
            fi
          done
        fi

        # Two machine-parseable summary lines, as the LAST things printed —
        # mirroring plan 01-01's REL05-EVIDENCE convention. Emitted on BOTH
        # the pass and the fail path: a RED observation is the most
        # valuable output this target can produce, and a signature failure
        # must not short-circuit the SBOM line, because the two
        # remediations are independent.
        echo "SIGN-EVIDENCE count=${SIGN_COUNT} distinct=${SIGN_DISTINCT} names=${SIGN_NAMES}"
        echo "SBOM-EVIDENCE count=${SBOM_COUNT} distinct=${SBOM_DISTINCT} names=${SBOM_NAMES}"

        if [ "${OK}" != "1" ]; then
          exit 1
        fi

  release:goreleaser:
    desc: >-
      Cut a REAL release: one `goreleaser release --clean` invocation —
      publishes to GitHub Releases, notarizes both darwin binaries with
      Apple (quill, in-process), signs every binary with cosign keyless
      (OIDC), and emits SBOMs. The single definition release.yml's
      collapsed `release` job calls (plan 01-03, DEV-01); not currently
      bound by TestWorkflowRunBodiesInvokeTask's inScopeJobs fixture (D-08
      exception) — applied deliberately, not because a test requires it.
      Meant to run in CI on a tag push, NOT casually from a laptop. For the
      local, non-publishing equivalent, use `task release:dry-run`.

      RELEASE CLASS, BOTH reachable (plan 02-02's goreleaser-caller
      enumeration): this is the one target where `notarize:` and the
      release-scoped `signs:` (cosign) pipe are BOTH live and BOTH expected
      to fire — this target's whole job is running them for real. The
      release-scoped signs: pipe still shells out to cosign for a real
      keyless OIDC signature, so its precondition below is unchanged and
      kept. notarize:'s five Apple credential variables (MACOS_SIGN_P12 and
      siblings) are supplied as CI secrets on release.yml's single
      `id-token: write` job's env: (D-14/D-17: never on any
      pull_request-triggerable workflow) — not by a precondition here, since
      this target is meant to run only from that job.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:goreleaser must run on a native darwin host — the linux legs cross-compile via zig from here (D-01/D-02) and darwin must build natively; a linux host would silently produce a cross-linked darwin binary (libresolv/DNS-resolution risk). Use `task release:dry-run` or the linux-cross-canary workflow instead."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml cross-compile via zig cc/zig c++ (CI pins 0.15.1 via mlugg/setup-zig). Install locally: brew install zig."
      - sh: command -v cosign
        msg: "cosign not found. .goreleaser.yaml's signs: pipe shells out to it. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
      - sh: command -v syft
        msg: "syft not found. .goreleaser.yaml's sboms: pipe shells out to it. CI installs it via anchore/sbom-action/download-syft; locally: brew install syft."
      - sh: git describe --exact-match --tags HEAD
        msg: "no tag found at HEAD. `goreleaser release` hard-fails without one. For a tagless, non-publishing run of the same composition, use `task release:dry-run` instead."
      - sh: '[ -n "${GITHUB_TOKEN:-}" ]'
        msg: "GITHUB_TOKEN is not set. GoReleaser's release: pipe reads GITHUB_TOKEN — NOT GH_TOKEN, which is the gh CLI's own variable. Set GITHUB_TOKEN before running this target."
      # Two HOMEBREW_TAP_TOKEN checks (03-03, T-03-09), not one: presence
      # alone would pass in the exact silent-degradation case this guards
      # against. If unset, .goreleaser.yaml's `{{ .Env.HOMEBREW_TAP_TOKEN }}`
      # template resolves to an empty string and GoReleaser's cask client
      # falls back to internal/client/client.go's NewIfToken default — the
      # RELEASE's own client — which cannot write seanb4t/homebrew-tap and
      # the tap push silently fails or is skipped. If someone ever sets the
      # two variables equal "to make it work", the push instead SUCCEEDS
      # against the wrong credential (the release's own token, not the
      # tap-scoped App's), and ROADMAP criterion 5 is quietly false behind
      # a green log — a presence-only check cannot catch that second case,
      # which is exactly the "every guard must assert it did its work" rule
      # this repository holds elsewhere (repo rule 84d1gfpywd).
      - sh: '[ -n "${HOMEBREW_TAP_TOKEN:-}" ]'
        msg: "HOMEBREW_TAP_TOKEN is not set. .goreleaser.yaml's homebrew_casks[0].repository.token reads it (D-16); release.yml mints it from the tap-scoped GitHub App immediately before this step. Without it, the cask client falls back to GITHUB_TOKEN, which cannot write seanb4t/homebrew-tap."
      - sh: '[ "${HOMEBREW_TAP_TOKEN:-}" != "${GITHUB_TOKEN:-}" ]'
        msg: "HOMEBREW_TAP_TOKEN is byte-identical to GITHUB_TOKEN. These must be two distinct credentials (D-16): GITHUB_TOKEN is this release's own token and cannot write seanb4t/homebrew-tap; HOMEBREW_TAP_TOKEN must come from the tap-scoped GitHub App's installation token. A release must not proceed with the two collapsed to one value."
    cmds:
      - |
        set -euo pipefail

        # ONE prefer-then-build algorithm (C6): prefer a `goreleaser` on
        # PATH (CI path — goreleaser-action install-only already put the
        # pinned build there, so nothing compiles inside the OIDC job);
        # else build go.tool.mod's pin as the LOCAL fallback. Either way,
        # `goreleaser --version` is asserted against the pin below.
        # awk, NOT `go list -f '{{.Version}}'`: Task renders every cmds: string
        # through Go text/template BEFORE the shell sees it, so a literal
        # {{.Version}} here is consumed by TASK, not passed to go list. Task has
        # no .Version variable, so it rendered to empty — turning the command
        # into `go list -f ''`, which falls back to go's default module format
        # and yielded "github.com/goreleaser/goreleaser/v2 v2.17.1" instead of
        # "v2.17.1". The comparison below could then never be equal, and it
        # failed the v0.5.0 release before `goreleaser release` ever ran. The
        # bug was invisible outside Task (the same command in a plain shell
        # prints v2.17.1) and this target runs ONLY from release.yml on a tag
        # push, so nothing exercised it until the real release. `go list -m`
        # with no -f prints "<module> <version>", so field 2 is the version.
        PINNED_VERSION="$(GOWORK=off go list -m -modfile=go.tool.mod github.com/goreleaser/goreleaser/v2 | awk '{print $2}')"
        PINNED_VERSION="${PINNED_VERSION#v}"
        if [ -z "${PINNED_VERSION}" ]; then
          echo "::error::could not resolve goreleaser's pinned version from go.tool.mod — refusing to release against an unverified toolchain (MAINT-03)"
          exit 1
        fi

        CLEANUP_DIR=""
        cleanup() { [ -n "${CLEANUP_DIR}" ] && rm -rf "${CLEANUP_DIR}"; }
        trap cleanup EXIT

        if command -v goreleaser >/dev/null 2>&1; then
          GORELEASER_BIN="$(command -v goreleaser)"
        else
          # Build NATIVELY, no GOOS/GOARCH in the environment — same
          # reasoning as release:dry-run's identical comment: a
          # GOARCH-cross-built GoReleaser runs under Rosetta and its child
          # xcrun then resolves as x86_64, which cannot load the
          # arm64-only libxcrun.dylib from CommandLineTools.
          CLEANUP_DIR="$(mktemp -d)"
          GORELEASER_BIN="${CLEANUP_DIR}/goreleaser"
          GOWORK=off go build -modfile=go.tool.mod \
            -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2
        fi

        # Assert the resolved binary's version (`goreleaser --version`)
        # matches the go.tool.mod pin before invoking release — keeps
        # prefer-then-build honest at the point of use (MAINT-03).
        #
        # BOTH sides are v-stripped, and that is load-bearing: the two install
        # paths this target supports report DIFFERENT formats for the same
        # version. goreleaser-action's prebuilt binary (the CI path) reports
        # `GitVersion: 2.17.1`, while the from-source `go build` fallback (the
        # local path) reports `GitVersion: v2.17.1`. Normalizing only the pin
        # would make this assertion pass in CI and fail on every contributor
        # machine that lacks goreleaser on PATH.
        RESOLVED_VERSION="$("${GORELEASER_BIN}" --version 2>&1 | grep -m1 '^GitVersion:' | awk '{print $2}')"
        RESOLVED_VERSION="${RESOLVED_VERSION#v}"
        if [ -z "${RESOLVED_VERSION}" ] || [ "${RESOLVED_VERSION}" != "${PINNED_VERSION}" ]; then
          echo "::error::resolved goreleaser (${GORELEASER_BIN}) reports version '${RESOLVED_VERSION}', want '${PINNED_VERSION}' (go.tool.mod's pin, MAINT-03). A stale goreleaser on PATH would otherwise silently hollow out TestGoreleaserPinParity's guarantee at the point of use."
          exit 1
        fi

        # No GOOS/GOARCH set here: unlike `build --single-target`,
        # `goreleaser release` resolves every target from each builds:
        # entry's own goos:/goarch: list, not from the environment. A
        # carried-over GOOS/GOARCH would be at best a no-op and at worst
        # mask a misconfiguration.
        "${GORELEASER_BIN}" release --clean

        # Emit the checksums-file hash as a $GITHUB_OUTPUT `hashes` value
        # when running under GitHub Actions (GITHUB_OUTPUT is only set
        # there — a no-op locally). release.yml's provenance: job still
        # consumes this output until plan 01-04 removes both together.
        # PRECISION (2026-08-01): provenance attests over the SIX
        # BINARIES, not the checksums file itself; this base64-encodes the
        # file's *contents* as the subject-list transport the SLSA generic
        # generator parses. Folded in here, rather than a second
        # release.yml step, so the release job's Release step keeps
        # exactly one run: body (T-01-14).
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          TAG="$(git describe --exact-match --tags HEAD)"
          CHECKSUMS_FILE="dist/codegraph_${TAG}_checksums.txt"
          if [ ! -f "${CHECKSUMS_FILE}" ]; then
            echo "::error::${CHECKSUMS_FILE} not found — expected GoReleaser's checksum: pipe to have produced it"
            exit 1
          fi
          echo "hashes=$(base64 -w0 < "${CHECKSUMS_FILE}")" >> "${GITHUB_OUTPUT}"
        fi

  release:record-final-hashes:
    desc: >-
      Makes the FIRST byte-identity comparison point (SIGN-04) observable.
      Reads the release job's local dist/artifacts.json AFTER `task
      release:goreleaser` (i.e. `goreleaser release --clean`) has fully
      completed — archive, checksum, sign, and publish have ALL already run
      by the time this target executes. This is NOT a capture "immediately
      after notarize"; no mid-pipe hook exists in GoReleaser for that, and
      labelling this value that way would silently assume the very
      byte-identity ordering claim SIGN-04 exists to measure. The field this
      target emits is named exactly for what it is: `final_local_sha256`.

      Read-only and additive: writes nothing, uploads nothing, needs no new
      CI permission and no secret. But it MUST FAIL LOUDLY (non-zero exit)
      on absent dist/artifacts.json, an unreadable/missing artifact file, or
      a missing darwin platform entry — after emitting the labelled
      `not-found` SIGN04-PUBLISH-EVIDENCE line so the failure is
      diagnosable. An earlier design considered suppressing all non-zero
      exits here on the theory that "a recording step must never break a
      publish" — that reasoning does not survive inspection: this step runs
      AFTER `goreleaser release` has already published, so there is no
      publish left to protect by staying silent. What a suppressed failure
      would actually buy is a green release job with SIGN-04 permanently
      unprovable, and D-12 forbids re-cutting the tag to fix that
      afterward — so failing loudly here, while there is still something to
      fail, is the only choice that keeps the claim provable.

      Never falls back to a snapshot-derived or glob-found path when the
      real tagged artifact cannot be located from dist/artifacts.json — a
      local snapshot exercise (below) proves the selection logic only for
      the empty-tag naming shape --snapshot produces; the real-tag path in
      CI must fail loudly rather than silently resolve something else.

      POST-PUBLISH FAILURE BRANCH: a hard failure here leaves the release
      job's own conclusion RED with the release assets ALREADY LIVE on
      GitHub — nothing left to build was skipped, only this recording step
      failed. post-release-verify.yml triggers on `workflow_run` gated to a
      `success` conclusion, so it will NEVER FIRE AUTOMATICALLY against a
      release whose release.yml run ended RED here — the Gatekeeper job and
      the notarized-suite job both silently do not run. Recovery: preserve
      this job's run logs, then manually `workflow_dispatch`
      post-release-verify.yml against the resolved tag. See
      docs/RELEASE-PROCEDURES.md's "Recovering from a post-publish
      hash-recording failure" section for the four states this can leave
      the release in and the distinct remedy for each — read it before
      acting, do not delete or re-push the release/tag (D-12).
    preconditions:
      - sh: command -v jq
        msg: "jq not found. Every result this target reports is read from dist/artifacts.json with it — never a filename glob, never a bare exit code. Install locally: brew install jq."
    cmds:
      - |
        set -euo pipefail

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # dist/artifacts.json is where `task release:goreleaser` (this
        # target's ONLY intended caller — see release.yml's Record final
        # local hashes step) leaves its output: the repo root's default
        # `dist/` directory, no --dist override, no -f alternate config.
        # Absent metadata is a HARD FAILURE, per this target's own contract
        # above — never a silent pass.
        if [ ! -f dist/artifacts.json ]; then
          echo "::error::dist/artifacts.json not found — release:record-final-hashes must run AFTER task release:goreleaser has completed. This target never falls back to a snapshot-derived or glob-found path (see its desc:); absence is recorded and then hard-failed, not silently skipped."
          echo "SIGN04-PUBLISH-EVIDENCE schema=1 goos=darwin goarch=not-found artifact_name=not-found final_local_sha256=not-found"
          exit 1
        fi

        # Reuses plan 02-04's release:rehearse-notarize artifact-metadata
        # reader VERBATIM, including its binary-format filter: GoReleaser
        # records type=="Binary" TWICE per platform (the raw build output
        # AND the archives: pipe's renamed release asset) — filtering on
        # .extra.Format=="binary" too is what keeps this at 4 (one per
        # platform) rather than counting 8.
        darwin_binary_entry() {
          # $1 = arch  $2 = field ("path" or "name")
          jq -r --arg a "$1" --arg f "$2" \
            '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos=="darwin" and .goarch==$a)][0][$f] // empty' \
            dist/artifacts.json
        }

        FAILED=0
        for arch in arm64 amd64; do
          BIN_PATH="$(darwin_binary_entry "${arch}" path)"
          BIN_NAME="$(darwin_binary_entry "${arch}" name)"

          if [ -z "${BIN_PATH}" ] || [ ! -f "${BIN_PATH}" ]; then
            echo "::error::darwin/${arch} binary not found in dist/artifacts.json (or the file it names is missing on disk) — cannot record final_local_sha256 for this platform"
            echo "SIGN04-PUBLISH-EVIDENCE schema=1 goos=darwin goarch=${arch} artifact_name=not-found final_local_sha256=not-found"
            FAILED=1
            continue
          fi

          FINAL_LOCAL_SHA256="$(sha256_of "${BIN_PATH}")"
          echo "SIGN04-PUBLISH-EVIDENCE schema=1 goos=darwin goarch=${arch} artifact_name=${BIN_NAME} final_local_sha256=${FINAL_LOCAL_SHA256}"
        done

        if [ "${FAILED}" = "1" ]; then
          echo "::error::release:record-final-hashes: one or more darwin platforms missing from dist/artifacts.json — see the not-found SIGN04-PUBLISH-EVIDENCE line(s) above"
          exit 1
        fi

  release:rehearse-notarize:
    desc: >-
      MAINTAINER-ONLY (D-08/D-09). Rehearses the one release-pipeline path
      that cannot be rehearsed any other way: the real `notarize:`
      submission to Apple, on the maintainer's own Mac, before any tag push.
      Requires a real Developer ID Application certificate and App Store
      Connect API key — see docs/RELEASE.md for how each of the five
      credential variables below is obtained. Contributors are NOT expected
      to hold an Apple certificate; there is deliberately no credential-free
      contributor mode (considered and declined as surface with no
      consumer — D-08, 02-CONTEXT.md <deferred>).

      Two modes, selected by SIGN04_MUTATE:

        default (SIGN04_MUTATE unset): a full, BOTH-DARWIN-ARCHES rehearsal
        of the SHIPPED configuration — build, notarize both darwin binaries
        with Apple, sign the POST-notarization bytes with cosign, archive,
        checksum — then MEASURE (never assume) that the archived,
        checksummed and cosign-signed subject is the SAME bytes as the
        notarized binary (SIGN-04/D-05's byte-identity chain, minus the
        re-downloaded-published-asset leg, which does not exist until plan
        02-07 and is deliberately not simulated here).

        SIGN04_MUTATE=1: reproduces the PRE-D-18-RULING signs: shape (
        build-scoped, unfiltered) in a GENERATED COPY ONLY, and MEASURES the
        ordering claim invert: under this shape cosign signs PRE-notarization
        bytes, so the D-05 byte-identity relationship should now describe
        the WRONG subject. This is D-07's one-time recorded mutation, never
        a permanent regression test. Covers ONE darwin arch only (see the
        Apple-submission-budget comment in this target's body) — the
        mechanism proven is per-pipe, not per-architecture, so a second real
        Apple submission during the mutation run would buy no extra
        evidence.

      A real pre-notarize baseline cannot be captured mid-pipe — GoReleaser
      owns the transition between the build pipe and the notarize pipe and
      exposes no hook between them (review concern, codex HIGH/pi MEDIUM).
      Both modes therefore obtain their baseline from a SEPARATE,
      notarize-DISABLED run of the IDENTICAL command and flags
      (`release --snapshot --skip=publish --clean`) as the real rehearsal,
      against a config generated from the SAME template with only the
      notarize `enabled:` predicate different — and this target MEASURES
      the determinism that substitution depends on (a double build,
      asserted byte-identical) rather than assuming it, because this
      repository's own reproducibility gate (ci.yml) has no darwin leg at
      all and a non-blocking linux/arm64 leg — DIST-04 does not cover this
      property, and no comment in this file claims otherwise.

      What cosign signed is established CRYPTOGRAPHICALLY — by running
      `cosign verify-blob` against BOTH the preserved pre-sign baseline and
      the final binary and recording which ONE verifies — never by
      re-hashing the path dist/artifacts.json names for the signature: that
      path records the signature FILE, not its subject, and under the
      mutation quill has already rewritten the file at that path in place.

      Every generated config lives under a run-scoped temp dir removed by a
      single trap; the target opens with a clean-worktree precondition and
      closes by asserting the committed .goreleaser.yaml is still
      byte-unchanged — no experiment here ever leaks into the working tree.
    preconditions:
      # --- host / tool guards, in the order a maintainer must satisfy them
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:rehearse-notarize must run on a native darwin host (D-08) — rehearsal is local-only by design, never CI. Run it on your own Mac."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml cross-compile via zig cc/zig c++ (REL-05); this rehearsal's release invocation still builds all four targets. Install locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. This rehearsal's release invocation exercises the sboms: pipe (--skip=publish does not skip it). Install locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. This rehearsal's release invocation exercises the signs: pipe against a throwaway local key (never the production keyless identity). Install locally: brew install cosign."
      - sh: command -v jq
        msg: "jq not found. Every result this target reports is read from dist/artifacts.json with it — never a filename glob, never a bare exit code. Install locally: brew install jq."
      - sh: git diff --quiet HEAD -- .goreleaser.yaml
        msg: "your .goreleaser.yaml has uncommitted changes — the config under test must be exactly the committed one, or the NOTARIZE-EVIDENCE/SIGN04-EVIDENCE this target records would describe a configuration nobody will ship. Commit or stash first."
      # --- Apple credentials (D-09's literal content): one named
      # precondition per variable, each halting BY NAME before any network
      # round-trip to Apple — mirroring the command -v cosign precondition
      # this repo added after binary_signs: hung ~5 minutes before failing
      # with expired_token. MAINTAINER-ONLY: see docs/RELEASE.md for how to
      # obtain each value. Ordered to match 02-04-PLAN.md's user_setup.
      - sh: '[ -n "${MACOS_SIGN_P12:-}" ]'
        msg: "MACOS_SIGN_P12 is not set. release:rehearse-notarize is MAINTAINER-ONLY and requires a real Developer ID Application certificate (base64-encoded .p12, or a filesystem path — quill accepts either). See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_SIGN_PASSWORD:-}" ]'
        msg: "MACOS_SIGN_PASSWORD is not set. release:rehearse-notarize is MAINTAINER-ONLY and requires the password chosen when exporting the .p12 above. See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_ISSUER_ID:-}" ]'
        msg: "MACOS_NOTARY_ISSUER_ID is not set. release:rehearse-notarize is MAINTAINER-ONLY and requires an App Store Connect API key's Issuer ID (Users and Access -> Integrations -> Keys). See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_KEY_ID:-}" ]'
        msg: "MACOS_NOTARY_KEY_ID is not set. release:rehearse-notarize is MAINTAINER-ONLY and requires the App Store Connect API key's Key ID column value. See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_KEY:-}" ]'
        msg: "MACOS_NOTARY_KEY is not set. release:rehearse-notarize is MAINTAINER-ONLY and requires the App Store Connect API key itself (base64-encoded .p8, or a filesystem path — quill accepts either). See docs/RELEASE.md."
    cmds:
      - |
        set -euo pipefail

        MUTATE="${SIGN04_MUTATE:-0}"
        echo "release:rehearse-notarize: SIGN04_MUTATE=${MUTATE}"

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 8 (recorded up front). The committed .goreleaser.yaml's OWN
        # sha256 — plan 02-07's pre-flight config-equality check needs this
        # value to compare against, and it must be read BEFORE any generated
        # copy exists.
        CONFIG_SHA256="$(sha256_of .goreleaser.yaml)"

        # --- 1. ONE run-scoped temp dir tree for every generated config,
        # the throwaway cosign key, the native GoReleaser build, the zig
        # caches, AND every dist/ output this rehearsal produces — never the
        # real dist/, which --clean would wipe and which every other target
        # already owns. A single trap removes all of it.
        REHEARSE_DIR="$(mktemp -d)"
        GORELEASER_DIR="$(mktemp -d)"
        GORELEASER_BIN="${GORELEASER_DIR}/goreleaser"
        ZIG_CACHE_ROOT="$(mktemp -d)"
        cleanup() { rm -rf "${REHEARSE_DIR}" "${GORELEASER_DIR}" "${ZIG_CACHE_ROOT}"; }
        trap cleanup EXIT

        BASELINE_DIST_1="${REHEARSE_DIR}/dist-baseline-1"
        BASELINE_DIST_2="${REHEARSE_DIR}/dist-baseline-2"
        MAIN_DIST="${REHEARSE_DIR}/dist-main"

        # GoReleaser v2.17.1 has NO --dist CLI flag on `release` (confirmed
        # against the pinned module's cmd/release.go and cmd/root.go — this
        # target uses the config's own top-level dist: field instead,
        # pkg/config/config.go + internal/pipe/dist/dist.go, which every
        # generated copy below sets to a DISTINCT absolute path under
        # REHEARSE_DIR). Never dist/, never a shared path two runs could
        # race on or destroy each other's output from, and never a
        # copy-aside step.
        inject_dist() {
          # $1 = source config  $2 = dist path  $3 = destination config
          printf 'dist: %s\n' "$2" > "$3"
          cat "$1" >> "$3"
        }

        # --- 2. A THROWAWAY LOCAL cosign key pair, and a generated copy of
        # the committed .goreleaser.yaml with --key injected into the
        # signs: pipe's sign-blob args — the SAME awk anchor and
        # additions-only diff guard release:dry-run-signed already uses, so
        # this rehearsal's cosign signature is verifiable offline with the
        # key it was made with, never the production keyless OIDC identity.
        # The five Apple credentials are NOT injected into the config here —
        # they reach quill through the process environment via the
        # committed config's own Env-bound Go-template fields, unchanged.
        export COSIGN_PASSWORD="${COSIGN_PASSWORD:-codegraph-throwaway-rehearsal-password-not-for-verification}"
        cosign generate-key-pair --output-key-prefix "${REHEARSE_DIR}/cosign" >/dev/null
        COSIGN_PUBKEY="${REHEARSE_DIR}/cosign.pub"

        GENERATED_ENABLED="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.yaml"
        awk -v keyline="      - \"--key=${REHEARSE_DIR}/cosign.key\"" '
          { print }
          /^      - "sign-blob"$/ { print keyline }
        ' .goreleaser.yaml > "${GENERATED_ENABLED}"

        DIFF_OUT="$(diff .goreleaser.yaml "${GENERATED_ENABLED}" || true)"
        if printf '%s\n' "${DIFF_OUT}" | grep -q '^<'; then
          echo "::error::${GENERATED_ENABLED} differs from the committed .goreleaser.yaml by more than additions:"
          printf '%s\n' "${DIFF_OUT}"
          exit 1
        fi
        BAD_ADDITIONS="$(printf '%s\n' "${DIFF_OUT}" | grep '^> ' | grep -v -- '--key=' | grep -v 'COSIGN_PASSWORD' || true)"
        if [ -n "${BAD_ADDITIONS}" ]; then
          echo "::error::${GENERATED_ENABLED} has additions not matching --key= or COSIGN_PASSWORD:"
          printf '%s\n' "${BAD_ADDITIONS}"
          exit 1
        fi
        echo "generated config (notarize-enabled base) differs from the committed .goreleaser.yaml by additions only:"
        printf '%s\n' "${DIFF_OUT}"

        # notarize-DISABLED baseline template: the SAME generated-enabled
        # config, ONE line changed — notarize.macos[0].enabled forced to
        # the literal "false", never a real Apple round-trip. Both configs
        # are therefore emitted from ONE template (the awk pass above) and
        # this sed is the single, provable delta between them — printed and
        # hard-failed on below if it is ever more than that one line.
        GENERATED_DISABLED_BASE="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.disabled-base.yaml"
        sed -E 's/^(    - enabled: ).*$/\1"false"/' "${GENERATED_ENABLED}" > "${GENERATED_DISABLED_BASE}"

        PREDICATE_DIFF="$(diff "${GENERATED_ENABLED}" "${GENERATED_DISABLED_BASE}" || true)"
        echo "PREDICATE-DIFF (notarize-enabled base vs notarize-disabled baseline template — must be the enabled: line and nothing else):"
        printf '%s\n' "${PREDICATE_DIFF}"
        PREDICATE_CHANGED_LINES="$(printf '%s\n' "${PREDICATE_DIFF}" | grep -c '^[<>]' || true)"
        if [ "${PREDICATE_CHANGED_LINES}" != "2" ] || ! printf '%s\n' "${PREDICATE_DIFF}" | grep -q 'enabled:'; then
          echo "::error::the notarize-enabled and notarize-disabled generated configs differ by more than the notarize enable predicate (${PREDICATE_CHANGED_LINES} changed lines) — this rule governs the BASELINE pair only and must hold exactly"
          exit 1
        fi

        GENERATED_DISABLED_1="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.disabled-1.yaml"
        GENERATED_DISABLED_2="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.disabled-2.yaml"
        inject_dist "${GENERATED_DISABLED_BASE}" "${BASELINE_DIST_1}" "${GENERATED_DISABLED_1}"
        inject_dist "${GENERATED_DISABLED_BASE}" "${BASELINE_DIST_2}" "${GENERATED_DISABLED_2}"

        # --- 3. Under SIGN04_MUTATE=1, reproduce the pre-D-18-ruling
        # signs: configuration in a GENERATED COPY ONLY. TWO edits, both
        # mandatory:
        #   a) the top-level key renames from signs: (release-scoped) to
        #      binary_signs: (build-scoped, the pre-ruling name)
        #   b) the "    ids: [raw]" line is REMOVED — signs[].ids and
        #      binary_signs[].ids resolve in DIFFERENT NAMESPACES (archive
        #      ids vs build ids); there is no build with id "raw", so
        #      carrying the filter across the rename would select ZERO
        #      artifacts, and a zero-match sign pipe does not fail — it
        #      logs a warning and returns nil. That would terminate this
        #      experiment as MUTATION-PRODUCED-NO-SIGNATURE for a reason
        #      that has nothing to do with pipe ordering, and the D-07
        #      inversion this whole rehearsal exists to observe could never
        #      be seen. The committed pre-ruling block carried no ids: at
        #      all — exactly why it worked, and the proof a faithful
        #      mutation removes the line rather than renaming around it.
        GENERATED_FINAL="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.enabled-dist.yaml"
        inject_dist "${GENERATED_ENABLED}" "${MAIN_DIST}" "${GENERATED_FINAL}"

        # Apple-submission budget (review concern codex LOW): the shipped-
        # configuration rehearsal above covers BOTH darwin arches, because
        # that is the shape the release ships. The mutation proves a
        # per-PIPE mechanism, not a per-architecture one, so a SECOND real
        # Apple submission during a mutation run buys no extra evidence —
        # mutation mode is single-arch BY DEFAULT, arm64, for that reason.
        MUTATE_ARCH_ID="codegraph-darwin-arm64"

        if [ "${MUTATE}" = "1" ]; then
          # Narrow notarize.macos[0].ids to ONE darwin build id — a
          # SEPARATE edit, applied BEFORE the two-edit signs: mutation
          # below and diffed independently, so the mutation-mode diff
          # guard (which permits EXACTLY the two D-07 signs:-block edits)
          # never has to reason about this budget-only narrowing.
          GENERATED_MUTATE_BASE="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.mutate-base.yaml"
          awk -v id="${MUTATE_ARCH_ID}" '
            BEGIN { in_ids = 0; seen = 0 }
            /^      ids:$/ && !seen {
              seen = 1
              print
              print "        - " id
              in_ids = 1
              next
            }
            in_ids && /^        - / { next }
            { in_ids = 0; print }
          ' "${GENERATED_ENABLED}" > "${GENERATED_MUTATE_BASE}"

          BUDGET_DIFF="$(diff "${GENERATED_ENABLED}" "${GENERATED_MUTATE_BASE}" || true)"
          echo "MUTATION-APPLE-SUBMISSION-BUDGET-DIFF (single-arch narrowing of notarize.macos[0].ids — NOT part of the two-edit signs: guard below):"
          printf '%s\n' "${BUDGET_DIFF}"

          # The two-edit signs:-block mutation itself.
          GENERATED_MUTATED="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.mutated.yaml"
          awk '
            BEGIN { in_signs = 0 }
            /^signs:$/ { in_signs = 1; print "binary_signs:"; next }
            in_signs && /^[A-Za-z_]+:/ { in_signs = 0 }
            in_signs && /^    ids: \[raw\]$/ { next }
            { print }
          ' "${GENERATED_MUTATE_BASE}" > "${GENERATED_MUTATED}"

          MUTATION_DIFF="$(diff "${GENERATED_MUTATE_BASE}" "${GENERATED_MUTATED}" || true)"
          echo "MUTATION-DIFF (the two-edit signs: block mutation, D-07):"
          printf '%s\n' "${MUTATION_DIFF}"

          MUT_REMOVED="$(printf '%s\n' "${MUTATION_DIFF}" | grep -c '^< ' || true)"
          MUT_ADDED="$(printf '%s\n' "${MUTATION_DIFF}" | grep -c '^> ' || true)"
          MUT_BAD=0
          # The mutation-mode diff guard PERMITS exactly these two edits
          # and no others — it must not enforce a single-edit shape, which
          # would block a correct mutation rather than merely fail to
          # require one.
          if [ "${MUT_REMOVED}" != "2" ] || [ "${MUT_ADDED}" != "1" ]; then
            echo "::error::MUTATION-CONFIG-INVALID: mutation diff removed ${MUT_REMOVED} line(s) and added ${MUT_ADDED} line(s) (want exactly 2 removed, 1 added) — the mutation-mode diff guard permits EXACTLY the two D-07 edits (top-level key rename, ids: [raw] removal) and no others"
            MUT_BAD=1
          fi
          if ! printf '%s\n' "${MUTATION_DIFF}" | grep -q '^< signs:$'; then
            echo "::error::MUTATION-CONFIG-INVALID: mutation diff does not remove the 'signs:' header line — edit (a), the top-level key rename, is missing"
            MUT_BAD=1
          fi
          if ! printf '%s\n' "${MUTATION_DIFF}" | grep -q '^> binary_signs:$'; then
            echo "::error::MUTATION-CONFIG-INVALID: mutation diff does not add the 'binary_signs:' header line — edit (a), the top-level key rename, is missing"
            MUT_BAD=1
          fi
          if ! printf '%s\n' "${MUTATION_DIFF}" | grep -q '^<     ids: \[raw\]$'; then
            echo "::error::MUTATION-CONFIG-INVALID: mutation diff does not remove the '    ids: [raw]' line — edit (b), the previous revision's known-wrong shape, is missing"
            MUT_BAD=1
          fi
          if [ "${MUT_BAD}" = "1" ]; then
            exit 1
          fi

          # --- 3a. Structurally validate the mutated config BEFORE any
          # Apple round-trip: exactly one build-scoped signing entry, no
          # release-scoped entry, that entry declares no id filter, and its
          # signature:/args: are byte-unchanged from the committed block.
          # Failure here costs nothing but a parse.
          MCI_BAD=0
          BINARY_SIGNS_COUNT="$(grep -c '^binary_signs:$' "${GENERATED_MUTATED}" || true)"
          if [ "${BINARY_SIGNS_COUNT}" != "1" ]; then
            echo "::error::MUTATION-CONFIG-INVALID: expected exactly one 'binary_signs:' top-level key in the mutated config, found ${BINARY_SIGNS_COUNT}"
            MCI_BAD=1
          fi
          if grep -q '^signs:$' "${GENERATED_MUTATED}"; then
            echo "::error::MUTATION-CONFIG-INVALID: the release-scoped 'signs:' key is still present in the mutated config — the rename edit did not take effect"
            MCI_BAD=1
          fi
          if grep -q '^    ids: \[raw\]$' "${GENERATED_MUTATED}"; then
            echo "::error::MUTATION-CONFIG-INVALID: the mutated config still declares 'ids: [raw]' under its signing entry — the removal edit did not take effect"
            MCI_BAD=1
          fi
          ORIGINAL_SIGNATURE_LINE="$(grep -m1 '^    signature: ' .goreleaser.yaml || true)"
          if [ -z "${ORIGINAL_SIGNATURE_LINE}" ]; then
            echo "::error::MUTATION-CONFIG-INVALID: could not find a '    signature: ' line in the committed .goreleaser.yaml to compare against"
            MCI_BAD=1
          elif ! grep -qF "${ORIGINAL_SIGNATURE_LINE}" "${GENERATED_MUTATED}"; then
            echo "::error::MUTATION-CONFIG-INVALID: the mutated config's signature: template line differs from the committed one — only the two D-07 edits are permitted"
            MCI_BAD=1
          fi
          for argline in '      - "sign-blob"' '      - "--bundle=${signature}"' '      - "${artifact}"' '      - "--yes"' '    artifacts: binary'; do
            if ! grep -qF "${argline}" "${GENERATED_MUTATED}"; then
              echo "::error::MUTATION-CONFIG-INVALID: the mutated config is missing the committed args:/artifacts: line [${argline}] — only the two D-07 edits are permitted"
              MCI_BAD=1
            fi
          done
          if [ "${MCI_BAD}" = "1" ]; then
            exit 1
          fi
          echo "MUTATION-CONFIG-INVALID check: PASSED (structural validation completed before any Apple round-trip)"

          MAIN_DIST="${REHEARSE_DIR}/dist-mutated"
          GENERATED_FINAL="${REHEARSE_DIR}/.goreleaser.rehearse-notarize.mutated-dist.yaml"
          inject_dist "${GENERATED_MUTATED}" "${MAIN_DIST}" "${GENERATED_FINAL}"
        fi

        # --- Build GoReleaser NATIVELY, no GOOS/GOARCH in the environment —
        # same Rosetta/xcrun reasoning release:dry-run-signed and
        # release:goreleaser already document: a GOARCH-cross-built
        # GoReleaser runs under Rosetta and its child xcrun then resolves as
        # x86_64, which cannot load the arm64-only libxcrun.dylib from
        # CommandLineTools.
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # GoReleaser records type: "Binary" TWICE per platform (the raw
        # build output and the archives pipe's renamed asset) — filtering
        # on .extra.Format=="binary" too avoids counting 8 where 4 exist
        # (02-RESEARCH.md Common Pitfalls; the same hazard release:dry-run's
        # own artifacts.json reader already guards against).
        darwin_binary_path() {
          # $1 = dist dir  $2 = arch
          jq -r --arg a "$2" \
            '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos=="darwin" and .goarch==$a)][0].path // empty' \
            "$1/artifacts.json"
        }

        # --- 4. Obtain a real pre-notarize baseline from a run that is
        # COMMENSURABLE with the release run, rather than attempting a
        # mid-pipe capture GoReleaser exposes no hook for. IDENTICAL
        # command, IDENTICAL flags as the main run below
        # (release --snapshot --skip=publish --clean), against the
        # notarize-DISABLED template. Run it TWICE, into the two DISTINCT
        # --dist-equivalent paths set above, and assert byte-equality
        # BEFORE trusting either baseline value or touching cosign at all —
        # this is the ONLY evidence in this repository for darwin
        # goreleaser determinism (ci.yml's reproducibility job has a
        # blocking linux/amd64 leg, a continue-on-error: true linux/arm64
        # leg, NO DARWIN LEG AT ALL, and every leg uses a raw `go build`,
        # never goreleaser — DIST-04 does not cover this property).
        echo "==> baseline run 1/2: goreleaser release -f ${GENERATED_DISABLED_1} --snapshot --skip=publish --clean"
        "${GORELEASER_BIN}" release -f "${GENERATED_DISABLED_1}" --snapshot --skip=publish --clean

        echo "==> baseline run 2/2: goreleaser release -f ${GENERATED_DISABLED_2} --snapshot --skip=publish --clean"
        "${GORELEASER_BIN}" release -f "${GENERATED_DISABLED_2}" --snapshot --skip=publish --clean

        BASELINE_NONDETERMINISTIC=0
        for arch in arm64 amd64; do
          B1="$(darwin_binary_path "${BASELINE_DIST_1}" "${arch}")"
          B2="$(darwin_binary_path "${BASELINE_DIST_2}" "${arch}")"
          if [ -z "${B1}" ] || [ ! -f "${B1}" ] || [ -z "${B2}" ] || [ ! -f "${B2}" ]; then
            echo "::error::could not resolve darwin/${arch}'s baseline binary from dist/artifacts.json in one or both baseline runs"
            exit 1
          fi
          H1="$(sha256_of "${B1}")"
          H2="$(sha256_of "${B2}")"
          if [ "${H1}" != "${H2}" ]; then
            echo "::error::BASELINE-NONDETERMINISTIC platform=darwin/${arch} run1_sha256=${H1} run2_sha256=${H2} — the two notarize-disabled baseline builds of the SAME commit are not byte-identical. This is a build-determinism finding about this repository, not an ordering finding about the sign/notarize pipes — STOPPING before any cosign verify-blob comparison, because a nondeterministic build would otherwise make 'neither candidate verifies' indistinguishable from a genuine ordering result."
            BASELINE_NONDETERMINISTIC=1
          else
            echo "BASELINE-DETERMINISM-OK platform=darwin/${arch} sha256=${H1}"
          fi
        done
        if [ "${BASELINE_NONDETERMINISTIC}" = "1" ]; then
          exit 1
        fi

        # --- 5. The REAL rehearsal: IDENTICAL command and flags to the
        # baseline pair above — no sign skip, no notarize skip, both pipes
        # running is the entire point. Record the expected SNAPSHOT NAMING
        # SHAPE before asserting anything about names: under --snapshot the
        # tag segment resolves EMPTY, so every sidecar name carries a
        # doubled separator (codegraph__darwin_arm64.sigstore.json, not
        # codegraph_<tag>_darwin_arm64.sigstore.json) where the real tag
        # would be. Names stay DISTINCT (os/arch still differ), so the
        # distinctness assertion below still holds — this is the EXPECTED
        # empty-tag shape, not a divergence from the tagged-release naming
        # contract release:dry-run-signed pins.
        echo "==> main run (mutate=${MUTATE}): goreleaser release -f ${GENERATED_FINAL} --snapshot --skip=publish --clean"
        "${GORELEASER_BIN}" release -f "${GENERATED_FINAL}" --snapshot --skip=publish --clean

        if [ ! -f "${MAIN_DIST}/artifacts.json" ]; then
          echo "::error::${MAIN_DIST}/artifacts.json not found after the main run"
          exit 1
        fi

        # --- 6. Assert FROM dist/artifacts.json, never a filename glob,
        # never a bare exit code.
        SIGN_COUNT="$(jq -r '[.[] | select(.type=="Signature")] | length' "${MAIN_DIST}/artifacts.json")"
        SIGN_NAMES="$(jq -r '[.[] | select(.type=="Signature") | .name] | join(",")' "${MAIN_DIST}/artifacts.json")"
        SIGN_DISTINCT="$(jq -r '[.[] | select(.type=="Signature") | .name] | unique | length' "${MAIN_DIST}/artifacts.json")"

        OK=1
        if [ "${MUTATE}" != "1" ]; then
          if [ "${SIGN_COUNT}" != "4" ] || [ "${SIGN_DISTINCT}" != "4" ]; then
            echo "::error::expected exactly 4 distinct Signature records in dist/artifacts.json (shipped configuration, all 4 platforms), got count=${SIGN_COUNT} distinct=${SIGN_DISTINCT} names=${SIGN_NAMES}"
            exit 1
          fi
          echo "SIGNATURE-COUNT-OK count=${SIGN_COUNT} distinct=${SIGN_DISTINCT} names=${SIGN_NAMES} (snapshot-mode shape: the empty tag segment is EXPECTED, not a defect)"
        else
          # A zero-match sign pipe does not fail — it logs a warning and
          # returns nil (source-confirmed). Name that no-op as its OWN
          # failure class, never SUBJECT-INDETERMINATE below: "signed
          # nothing" and "signed something that failed to invert" are
          # different findings with different causes and different
          # remedies, and collapsing them is exactly what would let a
          # no-op masquerade as an inconclusive ordering result.
          if [ "${SIGN_COUNT}" = "0" ]; then
            echo "::error::MUTATION-PRODUCED-NO-SIGNATURE: the mutated run produced 0 Signature-typed records in dist/artifacts.json — the mutation signed NOTHING. This is NOT SUBJECT-INDETERMINATE (below) — verify the ids: [raw] removal actually widened the filter as intended."
            exit 1
          fi
          echo "MUTATION-PRODUCED-NO-SIGNATURE check: PASSED (${SIGN_COUNT} Signature record(s), names=${SIGN_NAMES})"
        fi

        CHECKSUMS_FILE="$(jq -r '[.[] | select(.type=="Checksum")][0].path // empty' "${MAIN_DIST}/artifacts.json")"
        if [ -z "${CHECKSUMS_FILE}" ] || [ ! -f "${CHECKSUMS_FILE}" ]; then
          echo "::error::no Checksum-typed record found in ${MAIN_DIST}/artifacts.json — the checksum: pipe did not run or produced nothing (asserted from artifacts.json, never a filename glob)"
          exit 1
        fi

        ASSESS_ARCHES="arm64 amd64"
        if [ "${MUTATE}" = "1" ]; then
          ASSESS_ARCHES="arm64"
        fi

        for arch in ${ASSESS_ARCHES}; do
          FINAL_BIN="$(darwin_binary_path "${MAIN_DIST}" "${arch}")"
          if [ -z "${FINAL_BIN}" ] || [ ! -f "${FINAL_BIN}" ]; then
            echo "::error::could not resolve darwin/${arch}'s final binary from ${MAIN_DIST}/artifacts.json"
            exit 1
          fi
          FINAL_SHA256="$(sha256_of "${FINAL_BIN}")"

          PRESIGN_BIN="$(darwin_binary_path "${BASELINE_DIST_1}" "${arch}")"
          PRESIGN_SHA256="$(sha256_of "${PRESIGN_BIN}")"

          SHA_CHANGED="false"
          if [ "${FINAL_SHA256}" != "${PRESIGN_SHA256}" ]; then SHA_CHANGED="true"; fi

          # zip-content / checksums-file byte-identity: the D-05 chain that
          # describes the SHIPPED configuration's guarantee. The mutation's
          # own evidence is the cosign subject inversion below, not a
          # re-assertion of this chain — its archives:/checksum: pipes
          # still run (GoReleaser's hardcoded pipe order does not skip
          # them), but re-asserting byte-identity there would prove nothing
          # D-07 needs.
          ZIP_CONTENT_SHA256="unknown"
          CHECKSUMS_FILE_SHA256="unknown"
          if [ "${MUTATE}" != "1" ]; then
            ZIP_PATH="$(jq -r --arg a "${arch}" '[.[] | select(.type=="Archive" and .goos=="darwin" and .goarch==$a and (.name | endswith(".zip")))][0].path // empty' "${MAIN_DIST}/artifacts.json")"
            if [ -z "${ZIP_PATH}" ] || [ ! -f "${ZIP_PATH}" ]; then
              echo "::error::could not resolve darwin/${arch}'s zip archive from ${MAIN_DIST}/artifacts.json"
              exit 1
            fi
            ZIP_EXTRACT_DIR="$(mktemp -d)"
            unzip -q "${ZIP_PATH}" -d "${ZIP_EXTRACT_DIR}"
            ZIP_BIN="$(find "${ZIP_EXTRACT_DIR}" -type f -name codegraph | head -n1)"
            if [ -z "${ZIP_BIN}" ]; then
              echo "::error::no codegraph binary found inside darwin/${arch}'s extracted zip"
              rm -rf "${ZIP_EXTRACT_DIR}"
              exit 1
            fi
            ZIP_CONTENT_SHA256="$(sha256_of "${ZIP_BIN}")"
            rm -rf "${ZIP_EXTRACT_DIR}"
            if [ "${ZIP_CONTENT_SHA256}" != "${FINAL_SHA256}" ]; then
              echo "::error::darwin/${arch} zip-content sha256 (${ZIP_CONTENT_SHA256}) != final binary sha256 (${FINAL_SHA256})"
              OK=0
            fi

            RAW_NAME="$(jq -r --arg a "${arch}" '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos=="darwin" and .goarch==$a)][0].name // empty' "${MAIN_DIST}/artifacts.json")"
            CHECKSUMS_LINE_SHA256="$(awk -v n="${RAW_NAME}" '$2 == n || $2 == "*"n {print $1}' "${CHECKSUMS_FILE}" | head -n1)"
            CHECKSUMS_FILE_SHA256="${CHECKSUMS_LINE_SHA256:-not-found}"
            if [ "${CHECKSUMS_FILE_SHA256}" != "${FINAL_SHA256}" ]; then
              echo "::error::darwin/${arch} checksums-file sha256 (${CHECKSUMS_FILE_SHA256}) != final binary sha256 (${FINAL_SHA256}) for asset ${RAW_NAME}"
              OK=0
            fi

            if [ "${SHA_CHANGED}" != "true" ]; then
              echo "::error::darwin/${arch} final sha256 (${FINAL_SHA256}) equals the pre-sign baseline (${PRESIGN_SHA256}) — expected them to DIFFER (the measurement that converts 'quill rewrites the Mach-O' from inferred to observed)"
              OK=0
            fi
          fi

          # --- 6a. Identify what cosign actually signed CRYPTOGRAPHICALLY —
          # never by re-hashing dist/artifacts.json's recorded path, which
          # names the signature FILE, not its subject, and which quill has
          # already rewritten in place under the mutation. Verify the SAME
          # bundle against BOTH candidate subjects; exactly one must verify.
          SIG_PATH="$(jq -r --arg suf "_darwin_${arch}.sigstore.json" '[.[] | select(.type=="Signature") | select(.name | endswith($suf))][0].path // empty' "${MAIN_DIST}/artifacts.json")"
          if [ -z "${SIG_PATH}" ] || [ ! -f "${SIG_PATH}" ]; then
            echo "::error::could not resolve darwin/${arch}'s cosign signature bundle from ${MAIN_DIST}/artifacts.json"
            exit 1
          fi

          set +e
          cosign verify-blob --key "${COSIGN_PUBKEY}" --bundle "${SIG_PATH}" "${PRESIGN_BIN}" >"${REHEARSE_DIR}/verify-presign-${arch}.log" 2>&1
          VERIFIES_PRESIGN_EXIT=$?
          cosign verify-blob --key "${COSIGN_PUBKEY}" --bundle "${SIG_PATH}" "${FINAL_BIN}" >"${REHEARSE_DIR}/verify-final-${arch}.log" 2>&1
          VERIFIES_FINAL_EXIT=$?
          set -e
          VERIFIES_PRESIGN="false"
          if [ "${VERIFIES_PRESIGN_EXIT}" = "0" ]; then VERIFIES_PRESIGN="true"; fi
          VERIFIES_FINAL="false"
          if [ "${VERIFIES_FINAL_EXIT}" = "0" ]; then VERIFIES_FINAL="true"; fi
          echo "COSIGN-VERIFY-BLOB platform=darwin/${arch} vs_presign_exit=${VERIFIES_PRESIGN_EXIT} vs_final_exit=${VERIFIES_FINAL_EXIT}"

          COSIGN_SUBJECT="indeterminate"
          if [ "${VERIFIES_PRESIGN}" = "true" ] && [ "${VERIFIES_FINAL}" = "false" ]; then
            COSIGN_SUBJECT="presign"
          elif [ "${VERIFIES_FINAL}" = "true" ] && [ "${VERIFIES_PRESIGN}" = "false" ]; then
            COSIGN_SUBJECT="final"
          fi

          EXPECTED_SUBJECT="final"
          if [ "${MUTATE}" = "1" ]; then EXPECTED_SUBJECT="presign"; fi
          VERDICT="pass"
          if [ "${COSIGN_SUBJECT}" != "${EXPECTED_SUBJECT}" ]; then VERDICT="fail"; fi

          # --- 7. codesign -dvv (Team Identifier presence), then a SEPARATE,
          # LOCAL-ONLY spctl -a -vv -t install (D-19 oracle, never -t exec)
          # against a SYNTHETIC-quarantine copy. Deliberately NOT
          # verify:gatekeeper — that target's contract is a PUBLISHED asset
          # resolved by tag; widening it to accept a local path would
          # weaken the one gate whose whole value is that it cannot read a
          # local build.
          CODESIGN_OUT="$(codesign -dvv "${FINAL_BIN}" 2>&1 || true)"
          echo "REHEARSAL-CODESIGN-DVV platform=darwin/${arch}"
          echo "${CODESIGN_OUT}"
          TEAM_ID_PRESENT="false"
          if printf '%s\n' "${CODESIGN_OUT}" | grep -q '^TeamIdentifier=' && ! printf '%s\n' "${CODESIGN_OUT}" | grep -q '^TeamIdentifier=not set$'; then
            TEAM_ID_PRESENT="true"
          fi

          ASSESS_COPY="${REHEARSE_DIR}/spctl-assess-darwin-${arch}"
          cp "${FINAL_BIN}" "${ASSESS_COPY}"
          QUARANTINE_HEX_TS="$(printf '%x' "$(date +%s)")"
          QUARANTINE_UUID="$(uuidgen)"
          xattr -w com.apple.quarantine "0081;${QUARANTINE_HEX_TS};Safari;${QUARANTINE_UUID}" "${ASSESS_COPY}"
          set +e
          SPCTL_OUT="$(spctl -a -vv -t install "${ASSESS_COPY}" 2>&1)"
          SPCTL_EXIT=$?
          set -e
          echo "REHEARSAL-SPCTL platform=darwin/${arch} exit=${SPCTL_EXIT}"
          echo "${SPCTL_OUT}"
          SPCTL_VERDICT="unclassifiable"
          APPLE_STATUS="unknown"
          case "${SPCTL_EXIT}" in
            0) SPCTL_VERDICT="accepted"; APPLE_STATUS="notarized" ;;
            3) SPCTL_VERDICT="rejected"; APPLE_STATUS="rejected-or-unnotarized" ;;
          esac

          # --- 6a (hard failure). Two verifications both succeeding, or
          # both failing, means this experiment did not isolate what it
          # claims to — NOT reported as an ordering finding. Because the
          # BASELINE-NONDETERMINISTIC check above runs first and
          # independently, a SUBJECT-INDETERMINATE result here arrives
          # having already excluded build nondeterminism as the cause.
          SUBJECT_INDETERMINATE=0
          if [ "${COSIGN_SUBJECT}" = "indeterminate" ]; then
            echo "::error::SUBJECT-INDETERMINATE platform=darwin/${arch} cosign_verifies_presign=${VERIFIES_PRESIGN} cosign_verifies_final=${VERIFIES_FINAL} — exactly one candidate must verify"
            SUBJECT_INDETERMINATE=1
          fi

          # --- 9. Evidence lines, on BOTH the pass and fail path — schema=1
          # first field, fixed key order, sentinels never omitted.
          echo "NOTARIZE-EVIDENCE schema=1 goos=darwin goarch=${arch} presign_sha256=${PRESIGN_SHA256} final_sha256=${FINAL_SHA256} sha_changed=${SHA_CHANGED} team_id_present=${TEAM_ID_PRESENT} spctl_exit=${SPCTL_EXIT} spctl_verdict=${SPCTL_VERDICT} apple_status=${APPLE_STATUS}"
          echo "SIGN04-EVIDENCE schema=1 goos=darwin goarch=${arch} final_sha256=${FINAL_SHA256} zip_content_sha256=${ZIP_CONTENT_SHA256} checksums_file_sha256=${CHECKSUMS_FILE_SHA256} cosign_verifies_presign=${VERIFIES_PRESIGN} cosign_verifies_final=${VERIFIES_FINAL} cosign_subject=${COSIGN_SUBJECT} verdict=${VERDICT} mutate=${MUTATE} config_sha256=${CONFIG_SHA256}"

          if [ "${SUBJECT_INDETERMINATE}" = "1" ]; then
            exit 1
          fi
          # NOTE: `[ cond ] && VAR=x` must never be the LAST statement of a
          # loop body here. go-task runs cmds through its own embedded shell
          # (mvdan.cc/sh), not the system shell, and under `set -e` that
          # interpreter treats a FALSE and-list in final position as fatal —
          # so the target aborted precisely when every verdict was `pass`,
          # silently, with no ::error:: to print. Measured 2026-08-09 during
          # plan 02-04 Task 2's first real run: an and-list mid-block or at
          # top level is fine, last-in-loop is fatal. Second instance in this
          # repo of a bug that lives in the Taskfile wrapper and is invisible
          # to a plain `sh` run of the same script (the first shipped v0.5.0
          # with zero assets). Use `if`/`fi`, not `&&`, for every conditional
          # assignment in this file.
          if [ "${VERDICT}" != "pass" ]; then OK=0; fi
        done

        # --- 10. The committed .goreleaser.yaml must be byte-unchanged —
        # no experiment here may ever leak into the working tree.
        if ! git diff --quiet HEAD -- .goreleaser.yaml; then
          echo "::error::the committed .goreleaser.yaml changed during this rehearsal"
          exit 1
        fi
        CONFIG_SHA256_AFTER="$(sha256_of .goreleaser.yaml)"
        if [ "${CONFIG_SHA256_AFTER}" != "${CONFIG_SHA256}" ]; then
          echo "::error::the committed .goreleaser.yaml's sha256 changed during this rehearsal (before=${CONFIG_SHA256} after=${CONFIG_SHA256_AFTER})"
          exit 1
        fi

        if [ "${OK}" != "1" ]; then
          exit 1
        fi

        echo "release:rehearse-notarize: PASS (mutate=${MUTATE})"

  release:rehearse-cask:
    desc: >-
      MAINTAINER-ONLY, local, opt-in. Rehearses the entire Homebrew delivery
      path GoReleaser's `homebrew_casks:` pipe drives — a real
      `goreleaser release` render, a real `brew install --cask` of the
      RENDERED cask (with its download URL rewritten to a local file), and
      a real `brew uninstall --cask` — before the tap repository exists and
      before any release publishes anything (Phase 3, plan 03-01 tracer
      task). Proves: A1 (the `codegraph` binary sits at the root of the
      extracted `zip`, so `binaries: [codegraph]` needs no rename
      handling), A3 (the post-install hook's
      `#{HOMEBREW_PREFIX}/bin/codegraph` path is live by the time
      `postflight` runs), and D-10 (the install itself is BREW-05's gate —
      a hook whose invoked binary cannot run makes `brew install` fail).

      This target installs and uninstalls a REAL cask into the REAL
      Homebrew prefix — not a sandbox, not `--snapshot`'s `dist/`-only
      render. Never invoked by any CI workflow, never added to
      `inScopeJobs` (TestWorkflowRunBodiesInvokeTask). Guarded by an
      explicit opt-in variable so it cannot fire from a `task --list`
      browse, and preconditions refuse to run over an already-installed
      brew-managed `codegraph` rather than disturb it.

      Rehearsal, not publication (BREW-05 prohibition): the cask installed
      here is GoReleaser's OWN `dist/homebrew/Casks/codegraph.rb` render,
      copied aside with EXACTLY ONE line rewritten — the download URL,
      which under `--snapshot` points at a GitHub release that does not
      exist. This is never a hand-written cask standing in for GoReleaser's
      output, and its result must never be recorded as, or mistaken for,
      BREW-01's published cold-install evidence.

      REQUIRES REAL APPLE DEVELOPER ID CREDENTIALS — measured this session,
      not assumed. Homebrew Cask UNCONDITIONALLY quarantines every download
      via LaunchServices FFI regardless of URL scheme
      (extend/os/mac/cask/quarantine.rb `cask!`, called from
      cask/download.rb — no `--no-quarantine` flag exists; `spctl --add`
      that could locally allowlist one binary was REMOVED as of macOS 15.0,
      "operations that modify the rule database ... will no longer be
      supported", confirmed against `man spctl` on this host). A binary
      that is only ad-hoc signed (Go's own toolchain default) or entirely
      unsigned is therefore SIGKILLed by Gatekeeper the moment the
      post-install hook's `system_command` tries to execute it from a
      quarantined Caskroom path — measured directly this session:
      `brew install --cask` failed with "was terminated by uncaught signal
      KILL" against a snapshot build with no MACOS_* credentials set, and
      independently reproduced by manually quarantining an ad-hoc-signed
      copy of the same binary (exit 137). This is Gatekeeper working
      correctly, not a defect in this target — but it means the five
      MACOS_* credentials `release:rehearse-notarize` already requires are
      ALSO load-bearing here, even though `--skip=sign` is passed (that
      only skips this target's own cosign `signs:` pipe; `notary.MacOS{}`
      is registered inside BuildPipeline and still runs `goreleaser
      release`'s sign-and-notarize step whenever its five-term `enabled:`
      credential conjunction evaluates true).
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "release:rehearse-cask must run on a native darwin host — brew install --cask only makes sense against a real macOS Homebrew prefix. Run it on your own Mac."
      - sh: command -v brew
        msg: "brew not found. release:rehearse-cask installs and uninstalls a real Homebrew cask; without brew there is nothing to rehearse against. Install Homebrew: https://brew.sh."
      - sh: command -v zig
        msg: "zig not found. Both linux build ids in .goreleaser.yaml cross-compile via zig cc/zig c++ (REL-05); this rehearsal's release invocation still builds all four targets. Install locally: brew install zig."
      - sh: command -v syft
        msg: "syft not found. This rehearsal's release invocation exercises the sboms: pipe even under --skip=publish,sign. Install locally: brew install syft."
      - sh: command -v cosign
        msg: "cosign not found. --skip=sign skips this rehearsal's own signs: pipe, but notary.MacOS{} (registered inside BuildPipeline) still runs whenever its enabled: predicate is true (see the five MACOS_* preconditions below) — installed regardless as defense-in-depth matching release:dry-run's own precondition set. Install locally: brew install cosign."
      - sh: command -v jq
        msg: "jq not found. Every result this target reports is read from dist/artifacts.json with it — never a filename glob, never a bare exit code. Install locally: brew install jq."
      - sh: command -v python3
        msg: "python3 not found. This target's loopback-HTTP-server fallback (used only if brew's downloader rejects a file:// URL) needs it. Install locally: brew install python3."
      - sh: '! brew list --cask codegraph >/dev/null 2>&1'
        msg: "a brew-managed 'codegraph' cask is already installed. release:rehearse-cask installs and uninstalls a real cask into the real Homebrew prefix and refuses to run over an existing install rather than disturb it — run 'brew uninstall --cask codegraph' first if that install is disposable, or set up a clean environment."
      # --- Apple credentials (measured this session, NOT optional):
      # Homebrew Cask unconditionally quarantines every downloaded
      # artifact (see this target's desc: above) — a binary that is not
      # genuinely Developer-ID-signed AND notarized is SIGKILLed by
      # Gatekeeper the instant the post-install hook tries to run it, so
      # this rehearsal cannot reach a real PASS without these, unlike
      # release:dry-run/release:dry-run-signed, which never execute the
      # built binary at all. Same named-precondition shape
      # release:rehearse-notarize already uses. MAINTAINER-ONLY: see
      # docs/RELEASE.md for how to obtain each value.
      - sh: '[ -n "${MACOS_SIGN_P12:-}" ]'
        msg: "MACOS_SIGN_P12 is not set. release:rehearse-cask requires a real Developer ID Application certificate — Homebrew Cask unconditionally quarantines downloads, and an ad-hoc/unsigned binary is SIGKILLed by Gatekeeper when the post-install hook executes it (measured this session). See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_SIGN_PASSWORD:-}" ]'
        msg: "MACOS_SIGN_PASSWORD is not set. release:rehearse-cask requires the password chosen when exporting the .p12 above. See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_ISSUER_ID:-}" ]'
        msg: "MACOS_NOTARY_ISSUER_ID is not set. release:rehearse-cask requires notarization to complete (not just signing) — Gatekeeper's quarantine assessment on a Cask-installed binary checks both. See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_KEY_ID:-}" ]'
        msg: "MACOS_NOTARY_KEY_ID is not set. See docs/RELEASE.md."
      - sh: '[ -n "${MACOS_NOTARY_KEY:-}" ]'
        msg: "MACOS_NOTARY_KEY is not set. See docs/RELEASE.md."
      - sh: '[ "${CASK_REHEARSE:-0}" = "1" ]'
        msg: "CASK_REHEARSE is not set to 1. release:rehearse-cask is MAINTAINER-ONLY and installs/uninstalls a REAL cask into your REAL Homebrew prefix — this explicit opt-in exists so it can never fire from a 'task --list' browse. Run: CASK_REHEARSE=1 task release:rehearse-cask."
    cmds:
      - |
        set -euo pipefail

        echo "release:rehearse-cask: starting"

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 1. ONE run-scoped temp dir tree for the rewritten cask copy,
        # the zig caches, and (if needed) the loopback HTTP server's cwd
        # marker — never the real dist/, which --clean below wipes and
        # which every other release target already owns. A single trap
        # removes it, uninstalls the cask if this run installed one, and
        # kills the HTTP server if one was started — on BOTH the pass and
        # the fail path, so this target never leaves a half-installed cask
        # or a stray server behind on the maintainer's machine.
        REHEARSE_DIR="$(mktemp -d)"
        GORELEASER_DIR="$(mktemp -d)"
        GORELEASER_BIN="${GORELEASER_DIR}/goreleaser"
        ZIG_CACHE_ROOT="$(mktemp -d)"
        HTTP_SERVER_PID=""
        CASK_INSTALLED=0
        TAP_NAME=""
        OUTCOME="fail"

        cleanup() {
          if [ "${CASK_INSTALLED}" = "1" ] && [ -n "${TAP_NAME}" ]; then
            echo "==> cleanup: brew uninstall --cask ${TAP_NAME}/codegraph"
            brew uninstall --cask "${TAP_NAME}/codegraph" >/dev/null 2>&1 || true
          fi
          if [ -n "${TAP_NAME}" ]; then
            brew untap "${TAP_NAME}" >/dev/null 2>&1 || true
          fi
          if [ -n "${HTTP_SERVER_PID}" ]; then
            kill "${HTTP_SERVER_PID}" >/dev/null 2>&1 || true
          fi
          rm -rf "${REHEARSE_DIR}" "${GORELEASER_DIR}" "${ZIG_CACHE_ROOT}"
          if [ "${OUTCOME}" != "pass" ]; then
            echo "CASK-REHEARSE-EVIDENCE schema=3 snapshot_version=${SNAPSHOT_VERSION:-unknown} cask_sha256=${CASK_SHA256:-unknown} url_mechanism=${URL_MECHANISM:-none} man_page_count=${MAN_PAGE_COUNT:-0} fresh_man_pages=${FRESH_MAN_PAGE_COUNT:-0} completion_count=${COMPLETION_COUNT:-0} reported_version=${REPORTED_VERSION:-unknown} outcome=fail"
          fi
        }
        trap cleanup EXIT

        # --- 2. Build GoReleaser NATIVELY, no GOOS/GOARCH in the
        # environment — same Rosetta/xcrun reasoning release:dry-run and
        # release:rehearse-notarize already document.
        echo "==> building goreleaser natively"
        GOWORK=off go build -modfile=go.tool.mod \
          -o "${GORELEASER_BIN}" github.com/goreleaser/goreleaser/v2

        export ZIG_LOCAL_CACHE_DIR="${ZIG_CACHE_ROOT}/local"
        export ZIG_GLOBAL_CACHE_DIR="${ZIG_CACHE_ROOT}/global"

        # HOMEBREW_TAP_TOKEN: an obvious NON-CREDENTIAL placeholder.
        # --skip=publish means cask.Pipe{}.Publish() (the tap push — the
        # ONLY place this value is consumed) never runs, so a template
        # referencing it cannot fail this run and can never be mistaken
        # for a real secret in the log.
        export HOMEBREW_TAP_TOKEN="cask-rehearsal-placeholder-not-a-credential"

        # --- Step 1 (plan Task 2 algorithm): render, publish nothing.
        echo "==> goreleaser release --snapshot --skip=publish,sign --clean"
        "${GORELEASER_BIN}" release --snapshot --skip=publish,sign --clean

        if [ ! -f dist/artifacts.json ]; then
          echo "::error::goreleaser release produced no dist/artifacts.json"
          exit 1
        fi

        SNAPSHOT_VERSION="$(jq -r '.[0].extra.Version // .[0].version // "unknown"' dist/artifacts.json 2>/dev/null || echo unknown)"

        # --- Step 2: assert the render ACTUALLY happened — the positive
        # assertion this repo's rule 84d1gfpywd requires. A target that
        # proceeds to install a cask it never confirmed was written is
        # exactly the vacuous-guard shape that rule exists for.
        CASK_PATH="dist/homebrew/Casks/codegraph.rb"
        if [ ! -s "${CASK_PATH}" ]; then
          echo "::error::${CASK_PATH} does not exist or is empty after 'goreleaser release' — the homebrew_casks: cask.Pipe{} render did not happen (missing homebrew_casks: block in .goreleaser.yaml, or the ids:/repository: fields don't resolve). Nothing further can be rehearsed without a rendered cask on disk."
          exit 1
        fi
        CASK_SHA256="$(sha256_of "${CASK_PATH}")"
        echo "rendered cask: ${CASK_PATH} sha256=${CASK_SHA256}"

        # --- Step 3: copy aside and rewrite exactly two lines — the
        # download URL for THIS host's platform (darwin/arm64 or
        # darwin/amd64, whichever this Mac is), located by the literal
        # zip artifact name from dist/artifacts.json (never a hand-guessed
        # template resolution); and the declared `version "..."` line,
        # rewritten to the value the LOCAL, not-yet-installed build
        # actually reports.
        #
        # The version rewrite (added alongside D-11's version-equality
        # assertion, plan 03-02 Task 1) exists because `--snapshot` mode
        # itself — not this cask, not the hook — makes GoReleaser's
        # rendered `version "..."` (ctx.Version, a SNAPSHOT-suffixed
        # pseudo-version e.g. "0.7.0-SNAPSHOT-<hash>") diverge from the
        # ldflags-injected `internal/version.Version` (set from
        # GoReleaser's own Tag field, the nearest real tag, e.g.
        # "v0.7.0") that the binary itself reports — MEASURED this
        # session: the completed hook's version
        # assertion correctly raised "installed binary reports version
        # \"0.7.0\", cask declares \"0.7.0-SNAPSHOT-91b6df6\"" on the
        # very first GREEN attempt. In a REAL (tagged, non-snapshot)
        # release these two values are the SAME tag (D-11's assertion
        # would trivially pass), so this rewrite is a rehearsal-fidelity
        # correction, not a weakening of the assertion under test —
        # exactly the class of fix Rule 1/3 covers, not Rule 4: nothing
        # about the gate's behavior changes, only what this LOCAL,
        # snapshot-mode rehearsal declares as the cask's own version, so
        # the two sides it compares agree the way a real release's would.
        HOST_ARCH="$(go env GOARCH)"
        mkdir -p "${REHEARSE_DIR}/rehearsal"
        REHEARSAL_CASK="${REHEARSE_DIR}/rehearsal/codegraph.rb"
        cp "${CASK_PATH}" "${REHEARSAL_CASK}"

        ZIP_NAME="$(jq -r --arg goos darwin --arg goarch "${HOST_ARCH}" \
          '[.[] | select(.type=="Archive" and .goos==$goos and .goarch==$goarch and (.name | endswith(".zip")))][0].name // empty' \
          dist/artifacts.json)"
        ZIP_PATH="$(jq -r --arg goos darwin --arg goarch "${HOST_ARCH}" \
          '[.[] | select(.type=="Archive" and .goos==$goos and .goarch==$goarch and (.name | endswith(".zip")))][0].path // empty' \
          dist/artifacts.json)"
        if [ -z "${ZIP_NAME}" ] || [ -z "${ZIP_PATH}" ] || [ ! -f "${ZIP_PATH}" ]; then
          echo "::error::could not resolve darwin/${HOST_ARCH}'s zip archive from dist/artifacts.json"
          exit 1
        fi
        ZIP_ABS="$(cd "$(dirname "${ZIP_PATH}")" && pwd)/$(basename "${ZIP_PATH}")"

        URL_LINE_NUM="$(grep -n -F "${ZIP_NAME}" "${REHEARSAL_CASK}" | head -n1 | cut -d: -f1)"
        if [ -z "${URL_LINE_NUM}" ]; then
          echo "::error::no line in ${CASK_PATH} references the darwin/${HOST_ARCH} zip artifact name (${ZIP_NAME}) — cannot identify which url line to rewrite"
          exit 1
        fi

        # Locate the LOCAL (raw, not-yet-archived) build output for this
        # host's darwin arch — type=="Binary" with no extra.Format, the
        # go-build artifact BEFORE the archives: pipe's rename/copy (see
        # release:dry-run's own comment on the two "Binary" records
        # goreleaser release writes per platform). Executed directly, not
        # via brew — no download, no quarantine, so no Gatekeeper concern.
        LOCAL_BIN="$(jq -r --arg goos darwin --arg goarch "${HOST_ARCH}" \
          '[.[] | select(.type=="Binary" and .goos==$goos and .goarch==$goarch and ((.extra.Format // "")==""))][0].path // empty' \
          dist/artifacts.json)"
        if [ -z "${LOCAL_BIN}" ] || [ ! -x "${LOCAL_BIN}" ]; then
          echo "::error::could not resolve the local darwin/${HOST_ARCH} build output from dist/artifacts.json"
          exit 1
        fi
        LOCAL_VERSION_JSON="$("${LOCAL_BIN}" version --json 2>&1)"
        LOCAL_REPORTED_VERSION="$(printf '%s' "${LOCAL_VERSION_JSON}" | jq -r '.version // empty' | sed 's/^v//')"
        if [ -z "${LOCAL_REPORTED_VERSION}" ]; then
          echo "::error::could not parse .version from '${LOCAL_BIN} version --json' output: ${LOCAL_VERSION_JSON}"
          exit 1
        fi
        echo "local build reports (JSON, v-stripped): ${LOCAL_REPORTED_VERSION}"

        VERSION_LINE_NUM="$(grep -n -E '^  version "' "${REHEARSAL_CASK}" | head -n1 | cut -d: -f1)"
        if [ -z "${VERSION_LINE_NUM}" ]; then
          echo "::error::could not find a 'version \"...\"' line in ${REHEARSAL_CASK} to rewrite"
          exit 1
        fi

        URL_MECHANISM="file"
        NEW_URL="file://${ZIP_ABS}"
        sed -i.bak "${URL_LINE_NUM}s|\"[^\"]*\"|\"${NEW_URL}\"|" "${REHEARSAL_CASK}"
        sed -i.bak "${VERSION_LINE_NUM}s/.*/  version \"${LOCAL_REPORTED_VERSION}\"/" "${REHEARSAL_CASK}"

        DIFF_OUT="$(diff "${CASK_PATH}" "${REHEARSAL_CASK}" || true)"
        DIFF_CHANGED_LINES="$(printf '%s\n' "${DIFF_OUT}" | grep -c '^[<>]' || true)"
        if [ "${DIFF_CHANGED_LINES}" != "4" ]; then
          echo "::error::rehearsal cask differs from the rendered cask by ${DIFF_CHANGED_LINES} line(s) (two 1-line replacements are a 4-line unified diff: two removed, two added) — want exactly two lines changed (the download url and the declared version):"
          printf '%s\n' "${DIFF_OUT}"
          exit 1
        fi
        echo "REHEARSAL-DIFF (must be exactly the download URL and declared version lines):"
        printf '%s\n' "${DIFF_OUT}"

        # --- Step 4: brew install --cask the rewritten copy. Modern
        # Homebrew (6.0.16, measured this session) REJECTS installing a
        # loose .rb path directly ("Homebrew requires casks to be in a
        # tap") — a real environment finding this rehearsal exists to
        # surface, not documented anywhere in RESEARCH.md's source-level
        # trace. The rehearsal therefore wraps the rewritten cask in a
        # throwaway LOCAL git-repo tap (never the real seanb4t/homebrew-
        # tap, which does not exist yet — D-14) and installs by its
        # tap-qualified name. Try file:// first for the ZIP download URL
        # (URL_MECHANISM=file, above); if Homebrew's downloader rejects
        # that scheme, fall back to a loopback HTTP server rooted at
        # dist/ (URL_MECHANISM=http) by editing the SAME tap clone's cask
        # file in place — no re-tap needed.
        TAP_NAME="local-rehearsal/cask-rehearsal-scratch"
        LOCAL_TAP_SRC="${REHEARSE_DIR}/tap-src"
        mkdir -p "${LOCAL_TAP_SRC}/Casks"
        cp "${REHEARSAL_CASK}" "${LOCAL_TAP_SRC}/Casks/codegraph.rb"
        (
          cd "${LOCAL_TAP_SRC}"
          git init -q -b main
          git config user.email "cask-rehearsal@localhost"
          git config user.name "release:rehearse-cask"
          git add -A
          git commit -q -m "rehearsal cask (throwaway, never pushed)"
        )

        export HOMEBREW_NO_AUTO_UPDATE=1
        export HOMEBREW_NO_ENV_HINTS=1
        brew tap "${TAP_NAME}" "file://${LOCAL_TAP_SRC}"
        TAP_CLONE_DIR="$(brew --repo "${TAP_NAME}")"

        # UF-5 (T-04-05, review cycle 3 MEDIUM): a freshness marker created
        # immediately before the FIRST install, read ONLY by Step 5's
        # find -newer check below. Step 5d (further down) creates and
        # reads its own separate reinstall-freshness marker — one
        # creation point, one freshness consumer per marker, never
        # shared.
        MAN_BASELINE_MARKER="$(mktemp)"
        set +e
        INSTALL_OUT="$(brew install --cask "${TAP_NAME}/codegraph" 2>&1)"
        INSTALL_EXIT=$?
        set -e
        echo "${INSTALL_OUT}"

        if [ "${INSTALL_EXIT}" != "0" ] && printf '%s\n' "${INSTALL_OUT}" | grep -qiE 'unsupported url|no such file or directory.*curl|Curl download failed'; then
          echo "==> file:// rejected by Homebrew's downloader; falling back to a loopback HTTP server"
          URL_MECHANISM="http"
          DIST_ABS="$(cd dist && pwd)"
          HTTP_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          ( cd "${DIST_ABS}" && python3 -m http.server --bind 127.0.0.1 "${HTTP_PORT}" >"${REHEARSE_DIR}/http-server.log" 2>&1 & echo $! > "${REHEARSE_DIR}/http-server.pid" )
          HTTP_SERVER_PID="$(cat "${REHEARSE_DIR}/http-server.pid")"
          sleep 1

          ZIP_REL="${ZIP_PATH#dist/}"
          HTTP_URL="http://127.0.0.1:${HTTP_PORT}/${ZIP_REL}"
          cp "${CASK_PATH}" "${REHEARSAL_CASK}"
          sed -i.bak "${URL_LINE_NUM}s|\"[^\"]*\"|\"${HTTP_URL}\"|" "${REHEARSAL_CASK}"
          sed -i.bak "${VERSION_LINE_NUM}s/.*/  version \"${LOCAL_REPORTED_VERSION}\"/" "${REHEARSAL_CASK}"

          DIFF_OUT="$(diff "${CASK_PATH}" "${REHEARSAL_CASK}" || true)"
          DIFF_CHANGED_LINES="$(printf '%s\n' "${DIFF_OUT}" | grep -c '^[<>]' || true)"
          if [ "${DIFF_CHANGED_LINES}" != "4" ]; then
            echo "::error::HTTP-fallback rehearsal cask differs from the rendered cask by ${DIFF_CHANGED_LINES} line(s), want exactly two lines changed (the download url and the declared version):"
            printf '%s\n' "${DIFF_OUT}"
            exit 1
          fi
          echo "REHEARSAL-DIFF (HTTP fallback, must be exactly the download URL and declared version lines):"
          printf '%s\n' "${DIFF_OUT}"

          # Edit the ALREADY-TAPPED clone's own cask file in place — no
          # re-tap/re-clone needed, brew reads this file directly.
          cp "${REHEARSAL_CASK}" "${TAP_CLONE_DIR}/Casks/codegraph.rb"

          set +e
          INSTALL_OUT="$(brew install --cask "${TAP_NAME}/codegraph" 2>&1)"
          INSTALL_EXIT=$?
          set -e
          echo "${INSTALL_OUT}"
        fi

        if [ "${INSTALL_EXIT}" != "0" ]; then
          echo "::error::brew install --cask failed (exit ${INSTALL_EXIT}) via both file:// and http:// mechanisms — see output above"
          brew untap "${TAP_NAME}" >/dev/null 2>&1 || true
          exit 1
        fi
        CASK_INSTALLED=1
        echo "URL-REWRITE-MECHANISM: ${URL_MECHANISM}"

        # --- Step 5: assert the install's effects POSITIVELY (repo rule
        # 84d1gfpywd) — never just the brew exit code, which the
        # post-install hook's own system_command call could in principle
        # satisfy without having produced anything if this assertion
        # didn't independently re-check.
        MAN_DIR="$(brew --prefix)/share/man/man1"
        if [ ! -f "${MAN_DIR}/codegraph.1" ]; then
          echo "::error::${MAN_DIR}/codegraph.1 does not exist after brew install --cask — the post-install hook's 'codegraph man' invocation did not produce the expected output (D-11's positive-assertion gate would have caught this at install time; this rehearsal independently re-confirms it)"
          exit 1
        fi
        MAN_PAGE_COUNT="$(find "${MAN_DIR}" -maxdepth 1 -type f -name 'codegraph*' | wc -l | tr -d ' ')"
        if [ "${MAN_PAGE_COUNT}" -le 1 ]; then
          echo "::error::only ${MAN_PAGE_COUNT} codegraph man page(s) found in ${MAN_DIR} — want strictly more than 1 (the full command tree, not a single root page)"
          exit 1
        fi

        # UF-5 (T-04-05): independent rehearsal-side confirmation that the
        # man pages above are FRESH — this install's own output, not
        # residue a prior failed install left behind (03-EVIDENCE.md
        # measured 30 such orphans surviving Homebrew's own rollback). The
        # same belt-and-braces relationship this rehearsal already has
        # with BREW-05's raises, now extended to the .goreleaser.yaml hook's
        # own man_pages_before/fresh_man_pages comparison. MAN_BASELINE_MARKER
        # is read HERE and nowhere else.
        FRESH_MAN_PAGE_COUNT="$(find "${MAN_DIR}" -maxdepth 1 -type f -name 'codegraph*.1' -newer "${MAN_BASELINE_MARKER}" | wc -l | tr -d ' ')"
        if [ "${FRESH_MAN_PAGE_COUNT}" -eq 0 ]; then
          echo "::error::0 of ${MAN_PAGE_COUNT} codegraph*.1 page(s) in ${MAN_DIR} are newer than the pre-install baseline marker — the post-install hook's man-page generation did not produce or rewrite anything fresh (UF-5)"
          exit 1
        fi
        echo "fresh man pages (newer than pre-install baseline): ${FRESH_MAN_PAGE_COUNT}/${MAN_PAGE_COUNT}"
        rm -f "${MAN_BASELINE_MARKER}"

        INSTALLED_BIN="$(brew --prefix)/bin/codegraph"
        if [ ! -x "${INSTALLED_BIN}" ]; then
          echo "::error::${INSTALLED_BIN} is not executable after brew install --cask"
          exit 1
        fi
        REPORTED_VERSION="$("${INSTALLED_BIN}" version 2>&1 || true)"
        if [ -z "${REPORTED_VERSION}" ]; then
          echo "::error::${INSTALLED_BIN} version produced no output"
          exit 1
        fi
        echo "installed binary reports: ${REPORTED_VERSION}"

        # v-stripped JSON version, used below to confirm the version-
        # mismatch perturbation's failure message names the REAL reported
        # value (not just the mutated declared one).
        REPORTED_VERSION_JSON="$("${INSTALLED_BIN}" version --json 2>&1 || true)"
        REPORTED_VERSION_STRIPPED="$(printf '%s' "${REPORTED_VERSION_JSON}" | jq -r '.version // empty' | sed 's/^v//')"
        if [ -z "${REPORTED_VERSION_STRIPPED}" ]; then
          echo "::error::could not parse .version from '${INSTALLED_BIN} version --json' output: ${REPORTED_VERSION_JSON}"
          exit 1
        fi
        echo "installed binary reports (JSON, v-stripped): ${REPORTED_VERSION_STRIPPED}"

        # --- Step 5b removed (D-02): the Phase-4 sentinel no longer
        # exists to assert against — Phase 4's detection is structural.
        # OK still accumulates across every assertion below rather than
        # exiting on the first failure, so a single RED run can surface
        # every new behavior's failure at once (this repo's own
        # release:dry-run-signed idiom); Steps 5c, 5d, 6b and 7 all use it.
        OK=1

        # --- Step 5c (BREW-03, D-06): completion files under Homebrew's
        # own completion directories — a hard assertion now that
        # generate_completions_from_executable exists (Task 2).
        BASH_COMPLETION="$(brew --prefix)/etc/bash_completion.d/codegraph"
        ZSH_COMPLETION="$(brew --prefix)/share/zsh/site-functions/_codegraph"
        FISH_COMPLETION="$(brew --prefix)/share/fish/vendor_completions.d/codegraph.fish"
        COMPLETION_COUNT=0
        for f in "${BASH_COMPLETION}" "${ZSH_COMPLETION}" "${FISH_COMPLETION}"; do
          if [ -s "${f}" ]; then COMPLETION_COUNT=$((COMPLETION_COUNT + 1)); fi
        done
        echo "completion files present (non-empty): ${COMPLETION_COUNT}/3"
        if [ "${COMPLETION_COUNT}" != "3" ]; then
          echo "::error::expected all 3 completion files (bash/zsh/fish) present and non-empty after brew install --cask, found ${COMPLETION_COUNT}/3 (checked ${BASH_COMPLETION}, ${ZSH_COMPLETION}, ${FISH_COMPLETION})"
          OK=0
        fi

        # Confirm codegraph completion bash works against the INSTALLED
        # binary (not a locally-built one) — the mechanism BREW-03 relies
        # on, verified directly rather than assumed.
        if ! "${INSTALLED_BIN}" completion bash >/dev/null 2>&1; then
          echo "::error::'${INSTALLED_BIN} completion bash' failed against the installed binary"
          OK=0
        else
          echo "'${INSTALLED_BIN} completion bash' exits 0 and emits output (confirmed against the installed binary)"
        fi

        # --- Step 5d: idempotency (D-11's action text) — Homebrew re-runs
        # post.install on both reinstall and upgrade, and every step the
        # hook takes (directory creation, page generation) must tolerate
        # running again over an existing install. MAN_REINSTALL_MARKER is
        # created HERE, immediately before the reinstall invocation, and
        # is read ONLY by this step's freshness check below (review cycle
        # 3, MEDIUM): reusing MAN_BASELINE_MARKER (the pre-FIRST-install
        # marker) would leave this check pre-satisfied by pages the FIRST
        # install already wrote, whether or not the reinstall wrote
        # anything — a marker created immediately before THIS reinstall
        # removes that dependence entirely.
        echo "==> brew reinstall --cask ${TAP_NAME}/codegraph (idempotency)"
        MAN_REINSTALL_MARKER="$(mktemp)"
        set +e
        REINSTALL_OUT="$(brew reinstall --cask "${TAP_NAME}/codegraph" 2>&1)"
        REINSTALL_EXIT=$?
        set -e
        echo "${REINSTALL_OUT}"
        if [ "${REINSTALL_EXIT}" != "0" ]; then
          echo "::error::brew reinstall --cask exited ${REINSTALL_EXIT} — the hook is not idempotent"
          OK=0
        fi
        if [ ! -f "${MAN_DIR}/codegraph.1" ]; then
          echo "::error::man page missing after reinstall — the hook's directory-creation/write steps are not idempotent"
          OK=0
        fi
        REINSTALL_FRESH_MAN_PAGE_COUNT="$(find "${MAN_DIR}" -maxdepth 1 -type f -name 'codegraph*.1' -newer "${MAN_REINSTALL_MARKER}" | wc -l | tr -d ' ')"
        if [ "${REINSTALL_FRESH_MAN_PAGE_COUNT}" -eq 0 ]; then
          echo "::error::0 codegraph*.1 page(s) in ${MAN_DIR} are newer than the pre-reinstall marker — brew reinstall --cask wrote nothing (UF-5 idempotency check)"
          OK=0
        fi
        echo "SECOND-INSTALL-EVIDENCE exit=${REINSTALL_EXIT} fresh=${REINSTALL_FRESH_MAN_PAGE_COUNT}"
        rm -f "${MAN_REINSTALL_MARKER}"

        # --- Step 6: uninstall now (also registered in the trap for the
        # failure path above).
        echo "==> brew uninstall --cask ${TAP_NAME}/codegraph"
        brew uninstall --cask "${TAP_NAME}/codegraph"
        CASK_INSTALLED=0

        # --- Step 6b (D-07): post-uninstall symmetry — everything the
        # hooks create must be gone; Homebrew does not track hook-written
        # files, so hooks.post.uninstall must remove them explicitly.
        if [ -f "${MAN_DIR}/codegraph.1" ]; then
          echo "::error::${MAN_DIR}/codegraph.1 still exists after brew uninstall --cask — hooks.post.uninstall did not remove the man pages this cask wrote (D-07)"
          OK=0
        fi
        echo "post-uninstall verdict: man pages absent=$([ ! -f "${MAN_DIR}/codegraph.1" ] && echo true || echo false)"

        # --- Step 7 (Task 1 acceptance criterion): a deliberate local
        # perturbation proving D-11's version-equality assertion can
        # actually fire. Reuses the ALREADY-BUILT zip — no rebuild, no
        # re-notarization — hand-editing ONLY the declared `version "..."`
        # line of the already-working rehearsal cask, reusing the SAME
        # tap clone by overwriting its Casks/codegraph.rb in place (the
        # HTTP-fallback path above already establishes this is safe with
        # no re-tap needed).
        VERSION_LINE_NUM="$(grep -n -E '^  version "' "${REHEARSAL_CASK}" | head -n1 | cut -d: -f1)"
        if [ -z "${VERSION_LINE_NUM}" ]; then
          echo "::error::could not find a 'version \"...\"' line in ${REHEARSAL_CASK} to mutate"
          exit 1
        fi
        MUTATED_VERSION="0.0.0-cask-rehearsal-mutated-version"
        MUTATED_CASK="${REHEARSE_DIR}/rehearsal/codegraph.mutated-version.rb"
        cp "${REHEARSAL_CASK}" "${MUTATED_CASK}"
        sed -i.bak "${VERSION_LINE_NUM}s/.*/  version \"${MUTATED_VERSION}\"/" "${MUTATED_CASK}"

        cp "${MUTATED_CASK}" "${TAP_CLONE_DIR}/Casks/codegraph.rb"
        echo "==> brew install --cask ${TAP_NAME}/codegraph (MUTATED version — expect non-zero exit)"
        set +e
        MUTATE_INSTALL_OUT="$(brew install --cask "${TAP_NAME}/codegraph" 2>&1)"
        MUTATE_INSTALL_EXIT=$?
        set -e
        echo "${MUTATE_INSTALL_OUT}"
        if [ "${MUTATE_INSTALL_EXIT}" = "0" ]; then
          echo "::error::brew install --cask exited 0 with a deliberately mismatched declared version (${MUTATED_VERSION}) — D-11's version-equality assertion did not fire"
          OK=0
          brew uninstall --cask "${TAP_NAME}/codegraph" >/dev/null 2>&1 || true
        else
          echo "VERSION-MISMATCH-EVIDENCE exit=${MUTATE_INSTALL_EXIT}"
          if ! printf '%s\n' "${MUTATE_INSTALL_OUT}" | grep -qF "${MUTATED_VERSION}"; then
            echo "::error::the failure message does not quote the mutated declared version (${MUTATED_VERSION}) — want both the reported and declared values named"
            OK=0
          fi
          if ! printf '%s\n' "${MUTATE_INSTALL_OUT}" | grep -qF "${REPORTED_VERSION_STRIPPED}"; then
            echo "::error::the failure message does not quote the actual reported version (${REPORTED_VERSION_STRIPPED})"
            OK=0
          fi
        fi

        # Restore and re-run clean — the paired observation the plan
        # requires ("record both runs").
        cp "${REHEARSAL_CASK}" "${TAP_CLONE_DIR}/Casks/codegraph.rb"
        echo "==> brew install --cask ${TAP_NAME}/codegraph (RESTORED — expect exit 0)"
        set +e
        RESTORE_INSTALL_OUT="$(brew install --cask "${TAP_NAME}/codegraph" 2>&1)"
        RESTORE_INSTALL_EXIT=$?
        set -e
        echo "${RESTORE_INSTALL_OUT}"
        if [ "${RESTORE_INSTALL_EXIT}" != "0" ]; then
          echo "::error::brew install --cask exited ${RESTORE_INSTALL_EXIT} after restoring the correct version — want 0"
          OK=0
        else
          CASK_INSTALLED=1
          echo "==> brew uninstall --cask ${TAP_NAME}/codegraph (version-perturbation cleanup)"
          brew uninstall --cask "${TAP_NAME}/codegraph"
          CASK_INSTALLED=0
        fi
        echo "RESTORE-EVIDENCE exit=${RESTORE_INSTALL_EXIT}"

        # --- Step 7b (Task 2 acceptance criterion): a deliberately wrong
        # executable name in the completions stanza must NOT fail brew
        # install — only warn (RESEARCH.md Pitfall 1, measured here on
        # this machine rather than read from source alone). Reuses the
        # SAME already-built zip and tap clone.
        COMPLETIONS_LINE_NUM="$(grep -n -F 'generate_completions_from_executable "codegraph"' "${REHEARSAL_CASK}" | head -n1 | cut -d: -f1)"
        if [ -z "${COMPLETIONS_LINE_NUM}" ]; then
          echo "::error::could not find a 'generate_completions_from_executable \"codegraph\"' line in ${REHEARSAL_CASK} to mutate"
          OK=0
        else
          MUTATED_COMPLETIONS_CASK="${REHEARSE_DIR}/rehearsal/codegraph.mutated-completions.rb"
          cp "${REHEARSAL_CASK}" "${MUTATED_COMPLETIONS_CASK}"
          sed -i.bak "${COMPLETIONS_LINE_NUM}s/generate_completions_from_executable \"codegraph\"/generate_completions_from_executable \"codegraph-does-not-exist\"/" "${MUTATED_COMPLETIONS_CASK}"

          cp "${MUTATED_COMPLETIONS_CASK}" "${TAP_CLONE_DIR}/Casks/codegraph.rb"
          echo "==> brew install --cask ${TAP_NAME}/codegraph (MUTATED completions executable — expect exit 0 with a warning)"
          set +e
          COMPLETIONS_MUTATE_OUT="$(brew install --cask "${TAP_NAME}/codegraph" 2>&1)"
          COMPLETIONS_MUTATE_EXIT=$?
          set -e
          echo "${COMPLETIONS_MUTATE_OUT}"
          if [ "${COMPLETIONS_MUTATE_EXIT}" != "0" ]; then
            echo "::error::brew install --cask exited ${COMPLETIONS_MUTATE_EXIT} with a deliberately wrong completions executable name — RESEARCH.md Pitfall 1 predicts a WARNING, not a failure; this contradicts that finding and must be recorded as such, not smoothed over"
            OK=0
          else
            CASK_INSTALLED=1
            if ! printf '%s\n' "${COMPLETIONS_MUTATE_OUT}" | grep -qiE 'Failed to generate .* completions|Warning:'; then
              echo "::error::brew install --cask exited 0 but no completions-generation warning was observed in its output — cannot confirm Pitfall 1 fired rather than the completions stanza silently succeeding some other way"
              OK=0
            else
              echo "COMPLETIONS-PERTURBATION-EVIDENCE exit=${COMPLETIONS_MUTATE_EXIT}"
            fi
            echo "==> brew uninstall --cask ${TAP_NAME}/codegraph (completions-perturbation cleanup)"
            brew uninstall --cask "${TAP_NAME}/codegraph"
            CASK_INSTALLED=0
          fi

          # Restore the tap clone's cask file to the correct rehearsal
          # copy so the final untap leaves nothing mutated behind.
          cp "${REHEARSAL_CASK}" "${TAP_CLONE_DIR}/Casks/codegraph.rb"
        fi

        echo "==> brew untap ${TAP_NAME}"
        brew untap "${TAP_NAME}"
        TAP_NAME=""

        if [ "${OK}" != "1" ]; then
          echo "::error::release:rehearse-cask FAILED — see ::error:: lines above"
          exit 1
        fi

        OUTCOME="pass"
        # --- Step 8: machine-parseable evidence, SIGN04-PUBLISH-EVIDENCE
        # convention — schema=3 (D-02: dropped the removed marker's
        # `sentinel=` field, added `fresh_man_pages=` for the UF-5
        # freshness re-check; schema=1/2's pass/fail mismatch is also
        # resolved here rather than carried forward), fixed key order, on
        # the pass path here and on the fail path in the trap above.
        echo "CASK-REHEARSE-EVIDENCE schema=3 snapshot_version=${SNAPSHOT_VERSION} cask_sha256=${CASK_SHA256} url_mechanism=${URL_MECHANISM} man_page_count=${MAN_PAGE_COUNT} fresh_man_pages=${FRESH_MAN_PAGE_COUNT} completion_count=${COMPLETION_COUNT} reported_version=${REPORTED_VERSION} outcome=pass"

        echo "release:rehearse-cask: PASS"

  check:linux-cross-export:
    desc: >-
      Resolve both linux binaries the just-run `goreleaser release`
      (task release:dry-run) produced from dist/artifacts.json and copy
      each to a fixed, documented export path under dist/export/, named
      <goos>-<goarch>. Exists because actions/upload-artifact's `path:`
      input is a literal glob, not a shell — it cannot itself run the
      dist/artifacts.json jq lookup, and GoReleaser writes binaries under
      generated, build-id-nested dist/ paths that are not stable enough to
      hard-code as a glob (review LOW, Codex Plan-01). These export paths
      are a CONTRACT with linux-cross-canary.yml's two exec jobs and with
      check:linux-cross-exec's default CODEGRAPH_BIN path — do not rename
      dist/export/linux-amd64 or dist/export/linux-arm64 without updating
      all three.
    cmds:
      - |
        set -euo pipefail

        if [ ! -f dist/artifacts.json ]; then
          echo "::error::dist/artifacts.json not found — run task release:dry-run first"
          exit 1
        fi

        mkdir -p dist/export

        for pair in linux/amd64 linux/arm64; do
          GOOS="${pair%/*}"
          GOARCH="${pair#*/}"

          BIN=""
          if command -v jq >/dev/null 2>&1; then
            BIN=$(jq -r --arg goos "${GOOS}" --arg goarch "${GOARCH}" \
              '[.[] | select(.type=="Binary" and .extra.Format=="binary" and .goos==$goos and .goarch==$goarch)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            BIN=$(find dist -type f -name codegraph -path "*${GOOS}*${GOARCH}*" 2>/dev/null | head -n1)
          fi
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "::error::could not resolve the ${pair} binary from dist/artifacts.json — run task release:dry-run first"
            exit 1
          fi

          EXPORT="dist/export/${GOOS}-${GOARCH}"
          cp "${BIN}" "${EXPORT}"
          chmod +x "${EXPORT}"
          echo "    ${pair}: ${BIN} -> ${EXPORT}"
        done

  check:linux-cross-exec:
    desc: >-
      Convert "the linker accepted the cross-compiled object" into "the CGo
      tree-sitter parse path works on this OS and arch" — REL-05's real
      evidence bar (review synthesis finding S1). Takes the path to an
      already-built codegraph binary via CODEGRAPH_BIN (default
      dist/export/linux-<GOHOSTARCH>, the check:linux-cross-export
      contract), chmod +x's it, asserts its file(1) ELF machine matches the
      HOST architecture (a wrong-arch artifact fails loudly here instead of
      as a confusing exec-format error a few lines later), then runs the
      binary's real `init` subcommand against the checked-out repository
      working tree and asserts `codegraph status --json`'s exact numeric
      fileCount/nodeCount JSON fields (not rendered text — review
      suggestion, Codex Plan-01) are non-zero. A zero-count graph, an empty
      output, or a bare exit code is a FAIL — that is the whole point of
      the criterion. Emits exactly one machine-parseable REL05-EVIDENCE
      line as the last thing it prints; the target itself asserts both
      counts are non-zero and exits non-zero otherwise, so "a green step
      with no counts" is a structural impossibility.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "check:linux-cross-exec proves REL-05's real-Linux-execution half — it must run on a real Linux host, never emulated (D-02). Dispatch linux-cross-canary.yml, which runs this on namespace-profile-linux-amd64-4x8 / namespace-profile-linux-arm64-4x8."
      - sh: command -v jq
        msg: "jq not found — required to parse codegraph status --json's numeric fields."
    cmds:
      - |
        set -euo pipefail

        HOST_ARCH="$(go env GOHOSTARCH)"
        BIN="${CODEGRAPH_BIN:-dist/export/linux-${HOST_ARCH}}"
        if [ ! -f "${BIN}" ]; then
          echo "::error::codegraph binary not found at ${BIN} — set CODEGRAPH_BIN or run task check:linux-cross-export first"
          exit 1
        fi
        chmod +x "${BIN}"

        HOST_MACHINE="$(uname -m)"
        DESC="$(file -b "${BIN}")"
        echo "    binary: ${BIN}"
        echo "    host uname -m: ${HOST_MACHINE}"
        echo "    file -b: ${DESC}"

        # A wrong-arch artifact must fail loudly HERE, not a few lines
        # below as a confusing exec-format error.
        case "${HOST_MACHINE}:${DESC}" in
          x86_64:*ELF*x86-64*) ELF_MACHINE="x86-64" ;;
          aarch64:*ELF*aarch64*) ELF_MACHINE="aarch64" ;;
          *)
            echo "::error::${BIN} (${DESC}) does not match the host architecture (uname -m: ${HOST_MACHINE})"
            exit 1
            ;;
        esac

        # The real REL-05 evidence: index THIS checked-out repository — a
        # real, multi-language tree — not `--version`, not an exit code.
        REPO_ROOT="$(pwd)"
        rm -rf "${REPO_ROOT}/.codegraph"
        "${BIN}" init "${REPO_ROOT}"

        STATUS_JSON="$("${BIN}" status --json --path "${REPO_ROOT}")"
        FILES=$(printf '%s' "${STATUS_JSON}" | jq -r '.fileCount')
        SYMBOLS=$(printf '%s' "${STATUS_JSON}" | jq -r '.nodeCount')

        if ! [[ "${FILES}" =~ ^[0-9]+$ ]] || [ "${FILES}" -eq 0 ]; then
          echo "::error::codegraph status --json reports fileCount=${FILES} — REL-05 requires a non-zero count, not a green exit code"
          exit 1
        fi
        if ! [[ "${SYMBOLS}" =~ ^[0-9]+$ ]] || [ "${SYMBOLS}" -eq 0 ]; then
          echo "::error::codegraph status --json reports nodeCount=${SYMBOLS} — REL-05 requires a non-zero count, not a green exit code"
          exit 1
        fi

        echo "REL05-EVIDENCE uname=${HOST_MACHINE} elf=${ELF_MACHINE} files=${FILES} symbols=${SYMBOLS}"

  check:goreleaser:
    desc: >-
      Validate .goreleaser.yaml (DIST-01). CHECK CLASS (plan 02-02's
      goreleaser-caller enumeration): `goreleaser check` runs no pipes at
      all — neither notarize: nor signs: executes, so this target never
      reaches Apple or cosign and needs no credentials. It also does NOT
      semantically validate the notarize:/signs: block contents (this
      repo's own config comments already document that `goreleaser check`
      does not validate the artifacts: enum; the same class of blind spot
      is not independently confirmed for notarize: either) — a clean run
      here is config-shape validation only, never evidence that the pipe
      fires correctly.
    cmds:
      - "{{.GO_TOOL}} goreleaser check"

  verify:release-assets:
    desc: >-
      Re-prove REL-06/REL-07/REL-08's asset-set, checksum, cosign, and
      attestation claims against assets RE-DOWNLOADED from the PUBLISHED
      release named by $TAG — never a local dist/ copy, which never passes
      through the real GitHub Releases upload path, the Sigstore
      transparency log, or the attestation subject binding. Driven by
      .github/workflows/post-release-verify.yml's verify-supply-chain job on
      every future release; $TAG must already be resolved and validated
      (that job's resolve-tag dependency), never head_branch re-read here.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:release-assets requires TAG (the resolved, validated release tag) in the environment — post-release-verify.yml's resolve-tag job supplies it via needs.resolve-tag.outputs.tag."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:release-assets requires REPO (owner/repo) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a supply-chain break rather than a missing credential."
      - sh: command -v gh
        msg: "gh CLI not found. This target assumes the runner image ships it (matching GitHub-hosted runner images); locally: brew install gh / apt install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh's --json output with it. CI runner images ship it; locally: brew install jq."
      - sh: command -v cosign
        msg: "cosign not found. This target verifies the published cosign bundle with it. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        echo "verify:release-assets: TAG=${TAG} REPO=${REPO}"

        REQUIRED_RAW_SUFFIXES="linux_amd64 linux_arm64 darwin_amd64 darwin_arm64"

        # --- REQUIRED / ALLOWED / UNCLASSIFIED classification, never a
        # fixed total: this workflow re-fires on every future release, and
        # Phase 2 notarization / Phase 3 Homebrew cask artifacts may
        # legitimately add assets.
        ALLOWED_ASSETS=""
        # ^ intentionally EMPTY in this phase. Adding an asset here is a
        # deliberate edit, not a default — see the header comment in
        # post-release-verify.yml.

        # --- Bounded wait for asset visibility. Even after release.yml
        # reports success, GitHub's release-asset API and CDN can lag
        # briefly. Poll until the REQUIRED set is present, with a hard
        # attempt ceiling — a visibility-lag tolerance, never a substitute
        # for the workflow_run trigger's own ordering guarantee.
        MAX_ATTEMPTS=10
        SLEEP_SECONDS=6
        ATTEMPT=1
        NAMES=""
        while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
          ASSETS_JSON="$(gh release view "${TAG}" --repo "${REPO}" --json assets 2>/dev/null || echo '{"assets":[]}')"
          NAMES="$(printf '%s' "${ASSETS_JSON}" | jq -r '.assets[].name')"
          MISSING=""
          printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_checksums.txt" || MISSING="${MISSING} checksums"
          for suf in ${REQUIRED_RAW_SUFFIXES}; do
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}" || MISSING="${MISSING} raw:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.zip" || MISSING="${MISSING} zip:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.sigstore.json" || MISSING="${MISSING} sig:${suf}"
            printf '%s\n' "${NAMES}" | grep -qx "codegraph_${TAG}_${suf}.spdx.json" || MISSING="${MISSING} sbom:${suf}"
          done
          if [ -z "${MISSING}" ]; then
            echo "verify:release-assets: all required assets visible after ${ATTEMPT} attempt(s)"
            break
          fi
          echo "verify:release-assets: attempt ${ATTEMPT}/${MAX_ATTEMPTS} — still missing:${MISSING}"
          if [ "${ATTEMPT}" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::error::required assets still missing after ${MAX_ATTEMPTS} attempts (${SLEEP_SECONDS}s apart):${MISSING}"
            exit 1
          fi
          ATTEMPT=$((ATTEMPT + 1))
          sleep "${SLEEP_SECONDS}"
        done

        TOTAL_COUNT=$(printf '%s\n' "${NAMES}" | grep -c . || true)
        echo "verify:release-assets: OBSERVED ${TOTAL_COUNT} total published assets (recorded, not asserted — REQUIRED/ALLOWED/UNCLASSIFIED below is the real check)"

        UNCLASSIFIED=""
        for name in ${NAMES}; do
          case "${name}" in
            "codegraph_${TAG}_checksums.txt") continue ;;
          esac
          IS_REQUIRED=0
          for suf in ${REQUIRED_RAW_SUFFIXES}; do
            case "${name}" in
              "codegraph_${TAG}_${suf}"|"codegraph_${TAG}_${suf}.zip"|"codegraph_${TAG}_${suf}.sigstore.json"|"codegraph_${TAG}_${suf}.spdx.json")
                IS_REQUIRED=1
                ;;
            esac
          done
          if [ "${IS_REQUIRED}" = "1" ]; then
            continue
          fi
          IS_ALLOWED=0
          for allowed in ${ALLOWED_ASSETS}; do
            if [ "${name}" = "${allowed}" ]; then
              IS_ALLOWED=1
            fi
          done
          if [ "${IS_ALLOWED}" = "1" ]; then
            continue
          fi
          UNCLASSIFIED="${UNCLASSIFIED} ${name}"
        done
        if [ -n "${UNCLASSIFIED}" ]; then
          echo "::error::UNCLASSIFIED published asset(s), not in REQUIRED or ALLOWED:${UNCLASSIFIED} — an unexpected asset on a supply-chain release is a finding, not noise; add it to ALLOWED_ASSETS deliberately if it is expected"
          exit 1
        fi

        # Exact set equality on REQUIRED, both directions: every required
        # member present exactly once.
        for suf in ${REQUIRED_RAW_SUFFIXES}; do
          for kind_suffix in "" ".zip" ".sigstore.json" ".spdx.json"; do
            NAME="codegraph_${TAG}_${suf}${kind_suffix}"
            COUNT=$(printf '%s\n' "${NAMES}" | grep -cx "${NAME}" || true)
            if [ "${COUNT}" != "1" ]; then
              echo "::error::expected exactly 1 published asset named ${NAME}, found ${COUNT}"
              exit 1
            fi
          done
        done
        CHECKSUMS_COUNT=$(printf '%s\n' "${NAMES}" | grep -cx "codegraph_${TAG}_checksums.txt" || true)
        if [ "${CHECKSUMS_COUNT}" != "1" ]; then
          echo "::error::expected exactly 1 codegraph_${TAG}_checksums.txt, found ${CHECKSUMS_COUNT}"
          exit 1
        fi

        # --- Download every raw + zip payload and the checksums file into a
        # temp dir; assert coverage and sha256sum -c.
        DL_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "codegraph_${TAG}_checksums.txt"
        for suf in ${REQUIRED_RAW_SUFFIXES}; do
          gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
            --pattern "codegraph_${TAG}_${suf}"
          gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
            --pattern "codegraph_${TAG}_${suf}.zip"
        done

        CHECKSUMS_FILE="${DL_DIR}/codegraph_${TAG}_checksums.txt"
        LINE_COUNT=$(wc -l < "${CHECKSUMS_FILE}" | tr -d ' ')
        if [ "${LINE_COUNT}" != "8" ]; then
          echo "::error::${CHECKSUMS_FILE} has ${LINE_COUNT} lines, want exactly 8"
          exit 1
        fi

        # Both-directions set equality between the checksums file's named
        # entries and the 8 downloaded payloads; no sidecar or
        # self-reference line (D-12).
        CHECKSUM_NAMES="$(awk '{print $2}' "${CHECKSUMS_FILE}" | sed 's/^\*//' | sort)"
        DOWNLOADED_NAMES="$(cd "${DL_DIR}" && ls -1 | grep -v "^codegraph_${TAG}_checksums\.txt$" | sort)"
        if [ "${CHECKSUM_NAMES}" != "${DOWNLOADED_NAMES}" ]; then
          echo "::error::checksums file's named entries do not set-equal the 8 downloaded payloads"
          echo "checksums names: ${CHECKSUM_NAMES}"
          echo "downloaded names: ${DOWNLOADED_NAMES}"
          exit 1
        fi
        if printf '%s\n' "${CHECKSUM_NAMES}" | grep -Eq '\.(sigstore|spdx)\.json$|_checksums\.txt$'; then
          echo "::error::checksums file names a sidecar or itself — D-12 exclusion violated"
          exit 1
        fi

        (cd "${DL_DIR}" && sha256sum -c "$(basename "${CHECKSUMS_FILE}")")

        # --- Download the cosign bundle into a SEPARATE directory, never
        # into DL_DIR. DL_DIR's contents are themselves an assertion: the
        # set-equality check above compares the checksums file's named
        # entries against `ls DL_DIR`, so DL_DIR must hold exactly the 8
        # payloads and nothing else. Downloading the sidecar into it would
        # trade this target's original bug (cosign reading a .sigstore.json
        # that was never downloaded — the v0.5.1 post-release-verify failure)
        # for a spurious set-equality failure. Two temp dirs, two meanings.
        SIG_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}" "${SIG_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${SIG_DIR}" \
          --pattern "codegraph_${TAG}_linux_amd64.sigstore.json"
        if [ ! -f "${SIG_DIR}/codegraph_${TAG}_linux_amd64.sigstore.json" ]; then
          echo "::error::cosign bundle codegraph_${TAG}_linux_amd64.sigstore.json was not downloaded — cannot verify the signature"
          exit 1
        fi

        # --- cosign verify-blob, VERBATIM flags from docs/RELEASE.md § a —
        # a looser regex here would prove less than the published
        # instruction claims (REL-08 criterion 3, D-11a).
        cosign verify-blob \
          --bundle "${SIG_DIR}/codegraph_${TAG}_linux_amd64.sigstore.json" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp \
            '^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^[:space:]]*$' \
          "${DL_DIR}/codegraph_${TAG}_linux_amd64"
        echo "verify:release-assets: cosign verify-blob: Verified OK"

        # --- Attestation verification, the command plan 01-04 selected.
        gh attestation verify "${DL_DIR}/codegraph_${TAG}_linux_amd64" -R "${REPO}"

        echo "verify:release-assets: PASS — checksums, cosign, and attestation all verified against re-downloaded published assets for ${TAG}"

  verify:self-upgrade:
    desc: >-
      Re-prove REL-08's self-upgrade claim (D-08): a genuinely shipped PRIOR
      release binary self-upgrades via `codegraph upgrade "$TAG"` to the
      published release named by $TAG, and the resulting binary's sha256
      equals the published asset's — asserted by byte identity, never an
      exit code. Driven by .github/workflows/post-release-verify.yml's
      self-upgrade matrix (darwin/arm64, linux/amd64) on every future
      release.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:self-upgrade requires TAG (the resolved, validated release tag) in the environment — post-release-verify.yml's resolve-tag job supplies it via needs.resolve-tag.outputs.tag."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:self-upgrade requires REPO (owner/repo) in the environment."
      - sh: '[ -n "${GOOS:-}" ]'
        msg: "GOOS is not set. verify:self-upgrade requires GOOS (darwin or linux) in the environment."
      - sh: '[ -n "${GOARCH:-}" ]'
        msg: "GOARCH is not set. verify:self-upgrade requires GOARCH (amd64 or arm64) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a supply-chain break rather than a missing credential."
      - sh: command -v gh
        msg: "gh CLI not found. This target assumes the runner image ships it (matching GitHub-hosted runner images); locally: brew install gh / apt install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh api output with it. CI runner images ship it; locally: brew install jq."
      - sh: command -v cosign
        msg: "cosign not found. This target verifies the downloaded prior release binary's cosign bundle with it BEFORE making the file executable. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        echo "verify:self-upgrade: TAG=${TAG} REPO=${REPO} GOOS=${GOOS} GOARCH=${GOARCH}"

        # macOS ships no sha256sum by default (BSD userland); shasum -a 256
        # is the native equivalent. Prefer sha256sum when present (Linux),
        # fall back to shasum (darwin) — this target's matrix runs on both.
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 1. Resolve the PRIOR release by SEMANTIC-VERSION PREDECESSOR
        # ORDER, never gh's publication-chronology list order (cycle-2
        # review MEDIUM/Codex) — a historical dispatch of an old $TAG must
        # not select a release NEWER than $TAG, and an RC must not select
        # the wrong stable/prerelease neighbour.
        RELEASES_JSON="$(gh api "repos/${REPO}/releases" --paginate)"

        DRAFT_TAGS="$(printf '%s' "${RELEASES_JSON}" | jq -r '.[] | select(.draft == true) | .tag_name')"
        if [ -n "${DRAFT_TAGS}" ]; then
          echo "verify:self-upgrade: dropping draft release(s) — a draft has no downloadable asset and cannot be upgraded from:"
          printf '%s\n' "${DRAFT_TAGS}" | sed 's/^/    /'
        fi
        NON_DRAFT_JSON="$(printf '%s' "${RELEASES_JSON}" | jq -c '[.[] | select(.draft == false)]')"

        # Drop releases carrying ZERO downloadable assets, for exactly the
        # reason drafts are dropped above: you cannot upgrade FROM a release
        # that ships nothing. This is not hypothetical — v0.5.0 published
        # empty (the release pipeline aborted on its own version assertion
        # before goreleaser ran), and D-07 keeps such a release in the list
        # permanently rather than deleting it. Without this filter the
        # predecessor search happily selects it and then dies on
        # `gh release download` with "no assets to download", which reads as
        # a supply-chain failure when it is really "that release is empty".
        EMPTY_TAGS="$(printf '%s' "${NON_DRAFT_JSON}" | jq -r '.[] | select((.assets | length) == 0) | .tag_name')"
        if [ -n "${EMPTY_TAGS}" ]; then
          echo "verify:self-upgrade: dropping release(s) with no downloadable assets — cannot upgrade from an empty release:"
          printf '%s\n' "${EMPTY_TAGS}" | sed 's/^/    /'
        fi
        NON_DRAFT_JSON="$(printf '%s' "${NON_DRAFT_JSON}" | jq -c '[.[] | select((.assets | length) > 0)]')"

        SEMVER_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

        TAG_PARSED="$(printf '%s' "${TAG}" | jq -R -c \
          'capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9A-Za-z.-]+))?$")')"
        if [ -z "${TAG_PARSED}" ] || [ "${TAG_PARSED}" = "null" ]; then
          echo "::error::TAG '${TAG}' under verification does not parse as major.minor.patch[-prerelease] — cannot resolve a predecessor"
          exit 1
        fi
        TAG_MAJOR="$(printf '%s' "${TAG_PARSED}" | jq -r '.major | tonumber')"
        TAG_MINOR="$(printf '%s' "${TAG_PARSED}" | jq -r '.minor | tonumber')"
        TAG_PATCH="$(printf '%s' "${TAG_PARSED}" | jq -r '.patch | tonumber')"
        TAG_PRE="$(printf '%s' "${TAG_PARSED}" | jq -r '.pre // ""')"

        UNPARSEABLE="$(printf '%s' "${NON_DRAFT_JSON}" | jq -r --arg re "${SEMVER_RE}" \
          '[.[] | select(.tag_name | test($re) | not) | .tag_name] | .[]')"
        if [ -n "${UNPARSEABLE}" ]; then
          echo "verify:self-upgrade: skipping unparseable tag(s) (not major.minor.patch[-prerelease]), never silently ignored:"
          printf '%s\n' "${UNPARSEABLE}" | sed 's/^/    /'
        fi

        PARSED_JSON="$(printf '%s' "${NON_DRAFT_JSON}" | jq -c \
          '[.[] | . as $r
             | ($r.tag_name | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(-(?<pre>[0-9A-Za-z.-]+))?$")?) as $p
             | select($p != null)
             | {tag: $r.tag_name, major: ($p.major|tonumber), minor: ($p.minor|tonumber), patch: ($p.patch|tonumber), pre: ($p.pre // ""), api_prerelease: ($r.prerelease == true)}]')"

        # Filter to versions strictly LESS THAN $TAG under semver ordering.
        # A prerelease sorts below its own release (1.0.0-rc1 < 1.0.0).
        # Comparing two prereleases of the IDENTICAL major.minor.patch
        # falls back to a lexical comparison of the prerelease string — a
        # documented, accepted simplification; no full semver-precedence
        # library is available in this shell/jq environment.
        LESS_THAN_JSON="$(printf '%s' "${PARSED_JSON}" | jq -c \
          --argjson tmaj "${TAG_MAJOR}" --argjson tmin "${TAG_MINOR}" --argjson tpat "${TAG_PATCH}" --arg tpre "${TAG_PRE}" \
          '[.[] | select(
              (.major < $tmaj)
              or (.major == $tmaj and .minor < $tmin)
              or (.major == $tmaj and .minor == $tmin and .patch < $tpat)
              or (.major == $tmaj and .minor == $tmin and .patch == $tpat and .pre != "" and $tpre == "")
              or (.major == $tmaj and .minor == $tmin and .patch == $tpat and .pre != "" and $tpre != "" and .pre < $tpre)
           )]')"
        CANDIDATE_COUNT="$(printf '%s' "${LESS_THAN_JSON}" | jq 'length')"

        # Prerelease policy (a decision, not an implementation detail):
        # when $TAG is a stable version (no prerelease component), prefer
        # the greatest STABLE predecessor and fall back to a prerelease
        # predecessor only if no stable one exists. When $TAG is itself a
        # prerelease, allow either.
        #
        # "Stable" means BOTH no semver prerelease component AND not flagged
        # prerelease by the GitHub API. Checking only `.pre == ""` was a real
        # bug: v0.5.0 carries no semver suffix, so it read as stable and was
        # selected as v0.5.1's predecessor even though it is API-flagged
        # prerelease precisely BECAUSE it shipped empty. A maintainer who
        # marks a release prerelease is making exactly the statement this
        # policy needs to hear, and the tag string cannot carry it.
        POLICY="prerelease"
        FILTERED_JSON="${LESS_THAN_JSON}"
        if [ -z "${TAG_PRE}" ]; then
          STABLE_ONLY_JSON="$(printf '%s' "${LESS_THAN_JSON}" | jq -c '[.[] | select(.pre == "" and .api_prerelease == false)]')"
          STABLE_COUNT="$(printf '%s' "${STABLE_ONLY_JSON}" | jq 'length')"
          if [ "${STABLE_COUNT}" -gt 0 ]; then
            FILTERED_JSON="${STABLE_ONLY_JSON}"
            POLICY="stable"
          fi
        fi
        FILTERED_COUNT="$(printf '%s' "${FILTERED_JSON}" | jq 'length')"
        if [ "${FILTERED_COUNT}" -eq 0 ]; then
          echo "::error::no prior release exists to upgrade FROM (${CANDIDATE_COUNT} strictly-earlier candidate(s) before the prerelease policy filter) — this reads as 'no prior release', not a supply-chain failure. The first release ever cut has nothing to upgrade from."
          exit 1
        fi

        # Select the MAXIMUM of what remains: sort ascending by
        # [major, minor, patch, (stable > prerelease at the same base), pre],
        # take the last.
        PRIOR_TAG="$(printf '%s' "${FILTERED_JSON}" | jq -r \
          '[.[] | . + {rank: (if .pre == "" then 1 else 0 end)}] | sort_by([.major, .minor, .patch, .rank, .pre]) | last | .tag')"

        echo "PRIOR-RELEASE tag=${PRIOR_TAG} policy=${POLICY} candidates=${FILTERED_COUNT}"

        # --- 2. Download the prior release's raw asset for
        # GOOS/GOARCH — a genuinely shipped binary, which is the whole
        # point of the claim. TWO SEPARATE temp dirs (DL_DIR for the binary,
        # SIG_DIR for its cosign bundle) — the same two-temp-dirs discipline
        # verify:release-assets and verify:notarized-suite already use, so
        # the sidecar never lands next to the binary it signs.
        #
        # Ordering is load-bearing, not stylistic (review cycle 2, LOW): the
        # trap is installed IMMEDIATELY after the FIRST mktemp, before the
        # SECOND directory is created. The naive reading — create both
        # directories, then install one trap — is the one that leaks: if the
        # second mktemp fails under `set -e`, DL_DIR is left on disk with no
        # trap installed to remove it. cleanup() references SIG_DIR via
        # ${SIG_DIR:-} so it is safe to run before that variable is set.
        DL_DIR="$(mktemp -d)"
        cleanup() { rm -rf "${DL_DIR}" "${SIG_DIR:-}"; }
        trap cleanup EXIT
        SIG_DIR="$(mktemp -d)"

        PRIOR_ASSET="codegraph_${PRIOR_TAG}_${GOOS}_${GOARCH}"
        PRIOR_SIG_NAME="${PRIOR_ASSET}.sigstore.json"
        gh release download "${PRIOR_TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "${PRIOR_ASSET}"
        PRIOR_BIN="${DL_DIR}/${PRIOR_ASSET}"

        # gh release download can exit 0 having matched nothing — this
        # repository's own v0.5.1 post-release break. Hard-fail by name,
        # naming the expected bundle filename, rather than letting cosign
        # fail confusingly against an absent file.
        gh release download "${PRIOR_TAG}" --repo "${REPO}" --dir "${SIG_DIR}" \
          --pattern "${PRIOR_SIG_NAME}"
        PRIOR_SIG="${SIG_DIR}/${PRIOR_SIG_NAME}"
        if [ ! -f "${PRIOR_SIG}" ]; then
          echo "::error::cosign bundle ${PRIOR_SIG_NAME} was not downloaded — cannot verify the prior release binary before it is executed"
          exit 1
        fi

        # --- VERIFY BEFORE EXECUTING (T-04-15), the identical ordering
        # constraint verify:notarized-suite already enforces for the same
        # reason: cosign verify-blob runs BEFORE chmod +x, with the SAME
        # issuer and certificate-identity flags verify:release-assets and
        # verify:notarized-suite already use — never a looser pattern, which
        # would prove less than the published instruction claims. This
        # target's ordering is independent of any sibling CI job:
        # post-release-verify.yml's self-upgrade job deliberately carries no
        # `needs: verify-supply-chain` (a reporting-independence choice), so
        # execution safety must live inside this target, not depend on a
        # sibling job finishing first.
        cosign verify-blob \
          --bundle "${PRIOR_SIG}" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp \
            '^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^[:space:]]*$' \
          "${PRIOR_BIN}"
        echo "SELF-UPGRADE-VERIFY-EVIDENCE prior_tag=${PRIOR_TAG} bundle=${PRIOR_SIG_NAME} verdict=verified"

        # --- Only NOW does the file become executable.
        chmod +x "${PRIOR_BIN}"
        PRIOR_SHA256="$(sha256_of "${PRIOR_BIN}")"

        # --- Belt-and-braces: hard-fail BY NAME, before execution, if the
        # file is missing or not executable after download+chmod — the same
        # re-check verify:notarized-suite carries.
        if [ ! -f "${PRIOR_BIN}" ] || [ ! -x "${PRIOR_BIN}" ]; then
          echo "::error::${PRIOR_BIN} is missing or not executable after download+chmod — refusing to execute a file that cannot be the verified prior release binary"
          exit 1
        fi

        # --- 3. Run the real codegraph upgrade invocation against it, with
        # $TAG EXPLICIT as the positional version argument — an
        # argument-less invocation would instead resolve GitHub's
        # timing-sensitive "latest" endpoint (internal/upgrade/release.go)
        # and could silently verify the wrong release under concurrent tag
        # activity (review MEDIUM, Codex Plan-05).
        "${PRIOR_BIN}" upgrade "${TAG}"
        UPGRADED_SHA256="$(sha256_of "${PRIOR_BIN}")"

        # --- 4. Assert byte identity against the NEW release's raw asset
        # for the same platform, re-downloaded independently — not
        # "upgrade exited 0".
        NEW_ASSET="codegraph_${TAG}_${GOOS}_${GOARCH}"
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" \
          --pattern "${NEW_ASSET}" --clobber
        PUBLISHED_SHA256="$(sha256_of "${DL_DIR}/${NEW_ASSET}")"

        echo "SELF-UPGRADE-EVIDENCE goos=${GOOS} goarch=${GOARCH} prior_tag=${PRIOR_TAG} prior_sha256=${PRIOR_SHA256} upgraded_sha256=${UPGRADED_SHA256} published_sha256=${PUBLISHED_SHA256}"

        if [ "${UPGRADED_SHA256}" != "${PUBLISHED_SHA256}" ]; then
          echo "::error::upgraded binary sha256 (${UPGRADED_SHA256}) does not equal the published ${TAG} asset's sha256 (${PUBLISHED_SHA256})"
          exit 1
        fi

        # --- 5. Assert the upgraded binary reports the new version.
        REPORTED_VERSION="$("${PRIOR_BIN}" version --json | jq -r '.version')"
        if [ "${REPORTED_VERSION}" != "${TAG}" ]; then
          echo "::error::upgraded binary reports version '${REPORTED_VERSION}', want '${TAG}'"
          exit 1
        fi

        echo "verify:self-upgrade: PASS — ${GOOS}/${GOARCH} self-upgraded from ${PRIOR_TAG} to ${TAG} byte-identically to the published asset"

  verify:gatekeeper:
    desc: >-
      SIGN-03's tracer: an Apple Gatekeeper verdict on one PUBLISHED darwin
      release asset, never a local dist/ copy and never a locally rebuilt
      binary. The single definition both the SIGN-03 RED baseline (plan
      02-01 Task 2/3, against v0.5.1's deliberately un-notarized assets) and
      the post-release GREEN check (plan 02-06) call — GATEKEEPER_EXPECT
      selects which. Per D-19 (LOCKED, 02-RESEARCH.md) the oracle is
      `spctl -a -vv -t install`, NEVER `-t exec` — `-t exec` rejects a bare
      Mach-O on SHAPE before notarization is considered at all, which is why
      it would stay red after notarization for a completely different
      reason than the RED baseline's. The verdict is the EXIT STATUS alone
      (0=accepted, 3=rejected), never a substring search — "accepted"
      matches inside "rejected (the code is valid but does not seem to be
      an app)" and inside origin= lines. `syspolicy_check distribution` is
      recorded as a NON-GATING observation only: its verdict is fatal for
      anything unstapled, and stapling is permanently out of scope
      (D-16/DIST-06), so gating on it would be a gate that can never pass.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:gatekeeper requires TAG (the release tag whose darwin asset is assessed) in the environment — e.g. TAG=v0.5.1 for the RED baseline."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:gatekeeper requires REPO (owner/repo, e.g. seanb4t/codegraph-go) in the environment."
      - sh: '[ -n "${GOOS:-}" ]'
        msg: "GOOS is not set. verify:gatekeeper requires GOOS (darwin) in the environment — the asset name is codegraph_${TAG}_${GOOS}_${GOARCH}, matching internal/upgrade.releaseAssetName's contract."
      - sh: '[ -n "${GOARCH:-}" ]'
        msg: "GOARCH is not set. verify:gatekeeper requires GOARCH (amd64 or arm64) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a Gatekeeper break rather than a missing credential."
      - sh: '[ -n "${GATEKEEPER_EXPECT:-}" ]'
        msg: "GATEKEEPER_EXPECT is not set. Must be one of: accepted, rejected. The RED baseline (plan 02-01) uses rejected against v0.5.1's un-notarized assets; the post-release GREEN check (plan 02-06) uses accepted."
      - sh: '[ "${GATEKEEPER_EXPECT:-}" = "accepted" ] || [ "${GATEKEEPER_EXPECT:-}" = "rejected" ]'
        msg: "GATEKEEPER_EXPECT is set to a value other than 'accepted' or 'rejected'. An unvalidated value would fail safe but confusingly, turning every observation into a mismatch regardless of what spctl actually reports — value must be exactly one of the two allowed strings."
      - sh: '[ "$(go env GOHOSTOS)" = "darwin" ]'
        msg: "verify:gatekeeper must run on a native darwin host — spctl/syspolicy_check/xattr are macOS-only and this is not a build toolchain that can be cross-compiled around. Run it on macOS locally, or dispatch it on namespace-profile-macos-6x14-tahoe, the CI runner class release.yml and post-release-verify.yml use."
      - sh: command -v gh
        msg: "gh CLI not found. This target downloads the published release asset with it. CI runner images ship it; locally: brew install gh."
      - sh: command -v jq
        msg: "jq not found. This target parses gh release view --json assets output with it, to cross-check GitHub's own recorded per-asset digest against the recomputed sha256 — the provenance strengthening that turns 'the bytes I assessed' into 'the bytes the release serves'. CI runner images ship it; locally: brew install jq."
      - sh: command -v xattr
        msg: "xattr not found. This target applies and reads back the com.apple.quarantine extended attribute with it. macOS built-in — if missing, the host is misconfigured."
      - sh: command -v spctl
        msg: "spctl not found. This target's oracle IS spctl -a -vv -t install (D-19) — macOS built-in. If missing, the host is misconfigured."
    cmds:
      - |
        set -euo pipefail

        echo "verify:gatekeeper: TAG=${TAG} REPO=${REPO} GOOS=${GOOS} GOARCH=${GOARCH} expect=${GATEKEEPER_EXPECT}"

        # macOS ships no sha256sum by default (BSD userland); shasum -a 256
        # is the native equivalent — mirrors verify:self-upgrade's sha256_of.
        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        # --- 1. Resolve the asset name: the raw binary, matching
        # internal/upgrade.releaseAssetName's contract. Never the .zip.
        ASSET_NAME="codegraph_${TAG}_${GOOS}_${GOARCH}"

        # --- 2. Read the asset's metadata from the published release
        # listing and extract its recorded digest. An asset absent from the
        # listing is a hard failure naming the asset and the tag.
        ASSETS_JSON="$(gh release view "${TAG}" --repo "${REPO}" --json assets)"
        ASSET_ENTRY="$(printf '%s' "${ASSETS_JSON}" | jq -c --arg name "${ASSET_NAME}" '[.assets[] | select(.name == $name)] | first // empty')"
        if [ -z "${ASSET_ENTRY}" ]; then
          echo "::error::asset ${ASSET_NAME} not found among ${TAG}'s published assets — cannot assess an asset that was never published"
          exit 1
        fi
        GH_DIGEST_RAW="$(printf '%s' "${ASSET_ENTRY}" | jq -r '.digest // empty')"
        GH_DIGEST="${GH_DIGEST_RAW#sha256:}"

        # --- 3. Download it with gh release download into a mktemp -d
        # cleaned by a single trap. Downloading is not optional and a local
        # dist/ copy is never acceptable — plan 01-05's false negatives came
        # from a verifier that read an artifact it never downloaded.
        DL_DIR="$(mktemp -d)"
        trap 'rm -rf "${DL_DIR}"' EXIT
        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" --pattern "${ASSET_NAME}"
        ASSET_PATH="${DL_DIR}/${ASSET_NAME}"

        # --- 4. Recompute the sha256 and cross-check it against GitHub's
        # recorded digest from step 2 — the provenance cross-check that
        # makes the assessed bytes identifiable. A mismatch is always a
        # hard failure. A MISSING digest is bound to GATEKEEPER_EXPECT
        # (deliberate asymmetry, not an inconsistency):
        #   - expect=accepted (GREEN, plan 02-06's CI job): a missing or
        #     malformed digest is a HARD FAILURE. GREEN is the claim that
        #     carries weight, so its provenance must be established, not
        #     assumed. Sentinel-and-continue on a verification step is this
        #     repository's single most-repeated failure class.
        #   - expect=rejected (RED, this plan's baseline against a
        #     preserved older release, where the API may genuinely predate
        #     per-asset digests): record the sentinel and continue, but
        #     WARN loudly and set digest_match=unknown so the downgrade is
        #     visible in the evidence rather than silent.
        SHA256="$(sha256_of "${ASSET_PATH}")"
        DIGEST_MATCH="unknown"
        if [ -n "${GH_DIGEST}" ]; then
          if [ "${GH_DIGEST}" = "${SHA256}" ]; then
            DIGEST_MATCH="true"
          else
            DIGEST_MATCH="false"
          fi
        fi
        if [ "${DIGEST_MATCH}" = "false" ]; then
          echo "::error::sha256 mismatch: downloaded ${ASSET_NAME} hashes to ${SHA256}, GitHub's recorded digest is ${GH_DIGEST} — the bytes assessed are NOT provably the bytes the release serves"
          exit 1
        fi
        if [ "${DIGEST_MATCH}" = "unknown" ]; then
          if [ "${GATEKEEPER_EXPECT}" = "accepted" ]; then
            echo "::error::GitHub's recorded digest for ${ASSET_NAME} is unavailable on the GREEN path (GATEKEEPER_EXPECT=accepted) — provenance cannot be established, and GREEN is the claim that carries weight. This is a HARD FAILURE, not sentinel-and-continue (deliberate D-19/plan-02-01 asymmetry, stated here rather than left as an inconsistency)."
            exit 1
          fi
          echo "::warning::GitHub's recorded digest for ${ASSET_NAME} is unavailable on the RED path (GATEKEEPER_EXPECT=rejected — a preserved older release whose API may predate per-asset digests). Recording digest_match=unknown and continuing. Deliberate scope decision, not an oversight."
        fi

        # --- 5. Assess the file BEFORE applying any xattr and record that
        # verdict on its own labelled line as the explicit NON-EVIDENCE
        # control — the observation that makes "spctl on a
        # never-quarantined file" visibly distinct rather than silently
        # conflated with the real verdict below.
        set +e
        PRE_XATTR_OUT="$(spctl -a -vv -t install "${ASSET_PATH}" 2>&1)"
        PRE_XATTR_EXIT=$?
        set -e
        echo "GATEKEEPER-PRE-XATTR-CONTROL (NON-EVIDENCE — file was never quarantined at this point) exit=${PRE_XATTR_EXIT}"
        echo "${PRE_XATTR_OUT}"

        # --- 6. Apply a SYNTHETIC com.apple.quarantine xattr — Apple's
        # documented four-field flags;timestamp;agent;event-uuid form,
        # flags=0081 (downloaded-and-first-launch). Built in plain shell,
        # via printf/uuidgen — no Go-template braces anywhere in this
        # target, for the reason release:dry-run-signed has none: `task`
        # renders every cmds: string through Go text/template BEFORE the
        # shell sees it, and a stray double-brace template marker here
        # would be eaten (the defect that shipped v0.5.0 empty). Called
        # SYNTHETIC in every comment, label and evidence field — it is a
        # simulation until Task 2's checkpoint confirms it behaves like an
        # actual browser download; naming it anything else before that
        # comparison would prejudge the one open question (assumption A2)
        # this plan exists to settle.
        QUARANTINE_HEX_TS="$(printf '%x' "$(date +%s)")"
        QUARANTINE_UUID="$(uuidgen)"
        QUARANTINE_VALUE="0081;${QUARANTINE_HEX_TS};Safari;${QUARANTINE_UUID}"
        xattr -w com.apple.quarantine "${QUARANTINE_VALUE}" "${ASSET_PATH}"

        # --- 7. Read the attribute back and HARD-FAIL if it is absent or
        # empty. An assessment that runs without this confirmation is not
        # evidence, and the target must refuse to produce one.
        XATTR_READBACK="$(xattr -p com.apple.quarantine "${ASSET_PATH}" 2>/dev/null || true)"
        if [ -z "${XATTR_READBACK}" ]; then
          echo "::error::com.apple.quarantine xattr (SYNTHETIC) is absent or empty on ${ASSET_PATH} immediately after writing it — an assessment without this confirmation is not evidence, refusing to run spctl"
          exit 1
        fi
        XATTR_PRESENT="true"
        echo "GATEKEEPER-XATTR-SYNTHETIC value=${QUARANTINE_VALUE} readback=${XATTR_READBACK}"

        # --- 8. Run the D-19 oracle: spctl -a -vv -t install (never -t
        # exec — see this target's desc: for why). Capture stdout, stderr
        # (spctl writes its verdict to stderr) and exit status without
        # letting set -e abort the run — a rejection is the expected
        # outcome on the RED path and must be reported, not crashed on.
        set +e
        SPCTL_OUT="$(spctl -a -vv -t install "${ASSET_PATH}" 2>&1)"
        SPCTL_EXIT=$?
        set -e
        echo "GATEKEEPER-SPCTL exit=${SPCTL_EXIT}"
        echo "${SPCTL_OUT}"

        # --- 9. Derive the observed verdict from the EXIT STATUS ALONE: 0
        # is accepted, 3 is rejected, anything else is unclassifiable and
        # therefore a hard failure — NEVER a grep/case over the output
        # text, which would classify wrongly (a substring search for
        # "accepted" matches inside "rejected (the code is valid but does
        # not seem to be an app)" and inside origin= lines), not merely
        # weakly. Measured on macOS 27.0 while the CI runner is
        # Tahoe-class, so a future version drift is anticipated: it
        # surfaces here as a loud, unclassifiable-exit failure, never a
        # silently wrong verdict.
        OK=1
        case "${SPCTL_EXIT}" in
          0) OBSERVED="accepted" ;;
          3) OBSERVED="rejected" ;;
          *)
            echo "::error::spctl exit status ${SPCTL_EXIT} is neither 0 (accepted) nor 3 (rejected) — unclassifiable, hard failure"
            OBSERVED="unclassifiable"
            OK=0
            ;;
        esac

        # source_assertion is captured SEPARATELY from observed: whether
        # the output names the notarized-Developer-ID source string. NOT
        # part of the verdict — a deliberate SECOND, INDEPENDENT assertion,
        # so rejecting exit 0 when the source line is absent does not read
        # as a contradiction of "exit status is the oracle."
        if printf '%s' "${SPCTL_OUT}" | grep -q 'source=Notarized Developer ID'; then
          SOURCE_ASSERTION="pass"
        else
          SOURCE_ASSERTION="fail"
        fi

        # Truth table (mechanical, not left to interpretation): only an
        # off-diagonal pair fails.
        #   observed=accepted -> source_assertion MUST be pass
        #   observed=rejected -> source_assertion MUST be fail (the
        #     notarized-source line is legitimately ABSENT on the RED
        #     path, and its absence is correct — a naive "must be pass"
        #     reading would break the phase's first gate)
        SOURCE_MISMATCH=0
        if [ "${OBSERVED}" = "accepted" ] && [ "${SOURCE_ASSERTION}" != "pass" ]; then
          SOURCE_MISMATCH=1
        elif [ "${OBSERVED}" = "rejected" ] && [ "${SOURCE_ASSERTION}" != "fail" ]; then
          SOURCE_MISMATCH=1
        fi
        if [ "${SOURCE_MISMATCH}" = "1" ]; then
          echo "::error::SOURCE-ASSERTION-MISMATCH observed=${OBSERVED} source_assertion=${SOURCE_ASSERTION} — two independent assertions (observed from exit status alone; source_assertion from output text) disagree off the required diagonal"
          OK=0
        fi

        # --- 10. Run syspolicy_check distribution and record its exit
        # status and output verbatim under a labelled line. It MUST NOT
        # gate: D-19 removes it as a gating check because its Fatal
        # verdict is definitionally unreachable while stapling is out of
        # scope (D-16/DIST-06), and a gate that can never pass is one of
        # the two failure families this phase exists to close. If the
        # binary is absent, record the sentinel and continue.
        if command -v syspolicy_check >/dev/null 2>&1; then
          set +e
          SYSPOLICY_OUT="$(syspolicy_check distribution "${ASSET_PATH}" 2>&1)"
          SYSPOLICY_EXIT=$?
          set -e
        else
          SYSPOLICY_OUT="syspolicy_check not found on this host"
          SYSPOLICY_EXIT="not-found"
        fi
        echo "GATEKEEPER-SYSPOLICY-CHECK (NON-GATING — see this target's desc: for why gating on it is forbidden) exit=${SYSPOLICY_EXIT}"
        echo "${SYSPOLICY_OUT}"

        # --- 11. Compare the observed verdict against GATEKEEPER_EXPECT.
        if [ "${OBSERVED}" != "${GATEKEEPER_EXPECT}" ]; then
          echo "::error::observed verdict '${OBSERVED}' does not match GATEKEEPER_EXPECT='${GATEKEEPER_EXPECT}'"
          OK=0
        fi

        # --- 12. Emit the evidence line as the LAST line printed, on BOTH
        # the pass and the fail path — a RED observation is the most
        # valuable output this target can produce. schema=1 first, fixed
        # key order, sentinels for anything unavailable (never omitted).
        echo "GATEKEEPER-EVIDENCE schema=1 tag=${TAG} goos=${GOOS} goarch=${GOARCH} sha256=${SHA256} gh_digest=${GH_DIGEST:-not-found} digest_match=${DIGEST_MATCH} expect=${GATEKEEPER_EXPECT} observed=${OBSERVED} exit=${SPCTL_EXIT} xattr_present=${XATTR_PRESENT} source_assertion=${SOURCE_ASSERTION} syspolicy_exit=${SYSPOLICY_EXIT}"

        if [ "${OK}" != "1" ]; then
          exit 1
        fi

        echo "verify:gatekeeper: PASS — observed=${OBSERVED} matches GATEKEEPER_EXPECT=${GATEKEEPER_EXPECT}"

  verify:notarized-suite:
    desc: >-
      ROADMAP criterion 4's proof: runs the REAL test/integration and
      test/wireoracle suites against the RE-DOWNLOADED, NOTARIZED published
      darwin binary named by $TAG/$GOOS/$GOARCH — never a locally rebuilt
      one (D-10, plan 02-03's CODEGRAPH_TEST_BIN seam). test/wireoracle IS
      IN SCOPE (02-03's recorded verdict: normalize.go's serverVersion rule
      already erases the differing version field, so a release-shaped
      binary passed all 27 frozen scenarios with zero transcript changes).
      Integrity is verified — cosign verify-blob, the SAME issuer and
      certificate-identity flags verify:release-assets already uses — BEFORE
      the binary is ever made executable, never after: parallel independent
      CI jobs give no ordering guarantee, so a tampered asset would
      otherwise be executed even if a sibling supply-chain job's own
      verification later failed.
    preconditions:
      - sh: '[ -n "${TAG:-}" ]'
        msg: "TAG is not set. verify:notarized-suite requires TAG (the resolved, validated release tag) in the environment — post-release-verify.yml's resolve-tag job supplies it via needs.resolve-tag.outputs.tag."
      - sh: '[ -n "${REPO:-}" ]'
        msg: "REPO is not set. verify:notarized-suite requires REPO (owner/repo) in the environment."
      - sh: '[ -n "${GOOS:-}" ]'
        msg: "GOOS is not set. verify:notarized-suite requires GOOS (darwin) in the environment — the asset name is codegraph_${TAG}_${GOOS}_${GOARCH}, matching internal/upgrade.releaseAssetName's contract."
      - sh: '[ -n "${GOARCH:-}" ]'
        msg: "GOARCH is not set. verify:notarized-suite requires GOARCH (arm64 or amd64) in the environment."
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN is not set. Every gh invocation in this target needs it; a missing token would otherwise fail mid-target and look like a supply-chain break rather than a missing credential."
      - sh: command -v gh
        msg: "gh CLI not found. This target downloads the published release asset and its cosign bundle with it. CI runner images ship it; locally: brew install gh."
      - sh: command -v jq
        msg: "jq not found. This target counts executed go test -json events with it. CI runner images ship it; locally: brew install jq."
      - sh: command -v cosign
        msg: "cosign not found. This target verifies the downloaded binary's cosign bundle with it BEFORE making the file executable. CI installs it via sigstore/cosign-installer; locally: brew install cosign."
    cmds:
      - |
        set -euo pipefail

        echo "verify:notarized-suite: TAG=${TAG} REPO=${REPO} GOOS=${GOOS} GOARCH=${GOARCH}"

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        ASSET_NAME="codegraph_${TAG}_${GOOS}_${GOARCH}"
        SIG_NAME="${ASSET_NAME}.sigstore.json"

        # --- 1. Download the raw binary and its cosign bundle into TWO
        # SEPARATE temp dirs, plus a third for the go test -json stream — the
        # same two-temp-dirs discipline verify:release-assets already uses
        # (the sidecar must never land next to the binary it signs). One
        # trap covers all three from the moment they exist.
        DL_DIR="$(mktemp -d)"
        SIG_DIR="$(mktemp -d)"
        JSON_OUT="$(mktemp)"
        cleanup() { rm -rf "${DL_DIR}" "${SIG_DIR}"; rm -f "${JSON_OUT}"; }
        trap cleanup EXIT

        gh release download "${TAG}" --repo "${REPO}" --dir "${DL_DIR}" --pattern "${ASSET_NAME}"
        gh release download "${TAG}" --repo "${REPO}" --dir "${SIG_DIR}" --pattern "${SIG_NAME}"
        BIN_PATH="${DL_DIR}/${ASSET_NAME}"

        if [ ! -f "${SIG_DIR}/${SIG_NAME}" ]; then
          echo "::error::cosign bundle ${SIG_NAME} was not downloaded — cannot verify the signature"
          exit 1
        fi

        # --- 2. VERIFY BEFORE EXECUTING — the most important ordering
        # constraint here (T-02-19, review concern codex HIGH). cosign
        # verify-blob runs BEFORE any chmod, with the SAME issuer and
        # certificate-identity flags verify:release-assets already uses
        # (never a looser pattern, which would prove less than the
        # published instruction claims). A failed verification is a hard
        # failure before the binary is ever made executable.
        cosign verify-blob \
          --bundle "${SIG_DIR}/${SIG_NAME}" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp \
            '^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^[:space:]]*$' \
          "${BIN_PATH}"
        echo "verify:notarized-suite: cosign verify-blob: Verified OK"

        SHA256="$(sha256_of "${BIN_PATH}")"
        echo "NOTARIZED-SUITE-ASSET-SHA256 tag=${TAG} goos=${GOOS} goarch=${GOARCH} sha256=${SHA256}"

        # --- 3. Only NOW does the file become executable.
        chmod +x "${BIN_PATH}"

        # --- 4. Hard-fail BY NAME, before the suite runs, if the file is
        # missing or not executable — an explicit belt to the download and
        # chmod steps' braces, reachable even though both make this an
        # unlikely path in practice.
        if [ ! -f "${BIN_PATH}" ] || [ ! -x "${BIN_PATH}" ]; then
          echo "::error::${BIN_PATH} is missing or not executable after download+chmod — refusing to run the suite against a file that cannot be the notarized binary"
          exit 1
        fi

        ABS_BIN_DIR="$(cd "$(dirname "${BIN_PATH}")" && pwd)"
        export CODEGRAPH_TEST_BIN="${ABS_BIN_DIR}/$(basename "${BIN_PATH}")"

        # --- 5. Run the real suites — test/integration AND test/wireoracle
        # (both IN SCOPE, see this target's desc:) — against the notarized
        # binary. -count=1 disables Go's test cache so a cached result can
        # never stand in for a real run against THIS downloaded file.
        GO_TEST_EXIT=0
        go test -json -count=1 ./test/integration/... ./test/wireoracle/... > "${JSON_OUT}" || GO_TEST_EXIT=$?

        # --- 6. Count EXECUTED tests from the machine-readable -json
        # stream, never from parsed human-readable go test text (review
        # concern codex MEDIUM): go test emits no total-count line, and
        # human output confuses cached package summaries with executed
        # tests. A pass/fail event carrying a non-null Test field is one
        # executed test case; package-level pass/fail summaries (Test:
        # null) do not count.
        EXECUTED_COUNT="$(jq -s '[.[] | select(.Test != null) | select(.Action=="pass" or .Action=="fail")] | length' "${JSON_OUT}")"
        echo "NOTARIZED-SUITE-EVIDENCE schema=1 tag=${TAG} goos=${GOOS} goarch=${GOARCH} sha256=${SHA256} executed_tests=${EXECUTED_COUNT} go_test_exit=${GO_TEST_EXIT}"

        if [ "${EXECUTED_COUNT}" = "0" ]; then
          echo "::error::zero tests executed — a green job that ran nothing is the failure mode this whole phase is organised against, and a zero count is a hard failure regardless of go_test_exit=${GO_TEST_EXIT}"
          exit 1
        fi

        if [ "${GO_TEST_EXIT}" != "0" ]; then
          echo "::error::go test -json exited ${GO_TEST_EXIT} — see NOTARIZED-SUITE-EVIDENCE above and the captured JSON stream for the failing test(s)"
          exit "${GO_TEST_EXIT}"
        fi

        echo "verify:notarized-suite: PASS — ${EXECUTED_COUNT} tests executed against the notarized ${GOOS}/${GOARCH} binary for ${TAG}"

  check:cross:
    desc: >-
      4-target go list -mod=readonly sanity sweep (D-15) — the same pre-tag
      gate release-please.yml's pretag-gate job runs before a tag can be
      created. Run this locally before pushing to main to catch a
      platform-specific go.sum/build-constraint failure your own GOOS/GOARCH
      can't see (the exact failure class that reached the v0.1 rc.1 release
      candidate). The pair list is machine-held set-equal to
      .goreleaser.yaml's builds: targets by
      TestCheckCrossMatchesGoreleaserTargets, so the windows pairs left here
      in lockstep with the build entries (quick task 260807-gho).
    cmds:
      - |
        set -euo pipefail
        for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          GOOS="${pair%/*}" GOARCH="${pair#*/}" go list -mod=readonly ./... > /dev/null || {
            echo "::error::go list -mod=readonly ./... failed for GOOS=${pair%/*} GOARCH=${pair#*/}"
            exit 1
          }
        done

  lint:actions:
    desc: Lint GitHub Actions workflows (workflow static analysis).
    cmds:
      - "{{.GO_TOOL_LINT}} actionlint .github/workflows/*.yml"

  check:transcript-freeze:
    desc: >-
      D-03 anti-regeneration guard, ADVISORY since 03-02 (v0.3.0 Phase 3):
      reports, but never fails the build, when a pull request's merge-base
      diff changes a frozen wire-oracle transcript together with
      internal/mcp/*.go or the MCP dependency line in go.mod. Became
      advisory because the guard's own "split into two pull requests"
      remedy is structurally unavailable in this repository (03-CONTEXT.md
      D-06: a server-change-only PR fails the required wire-oracle leg, and
      a transcripts-only PR has no mergeable base) — the control that
      applies instead is the reviewed-diff pass D-06 mandates: capture the
      wire oracle before and after, read every changed line, name every
      cause in the commit message. SDK-01's swap still carries its own
      self-expiring exemption notice keyed to the mark3labs-to-go-sdk
      go.mod transition (02-CONTEXT.md D-01/D-02/D-03). Requires
      TRANSCRIPT_FREEZE_BASE (a ref name, e.g. origin/main) so the diff is
      computed against the merge-base rather than a per-commit comparison —
      pull-request granularity is what survives this repository's
      squash-merge model.
    cmds:
      - |
        set -euo pipefail
        if [ -z "${TRANSCRIPT_FREEZE_BASE:-}" ]; then
          echo "::error::TRANSCRIPT_FREEZE_BASE is not set — check:transcript-freeze needs a base ref to compute the merge-base diff against (e.g. TRANSCRIPT_FREEZE_BASE=origin/main task check:transcript-freeze)."
          exit 1
        fi
        git rev-parse --verify "${TRANSCRIPT_FREEZE_BASE}" >/dev/null
        mb=$(git merge-base "${TRANSCRIPT_FREEZE_BASE}" HEAD)
        CHANGED_LIST=$(mktemp)
        GOMOD_DIFF=$(mktemp)
        trap 'rm -f "$CHANGED_LIST" "$GOMOD_DIFF"' EXIT
        # --name-status with rename/copy detection (-M -C), NOT --name-only:
        # both sides of a renamed transcript or a renamed transcripts
        # directory must reach the classifier.
        git diff --name-status -M -C "$mb" HEAD > "$CHANGED_LIST"
        git diff "$mb" HEAD -- go.mod > "$GOMOD_DIFF"
        go run ./tools/transcriptfreeze -changed-list "$CHANGED_LIST" -gomod-diff "$GOMOD_DIFF"

  corpora:assert-one:
    desc: >-
      The four-part integrity check FIXT-02's reproducibility evidence and
      corpora:fetch-one's promotion gate both rest on, defined exactly
      once here and invoked by corpora:fetch-one and corpora:assert (via
      `task`) rather than duplicated. Checks CORPUS_REPO/CORPUS_SHA's
      manifest-resolved destination, or CORPUS_DIR_OVERRIDE when set
      (corpora:fetch-one's internal use, to check a staging directory
      before promotion). A destination is usable only when ALL FOUR
      hold: a real .git directory exists, HEAD equals the pinned SHA
      exactly, `git status --porcelain --ignored` is EMPTY, and `git
      rev-parse HEAD^{tree}` resolves. HEAD alone is NOT sufficient: a
      tree at the right commit with one modified tracked file, one
      changed file mode, one retargeted symlink, or one injected
      untracked file has the correct HEAD and the wrong contents —
      tools/bench/runner/main.go:482's pinnedAt does exactly this weaker
      HEAD-only check; this is deliberately stronger. Never prints a
      success line without establishing all four facts (rule 84d1gfpywd).
    preconditions:
      - sh: command -v git
        msg: "git not found — corpora:assert-one shells out to git directly."
      - sh: command -v jq
        msg: "jq not found — corpora:assert-one resolves its destination from tools/corpora -mode entries JSON via jq."
      - sh: command -v go
        msg: "go not found — corpora:assert-one runs tools/corpora via `go run`."
    cmds:
      - |
        set -euo pipefail

        if [ -z "${CORPUS_REPO:-}" ] || [ -z "${CORPUS_SHA:-}" ]; then
          echo "::error::corpora:assert-one: CORPUS_REPO and CORPUS_SHA are both required (e.g. CORPUS_REPO=org/name CORPUS_SHA=<40-hex> task corpora:assert-one)"
          exit 1
        fi

        # Re-validate independently at THIS interpolation point — the
        # last line of defence before CORPUS_REPO/CORPUS_SHA reach a
        # filesystem path or a manifest lookup. internal/corpora.Validate
        # is the source of truth; this duplicates its allowlist on
        # purpose, via shell pattern matching against a negated character
        # class (never a substring search), with every expansion quoted.
        if [ "${#CORPUS_SHA}" -ne 40 ]; then
          echo "::error::corpora:assert-one: CORPUS_SHA is not exactly 40 characters"
          exit 1
        fi
        case "$CORPUS_SHA" in
          *[!0-9a-f]*)
            echo "::error::corpora:assert-one: CORPUS_SHA contains a non-lowercase-hex character"
            exit 1
            ;;
        esac
        case "$CORPUS_REPO" in
          *[!A-Za-z0-9._/-]*)
            echo "::error::corpora:assert-one: CORPUS_REPO contains a disallowed character"
            exit 1
            ;;
          /*|*/)
            echo "::error::corpora:assert-one: CORPUS_REPO must not have a leading or trailing slash"
            exit 1
            ;;
        esac
        slash_count=$(printf '%s' "$CORPUS_REPO" | tr -cd '/' | wc -c | tr -d ' ')
        if [ "$slash_count" -ne 1 ]; then
          echo "::error::corpora:assert-one: CORPUS_REPO must contain exactly one slash"
          exit 1
        fi

        if [ -n "${CORPUS_DIR_OVERRIDE:-}" ]; then
          dest="$CORPUS_DIR_OVERRIDE"
        else
          entries=$(go run ./tools/corpora -mode entries)
          dest=$(printf '%s' "$entries" | jq -r --arg repo "$CORPUS_REPO" --arg sha "$CORPUS_SHA" '.[] | select(.repo == $repo and .sha == $sha) | .dir')
          if [ -z "$dest" ]; then
            echo "::error::corpora:assert-one: no manifest entry found for repo=${CORPUS_REPO} sha=${CORPUS_SHA} — corpora is manifest-anchored (D-09); add or correct the entry in corpora/manifest.json first"
            exit 1
          fi
        fi

        if [ ! -d "${dest}/.git" ]; then
          echo "::error::corpora:assert-one: part 1/4 FAILED — ${dest}/.git is not a real git directory (D-11)"
          exit 1
        fi
        head=$(git -C "$dest" rev-parse HEAD 2>/dev/null || true)
        if [ "$head" != "$CORPUS_SHA" ]; then
          echo "::error::corpora:assert-one: part 2/4 FAILED — HEAD (${head:-<none>}) at ${dest} does not equal the pinned SHA ${CORPUS_SHA}"
          exit 1
        fi
        status=$(git -C "$dest" status --porcelain --ignored)
        if [ -n "$status" ]; then
          echo "::error::corpora:assert-one: part 3/4 FAILED — ${dest} has a correct HEAD but its working tree is not clean (modified/staged/untracked/ignored content since checkout):"
          printf '%s\n' "$status" >&2
          exit 1
        fi
        tree=$(git -C "$dest" rev-parse 'HEAD^{tree}')
        if [ -z "$tree" ]; then
          echo "::error::corpora:assert-one: part 4/4 FAILED — HEAD^{tree} did not resolve at ${dest}"
          exit 1
        fi
        files=$(git -C "$dest" ls-files | wc -l | tr -d ' ')
        echo "corpora:assert-one: ${CORPUS_REPO} OK at ${dest} — tracked files: ${files}, tree: ${tree}"

  corpora:fetch-one:
    desc: >-
      Fetches exactly the manifest entry named by CORPUS_REPO/CORPUS_SHA
      at a shallow depth into its collision-free destination, or confirms
      it is already present and passing corpora:assert-one's four-part
      check (idempotent, no force flag needed). Corpora land OUTSIDE this
      working tree (D-12) and are never committed — corpora/manifest.json
      is the sole pin authority (D-09). Promotion is claim (atomic mkdir)
      -> stage (mktemp -d under the destination's parent) -> check (the
      full four-part integrity check, on the staged tree) -> promote (mv
      into a path that cannot already exist) — in that order, always,
      because claiming before the network fetch serialises concurrent
      fetches of the same entry rather than racing two transfers to
      discard one. Never mv's onto an existing path under any branch — a
      directory rename onto one that already exists nests rather than
      failing.
    preconditions:
      - sh: command -v git
        msg: "git not found — corpora:fetch-one shells out to git directly."
      - sh: command -v jq
        msg: "jq not found — corpora:fetch-one resolves its destination from tools/corpora -mode entries JSON via jq."
      - sh: command -v go
        msg: "go not found — corpora:fetch-one runs tools/corpora via `go run`."
    cmds:
      - |
        set -euo pipefail

        if [ -z "${CORPUS_REPO:-}" ] || [ -z "${CORPUS_SHA:-}" ]; then
          echo "::error::corpora:fetch-one: CORPUS_REPO and CORPUS_SHA are both required (e.g. CORPUS_REPO=org/name CORPUS_SHA=<40-hex> task corpora:fetch-one)"
          exit 1
        fi

        # Re-validate independently at THIS interpolation point, before
        # CORPUS_REPO/CORPUS_SHA are used to construct a git remote URL —
        # the last line of defence (T-01-04-01). internal/corpora.Validate
        # is the source of truth; this duplicates its allowlist via shell
        # pattern matching against a negated character class, never a
        # substring search, with every expansion quoted.
        if [ "${#CORPUS_SHA}" -ne 40 ]; then
          echo "::error::corpora:fetch-one: CORPUS_SHA is not exactly 40 characters"
          exit 1
        fi
        case "$CORPUS_SHA" in
          *[!0-9a-f]*)
            echo "::error::corpora:fetch-one: CORPUS_SHA contains a non-lowercase-hex character"
            exit 1
            ;;
        esac
        case "$CORPUS_REPO" in
          *[!A-Za-z0-9._/-]*)
            echo "::error::corpora:fetch-one: CORPUS_REPO contains a disallowed character"
            exit 1
            ;;
          /*|*/)
            echo "::error::corpora:fetch-one: CORPUS_REPO must not have a leading or trailing slash"
            exit 1
            ;;
        esac
        slash_count=$(printf '%s' "$CORPUS_REPO" | tr -cd '/' | wc -c | tr -d ' ')
        if [ "$slash_count" -ne 1 ]; then
          echo "::error::corpora:fetch-one: CORPUS_REPO must contain exactly one slash"
          exit 1
        fi

        # Resolve the destination FROM tools/corpora rather than
        # re-deriving Entry.Dir's SHA-256 digest independently in bash.
        entries=$(go run ./tools/corpora -mode entries)
        dest=$(printf '%s' "$entries" | jq -r --arg repo "$CORPUS_REPO" --arg sha "$CORPUS_SHA" '.[] | select(.repo == $repo and .sha == $sha) | .dir')
        if [ -z "$dest" ]; then
          echo "::error::corpora:fetch-one: no manifest entry found for repo=${CORPUS_REPO} sha=${CORPUS_SHA} — corpora is manifest-anchored (D-09); add or correct the entry in corpora/manifest.json first"
          exit 1
        fi
        mkdir -p "$(dirname "$dest")"

        # Fast path: already fetched and verified — skip the network
        # round-trip and the claim entirely.
        if [ -d "$dest" ] && CORPUS_REPO="$CORPUS_REPO" CORPUS_SHA="$CORPUS_SHA" task corpora:assert-one >/dev/null 2>&1; then
          echo "corpora:fetch-one: ${CORPUS_REPO} already present and verified at ${dest}"
          exit 0
        fi
        if [ -d "$dest" ]; then
          echo "::error::corpora:fetch-one: ${dest} exists but fails the integrity check — run 'CORPUS_REPO=${CORPUS_REPO} CORPUS_SHA=${CORPUS_SHA} task corpora:assert-one' for the specific failure. Refusing to silently re-fetch over a corrupt or tampered destination."
          exit 1
        fi

        # Claim FIRST, then fetch — mkdir is atomic on POSIX and fails if
        # the path already exists, so exactly one process ever holds it.
        if ! mkdir "${dest}.lock" 2>/dev/null; then
          if [ -d "$dest" ] && CORPUS_REPO="$CORPUS_REPO" CORPUS_SHA="$CORPUS_SHA" task corpora:assert-one >/dev/null 2>&1; then
            echo "corpora:fetch-one: ${CORPUS_REPO} already fetched and verified at ${dest} (another process finished first)"
            exit 0
          fi
          echo "::error::corpora:fetch-one: claim ${dest}.lock is held — a fetch of ${CORPUS_REPO} is in flight, or a previous run was interrupted and leaked its claim. Remove ${dest}.lock once no fetch of ${CORPUS_REPO} is running, then retry."
          exit 1
        fi

        stage=""
        cleanup() {
          if [ -n "$stage" ] && [ -d "$stage" ]; then
            rm -rf "$stage"
          fi
          rmdir "${dest}.lock" 2>/dev/null || true
        }
        trap cleanup EXIT

        # Close the claim-then-check-existence race: between the fast
        # path above and this claim, another process could have finished
        # and promoted. Re-check now, while holding the exclusive claim.
        if [ -d "$dest" ]; then
          if CORPUS_REPO="$CORPUS_REPO" CORPUS_SHA="$CORPUS_SHA" task corpora:assert-one >/dev/null 2>&1; then
            echo "corpora:fetch-one: ${CORPUS_REPO} already fetched and verified at ${dest} (raced with another process)"
            exit 0
          fi
          echo "::error::corpora:fetch-one: ${dest} exists but fails the integrity check — refusing to silently re-fetch over a corrupt or tampered destination"
          exit 1
        fi

        stage=$(mktemp -d "$(dirname "$dest")/tmp.XXXXXX")
        git init --quiet "$stage"
        git -C "$stage" remote add origin "https://github.com/${CORPUS_REPO}.git"
        git -C "$stage" fetch --quiet --depth 1 origin "$CORPUS_SHA"
        git -C "$stage" checkout --quiet FETCH_HEAD

        if ! CORPUS_REPO="$CORPUS_REPO" CORPUS_SHA="$CORPUS_SHA" CORPUS_DIR_OVERRIDE="$stage" task corpora:assert-one; then
          echo "::error::corpora:fetch-one: freshly staged ${CORPUS_REPO} failed the integrity check above — not promoted"
          exit 1
        fi

        # dest cannot already exist: only the claim holder creates it, and
        # we hold the claim.
        mv "$stage" "$dest"
        stage=""
        echo "corpora:fetch-one: fetched ${CORPUS_REPO} to ${dest}"

  corpora:assert:
    desc: >-
      The WHOLE-SET positive assertion (rule 84d1gfpywd): runs
      corpora:assert-one's four-part integrity check for every LOCKED
      corpus entry, then asserts the number it verified equals the
      locked-set size — never merely that nothing failed. Consumed by
      Plan 01-06 (wave 4); defined here, in wave 1, because it is a pure
      loop over corpora:assert-one, which this plan already defines, and
      a target defined a wave after its consumer could not pass its own
      verification. Exits non-zero when the locked set is empty or any
      corpus fails any part.
    preconditions:
      - sh: command -v git
        msg: "git not found — corpora:assert shells out to git directly (via corpora:assert-one)."
      - sh: command -v jq
        msg: "jq not found — corpora:assert resolves the locked set from tools/corpora -mode entries -locked JSON via jq."
      - sh: command -v go
        msg: "go not found — corpora:assert runs tools/corpora via `go run`."
    cmds:
      - |
        set -euo pipefail
        entries=$(go run ./tools/corpora -mode entries -locked)
        want=$(printf '%s' "$entries" | jq 'length')
        if [ "$want" -eq 0 ]; then
          echo "::error::corpora:assert: the locked corpus set is empty — nothing to verify. Lock at least one entry in corpora/manifest.json (Plan 01-06) before running this target."
          exit 1
        fi
        mapfile -t rows < <(printf '%s' "$entries" | jq -c '.[]')
        verified=0
        for row in "${rows[@]}"; do
          repo=$(printf '%s' "$row" | jq -r '.repo')
          sha=$(printf '%s' "$row" | jq -r '.sha')
          CORPUS_REPO="$repo" CORPUS_SHA="$sha" task corpora:assert-one
          verified=$((verified + 1))
        done
        if [ "$verified" -ne "$want" ]; then
          echo "::error::corpora:assert: verified ${verified} of ${want} locked corpora — see errors above"
          exit 1
        fi
        echo "corpora:assert: verified ${verified}/${want} locked corpora"

  corpora:fetch:
    desc: >-
      Fetches (or confirms already fetched-and-verified) every LOCKED
      corpus entry from corpora/manifest.json — the sole pin authority
      (D-09) — into the out-of-tree corpus root (D-12). Corpora are
      fetched at pinned SHAs only and are NEVER committed to this
      repository. Exits non-zero with an error-annotated message when the
      locked set is empty; never degrades to a silent no-op skip (rule
      84d1gfpywd). Nothing is locked at this plan's completion, so the
      empty-set refusal is what this plan verifies; Plan 01-06 locks the
      set and makes the populated path live.
    preconditions:
      - sh: command -v git
        msg: "git not found — corpora:fetch shells out to git directly (via corpora:fetch-one)."
      - sh: command -v jq
        msg: "jq not found — corpora:fetch resolves the locked set from tools/corpora -mode entries -locked JSON via jq."
      - sh: command -v go
        msg: "go not found — corpora:fetch runs tools/corpora via `go run`."
    cmds:
      - |
        set -euo pipefail
        entries=$(go run ./tools/corpora -mode entries -locked)
        want=$(printf '%s' "$entries" | jq 'length')
        if [ "$want" -eq 0 ]; then
          echo "::error::corpora:fetch: the locked corpus set is empty — nothing to fetch. Lock at least one entry in corpora/manifest.json (Plan 01-06) before running this target."
          exit 1
        fi
        mapfile -t rows < <(printf '%s' "$entries" | jq -c '.[]')
        fetched=0
        for row in "${rows[@]}"; do
          repo=$(printf '%s' "$row" | jq -r '.repo')
          sha=$(printf '%s' "$row" | jq -r '.sha')
          CORPUS_REPO="$repo" CORPUS_SHA="$sha" task corpora:fetch-one
          fetched=$((fetched + 1))
        done
        echo "corpora:fetch: fetched or confirmed ${fetched}/${want} locked corpora"

  corpora:measure:
    desc: >-
      Regenerates the measurement record and the generated human-readable
      document (D-07): rebuilds corpora/observations.json and, only when
      no selection has been recorded yet, renders docs/CORPUS-MEASUREMENT.md
      as a pure observation report. It UPSERTS by default (keyed repo@sha,
      never fully reconstructs), applies corpora.StripVolatile's superset
      policy so no host-local path or per-machine value is committed
      (FIXT-01), and NEVER writes corpora/selection.json — that curated
      policy file has no write path from the generator at all, by design.
      Plan 01-07's drift job calls this target to prove re-measuring the
      committed record reproduces it byte-identically. Pass -mode select
      to compute the threshold/locked-set proposal from the observations.
    preconditions:
      - sh: command -v go
        msg: "go not found — corpora:measure runs tools/corpora via `go run`."
      - sh: command -v git
        msg: "git not found — corpora:measure shells out to git for tracked-file counts."
    cmds:
      - |
        set -euo pipefail
        # Default locked scope: measure every locked corpus, upsert into the
        # committed observations file, regenerate the prose document. Pass
        # explicit flags for a bounded candidate search (e.g. -repos org/name).
        go run ./tools/corpora -mode measure

  corpora:verify:
    desc: >-
      D-08's CHEAP half of the corpora drift guard: reconciles the three
      COMMITTED documents — corpora/manifest.json, corpora/observations.json
      and corpora/selection.json — against each other through the
      internal/corpora coverage guard (CheckCoverage). Requires no fetched
      corpora and no indexing, so it is safe on EVERY CI run as its own named
      step. The cached-result-defeating -count=1 flag is MANDATORY: without it
      Go's test cache would let a mutated committed document slip through on a
      stale green result.
    preconditions:
      - sh: command -v go
        msg: "go not found — corpora:verify runs go test over ./internal/corpora."
    cmds:
      - go test -count=1 ./internal/corpora/...

  corpora:drift:
    desc: >-
      D-08's EXPENSIVE half of the corpora drift guard: proves the pinned
      LOCKED corpora still produce the committed measurement. Fetches and
      asserts every locked corpus, re-runs task corpora:measure at the
      DEFAULT locked scope (which never deletes out-of-scope observation
      entries), then requires the working tree to be clean for the two
      GENERATED files corpora/observations.json and docs/CORPUS-MEASUREMENT.md.
      A difference means the pinned corpora no longer produce the recorded
      numbers. The diff NEVER covers the curated selection policy file the
      measure step cannot write, so nothing under test can correlate with it.
      The clean-diff demand composes with the upsert lifecycle because
      observations are keyed by repo@sha: a pin bump creates a NEW key rather
      than staling an old one, and the entry-deletion flag (which would remove
      out-of-scope entries and break the diff) is deliberately never passed.
      Invoked by the corpora workflow's drift leg, which runs only when a
      measurement-affecting path changes.
    preconditions:
      - sh: command -v go
        msg: "go not found — corpora:drift re-runs tools/corpora via `go run`."
      - sh: command -v git
        msg: "git not found — corpora:drift computes the drift diff with git."
    cmds:
      - |
        set -euo pipefail
        task corpora:fetch
        task corpora:assert
        task corpora:measure
        # The measure step UPSERTS at the locked scope (never passing the
        # out-of-scope deletion flag), so measured-but-unlocked observations
        # are neither re-measured nor removed and never appear in this diff.
        changed=$(git diff --name-only -- corpora/observations.json docs/CORPUS-MEASUREMENT.md)
        if [ -n "$changed" ]; then
          echo "::error::corpora:drift: re-measuring the locked corpora changed committed files — the pinned corpora no longer produce the recorded numbers"
          printf '%s\n' "$changed"
          git diff -- corpora/observations.json docs/CORPUS-MEASUREMENT.md | head -100
          exit 1
        fi
        echo "corpora:drift: locked corpora re-measure byte-identical to the committed record"

  diag:cpu:
    desc: >-
      CPU/memory/storage topology diagnostic (10-04-PLAN, Rule 2 deviation
      — NOT a gate; never called by ci.yml, and the only callers in
      bench.yml are its non-gating, manually-dispatched cpu-diag-* jobs).
      Reports CPU (nproc, a Go process's own
      runtime.NumCPU()/GOMAXPROCS(0), the cgroup CPU quota, /proc/cpuinfo
      model/family/stepping/count, cpufreq scaling info), memory (free -b
      or /proc/meminfo MemTotal), and storage (df -T for the workspace
      and TMPDIR, block-device rotational flags, and a real
      sequential-write+read-back throughput probe against TMPDIR — the
      exact directory tools/bench/runner materializes its corpus into,
      since os.MkdirTemp("", ...) resolves there). Exists to A/B two
      competing explanations for bench throughput variance that showed up
      with rock-stable peak RSS (0.56%) but a much wider wall-clock spread
      (4.36% session medians, ~30% full 14-trial range): (1) CPU-count
      oversubscription — refuted in an earlier pass, NumCPU already
      matches nproc/cgroup on Namespace — and (2) I/O-bound variance from
      unequal or noisier storage/memory between runner classes, which same
      work + stable memory + different wall-clock is the classic signature
      of. Linux-only by nature (cgroup/proc paths); the precondition below
      fails loud with a pointer to the dispatchable workflow rather than
      printing confusing "file not found" output on a contributor's
      non-Linux machine.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "diag:cpu reads Linux cgroup/proc paths and is meant to run on the CI runner under investigation, not a contributor machine. Dispatch it instead: Actions -> bench -> Run workflow -> job: cpu-diag (both cpu-diag-github and cpu-diag-namespace run side by side)."
    cmds:
      - echo "=== CPU ==="
      - echo "--- nproc ---"
      - nproc
      - echo "--- go process view (runtime.NumCPU / runtime.GOMAXPROCS(0)) ---"
      - go run ./tools/bench/cpudiag
      - echo "--- cgroup CPU quota ---"
      - |
        set -euo pipefail
        if [ -f /sys/fs/cgroup/cpu.max ]; then
          echo "cgroup v2 cpu.max:"
          cat /sys/fs/cgroup/cpu.max
        elif [ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]; then
          echo "cgroup v1 cpu.cfs_quota_us / cpu.cfs_period_us:"
          cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us
          cat /sys/fs/cgroup/cpu/cpu.cfs_period_us
        else
          echo "no cgroup CPU quota file found at either the v2 or v1 path"
        fi
      - echo "--- /proc/cpuinfo model/family/stepping/count ---"
      - |
        set -euo pipefail
        if [ -f /proc/cpuinfo ]; then
          grep -m1 "model name"  /proc/cpuinfo || echo "no 'model name' line in /proc/cpuinfo"
          grep -m1 "cpu family"  /proc/cpuinfo || echo "no 'cpu family' line in /proc/cpuinfo"
          grep -m1 "stepping"    /proc/cpuinfo || echo "no 'stepping' line in /proc/cpuinfo"
          echo "processor count: $(grep -c '^processor' /proc/cpuinfo)"
        else
          echo "/proc/cpuinfo not present"
        fi
      - echo "--- cpufreq scaling (cpu0) ---"
      - |
        set -euo pipefail
        CPUFREQ_DIR=/sys/devices/system/cpu/cpu0/cpufreq
        if [ -d "$CPUFREQ_DIR" ]; then
          for f in scaling_governor scaling_cur_freq scaling_min_freq scaling_max_freq; do
            if [ -f "$CPUFREQ_DIR/$f" ]; then
              echo "${f}: $(cat "$CPUFREQ_DIR/$f")"
            else
              echo "${f}: not present"
            fi
          done
        else
          echo "no cpufreq sysfs directory at $CPUFREQ_DIR (common inside a VM/container without frequency-scaling passthrough — itself a data point)"
        fi
      - echo "=== Memory ==="
      - |
        set -euo pipefail
        if command -v free >/dev/null 2>&1; then
          free -b
        else
          echo "free not found; falling back to /proc/meminfo"
          grep MemTotal /proc/meminfo
        fi
      - echo "=== Storage ==="
      - echo "--- df -T (workspace and TMPDIR) ---"
      - |
        set -euo pipefail
        echo "workspace ($(pwd)):"
        df -T .
        echo "TMPDIR (${TMPDIR:-/tmp}), the directory tools/bench/runner materializes its corpus into:"
        df -T "${TMPDIR:-/tmp}"
      - echo "--- block device rotational flags (0=SSD/NVMe, 1=spinning) ---"
      - |
        set -euo pipefail
        shopt -s nullglob 2>/dev/null || true
        found=0
        for f in /sys/block/*/queue/rotational; do
          found=1
          dev=$(basename "$(dirname "$(dirname "$f")")")
          val=$(cat "$f" 2>/dev/null || echo "unreadable")
          echo "${dev}: rotational=${val}"
        done
        if [ "$found" -eq 0 ]; then
          echo "no /sys/block/*/queue/rotational entries found"
        fi
      - echo "--- sequential write+read-back probe against TMPDIR (2GiB) ---"
      - |
        set -euo pipefail
        SCRATCH_DIR="${TMPDIR:-/tmp}"
        SCRATCH_FILE="${SCRATCH_DIR%/}/codegraph-diag-ddtest.bin"
        trap 'rm -f "$SCRATCH_FILE"' EXIT
        echo "write:"
        if dd if=/dev/zero of="$SCRATCH_FILE" bs=1M count=2048 conv=fdatasync oflag=direct 2>write.log; then
          echo "(oflag=direct supported)"
        else
          echo "(oflag=direct NOT supported on this filesystem — falling back to buffered write)"
          dd if=/dev/zero of="$SCRATCH_FILE" bs=1M count=2048 conv=fdatasync 2>write.log
        fi
        cat write.log
        echo "read-back:"
        if dd if="$SCRATCH_FILE" of=/dev/null bs=1M iflag=direct 2>read.log; then
          echo "(iflag=direct supported)"
        else
          echo "(iflag=direct NOT supported on this filesystem — falling back to buffered read)"
          dd if="$SCRATCH_FILE" of=/dev/null bs=1M 2>read.log
        fi
        cat read.log
        rm -f write.log read.log

  diag:storage-fit:
    desc: >-
      tmpfs sizing diagnostic (10-04-PLAN, Rule 2 deviation — NOT a gate;
      never called by ci.yml, and the only callers in bench.yml are its
      non-gating, manually-dispatched cpu-diag-* jobs). Reports the
      candidate tmpfs mount's available capacity (df -h /dev/shm) and
      then materializes ONE real PERF-02/INDX-06 synthetic corpus
      (tools/bench/gencorpus, seed 42, count 120000 — the exact
      seed/count tools/bench/runner's regression mode uses) and runs a
      real `codegraph init` + `codegraph index --force --quiet` against
      it, reporting `du -sh` on both the corpus and the resulting
      .codegraph/ Pebble store. Exists to answer, with real numbers
      rather than estimates, whether pointing the regression scratch
      directory at tmpfs (candidate fix for I/O-bound throughput
      variance — see diag:cpu's doc comment) is even viable before
      wiring it in: a tmpfs mount that can't hold the corpus + store
      would make the fix worse than the problem. Everything this target
      creates lives under a temp directory removed on exit; it never
      writes to the real tmpfs default tools/bench/runner would use in
      production, only measures what WOULD fit there.
    preconditions:
      - sh: '[ "$(go env GOHOSTOS)" = "linux" ]'
        msg: "diag:storage-fit reads Linux-only paths (/dev/shm) and is meant to run on the CI runner under investigation, not a contributor machine. Dispatch it instead: Actions -> bench -> Run workflow -> job: cpu-diag."
    cmds:
      - echo "--- /dev/shm availability and size ---"
      - |
        set -euo pipefail
        if [ -d /dev/shm ]; then
          df -h /dev/shm
        else
          echo "/dev/shm does not exist on this host"
        fi
      - echo "--- materializing one real PERF-02 corpus (seed 42, count 120000) ---"
      - |
        set -euo pipefail
        WORKDIR=$(mktemp -d)
        trap 'rm -rf "$WORKDIR"' EXIT
        go build -o "$WORKDIR/gencorpus" ./tools/bench/gencorpus
        go build -o "$WORKDIR/codegraph" ./cmd/codegraph
        CORPUS_DIR="$WORKDIR/corpus"
        "$WORKDIR/gencorpus" -seed 42 -out "$CORPUS_DIR" -count 120000
        echo "corpus size:"
        du -sh "$CORPUS_DIR"
        "$WORKDIR/codegraph" init "$CORPUS_DIR"
        "$WORKDIR/codegraph" index "$CORPUS_DIR" --force --quiet
        echo ".codegraph store size:"
        du -sh "$CORPUS_DIR/.codegraph"
        echo "total (corpus + store):"
        du -sh "$WORKDIR"

  check:reproducibility:
    desc: >-
      linux/amd64 double-build hash-diff (DIST-04, BLOCKING leg) — ports
      ci.yml's reproducibility job's canonical double build character-for-
      character. Reads SOURCE_DATE_EPOCH/COMMIT from the environment (what
      ci.yml's own "Compute determinism inputs" step exports via env:);
      when either is unset, defaults locally to the same two commands that
      step runs (git log -1 --format=%ct / git rev-parse HEAD) so this
      target is runnable on a contributor checkout without inventing
      different inputs. Uses GNU date -d (matching ci.yml's own script
      verbatim, D-15-style byte-fidelity) — a Linux host, or GNU coreutils
      on PATH as `date`, is required; BSD/macOS date does not accept -d.
    cmds:
      - |
        set -euo pipefail
        SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
        COMMIT="${COMMIT:-$(git rev-parse HEAD)}"
        DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=ci-repro -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}"
        build() {
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o "$1" ./cmd/codegraph
        }
        build /tmp/codegraph_build1
        build /tmp/codegraph_build2
        H1=$(sha256sum /tmp/codegraph_build1 | cut -d' ' -f1)
        H2=$(sha256sum /tmp/codegraph_build2 | cut -d' ' -f1)
        echo "build1=$H1"
        echo "build2=$H2"
        if [ "$H1" != "$H2" ]; then
          echo "::error::REPRODUCIBILITY GATE FAILED: linux/amd64 build is non-deterministic ($H1 != $H2)"
          exit 1
        fi
        echo "linux/amd64 double-build matched: $H1"

  check:reproducibility:arm64:
    desc: >-
      linux/arm64 cross-target double-build hash-diff (DIST-04, REPORTED
      ONLY — non-blocking per D-03). Ports ci.yml's cross-target leg
      character-for-character, including its ::warning:: (not ::error::)
      branch and non-failing exit — a mismatch here is reported, never
      gated. Same SOURCE_DATE_EPOCH/COMMIT local-defaulting as
      check:reproducibility. This leg is non-blocking in CI, which makes a
      silent local skip especially dangerous ("I ran it and it was fine"
      would actually mean "it never ran") — the zig precondition below
      exists specifically to fail loud instead.
    preconditions:
      - sh: command -v zig
        msg: "zig not found on PATH — check:reproducibility:arm64 cross-compiles via zig cc (aarch64-linux-gnu). Install per CONTRIBUTING.md's Building section (https://ziglang.org/download/), or run `task check:reproducibility` (the blocking linux/amd64 leg) alone if you don't need the cross-target report."
    cmds:
      - |
        set -euo pipefail
        SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
        COMMIT="${COMMIT:-$(git rev-parse HEAD)}"
        DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -buildid= -X github.com/seanb4t/codegraph-go/internal/version.Version=ci-repro -X github.com/seanb4t/codegraph-go/internal/version.Commit=${COMMIT} -X github.com/seanb4t/codegraph-go/internal/version.Date=${DATE}"
        build() {
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC="zig cc -target aarch64-linux-gnu" \
            CXX="zig c++ -target aarch64-linux-gnu" \
            go build -trimpath -ldflags "$LDFLAGS" -o "$1" ./cmd/codegraph
        }
        build /tmp/codegraph_arm1
        build /tmp/codegraph_arm2
        H1=$(sha256sum /tmp/codegraph_arm1 | cut -d' ' -f1)
        H2=$(sha256sum /tmp/codegraph_arm2 | cut -d' ' -f1)
        echo "build1=$H1"
        echo "build2=$H2"
        if [ "$H1" != "$H2" ]; then
          echo "::warning::linux/arm64 cross-target double-build did NOT match (reported only, non-blocking per D-03)"
        else
          echo "linux/arm64 cross-target double-build matched (reported only, non-blocking per D-03)"
        fi

  bench:regression:
    desc: >-
      Local invocation of the PERF-02/INDX-06 regression gate (D-14) —
      wraps ci.yml's perf-regression job's invocation verbatim. This gate
      is deliberately unrunnable as a REAL check on a developer machine:
      internal/bench.CheckRegression refuses any comparison whose
      GOOS/GOARCH, runner, or scratch_fs identity doesn't match the
      committed tools/bench/baseline.json, and a developer machine is
      essentially never that exact combination. When that refusal fires,
      this target explains why in prose (tools/bench/BASELINE.md has the
      full rationale) and still exits non-zero — it never remaps or
      swallows the underlying exit status; the explanation is additive
      output only. No -rebless flag is reachable from this or any other
      task target (D-13) — baseline.json is written only by bench.yml's
      manually-dispatched rebless job.
    cmds:
      - |
        set -euo pipefail
        if OUTPUT=$(go run ./tools/bench/runner -mode regression \
          -baseline tools/bench/baseline.json \
          -trials 3 \
          -ceiling-bytes 4294967296 2>&1); then
          STATUS=0
        else
          STATUS=$?
        fi
        echo "$OUTPUT"
        if [ "$STATUS" -ne 0 ] && printf '%s' "$OUTPUT" | grep -qE 'platform mismatch|runner mismatch|scratch filesystem mismatch'; then
          echo ""
          echo "This gate refused the comparison above as a category error: it compares"
          echo "against tools/bench/baseline.json, which is bound to a specific runner class"
          echo "and scratch filesystem class, and it is deliberately not runnable as a real"
          echo "gate on a developer machine. See tools/bench/BASELINE.md for the full"
          echo "rationale and how to re-bless the baseline (bench.yml's rebless job only —"
          echo "no local -rebless target exists, see CONTRIBUTING.md)."
        fi
        exit "$STATUS"

  # --- Contributor-only coarse wrappers (D-02) --------------------------
  #
  # CI NEVER calls these two targets — ci.yml calls the fine-grained
  # targets above directly, one per named step. A wrapper that forgets a
  # leg costs a contributor convenience, but cannot weaken CI coverage,
  # because CI never reads this list. Do not "simplify" ci.yml onto these
  # wrappers — that would reintroduce exactly the silent-drop risk D-02
  # designed out. See TestTaskfileWrapperIsSerial (internal/upgrade) for
  # the set-equality guard that keeps the `test` wrapper's leg list honest.

  test:
    desc: >-
      Contributor wrapper: the six host-only legs (test:unit, test:golden,
      test:integration, test:wireoracle, test:daemon, test:race), run
      SERIALLY via a list of sub-task commands (never deps:, which go-task
      runs concurrently). test:daemon and test:race both pass -p 1
      specifically to avoid cross-test contention; running the two
      concurrently with each other would reintroduce exactly the flakiness
      those flags exist to prevent.
    cmds:
      - task: test:unit
      - task: test:golden
      - task: test:integration
      - task: test:wireoracle
      - task: test:daemon
      - task: test:race

  lint:
    desc: "Contributor wrapper: vet and lint:actions, run serially."
    cmds:
      - task: vet
      - task: lint:actions
