kind: Fixes
body: Install and uninstall now report failed or partial as an agent's status when its result has errors, and kept when nothing changed and some file was kept in place, and install --print-config-style prints an error= field for an agent whose paths do not resolve, with no --target, --target all or --target auto, instead of stopping.
