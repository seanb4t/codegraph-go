kind: Fixes
body: The Codex install target now writes its global config.toml, AGENTS.md, hooks.json and PreToolUse guard under CODEX_HOME when it is set and not empty, and under ~/.codex otherwise, CODEX_HOME must be an existing absolute directory or global Codex commands stop with an error, and anyone who sets CODEX_HOME should re-run `codegraph install -t codex -l global` because upgrade does not move files from ~/.codex.
time: 2026-11-18T21:10:19.796042-05:00
