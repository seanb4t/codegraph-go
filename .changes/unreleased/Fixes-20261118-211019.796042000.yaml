kind: Fixes
body: The Codex install target now writes its global config.toml, AGENTS.md, hooks.json and PreToolUse guard under CODEX_HOME when it is set and not empty, and under ~/.codex otherwise, and a CODEX_HOME that is not an absolute path is an error for global installs.
