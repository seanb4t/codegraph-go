kind: Fixes
body: codegraph no longer treats the home directory as a project when ~/.codegraph exists, and the daemon registry moves from ~/.codegraph/daemons to $XDG_STATE_HOME/codegraph/daemons (default ~/.local/state/codegraph/daemons) with a one-time migration; delete a leftover ~/.codegraph/store by hand.
