kind: Fixes
body: In coloured output and in the install, daemon, githooks, upgrade, print-config-style and uninit messages and the uninit and index prompts, control characters are now removed and format characters such as bidi overrides and zero-width spaces are shown as <U+XXXX> escapes, including in source lines.
