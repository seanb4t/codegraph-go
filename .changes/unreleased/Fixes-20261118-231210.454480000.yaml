kind: Fixes
body: Installing the Claude Code or Codex hooks now stops with an error that names the key when the hooks value, a hooks event value that is not an array, or the permissions or permissions.allow value in settings.json or hooks.json has the wrong JSON type, and leaves the file unchanged, instead of overwriting the value.
