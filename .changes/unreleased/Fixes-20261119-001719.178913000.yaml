kind: Fixes
body: Global installs and uninstalls now refuse a relative HERMES_HOME, and a relative home directory with an error that says codegraph cannot find its global files, a relative XDG_CONFIG_HOME is ignored with a note as the XDG specification says, and the Claude Code hook install refuses a global hook path that is not valid UTF-8 and tells you to install with --location local, because JSON cannot hold such a path and the registration would not match on uninstall.
