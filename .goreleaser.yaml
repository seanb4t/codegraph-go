# GoReleaser v2 build configuration for codegraph-go (DIST-01, DIST-04).
#
# IMPORTANT CONTRACTS — do not change without reading the linked findings:
#
#   (a) release.yml's build job invokes `goreleaser build --single-target`
#       ONLY (never `goreleaser release`), so the archives/checksum blocks
#       below are NOT executed by this project's pipeline — GoReleaser's
#       `build` subcommand compiles binaries only and does not run the
#       archive/checksum/sign/sbom pipes. The real asset-naming/checksum
#       contract is enforced entirely by release.yml's own shell steps
#       ("Rename to release-asset contract name" in the build job, and
#       "Checksums" in the assemble job), which must independently agree
#       with internal/upgrade.releaseAssetName() (Finding 1, Phase 8
#       research; contract shape: codegraph_<tag>_<goos>_<goarch>,
#       using the v-prefixed tag, not the prefix-stripped version). The
#       archives.name_template below documents that same shape for a
#       human reader but is otherwise inert — if you change the asset
#       name shape, change BOTH release.yml's DEST= line and
#       internal/upgrade.releaseAssetName(); editing name_template alone
#       has no effect on the actual release artifacts (WR-01, Phase 8
#       re-review).
#
#   (b) The reproducibility flags on every build entry (-trimpath,
#       -buildid=, mod_timestamp) exist so the DIST-04 double-build
#       determinism gate (Plan 08-08) can byte-for-byte diff two builds
#       of the same commit. Do not remove them.
#
#   (c) Signing and SBOM generation are performed by release.yml's
#       assembly job (Plan 08-04, Finding 2), NOT here — the native
#       4-target matrix is built per-runner via
#       `goreleaser build --single-target` (OSS-only; no Pro
#       release --split/--merge or prebuilt-builder directives).
#       This file intentionally has no `signs:` or `sbom:` block.
#
#   (d) Native Windows is NOT a supported platform (quick task
#       260807-gho). Windows users run the linux/amd64 binary under
#       WSL2. Do not re-add windows build entries here without
#       reversing that decision in README.md's Supported platforms
#       section and re-adding the corresponding release.yml matrix
#       legs, CI vet jobs, and internal/upgrade .exe handling.

version: 2

project_name: codegraph

builds:
  # Both linux legs cross-compile via zig cc/zig c++ (D-01/D-02, REL-05):
  # this is what makes a single macOS host able to produce all four release
  # targets in one `goreleaser release` invocation (Phase 1 spike). The
  # amd64 leg no longer uses the runner's native gcc — see
  # codegraph-linux-arm64 below, which already did this before this phase.
  - id: codegraph-linux-amd64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    flags:
      - -trimpath
    ldflags: &version_ldflags
      - -s
      - -w
      - -buildid=
      - -X github.com/seanb4t/codegraph-go/internal/version.Version={{ .Tag }}
      - -X github.com/seanb4t/codegraph-go/internal/version.Commit={{ .FullCommit }}
      - -X github.com/seanb4t/codegraph-go/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: codegraph-linux-arm64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

  # darwin/amd64 and darwin/arm64 are built NATIVELY on a macos-latest
  # runner (Finding 2): cross-compiling darwin from Linux via zig risks
  # breaking libresolv-based DNS resolution in the resulting binary, so
  # no CC/CXX override is set here — the runner's own Xcode clang
  # already targets both darwin arches correctly.
  - id: codegraph-darwin-amd64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: codegraph-darwin-arm64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

# Raw per-platform binaries, NEVER tar.gz/zip (D-02/Finding 1): the
# upgrade path in internal/upgrade downloads and swaps in this exact
# byte stream directly, with no archive extraction step.
#
# NOTE (WR-01, Phase 8 re-review): this block (and the checksum: block
# below) is dead configuration under this project's pipeline — see the
# header comment at the top of this file. It never executes because
# release.yml only runs `goreleaser build --single-target`, never
# `goreleaser release`. Kept as documentation of intent only.
archives:
  - formats: [binary]
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Tag }}_checksums.txt"
  algorithm: sha256
