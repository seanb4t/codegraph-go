# GoReleaser v2 build configuration for codegraph-go (DIST-01, DIST-04).
#
# IMPORTANT CONTRACTS — do not change without reading the linked findings:
#
#   (a) release.yml no longer invokes `goreleaser build --single-target`;
#       a single `goreleaser release` invocation now builds all four
#       targets AND runs the archive/checksum/notarize/signs/sboms/release
#       pipes below (REL-06, SIGN-01). They are LIVE, not inert. The
#       archives: entry with id: raw carries the asset-naming contract with
#       internal/upgrade.releaseAssetName() (contract shape:
#       codegraph_<tag>_<goos>_<goarch>, using the v-prefixed tag, not
#       the prefix-stripped version) — TestReleaseAssetNameMatchesGoReleaser
#       (internal/upgrade/verify_release_e2e_test.go) pins the two
#       independent implementations of that string together. If you
#       change the raw entry's name_template, you MUST also change
#       internal/upgrade.releaseAssetName() in the same change, or
#       `codegraph upgrade` 404s on a genuine, correctly-published
#       release.
#
#   (b) The reproducibility flags on every build entry (-trimpath,
#       -buildid=, mod_timestamp) exist so the DIST-04 double-build
#       determinism gate (Plan 08-08) can byte-for-byte diff two builds
#       of the same commit. Do not remove them.
#
#   (c) Signing, notarization, and SBOM generation are performed HERE, by
#       the notarize:, signs:, and sboms: pipes below, under a single
#       `goreleaser release` invocation (REL-06) — NOT by a hand-rolled
#       shell loop in release.yml's assemble job. That hand-rolled loop
#       is deleted in the same phase (plan 01-03). Per D-18 (LOCKED,
#       maintainer, 2026-08-09): cosign signs via the RELEASE-scoped
#       signs: pipe (registered after GoReleaser's hardcoded BuildPipeline
#       Go slice, and therefore after notarize:, which mutates the
#       Mach-O in place) — never the build-scoped binary_signs: key,
#       which would sign PRE-notarization bytes. The native 4-target
#       build remains OSS-only: no GoReleaser Pro `release --split`,
#       `continue --merge`, or prebuilt-builder directive is used
#       anywhere in this file.
#
#   (d) Native Windows is NOT a supported platform (quick task
#       260807-gho). Windows users run the linux/amd64 binary under
#       WSL2. Do not re-add windows build entries here without
#       reversing that decision in README.md's Supported platforms
#       section and re-adding the corresponding release.yml matrix
#       legs, CI vet jobs, and internal/upgrade .exe handling.

version: 2

project_name: codegraph

builds:
  # Both linux legs cross-compile via zig cc/zig c++ (D-01/D-02, REL-05):
  # this is what makes a single macOS host able to produce all four release
  # targets in one `goreleaser release` invocation (Phase 1 spike). The
  # amd64 leg no longer uses the runner's native gcc — see
  # codegraph-linux-arm64 below, which already did this before this phase.
  - id: codegraph-linux-amd64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    flags:
      - -trimpath
    ldflags: &version_ldflags
      - -s
      - -w
      - -buildid=
      - -X github.com/seanb4t/codegraph-go/internal/version.Version={{ .Tag }}
      - -X github.com/seanb4t/codegraph-go/internal/version.Commit={{ .FullCommit }}
      - -X github.com/seanb4t/codegraph-go/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: codegraph-linux-arm64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

  # darwin/amd64 and darwin/arm64 are built NATIVELY on a macos-latest
  # runner (Finding 2): cross-compiling darwin from Linux via zig risks
  # breaking libresolv-based DNS resolution in the resulting binary, so
  # no CC/CXX override is set here — the runner's own Xcode clang
  # already targets both darwin arches correctly.
  - id: codegraph-darwin-amd64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: codegraph-darwin-arm64
    main: ./cmd/codegraph
    binary: codegraph
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags: *version_ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

# Raw per-platform binaries, NEVER tar.gz/zip for the `raw` entry (D-02/
# Finding 1): the upgrade path in internal/upgrade downloads and swaps in
# that exact byte stream directly, with no archive extraction step. A
# second `zip` entry (REL-09/D-15) carries the SAME per-platform stem
# plus `.zip`, for consumers (e.g. Phase 3's Homebrew cask) that want an
# archive instead of a raw executable — the two coexist deliberately
# (add-alongside, not promote: see 01-02-PLAN.md's assumption-delta
# decision) and `codegraph upgrade` only ever consumes the `raw` entry.
#
# NOTE (updated from the WR-01/Phase 8 "dead configuration" note): this
# block and the checksum: block below are now LIVE under
# `goreleaser release` (REL-06) — see the header comment at the top of
# this file, which plan 01-02's Task 2 brings up to date with the
# binary_signs:/sboms:/release: blocks it adds.
archives:
  - id: raw
    ids:
      - codegraph-linux-amd64
      - codegraph-linux-arm64
      - codegraph-darwin-amd64
      - codegraph-darwin-arm64
    formats: [binary]
    # UNCHANGED character-for-character (D-02/Finding 1): this is a
    # runtime contract with internal/upgrade.releaseAssetName(), pinned
    # by TestReleaseAssetNameMatchesGoReleaser
    # (verify_release_e2e_test.go) and TestRawArchiveEntryStaysBinaryFormat
    # (goreleaser_shape_test.go). `codegraph upgrade` downloads and swaps
    # in this exact byte stream with no extraction step — changing
    # `formats:` away from `binary`, or changing name_template by a
    # single character, bricks every user's next upgrade.
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}

  - id: zip
    ids:
      - codegraph-linux-amd64
      - codegraph-linux-arm64
      - codegraph-darwin-amd64
      - codegraph-darwin-arm64
    formats: [zip]
    # Same stem as the `raw` entry plus `.zip` (D-15). No `files:`
    # override — relies on GoReleaser v2.17.1's actual default archive
    # file set: the binary plus LICENSE*, README* AND CHANGELOG*
    # (internal/pipe/archive/archive.go:83-91 in the pinned module; this
    # repo has a real CHANGELOG.md at the root, so it is included). D-16's
    # binding requirement is that shell completions and man pages stay
    # OUT of this zip, because BREW-03/BREW-04 generate those from the
    # binary at Homebrew cask-build time and shipping them here would
    # create a second, staler source — NOT that the file set is limited
    # to exactly "binary + LICENSE + README" (that description was
    # incomplete; see cycle-3 review, Codex Plan-02 MEDIUM).
    name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Tag }}_checksums.txt"
  algorithm: sha256
  # D-12: scoped to exactly the 8 downloadable payloads (4 raw binaries +
  # 4 zips). `.sigstore.json`/`.spdx.json` sidecars and this checksums
  # file itself are deliberately excluded — checksumming a signature is
  # circular. Held by TestChecksumCoversRawAndZipIdsOnly. (This block is
  # NOT yet the sole writer of the published checksums file on its own —
  # that additionally requires plan 01-03 to delete release.yml's
  # hand-rolled `sha256sum` step, proven post-publish by plan 01-05.)
  ids: [raw, zip]

# notarize: (SIGN-01, D-01/D-04/D-18) performs Developer ID codesigning AND
# Apple notarization submission for the two darwin raw Mach-O binaries,
# entirely in-process via github.com/goreleaser/quill (already an indirect
# dependency, go.tool.mod:236) — never a codesign/xcrun notarytool
# shell-out. notary.MacOS{} is registered inside GoReleaser's hardcoded
# BuildPipeline Go slice (internal/pipeline/pipeline.go, pinned
# goreleaser/v2@v2.17.1), which is why it runs before archives:/checksum:/
# sboms:/signs: below with no reordering needed in this file — GoReleaser's
# pipe order is a HARDCODED SLICE, NOT driven by this file's block order.
#
# notary.MacOS is a SIGN-AND-NOTARIZE pipe: quill.Sign embeds the Mach-O's
# LC_CODE_SIGNATURE load command IN PLACE (Apple's notarization submission
# itself mutates nothing). This is why signs: below — not the old
# build-scoped binary_signs: key — is what must run after it; see that
# block's comment for the full ordering rationale (D-18).
#
# `ids:` names ONLY the two darwin build ids explicitly — the default is
# [ProjectName] ("codegraph"), which matches NEITHER build id and produces
# a SILENT, non-fatal skip (pipe.Skipf): a green `goreleaser release` log
# with un-notarized darwin binaries and no error anywhere. Held by
# TestNotarizeMacosIdsCoverDarwinBuildIDs, an EXACT-SET assertion (fails on
# too little — matches D-15's "raw Mach-O is the only notarized subject" —
# AND on too much, e.g. the zip archive id smuggled into what is a
# BUILD-id filter, a different namespace from signs[].ids' ARCHIVE-id
# filter below).
#
# `enabled:` gates on ALL FIVE credential variables CONJUNCTIVELY, not on
# the certificate alone. `notary.MacOS` IS reachable from `goreleaser
# build` (unlike signs:, which is release-scoped and therefore is NOT) —
# see Taskfile.yml's per-target notarize-reachability comments (D-18) — so
# an ordinary developer's `check:darwin-release-build` run reaches this
# gate on a half-populated environment. At source, when the notary inputs
# are absent the pipe SIGNS the binary, logs that it will not attempt
# notarization, and CONTINUES: a partial credential set does not fail
# loudly, it ships a signed-but-un-notarized binary behind a green log. A
# single separate enable flag was considered and REJECTED (a sixth input
# whose accidental presence could enable an incomplete credential set is
# exactly the failure this gate exists to prevent) — one mechanism, five
# terms, no override. Held by TestNotarizeMacosEnabledIsEnvGated, a static
# backstop resolving this template under 7 controlled environments.
#
# `sign:` declares NO entitlements key (D-03): quill embeds nothing when
# it is unset while still applying the hardened-runtime code-directory
# flag UNCONDITIONALLY (Apple requires hardened runtime for notarization
# regardless). This repo's own CGo tree-sitter grammars compile at BUILD
# time, not runtime, so no JIT/unsigned-executable-memory entitlement
# should be needed — Criterion 4 (running the real suite against the real
# notarized binary) is what converts that "should" into "measured". Held
# by TestNotarizeMacosOmitsEntitlements; a future entitlements: addition
# must turn it red so it is a deliberate decision, not drift.
#
# `wait: true` blocks the pipe until Apple responds. `timeout:` is a
# PER-BINARY budget, not a shared one: the per-binary loop inside this ONE
# entry is a plain sequential range (notary.MacOS parallelizes ACROSS
# notarize.macos config entries via a semaphore error group, never within
# one), so this two-id entry's wall-clock worst case is the SUM of two
# such budgets, not the max of a concurrent pair — held by
# TestNotarizeMacosHasExactlyOneEntry, which also rejects a second entry
# outright, since a second entry would change that parallelism model.
# At source, a timeout status and a pending status are BOTH logged and
# then continued past — NEITHER fails the pipe. A slow Apple response on
# release day can therefore ship signed-but-un-notarized binaries behind a
# green release log; the post-release Gatekeeper job (plan 02-06,
# `task verify:gatekeeper`) is the compensating control that turns that
# into a red signal.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_ISSUER_ID") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids:
        - codegraph-darwin-amd64
        - codegraph-darwin-arm64
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        # entitlements: intentionally OMITTED — D-03's working hypothesis,
        # measured by Criterion 4. See the block comment above.
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# signs: (D-18, LOCKED, maintainer, 2026-08-09) — cosign now signs via this
# RELEASE-SCOPED pipe, not the build-scoped `binary_signs:` key this
# project used before. GoReleaser's pipe execution order is a HARDCODED GO
# SLICE (internal/pipeline/pipeline.go, pinned goreleaser/v2@v2.17.1), not
# driven by this file's block order: `sign.Pipe{}` (this block) is
# registered well AFTER BuildPipeline entirely, and therefore after
# `notary.MacOS{}` (notarize: above) — which is a SIGN-AND-NOTARIZE pipe
# whose signing half rewrites the Mach-O's LC_CODE_SIGNATURE load command
# IN PLACE. Moving cosign here, instead of the old build-scoped key (which
# ran BEFORE notarize and therefore signed PRE-notarization bytes), is
# what makes the cosign-signed subject, the archived subject, the
# checksummed subject, and the SLSA-attested subject all describe the
# SAME, post-notarization bytes by construction — the property SIGN-04
# requires and TestSignsSidecarMatchesUpgradeContract pins.
#
# RETRACTED: a prior revision of this comment block claimed the `signs:`
# pipe's `artifacts: binary` mode "requires archives.formats: binary
# project-wide" and used that as the reason to prefer `binary_signs:`.
# That claim is FALSE at source level (D-18/A4, confirmed against the
# pinned v2.17.1 module): the filter is PER-ARTIFACT-TYPE
# (`artifact.ByType(artifact.UploadableBinary)`, internal/pipe/sign/
# sign.go:113-114), and the coexisting `zip` archives: entry produces a
# different artifact type (`UploadableArchive`) that this filter does not
# match — no project-wide precondition exists. `ids: [raw]` below scopes
# it explicitly to just the `raw` archives: entry regardless. GoReleaser
# is not wrong and this was never an upstream bug — the prior config was
# simply asking GoReleaser for the wrong thing.
#
# IMPORTANT — this is NOT the same substitution behavior as sboms: below,
# and gets it wrong if you copy that pattern verbatim. GoReleaser's
# `signs:` pipe, with `artifacts: binary`, filters
# `artifact.ByType(artifact.UploadableBinary)` (internal/pipe/sign/
# sign.go:113-114 in the pinned goreleaser/v2@v2.17.1 module) — narrowed
# by `ids: [raw]` below to exactly the archives: `raw` entry's per-platform
# UploadableBinary artifacts, the SAME on-disk file quill's notarize pipe
# already mutated in place (`Path: binary.Path`, `archive.Pipe`'s `skip()`
# branch, internal/pipe/archive/archive.go:296-310). For the PUBLISHED
# signature asset's name, `${artifact}` in a `signature:` template expands
# to that artifact's `.Name` — GoReleaser's own documented
# `signature: "${artifact}.sigstore.json"` idiom collapses to the single
# literal `codegraph.sigstore.json` for every one of the 4 platforms
# (confirmed in internal/pipe/sign/sign.go's signone(): env["artifact"] is
# reset to art.Name, not art.Path, for the second/publish-naming template
# pass; internal/tmpl/tmpl.go's WithArtifact binds artifactName: a.Name).
# With release.replace_existing_artifacts: true (see release: below) this
# clobbers 3 of 4 sidecars SILENTLY: the exact same defect class cycle-3
# review caught in sboms.documents (HIGH-B), but for signatures. The fix
# mirrors sboms' own authorized fallback: template on Go-template FIELDS
# (.ProjectName/.Tag/.Os/.Arch, bound from that same artifact's correct
# per-platform Goos/Goarch) instead of the $artifact env var, mirroring
# the `raw` archive entry's name_template character-for-character. Held
# by TestSignsSidecarMatchesUpgradeContract, which RESOLVES this template
# for all four platforms and asserts the results are four DISTINCT
# strings each matching internal/upgrade's download contract — not a
# literal string match, per the same "assert the property, not the
# literal" discipline cycle-3 review required for sboms.documents. Never
# revert to a bare `${artifact}` form.
signs:
  - cmd: cosign
    ids: [raw]
    signature: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: binary

# sboms: (D-17) reproduces today's hand-rolled
# `syft "$f" -o spdx-json="${f}.spdx.json"` loop (release.yml's assemble
# job, deleted by plan 01-03) declaratively, per-binary. `artifacts:
# binary` is set EXPLICITLY — the pipe's own default is `archive`, and
# leaving it defaulted would silently catalog the new `zip` entries
# instead, dropping the per-binary DIST-03 contract. The zips
# deliberately get no separate SBOM: their contents (the same binary
# already catalogued here, plus LICENSE/README/CHANGELOG) would be a
# duplicate.
#
# `documents:` is NAME-derived (`{{ .ArtifactName }}`), NOT PATH-derived
# (`${artifact}`) — this is cycle-3 review HIGH-B and is a correctness
# requirement, not a style choice. GoReleaser's sboms: pipe, with
# artifacts: binary, dedupes by PATH preferring the archives: pipe's
# renamed UploadableBinary artifact
# (internal/artifact/artifact.go:734 ByBinaryLikeArtifacts, pinned
# goreleaser/v2@v2.17.1 module), whose .Path is still the pre-rename
# build output but whose .Name (bound to Go-template field
# .ArtifactName by internal/tmpl's WithArtifact) IS the renamed,
# per-platform `raw` asset name. A `${artifact}`-based (path-derived)
# template would therefore resolve to the same `codegraph.spdx.json`
# for all 4 platforms; `{{ .ArtifactName }}.spdx.json` resolves to the
# four distinct `codegraph_<tag>_<goos>_<goarch>.spdx.json` names
# today's syft loop publishes. Held by TestSbomsArePerBinaryWithSpdxNames,
# which RESOLVES this template for all four platforms and asserts the
# results are four DISTINCT strings, not a literal string match. Plan
# 01-06's `release:dry-run-signed` leg resolves this template against a
# REAL pipe (not just this static config assertion) before the
# irreversible publish.
sboms:
  - id: binary-sbom
    artifacts: binary
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# release: (review HIGH-2) pins rerun idempotency and prerelease
# handling in config rather than inheriting GoReleaser's defaults, which
# would silently drop both behaviors the deleted (plan 01-03)
# `gh release upload --clobber` step (release.yml) provided today.
#
# NOTE: the release: pipe is the one pipe in this configuration that no
# dry run can exercise — `goreleaser release --snapshot --skip=publish,sign`
# structurally cannot reach it, and there is no local mode that publishes
# to a real GitHub Release without publishing to a real GitHub Release.
# Every other contract in this phase is proven by a demonstrated-RED test
# or a canary run; this one is proven by pinning the config explicitly
# instead of inheriting defaults, and is observed for the first time
# during plan 01-05's real release (see its Task 2 checkpoint).
release:
  # GoReleaser v2.17.1 defaults this to false (pkg/config/config.go:671).
  # The pre-migration publisher was `gh release upload --clobber`
  # (release.yml:325), so re-running a failed or partial release was
  # safe and idempotent. Deleting that step (plan 01-03) WITHOUT setting
  # this key would make a re-run after a partial upload fail on
  # already-existing assets — blocking the patch-forward recovery D-07
  # mandates, at exactly the moment it is needed, since D-07 also
  # forbids deleting the tag to retry. Held by
  # TestReleaseBlockIsRerunIdempotent.
  replace_existing_artifacts: true
  # Replaces release.yml:306's `*-*) PRERELEASE_FLAG="--prerelease"`
  # case: `auto` marks a release as a prerelease when the tag contains a
  # prerelease identifier, the same rule expressed declaratively.
  prerelease: auto
  # No name_template/header/footer/draft/disable key: release-please
  # creates the tag AND the GitHub Release object with its own generated
  # body BEFORE release.yml ever fires (release-please.yml:57-92), so
  # GoReleaser's job is only to add assets to an ALREADY-EXISTING
  # Release. Regenerating the body would move release authorship away
  # from the tool D-06R reserves it to. Held by
  # TestReleaseBlockDoesNotRewriteReleaseBody.

# homebrew_casks: (BREW-01/03/04, D-14/D-15/D-16/D-05) publishes
# Casks/codegraph.rb to the seanb4t/homebrew-tap repository (D-14,
# maintainer-confirmed 2026-08-09: `brew tap seanb4t/tap && brew install
# codegraph`) on every release. `cask.Pipe{}` is registered in TWO
# GoReleaser pipelines in the pinned v2.17.1 module: the MAIN pipeline
# (internal/pipeline/pipeline.go:155, which RENDERS
# dist/homebrew/Casks/codegraph.rb) and the PUBLISH pipeline
# (internal/pipe/publish/publish.go:64, which PUSHES it to the tap,
# ordered last — "brew et al use the release URL, so, they should be
# last"). `--snapshot` sets skips.Publish and therefore skips only the
# second; the render always happens (Taskfile.yml's
# release:rehearse-cask target rehearses exactly that render + a real
# local `brew install`, never the tap push).
#
# Discretionary metadata (03-CONTEXT.md "Claude's Discretion"), decided
# and recorded here rather than left to a GoReleaser default:
#
#   - Platform scope: this block makes NO cross-platform claim. `ids:
#     [zip]` (below) is an ARCHIVE-id filter required to avoid
#     ErrMultipleArchivesSameOS — it is NOT an OS-scoping mechanism, and
#     HomebrewCask has no os:/platform: field in this pinned v2.17.1
#     (confirmed: pkg/config/config.go's HomebrewCask struct has none).
#     Because the `zip` archive entry covers all 4 platforms, the
#     rendered cask's `on_linux do ... end` block IS populated with real
#     linux URLs/sha256 (measured this session against a real snapshot
#     render) — a structural side effect of sharing one archive entry
#     with the raw-binary/direct-download path, not a deliberate
#     cross-platform decision. Every verification path this phase runs
#     (Gatekeeper quarantine, notarization, the rehearsal itself) is
#     macOS-only; no claim is made or tested about linuxbrew cask
#     installability.
#   - livecheck: GoReleaser's cask.rb template (templates/cask.rb)
#     unconditionally emits `livecheck do skip "Auto-generated on
#     release." end` for every cask — there is no config field to set;
#     nothing to add here.
#   - auto_updates: HomebrewCask has no such field and the template never
#     emits an `auto_updates` stanza in this pinned version — not
#     settable through this pipe. codegraph's own self-updater
#     (`codegraph upgrade`) is unrelated to this cask-level claim, and
#     Phase 4 teaches it to refuse under a brew-managed install, detected
#     structurally from the resolved install path plus Homebrew's own
#     install receipt (D-02/D-03) — no marker file is written or read.
#   - depends_on (macOS minimum): NOT asserted. HomebrewCaskDependency
#     (pkg/config/config.go) carries only Cask/Formula fields with an
#     explicit `// TODO: support macos, arch` comment — this pinned
#     GoReleaser version cannot express a macOS-version depends_on for
#     casks at all, so there is no evidence-backed floor to assert; this
#     is an unavailable mechanism, not a declined one.
homebrew_casks:
  - name: codegraph
    directory: Casks # GoReleaser's own default; explicit for clarity.
    ids:
      # LOAD-BEARING (RESEARCH.md Pattern 1, traced to
      # internal/pipe/cask/cask.go's doRun()/dataFor()): this file
      # declares TWO archive entries (`raw`, `zip`) covering the
      # identical 4 platforms. cask.Pipe{}'s default artifact filter (no
      # ids: set) matches BOTH shapes for every platform, and
      # dataFor()'s platformCounts check then throws
      # ErrMultipleArchivesSameOS ("one tap can handle only one archive
      # of an OS/Arch combination. Consider using ids in the
      # homebrew_casks section"). Scoping to the `zip` archive id alone
      # — never `raw`, never both — is the fix the pipe's own error
      # names.
      - zip
    # url.template: deliberately OMITTED (RESEARCH.md Pattern 2). The
    # unset default is GoReleaser's own `{{ .ArtifactName }}`-derived
    # ReleaseURLTemplate (Name-derived) — a hand-written `${artifact}`
    # (Path-derived) form is the exact collision class this file's
    # signs:/sboms: blocks each independently document having hit
    # before. Do not add a url: key here without re-reading both.
    repository:
      owner: seanb4t
      name: homebrew-tap
      branch: main
      # GitHub App installation token (D-16), minted per-release and
      # scoped to homebrew-tap ALONE — a SEPARATE client from this
      # release's own GITHUB_TOKEN (internal/client/client.go:153-166,
      # NewIfToken). Wired here now; the App itself and the workflow job
      # that mints HOMEBREW_TAP_TOKEN land in plan 03-03.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/seanb4t/codegraph-go"
    # Mirrors internal/cli/root.go's newRootCmd().Short verbatim — one
    # product description in one place, never a second hand-written one
    # that can drift (the same drift shape D-15 rejected one level up).
    description: "Pre-indexed code knowledge graph for coding agents"
    binaries:
      # Plural form only (`binary`/`manpage` singular fields are
      # Deprecated on the pinned HomebrewCask struct,
      # pkg/config/config.go:246-250, and emit a deprecate.Notice).
      - codegraph
    # generate_completions_from_executable (BREW-03, D-06): executes the
    # INSTALLED binary at install time — `codegraph completion <shell>`
    # already works with no CLI changes (Cobra 1.10.2 auto-registers
    # `completion`; root.go never sets CompletionOptions.DisableDefaultCmd
    # — confirmed against the binary release:rehearse-cask itself
    # installs, not merely assumed). `executable:` is left unset
    # deliberately: cask.go:78-79 auto-defaults it to `binaries[0]`
    # ("codegraph") whenever shells/shell_parameter_format make this
    # block "configured" — an explicit executable: would be a second,
    # potentially-drifting spelling of the same binary name already
    # named above. `shells:` is DELIBERATELY the three-element set below
    # — narrower than Homebrew's own SUPPORTED_SHELLS default, which also
    # includes pwsh, an unrequested shell whose generation failure would
    # produce a warning nobody asked for.
    #
    # This artifact is NOT the install gate — see hooks.post.install's
    # own comment below for the mechanistic reason
    # (Cask::Artifact::GeneratedCompletion#write_completion swallows its
    # own execution failure via `rescue => e; opoo e`); the two
    # mechanisms both execute the binary but must never be confused for
    # one another.
    generate_completions_from_executable:
      shells: [bash, zsh, fish]
      shell_parameter_format: cobra
    hooks:
      post:
        install: |
          # D-10: the install itself is BREW-05's gate. system_command's
          # default is must_succeed: true (Homebrew's SystemCommand.run!),
          # and Cask::Installer#install_artifacts does not rescue that
          # failure — it rolls back and re-raises (installer.rb:330-354:
          # "rescue => e ... ensure purge_versioned_files; raise e"), so
          # `brew install` exits non-zero for the first user whose binary
          # cannot even run `man` or reports the wrong version.
          # generate_completions_from_executable below CANNOT play this
          # role: Cask::Artifact::GeneratedCompletion#write_completion
          # (generated_completion.rb:138-148) wraps its own execution of
          # the binary in `rescue => e; opoo e` — a warning, not a raise
          # (RESEARCH.md Pitfall 1; measured directly by this repo's own
          # perturbation in Taskfile.yml's release:rehearse-cask, which
          # deliberately breaks that stanza and observes a green exit).
          # This hook — and only this hook — is BREW-05's gate.
          binary = "#{HOMEBREW_PREFIX}/bin/codegraph"
          man_dir = "#{HOMEBREW_PREFIX}/share/man/man1"

          # UF-5 fix (review cycles 1-2): a per-path freshness BASELINE,
          # not a wall-clock guess. A "one second before the hook started"
          # oracle carries a one-second window in which a page written by
          # a PREVIOUS run counts as fresh, and it is additionally
          # sensitive to filesystem timestamp precision and to clock
          # adjustment; a before/after snapshot of the exact
          # `codegraph*.1` set has no wall-clock slack at all. Records
          # BOTH mtime AND size per path — mtime alone cannot detect a
          # same-tick rewrite (see the residual note below the freshness
          # check). Missing pages are simply absent from the Hash — their
          # absence is what makes a newly-created page detectable.
          man_pages_before = Dir.glob("#{man_dir}/codegraph*.1").each_with_object({}) do |p, h|
            h[p] = { mtime: File.mtime(p), size: File.size(p) }
          end

          # Assertion one (D-11): the man generation produced something.
          # Reads the directory rather than trusting the exit status alone
          # — a binary that ran and wrote nothing would otherwise pass
          # vacuously (repo rule 84d1gfpywd). No specific count is
          # pinned: the page tree grows with every new subcommand, and a
          # pinned count would turn that growth into a broken install.
          system_command binary, args: ["man", man_dir]
          man_pages = Dir.glob("#{man_dir}/codegraph*.1")
          if man_pages.length <= 1
            raise "codegraph cask post-install: expected more than 1 man page under #{man_dir}, found #{man_pages.length}"
          end

          # Assertion one-and-a-half, UF-5 (T-04-05): the pages this run
          # produced are actually FRESH, not residue from a prior failed
          # install (03-EVIDENCE.md:815-833 measured 30 such orphans —
          # Homebrew's rollback purges the Caskroom but never runs the
          # uninstall hook that would have cleaned this shared directory).
          # A page is fresh when it is absent from man_pages_before (newly
          # created by this run), its mtime advanced past the baseline
          # (rewritten by this run), or its size differs from the baseline
          # (rewritten within the same timestamp tick — the
          # coarse-granularity case, only detectable because the baseline
          # also recorded size). Freshness rather than growth is
          # deliberate and load-bearing: a `brew reinstall` rewrites the
          # SAME pages, so a count-grew assertion would break Step 5d's
          # idempotency rehearsal, while this comparison passes on
          # reinstall (rewritten pages advance past their own baseline)
          # and still fails the case UF-5 named: a binary that ran, exited
          # 0, and wrote nothing over a directory of residue.
          #
          # Residual, stated rather than hidden: if a filesystem's mtime
          # granularity is coarse enough that a rewrite within the same
          # tick leaves the mtime byte-identical AND the rewritten content
          # happens to be the same length, a pure-rewrite reinstall could
          # read as not-fresh — a rewrite byte-identical in both length
          # and timestamp is indistinguishable from no rewrite at all, and
          # no metadata comparison can close that. The rehearsal's
          # independent `find -newer` probe against a real marker file
          # (Taskfile.yml's release:rehearse-cask) is the second,
          # independent check of the same property.
          fresh_man_pages = man_pages.select do |p|
            before = man_pages_before[p]
            before.nil? || File.mtime(p) > before[:mtime] || File.size(p) != before[:size]
          end
          if fresh_man_pages.empty?
            raise "codegraph cask post-install: 0 of #{man_pages.length} codegraph*.1 page(s) under #{man_dir} are fresh (before=#{man_pages_before.length}, total=#{man_pages.length}, fresh=#{fresh_man_pages.length}) — the binary ran but produced no new or rewritten man pages"
          end

          # Assertion two (D-11): it is the right artifact. Equality on
          # values normalized by stripping a single leading "v" — never
          # containment, since "0.8.0" is contained in both "0.8.01" and
          # "10.8.0". `version` here is the Ruby DSL delegate (the cask's
          # OWN declared version, base/dsl/base.rb:25's def_delegators),
          # not a Go identifier.
          version_result = system_command binary, args: ["version", "--json"]
          reported_version = JSON.parse(version_result.stdout)["version"].to_s.sub(/\Av/, "")
          declared_version = version.to_s.sub(/\Av/, "")
          if reported_version != declared_version
            raise "codegraph cask post-install: installed binary reports version #{reported_version.inspect}, cask declares #{declared_version.inspect}"
          end

          # Idempotency: every step above tolerates re-running over an
          # existing install. `codegraph man`'s own os.MkdirAll is
          # create-if-absent and doc.GenManTree overwrites each page — and
          # a `brew reinstall` rewriting those pages is exactly the case
          # the freshness assertion above is designed to still pass: each
          # rewritten page's mtime (or size, for a same-tick rewrite)
          # advances past its own baseline. Homebrew re-runs this hook on
          # both reinstall and upgrade.
        uninstall: |
          # D-07: symmetric with post.install — brew does not track files
          # a hook writes, so they must be removed explicitly, via an
          # explicit statement rather than a chained `&&` list. The
          # declarative `uninstall: delete:`/`zap: trash:` stanzas were
          # rejected: these are artifacts THIS CASK generated, not user
          # data. Force-style removal (no error on an already-absent
          # file) because the man pages may legitimately already be gone
          # (e.g. a prior manual cleanup).
          man_dir = Pathname.new("#{HOMEBREW_PREFIX}/share/man/man1")
          Dir.glob((man_dir/"codegraph*.1").to_s).each { |f| FileUtils.rm_f(f) }
