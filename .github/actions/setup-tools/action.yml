# Installs the tools mise.toml pins and puts their real bin directories on PATH.
# Prebuilt downloads are verified against mise.lock checksums; `go:` tools are
# built from source and verified by the Go checksum database. Shims stay off
# PATH: a shim resolves its version from the working directory, and several
# Taskfile targets run tools from scratch directories outside the repository.
name: Set up tools
description: Install the tools pinned in mise.toml and add them to PATH.
inputs:
  tools:
    description: >-
      Space-separated mise tool names to install, each also the name of the
      command it provides. Empty installs every tool in mise.toml.
    default: ""
  cache:
    description: >-
      "false" keeps mise's tool cache out of the job. The release job and the
      pull_request_target jobs set it.
    default: "true"
  go-cache:
    description: >-
      "true" caches the Go module and build caches with actions/cache. Use it
      on GitHub-hosted runners; Namespace jobs cache Go with
      namespacelabs/nscloud-cache-action instead.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise and the pinned tools
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.18
        install_args: ${{ inputs.tools }}
        cache: ${{ inputs.cache }}
        add_shims_to_path: false

    - name: Locate the Go caches
      id: go-cache-paths
      if: inputs.go-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        gomodcache=$(go env GOMODCACHE)
        gocache=$(go env GOCACHE)
        {
          echo "gomodcache=${gomodcache}"
          echo "gocache=${gocache}"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Go modules and builds
      if: inputs.go-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.gomodcache }}
          ${{ steps.go-cache-paths.outputs.gocache }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum') }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

    - name: Verify the tools on PATH are the mise installs
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        check=${TOOLS:-go task}
        for tool in ${check}; do
          have=$(command -v "${tool}" || true)
          want=$(mise which "${tool}") || { echo "::error::mise has no install of ${tool}: list only tools pinned in mise.toml"; exit 1; }
          [ "${have}" = "${want}" ] || { echo "::error::${tool} on PATH is ${have:-missing}, not the mise install ${want}"; exit 1; }
          echo "${tool}: ${have}"
        done
        if [ -z "${TOOLS}" ] || [[ " ${TOOLS} " == *" go "* ]]; then
          [ "$(go env GOTOOLCHAIN)" = "local" ] || { echo "::error::GOTOOLCHAIN is $(go env GOTOOLCHAIN), want local (mise.toml [env])"; exit 1; }
        fi
