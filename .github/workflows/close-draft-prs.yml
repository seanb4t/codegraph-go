# Adapted from open-gsd/gsd-core (.github/workflows/close-draft-prs.yml).
#
# pull_request_target (not pull_request) so the job runs in the base-repo context
# with a write-capable token even for fork PRs. Under `pull_request`, a fork PR
# gets a read-only GITHUB_TOKEN regardless of the `permissions:` block, the
# close call 403s, and the gate silently does not apply. Safe here: this job
# performs NO checkout and executes no PR-supplied code — it reads event
# metadata only.
#
# Known gap, stated rather than implied: GitHub does not fire
# pull_request_target for fork branches whose names look like a Git SHA, so a
# contributor could evade this by naming their head branch like a commit hash.
# Closing that needs a scheduled base-context sweep (gsd-core has one; see the
# tracking issue). A draft PR that evades this still cannot merge — it fails
# every other gate and the branch ruleset.
name: Close Draft PRs

on:
  pull_request_target:
    types: [opened, reopened, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  close-if-draft:
    name: Reject draft PRs
    # Maintainers may use drafts for their own coordination.
    if: >-
      github.event.pull_request.draft == true &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comment and close draft PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '## Draft PRs are not accepted',
                '',
                'This project takes completed pull requests only, and draft PRs are closed automatically.',
                '',
                'This is not about the state of your work — it is that a draft bypasses the review gates while still consuming review attention. Open it when it is ready and it gets a real review.',
                '',
                '### What to do instead',
                '',
                '1. Finish the change locally',
                '2. `CGO_ENABLED=1 go test ./...` and `CGO_ENABLED=1 go vet ./...` clean',
                '3. Open a **non-draft** PR with the typed template that fits — fix, enhancement, or feature',
                '',
                `See [CONTRIBUTING.md](${repoUrl}/blob/main/CONTRIBUTING.md) for the full process. Reopening this PR once it is ready is fine.`,
              ].join('\n')
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });

            core.info(`Closed draft PR #${pr.number}: ${pr.title}`);
