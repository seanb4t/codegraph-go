# Adapted from open-gsd/gsd-core (.github/workflows/require-issue-link.yml).
#
# pull_request_target (not pull_request): a fork PR under `pull_request` gets a
# read-only GITHUB_TOKEN regardless of the `permissions:` block, so createComment
# 403s, the unhandled rejection kills the step, and the setFailed on the last
# line never runs — the contributor sees an API stack trace instead of guidance.
# Safe here: NO checkout, and the PR body is read only via an env var, never
# interpolated into a shell. No head code executes.
#
# DIVERGENCE from gsd-core: their version requires an issue on every PR. Our
# CONTRIBUTING.md exempts trivially mechanical changes (typo, dead link), so an
# explicit opt-out marker is honoured here. Without it this workflow would
# contradict the contributing guide, and one of the two would have to be wrong.
name: Require Issue Link

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  issues: write # the sticky guidance comment (issues.createComment works on PRs)
  pull-requests: read # `gh pr view --json files` for the path-based exemption
  contents: read

jobs:
  check-issue-link:
    name: Issue link required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Path-based auto-exemption, mirroring scripts/pr_template_policy.py's
      # EXEMPT_PREFIXES / EXEMPT_EXACT. Kept in shell so this job still performs
      # NO checkout — that is a security property of this workflow under
      # pull_request_target, not an accident. `gh pr view` needs no working tree.
      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "list<<PRFILES_EOF"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path'
            echo "PRFILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check PR body for an issue reference or an explicit exemption
        id: check
        env:
          # Bound to env vars — never interpolated into the shell directly.
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.files.outputs.list }}
        run: |
          set -euo pipefail

          # Does every changed path fall in a housekeeping area? GSD planning
          # artifacts live in .planning/ and have no GitHub issue by design, so
          # without this the gate fires on roughly half this repo's PRs — and a
          # gate that fires on routine work teaches people to bypass it
          # reflexively, which is what the exemption marker exists to prevent.
          all_exempt=true
          any_file=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            any_file=true
            case "$f" in
              .planning/*|docs/*|.github/*) ;;
              go.mod|go.sum|.gitignore|README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|NOTICE|LICENSE|CHANGELOG.md) ;;
              # Keep in sync with scripts/pr_template_policy.py's EXEMPT_EXACT.
              # Isolated tool modfiles (issue #18) and release-please's own
              # machinery — the release PR touches exactly
              # {.release-please-manifest.json, CHANGELOG.md}, and the bot
              # regenerates its body every run, so a manual exemption marker
              # cannot survive there.
              go.tool.mod|go.tool.sum|go.tool-lint.mod|go.tool-lint.sum) ;;
              .release-please-manifest.json|release-please-config.json) ;;
              *) all_exempt=false; break ;;
            esac
          done <<< "$CHANGED_FILES"

          if printf '%s' "$PR_BODY" | grep -qiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$any_file" = true ] && [ "$all_exempt" = true ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path_exempt=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$PR_BODY" | grep -qiE '<!--[[:space:]]*pr-issue-exempt:[[:space:]]*[^[:space:]>-]'; then
            # Exemption must carry a non-empty reason — a bare marker does not count.
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note the exemption
        if: steps.check.outputs.exempt == 'true'
        run: echo "::notice::PR claims a mechanical-change exemption from the issue-link requirement."

      - name: Note the path-based exemption
        if: steps.check.outputs.path_exempt == 'true'
        run: echo "::notice::All changed paths are housekeeping (.planning/, docs/, .github/, or a root manifest) — issue link not required."

      - name: Comment and fail if no issue link
        if: steps.check.outputs.found == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- codegraph-require-issue-link -->';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const prNumber = context.payload.pull_request.number;
            const body = [
              marker,
              '## Missing issue link',
              '',
              'This PR does not reference an issue. Add a closing keyword to the PR body:',
              '',
              '```',
              'Closes #123',
              '```',
              '',
              `If no issue exists yet, [open one first](${repoUrl}/issues/new/choose) — it is where prior context and project decisions surface before code gets written.`,
              '',
              '### Genuinely mechanical change?',
              '',
              'Typo, dead link, broken reference — say so explicitly and this check passes:',
              '',
              '```',
              '<!-- pr-issue-exempt: fixes a broken link in README -->',
              '```',
              '',
              'The reason must be non-empty. This re-evaluates on the next PR update.',
            ].join('\n');
            // The comment is a COURTESY; the setFailed below is the GATE. A
            // failure posting it must never suppress the verdict — this catch is
            // defence in depth so a future permission change degrades the
            // diagnostic, not the gate.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, body,
                });
              }
            } catch (err) {
              core.warning(`Could not post the missing-issue-link comment (${err.status || err.message}). Guidance follows:\n${body}`);
            }
            core.setFailed('PR body must contain a closing issue reference (e.g. "Closes #123"), or an explicit <!-- pr-issue-exempt: reason -->.');
