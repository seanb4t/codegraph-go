# release-please: version bump, CHANGELOG.md, and tag/GitHub-Release creation
# from Conventional Commits on every push to main.
#
# This file exists SOLELY to produce the App-authored tag push that
# release.yml's LOCKED trigger (`on: push: tags: v[0-9]*`) consumes. It
# MUST NOT build, sign, or publish anything itself — see
# .planning/phases/09-release-please-and-goreleaser/09-CONTEXT.md D-01/D-02.
#
# The GitHub App token (not the default GITHUB_TOKEN) is load-bearing: refs
# pushed with the default GITHUB_TOKEN do NOT trigger other workflow runs,
# so a default-token-authored tag would never fire release.yml and
# `codegraph upgrade` would have nothing to verify. App-token-authored refs
# DO trigger downstream workflows — this is exactly what makes release.yml
# fire on release-please's tag push with its trigger/SAN unchanged.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Ports docs/RELEASE-PROCEDURES.md §1's manual pre-tag sweep into a
  # blocking automated gate: release-please can never open/merge a release
  # PR (and therefore never cut a tag) from a `main` state that fails
  # cross-platform module resolution. This is the exact check that would
  # have caught the v0.1 rc.1 linux-only go.sum failure. Runs on every push
  # to main (not just "about to release") per 09-RESEARCH.md Open Question
  # 2 — release-please exposes no pre-check hook to gate more narrowly, and
  # the cost (six `go list` invocations) is low.
  pretag-gate:
    name: pre-tag 6-target go list sanity sweep
    # Deliberately OUTSIDE D-06's Namespace-runner migration scope (D-06
    # names exactly ci.yml/bench.yml/release.yml) — stays on GitHub-hosted
    # ubuntu-latest. It separately gains the task bootstrap below per D-15,
    # which is an unrelated decision that happens to intersect this job; do
    # not read the inconsistency with ci.yml's runner class as an oversight.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Run check:cross sweep
        run: task check:cross

  release-please:
    name: release-please
    needs: pretag-gate
    runs-on: ubuntu-latest
    # Job-level permissions below govern the default GITHUB_TOKEN ONLY. This
    # is a DIFFERENT scope from the GitHub App's own installation
    # permissions (configured at App-creation time in the GitHub UI, see
    # docs/RELEASE-PROCEDURES.md's App prerequisite section) — conflating
    # the two is a documented pitfall (09-RESEARCH.md Pitfall 2).
    permissions:
      contents: write # tag creation + GitHub Release creation (release-please)
      pull-requests: write # opening/updating the "chore: release X.Y.Z" PR
      issues: write # release-please labels its PRs autorelease:pending /
      # autorelease:tagged, and PR labels are governed by the
      # Issues API scope in GitHub's permission model
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        # actions/create-github-app-token's current required input is
        # client-id (App's Client ID); app-id (the numeric App ID) is kept
        # only as a deprecated back-compat alias. Both work; app-id is used
        # here to match D-02's documented secret names (APP_ID,
        # APP_PRIVATE_KEY) — migrating to client-id later requires
        # re-seeding the secret with the App's Client ID, not its App ID.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
