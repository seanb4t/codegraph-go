# Tag-triggered release workflow (DIST-01, DIST-02, DIST-03).
#
# LOCKED CONTRACT — do not change without reading internal/upgrade/verify.go
# (releaseWorkflowRefPattern) and .planning/phases/08-release-hardening-benchmarks/08-RESEARCH.md
# Finding 1/2 first:
#
#   - This file MUST be named release.yml (or release.yaml) and live at
#     .github/workflows/, and MUST trigger ONLY on tag pushes matching
#     v[0-9]* (see `on:` below). internal/upgrade/verify.go's
#     releaseWorkflowRefPattern anchors the cosign OIDC certificate's SAN
#     to exactly this file+ref shape:
#       ^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^\s]*$
#     Renaming this file, changing its trigger, or signing from a
#     different workflow silently breaks `codegraph upgrade` for every
#     user. If this file is ever renamed, releaseWorkflowRefPattern in
#     verify.go MUST change in lockstep.
#
#   - Native 2-OS runner matrix (RESEARCH.md Finding 2): darwin targets
#     build NATIVELY on macos-latest (Xcode clang, no zig, no osxcross)
#     because a Linux-hosted CGo cross-link to darwin risks silently
#     breaking libresolv-based DNS resolution in the resulting binary —
#     a real, multi-source-corroborated risk for a binary
#     (`codegraph upgrade`) that makes real HTTPS calls on every
#     platform, including macOS. Only linux/arm64 and both windows
#     targets cross-compile via zig, from ubuntu-latest.
#
#   - Per-binary signing (RESEARCH.md Finding 1, see the `assemble` job):
#     internal/upgrade's defaultVerify hashes the DOWNLOADED BINARY
#     ITSELF (sha256.Sum256(binary)), not a checksums file — cosign MUST
#     sign each binary individually.
#
#   - Every third-party Action below is pinned to a full commit SHA
#     (resolved from the exact release tag noted in the trailing
#     comment) except the SLSA generic generator, which slsa-verifier
#     requires to be referenced by a full @vX.Y.Z semver tag, not a SHA
#     (see the `provenance` job).

name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  # Pinned to the GoReleaser version validated locally in Plan 08-01
  # (goreleaser --version -> v2.17.0) for build-config reproducibility.
  GORELEASER_VERSION: "v2.17.0"

jobs:
  # Native 2-OS matrix: each of the 6 (goos,goarch) targets in
  # .goreleaser.yaml is built independently via
  # `goreleaser build --single-target` (an OSS command — no GoReleaser
  # Pro `release --split`/`continue --merge`/prebuilt-builder directive
  # is used anywhere in this workflow, per RESEARCH.md Finding 2/
  # Pitfall 3) and uploaded as a CI artifact. A later `assemble` job
  # downloads all 6 and does the release/sign/SBOM/publish work.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest builds linux + windows: native gcc for
          # linux/amd64 (no cross-toolchain needed); zig cc for the
          # linux/arm64 and windows cross targets (CC/CXX for these are
          # already set per-build-id inside .goreleaser.yaml itself —
          # this job only needs to ensure the `zig` binary is on PATH).
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            needs_zig: false
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            needs_zig: true
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            needs_zig: true
          - runner: ubuntu-latest
            goos: windows
            goarch: arm64
            needs_zig: true
          # macos-latest builds BOTH darwin arches NATIVELY (Xcode's own
          # clang, arch-only cross for darwin/amd64) — no zig, no
          # osxcross, no manually-sourced SDK: this is the darwin-DNS-
          # resolver mitigation (Finding 2 / Pitfall 2).
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            needs_zig: false
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            needs_zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # goreleaser needs full history + tags to resolve
          # {{.Tag}}/{{.FullCommit}}/{{.CommitDate}}/{{.CommitTimestamp}}.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zig (linux/arm64 + windows cross targets only)
        if: matrix.needs_zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.1"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Build single target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: goreleaser build --single-target --clean

      - name: Rename to release-asset contract name
        id: asset
        shell: bash
        # Pass workflow context via env (never interpolate ${{ }} directly
        # into the run script — a crafted tag name could otherwise inject
        # shell commands into the release runner). Referencing $TAG/$GOOS/
        # $GOARCH treats the values as data, not script text.
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          # internal/upgrade.releaseAssetName()'s exact contract shape
          # (Finding 1): codegraph_<tag>_<goos>_<goarch>[.exe]. Locate the
          # built binary via dist/artifacts.json — GoReleaser's own
          # documented stable lookup (dist/ subdirectory names are NOT
          # guaranteed stable across GoReleaser versions) — with a
          # defensive find(1) fallback if artifacts.json is absent or
          # doesn't contain a matching entry.
          BIN_PATH=""
          if [ -f dist/artifacts.json ]; then
            BIN_PATH=$(jq -r --arg goos "$GOOS" --arg goarch "$GOARCH" \
              '[.[] | select(.type=="Binary" and .goos==$goos and .goarch==$goarch)][0].path // empty' \
              dist/artifacts.json)
          fi
          if [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ]; then
            BIN_PATH=$(find dist -type f \( -name 'codegraph' -o -name 'codegraph.exe' \) | head -n1)
          fi
          if [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ]; then
            echo "::error::could not locate built binary for ${GOOS}/${GOARCH} under dist/"
            exit 1
          fi

          DEST="codegraph_${TAG}_${GOOS}_${GOARCH}${EXT}"
          cp "$BIN_PATH" "$DEST"
          echo "name=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error

  # Downloads all 6 binaries, computes checksums, signs EACH BINARY
  # individually with cosign v3 keyless (Finding 1 — internal/upgrade's
  # defaultVerify hashes the downloaded binary itself, never a checksums
  # file), emits a per-binary SBOM via syft, and publishes everything as
  # one GitHub release. SLSA provenance runs as a separate job below,
  # over this job's checksums file — provenance and the per-binary
  # cosign bundle serve different verifiers (slsa-verifier vs.
  # `codegraph upgrade`) and are allowed different scopes (Finding 1).
  assemble:
    name: sign, SBOM, and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create + asset uploads
      id-token: write # cosign keyless OIDC signing (Finding 1) — this
      # job's OIDC token is what produces the cert SAN
      # releaseWorkflowRefPattern anchors on: this exact
      # workflow file, triggered by this exact tag ref.
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download all built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "codegraph_*"
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum codegraph_* > "codegraph_${TAG}_checksums.txt"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign each binary individually (Finding 1)
        working-directory: release
        run: |
          set -euo pipefail
          # internal/upgrade's defaultVerify hashes the DOWNLOADED BINARY
          # ITSELF (sha256.Sum256(binary)) — cosign MUST sign each
          # binary individually here, producing a per-binary
          # <asset>.sigstore.json sidecar (cosign v3's --bundle flag).
          # Signing only the checksums file would make every real
          # `codegraph upgrade` fail signature verification (Finding 1).
          for f in codegraph_*; do
            case "$f" in
            *_checksums.txt | *.sigstore.json | *.spdx.json) continue ;;
            esac
            cosign sign-blob --bundle="${f}.sigstore.json" --yes "$f"
          done

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Per-binary SBOM (DIST-03)
        working-directory: release
        run: |
          set -euo pipefail
          for f in codegraph_*; do
            case "$f" in
            *_checksums.txt | *.sigstore.json | *.spdx.json) continue ;;
            esac
            syft "$f" -o spdx-json="${f}.spdx.json"
          done

      - name: Base64-encode checksums for SLSA provenance
        id: hash
        working-directory: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "hashes=$(base64 -w0 < "codegraph_${TAG}_checksums.txt")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          case "$TAG" in
          *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            codegraph_*

  # SLSA3 provenance via the GENERIC generator (not the Go builder,
  # which would rebuild the binary under its own fixed config and
  # cannot accommodate the zig-cc CGo cross-build) over the assemble
  # job's checksums file. Per slsa-github-generator's own documented
  # requirement, this reusable workflow MUST be referenced by a full
  # @vX.Y.Z semver tag — a SHA pin is explicitly rejected/unsupported
  # and a short tag (@v2) is rejected by slsa-verifier.
  provenance:
    name: SLSA provenance
    needs: assemble
    permissions:
      actions: read # required for the generator to detect the GH Actions environment
      id-token: write # provenance signing identity
      contents: write # upload provenance to the release created by `assemble`
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.assemble.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
