# Tag-triggered release workflow (DIST-01, DIST-02, DIST-03).
#
# LOCKED CONTRACT — do not change without reading internal/upgrade/verify.go
# (releaseWorkflowRefPattern) and .planning/phases/08-release-hardening-benchmarks/08-RESEARCH.md
# Finding 1/2 first:
#
#   - This file MUST be named release.yml (or release.yaml) and live at
#     .github/workflows/, and MUST trigger ONLY on tag pushes matching
#     v[0-9]* (see `on:` below). internal/upgrade/verify.go's
#     releaseWorkflowRefPattern anchors the cosign OIDC certificate's SAN
#     to exactly this file+ref shape:
#       ^https://github\.com/seanb4t/codegraph-go/\.github/workflows/release\.ya?ml@refs/tags/v[0-9][^\s]*$
#     Renaming this file, changing its trigger, or signing from a
#     different workflow silently breaks `codegraph upgrade` for every
#     user. If this file is ever renamed, releaseWorkflowRefPattern in
#     verify.go MUST change in lockstep.
#
#   - Single job, single runner class (plan 01-03, D-01, D-11): the
#     goreleaser job runs NATIVELY on a real Apple-Silicon macOS profile
#     (namespace-profile-macos-6x14-tahoe) and both linux legs
#     cross-compile via `zig cc`/`zig c++` from it (D-01/D-02, REL-05
#     enabling change, proven on real hardware by canary run 31273571889 —
#     see 01-01-SUMMARY.md). A Linux-hosted CGo cross-link to darwin risks
#     silently breaking libresolv-based DNS resolution in the resulting
#     binary — a real, multi-source-corroborated risk for a binary
#     (`codegraph upgrade`) that makes real HTTPS calls on every platform,
#     including macOS. Native Windows is not a supported platform (quick
#     task 260807-gho); Windows users run the linux/amd64 asset under
#     WSL2, so no windows leg exists here. Prior to plan 01-03 this file
#     ran a 4-leg build matrix on two runner classes plus a separate
#     assemble job with its own CI-artifact round trip; see
#     10-03-SUMMARY.md and 01-01-SUMMARY.md for that history.
#
#   - Per-binary signing (RESEARCH.md Finding 1): internal/upgrade's
#     defaultVerify hashes the DOWNLOADED BINARY ITSELF
#     (sha256.Sum256(binary)), not a checksums file — cosign MUST sign
#     each binary individually. This is done declaratively by
#     .goreleaser.yaml's binary_signs: pipe (plan 01-02), not a shell loop
#     in this file.
#
#   - Every third-party Action below is pinned to a full commit SHA
#     (resolved from the exact release tag noted in the trailing
#     comment) — UNCONDITIONALLY: the SLSA generic generator's
#     documented tag-pin exception left with it (D-09). Build
#     provenance moved from that third-party reusable workflow to
#     GitHub's first-party actions/attest-build-provenance, published
#     through GitHub's Attestations API rather than as an
#     .intoto.jsonl release asset — the verification command changed
#     accordingly; see docs/RELEASE.md § b (`gh attestation verify`,
#     never `slsa-verifier verify-artifact`, which architecturally
#     cannot verify this format, D-10).

name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  # Deliberately kept equal to go.tool.mod's goreleaser require line
  # (v2.17.1) — machine-enforced by TestGoreleaserPinParity in
  # internal/upgrade/taskfile_shape_test.go. Aligned upward to v2.17.1
  # (was v2.17.0) because go.tool.mod's pin is the one with live, repeated
  # PR validation (task check:goreleaser, task check:darwin-release-build);
  # this env value's prior "validated locally in Plan 08-01" provenance
  # predated both the Taskfile rewiring and go.tool.mod's existence.
  GORELEASER_VERSION: "v2.17.1"

jobs:
  # Collapsed single job (plan 01-03, D-01, D-11): one `goreleaser release`
  # invocation (task release:goreleaser), on one native macOS-class runner,
  # does everything the former build+assemble jobs did across two runner
  # classes and a CI-artifact round trip — cross-compile all four targets
  # (darwin native, linux via zig cc), checksum, sign, SBOM, and publish.
  # This job is the ONLY job in this file that can mint the OIDC token
  # producing the cert SAN releaseWorkflowRefPattern anchors on: this exact
  # workflow file, triggered by this exact tag ref (T-01-11 — the OIDC
  # write scope is now a machine check, TestOIDCWriteScopedToSingleGoreleaserJob,
  # not an eyeball one; see T-01-29 for the accepted intra-job execution
  # surface this collapse widens).
  release:
    name: build, sign, SBOM, and publish release
    runs-on: namespace-profile-macos-6x14-tahoe
    permissions:
      contents: write # publishing release assets
      id-token: write # cosign keyless OIDC signing (Finding 1) — this
      # job's OIDC token is what produces the cert SAN
      # releaseWorkflowRefPattern anchors on: this exact
      # workflow file, triggered by this exact tag ref. It is
      # the ONLY job in this file that can mint one (T-01-11, D-11:
      # exactly one job in this file may hold id-token: write —
      # machine-checked by TestOIDCWriteScopedToSingleGoreleaserJob,
      # no allowance).
      attestations: write # actions/attest-build-provenance (D-09) — new
      # permission GitHub's Attestations API requires; absent from
      # this job before this plan.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # goreleaser needs full history + tags to resolve
          # {{.Tag}}/{{.FullCommit}}/{{.CommitDate}}/{{.CommitTimestamp}}.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # nscloud-cache-action (present in the pre-collapse build job) is
      # deliberately NOT carried into this job: it now also holds
      # id-token: write, so every additional Action inside it is inside
      # the signing boundary, and a release build should not read from a
      # mutable cache any PR on any branch can populate (review synthesis
      # finding S2; T-01-29).

      - name: Install zig
        # UNCONDITIONAL (D-02): both linux build ids in .goreleaser.yaml
        # now cross via zig cc/zig c++ from this one darwin host — the
        # per-leg `if: matrix.needs_zig` guard the old build matrix used
        # no longer applies now that there is no matrix.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.1"

      - name: Install cosign
        # Moved up from the deleted assemble job: .goreleaser.yaml's
        # binary_signs: pipe shells out to cosign, so it must be on PATH
        # before goreleaser runs.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        # Moved up from the deleted assemble job: .goreleaser.yaml's
        # sboms: pipe shells out to syft, so it must be on PATH before
        # goreleaser runs.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install GoReleaser
        # GoReleaser install strategy, DECIDED (C6, not left to chance):
        # install-only: true keeps GORELEASER_VERSION's meaning concrete —
        # the version this Action installs — which is what
        # TestGoreleaserPinParity holds equal to go.tool.mod. A
        # Taskfile-only build would make this env var vestigial in CI and
        # quietly hollow that test (and the tool-vuln/VULN-01-02-03 gate's
        # view of the pinned tool version) out. It also avoids paying a
        # from-source GoReleaser build inside this OIDC-bearing job.
        # Taskfile.yml's release:goreleaser target prefers this installed
        # binary and falls back to building go.tool.mod's pin only as a
        # LOCAL convenience when no Action is available.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Install Task
        uses: ./.github/actions/install-task

      # The single run: body in this job (T-01-14): goreleaser release
      # --clean has exactly one definition, in Taskfile.yml's
      # release:goreleaser target (DEV-01) — workflow context reaches it
      # only via this step's env:, never interpolated into a run: body.
      # GoReleaser's release: pipe reads GITHUB_TOKEN — NOT GH_TOKEN, which
      # is the gh CLI's own variable (review MEDIUM, pi Plan-03).
      #
      # The five MACOS_* variables below (SIGN-01) are what makes
      # .goreleaser.yaml's notarize: block's enabled: template
      # (.goreleaser.yaml:252, a conjunction over all five) evaluate true.
      # If any one is absent, that template evaluates false and this job
      # ships an UN-NOTARIZED release with a GREEN run — no error, no
      # warning, just a binary that later fails SIGN-03's Gatekeeper gate.
      # No other workflow in this repository may reference these five
      # names, and none may hold them outside this one step: this job is
      # the only job in the only workflow permitted to (D-14/D-17,
      # T-02-16), machine-enforced by TestAppleSecretsScopedToSingleReleaseJob
      # (internal/upgrade), which enumerates .github/workflows/ at runtime
      # rather than from a fixture list.
      #
      # No masking step precedes this. Assumption A5 (02-EVIDENCE.md) tested
      # a real quill failure (a deliberately wrong MACOS_SIGN_PASSWORD) and
      # found no certificate, key, or password material anywhere in the
      # error output — the P12 decode fails locally, in under a second,
      # before any Apple network contact. That verdict closes the masking
      # question with a recorded reason rather than an unexplained absence;
      # re-run the spot check if quill's error-wrapping ever changes.
      - name: Release
        id: release
        run: task release:goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Build provenance via GitHub's first-party attestor (D-09), replacing
      # the third-party SLSA generic generator entirely — no more
      # `provenance:` job, no more hand-rolled base64 subject-list encoding
      # (this Action parses the checksums file's own shasum-format lines as
      # its subject list). Runs LAST, after `task release:goreleaser` has
      # populated dist/, over the SAME 8 subjects GoReleaser's checksum:
      # pipe covers (D-12): the 4 raw binaries + 4 .zip archives —
      # .sigstore.json/.spdx.json sidecars and the checksums file itself are
      # deliberately excluded. Published through GitHub's Attestations API,
      # not as a release asset; verify with `gh attestation verify`
      # (docs/RELEASE.md § b) — never `slsa-verifier verify-artifact`,
      # which is architecturally unable to verify this format (D-10).
      - name: Attest build provenance (8 subjects)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/codegraph_${{ github.ref_name }}_checksums.txt
