# PR/push CI gates (DIST-03, DIST-04).
#
# This workflow turns this phase's guarantees into things that actually run on
# every PR/push, not just documented intent (08-RESEARCH.md Pitfall 5:
# "SLSA/reproducibility claims asserted without ever being independently
# re-verified"):
#
#   - changes: dorny/paths-filter decides which legs a pull request needs
#     (#221, design D2). The filters name what a leg can skip, not what it
#     needs, because a list of inputs misses some. A push to main, a failed
#     filter step and a change under the `ci` filter run every leg.
#   - go, go-race, daemon, web, release-checks: the test legs (design D3).
#     Each Go leg runs gotestsum, which writes a JUnit report and prints the
#     slowest tests, and never reruns a failed test.
#   - test: the aggregate job. It needs every leg and fails if any leg failed
#     or was cancelled, so the required check `test` keeps its name and
#     reports on every pull request, whichever legs ran (design D1).
#   - govulncheck: a BLOCKING vulnerability gate, deliberately its own job —
#     never combined with SBOM generation into one step (RESEARCH
#     anti-pattern: "conflating SBOM generation with vulnerability scanning
#     as one CI step").
#   - reproducibility: a real double-build hash-diff, not an assertion.
#     Blocks on linux/amd64 (the canonical, lowest-variance target, D-03);
#     the linux/arm64 cross-target leg is reported via continue-on-error,
#     never silently green across all targets.
#
# A skipped job still reports its required check as Success, which a
# workflow-level paths filter would not; that is why the legs skip through a
# job-level `if`.
#
# The perf regression check (PERF-02, INDX-06) is not a gate here. It runs
# in bench.yml, nightly and on dispatch, and blocks no pull request.
#
# Security note: every third-party Action below is pinned to a full commit
# SHA (resolved at execution time via `gh api`, matching release.yml's own
# convention). No `run:` block interpolates a `${{ github.* }}` context
# value directly — untrusted refs/titles/branches are never present in this
# workflow's triggers (tag/PR/push only), but the same env-indirection
# discipline is followed here for consistency with release.yml.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. A push to main
# always runs to completion, so each merged commit gets its full set of
# checks (design D4).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each output is the string 'true' or 'false'. A filter step that did not
  # succeed (it failed, or it was skipped on a push) makes every output true,
  # so the classifier errs toward running.
  changes:
    name: changes (paths-filter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.skip.outcome != 'success' || steps.skip.outputs.go == 'true' }}
      release: ${{ steps.skip.outcome != 'success' || steps.skip.outputs.release == 'true' }}
      web: ${{ steps.need.outcome != 'success' || steps.need.outputs.web == 'true' }}
      ci: ${{ steps.need.outcome != 'success' || steps.need.outputs.ci == 'true' }}
    steps:
      # Every pattern of a filter must match a file (`every`): the file is
      # outside the paths that the leg can skip. Go tests read Markdown
      # (README.md, docs/CLI-REFERENCE.md and others), so Markdown does not
      # skip the Go legs.
      - name: Filter what a leg can skip
        id: skip
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!openspec/**'
              - '!web/src/**'
              - '!web/tests/**'
            release:
              - '**'
              - '!openspec/**'
              - '!web/src/**'
              - '!web/tests/**'

      # Any pattern of a filter matches a file (`some`).
      - name: Filter what a leg needs
        id: need
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'web/**'
              - '**/*.proto'
              - 'buf*.yaml'
              - 'Taskfile.yml'
              - 'mise.toml'
              - 'mise.lock'
            ci:
              - '.github/**'
              - 'scripts/**'
              - 'tests/**'
              - 'Taskfile.yml'
              - 'mise.toml'
              - 'mise.lock'
              - '.golangci.yml'

  go:
    name: test (go)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Build
        run: task build

      # DEV-01 (Phase 10): plain `go vet ./...`. Findings are fixed, not
      # suppressed.
      - name: Vet (go vet ./...)
        run: task vet

      # Placed right after Vet, before the slower test steps, so a lint
      # failure surfaces early.
      - name: Lint (golangci-lint via task lint:go)
        run: task lint:go

      # proto:drift runs protoc-gen-es from web/node_modules/.bin, so the
      # frozen web install comes first (BLD-01).
      - name: Install JS deps (frozen lockfile, BLD-01)
        run: task web:deps

      # Every package except internal/daemon, which the daemon leg runs.
      # test/integration and test/wireoracle are packages of ./..., so this
      # step runs them. No -count=1: the restored test cache skips a package
      # whose inputs did not change.
      - name: Test (excluding internal/daemon)
        run: task test:unit

      # FIXT-01 (D-08 cheap half): the corpus coverage guard reconciles the
      # three committed documents (manifest, observations, selection)
      # against each other, with no fetched corpora.
      - name: Corpus coverage claim (committed record)
        run: task corpora:verify

      # BLD-04: the committed generated files under internal/schema/ and
      # internal/uiproto/uiv1/ still match what the pinned buf toolchain
      # emits from their .proto sources.
      - name: Proto codegen drift guard (BLD-04)
        run: task proto:drift

      # DOCS-05: docs/CLI-REFERENCE.md still matches what tools/clidoc
      # generates from the live Cobra tree.
      - name: CLI reference drift guard (DOCS-05)
        run: task docs:cli:drift

      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-go
          path: test-results/
          if-no-files-found: error

  # WR-03 (03-REVIEW.md): the goroutine lifecycles of the watcher packages,
  # and internal/cli's serveWatchStart tests, under the race detector. The
  # packages run in parallel; only internal/daemon needs -p 1.
  go-race:
    name: test (go-race)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Test concurrency packages under the race detector (-race)
        run: task test:race

      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-go-race
          path: test-results/
          if-no-files-found: error

  # internal/daemon runs once, under -race, -p 1 and -count=1. The daemon
  # runs indexer.Sync and opens the store, so any Go change can break it.
  daemon:
    name: test (daemon)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Test internal/daemon under the race detector (-race -p 1)
        run: task test:race:daemon

      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-daemon
          path: test-results/
          if-no-files-found: error

  web:
    name: test (web)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      # BLD-01/D-13: frozen-lockfile install with the pnpm mise.toml pins.
      # pnpm enforces strictDepBuilds from web/pnpm-workspace.yaml (BLD-05).
      - name: Install JS deps (frozen lockfile, BLD-01)
        run: task web:deps

      # BRW-06 (03-01): the JS unit-test suite. The target asserts a
      # positive executed-test count before it judges pass or fail.
      - name: web unit tests (vitest)
        run: task web:test

      - name: pnpm audit gate (BLD-06)
        run: task web:audit

      # BLD-01: the pinned toolchain still produces a structurally valid
      # build from this source on a clean runner. Builds into a scratch
      # directory and asserts the committed tree is untouched.
      - name: SPA clean-checkout rebuild check (BLD-01)
        run: task web:build:verify

      # BLD-03: the committed web/build/ is current with its source, by two
      # digests against web/build/.build-manifest. Runs after the rebuild
      # check on purpose: if that check mutated the tree, this guard sees it.
      - name: SPA build drift guard (BLD-03)
        run: task web:drift

      # GRD-11/GRF-06: forbidden force-directed layout names in web/src.
      - name: No-force-layout guard (GRD-11/GRF-06)
        run: task check:no-force-layout

  release-checks:
    name: test (release-checks)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      # GRD-11/GRF-10: govulncheck source mode over the main module, the syft
      # SBOM by name and version, and the cgo-closure walk.
      - name: Gonum dependency-shape guard (GRD-11/GRF-10)
        run: task check:gonum

      # CHG-03: the pinned changie reproduces CHANGELOG.md from .changes/.
      - name: Changie reproduces CHANGELOG.md (CHG-03)
        run: task check:changie

  # The required check `test`. It reads the result of every job it needs:
  # success or skipped passes, and anything else fails. It runs whatever the
  # legs did (`always()`), so a failed leg cannot leave the check unreported.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [changes, go, go-race, daemon, web, release-checks]
    if: ${{ always() }}
    steps:
      - name: Require every leg to pass or skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "changes and leg results: ${RESULTS}"
          read -r -a results <<< "${RESULTS}"
          if [ "${#results[@]}" -ne 6 ]; then
            echo "::error::read ${#results[@]} results, want 6 (changes and five legs)"
            exit 1
          fi
          for result in "${results[@]}"; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::a job this check needs reported ${result}"
                exit 1
                ;;
            esac
          done

  govulncheck:
    name: govulncheck (DIST-03, blocking)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"

      # Deliberately its own job/step — NEVER combined with SBOM generation
      # (RESEARCH anti-pattern). The release SBOMs come from .goreleaser.yaml's
      # sboms: pipe in release.yml, separate from this call-graph-aware gate.
      - name: Run govulncheck
        run: task vuln:source

  # tool-vuln (VULN-01/02/03): govulncheck -mode=binary over the Go tool
  # binaries mise.toml pins — the third-party modules that execute as
  # credentialed CI tooling (repository write access and secrets). This job
  # deliberately does NOT replace the
  # govulncheck job above, which keeps covering the main module in source
  # mode, unchanged, and stays BLOCKING. -mode=binary is symbol-level, not
  # call-graph-aware — a materially weaker guarantee than that source-mode
  # gate's — so a reader must not generalize its call-graph framing onto
  # this job.
  #
  # ADVISORY, not blocking (D-04 superseded — see 04-01-SUMMARY.md): this
  # job was designed blocking and demoted after its own first real run
  # found that `goreleaser`'s binary carries a real, permanently-unfixed,
  # symbol-reachable match for GO-2026-5932 (golang.org/x/crypto/openpgp,
  # reached via goreleaser/cmd -> pipe/ko -> google/ko ->
  # sigstore/cosign/oci -> sigstore/rekor/pkg/pki/pgp; upstream unmaintained,
  # Fixed in: N/A). Shipped blocking, this job would have been permanently
  # red from its first run on real in-scope tooling. `task vuln` reports
  # every finding (including that one) and always exits 0; `task
  # vuln:selftest` is the exception — it proves DETECTION still fires
  # against a known-vulnerable target and is allowed to fail this job if
  # that detection mechanism itself regresses.
  #
  # Making this job (or its selftest) a branch-protection required context
  # is a separate, out-of-repo ruleset change this plan does not perform.
  tool-vuln:
    name: tool-vuln (VULN-01/02/03, advisory)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      # Every per-tool outcome is reported. The step fails only when the report
      # loop itself fails: a roster tool mise cannot find (NOT FOUND), a tool it
      # never tried, or a found binary it never scanned (scripts/vuln_report.py).
      - name: Tool-binary vulnerability scan (advisory — scan findings are reported, never fail the build)
        run: task vuln

      - name: Non-vacuity proof the advisory scan can still detect (VULN-02, may fail this job on a detection regression)
        run: task vuln:selftest

  reproducibility:
    name: reproducibility (double-build hash-diff, DIST-04)
    runs-on: namespace-profile-linux-amd64-4x8
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: linux/amd64 double build (BLOCKING — canonical target, D-03)
        # goreleaser build reads .goreleaser.yaml's flags and the commit
        # itself, so this gate proves what release.yml will produce (#212).
        run: task check:reproducibility

      - name: linux/arm64 double build (REPORTED ONLY, non-blocking — D-03 cross-target)
        # D-03: only linux/amd64 is the hard block. CGo cross-linked
        # artifacts (via zig here) are harder to guarantee bit-identical
        # across toolchains, so this leg is explicitly reported, never
        # silently folded into a single all-green check
        # (08-CONTEXT.md prohibition: "MUST NOT make the double-build gate
        # silently green across all targets").
        continue-on-error: true
        run: task check:reproducibility:arm64

  # actionlint: the release chain's guarantees live in workflow files
  # (ci.yml, release.yml, release-pr.yml, release-tag.yml and pr-title.yml
  # among them) — a static schema/expression-type/injection checker over all
  # of them is mandatory, not optional, given this repo's own documented "guard present but never
  # fires" failure mode (Phase-8 CR-01/WR-02). actionlint catches schema
  # errors, untyped expressions, and injection-shaped run: blocks before
  # merge. actionlint is pinned in mise.toml.
  actionlint:
    name: actionlint (workflow static analysis)
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Run actionlint
        run: task lint:actions

      # The CI scripts' unit suites run here, in a job no path filter gates.
      - name: CI script unit suites (vuln report, PR-template policy)
        run: task check:ci-scripts

  transcript-freeze:
    name: transcript-freeze
    # D-03 (v0.3.0 Phase 1): pull-request-only, because the guard's
    # merge-base diff is only meaningful against a PR's base ref — a plain
    # push to main has no comparable base for this check.
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      # Base ref reaches the shell only through this step-level env: entry,
      # never interpolated into the run: body — matching this workflow's
      # existing env-indirection discipline (T-06-01).
      - name: Anti-regeneration guard (D-03, advisory since 03-02)
        env:
          TRANSCRIPT_FREEZE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: task check:transcript-freeze

  goreleaser-check:
    name: goreleaser check (config validation, DIST-01)
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Run goreleaser check
        run: task check:goreleaser
