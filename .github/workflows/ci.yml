# PR/push CI gates (DIST-03, DIST-04, PERF-02, INDX-06).
#
# This workflow turns this phase's guarantees into things that actually run on
# every PR/push, not just documented intent (08-RESEARCH.md Pitfall 5:
# "SLSA/reproducibility claims asserted without ever being independently
# re-verified"):
#
#   - test: go build + go test ./... with internal/daemon's known-flaky
#     soak/flush-lock tests isolated into their own -count=1 step (STATE.md
#     documents this as a PRE-EXISTING flake under full-suite parallel load,
#     not a new regression to paper over).
#   - govulncheck: a BLOCKING vulnerability gate, deliberately its own job —
#     never combined with SBOM generation into one step (RESEARCH
#     anti-pattern: "conflating SBOM generation with vulnerability scanning
#     as one CI step").
#   - reproducibility: a real double-build hash-diff, not an assertion.
#     Blocks on linux/amd64 (the canonical, lowest-variance target, D-03);
#     the linux/arm64 cross-target leg is reported via continue-on-error,
#     never silently green across all targets.
#   - perf-regression: tools/bench/runner -mode regression against the
#     committed tools/bench/baseline.json, gating PERF-02 (throughput and
#     peak-RSS tolerance bands; query latency and cold start are measured
#     and reported, not yet gated) and INDX-06 (absolute peak-RSS ceiling)
#     — entirely offline against the deterministic synthetic corpus (D-04:
#     this gate MUST NOT clone a remote repo).
#
# Security note: every third-party Action below is pinned to a full commit
# SHA (resolved at execution time via `gh api`, matching release.yml's own
# convention). No `run:` block interpolates a `${{ github.* }}` context
# value directly — untrusted refs/titles/branches are never present in this
# workflow's triggers (tag/PR/push only), but the same env-indirection
# discipline is followed here for consistency with release.yml.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Build
        run: task build

      # DEV-01 (Phase 10): NEW enforcement, not a rewiring — plain
      # `go vet ./...` was never in CI before this step; only two
      # package-scoped GOOS=windows vets existed, and those went away with
      # native Windows support (quick task 260807-gho). Findings surfaced
      # on this gate's first run are fixed, not suppressed.
      - name: Vet (go vet ./...)
        run: task vet

      - name: Test (excluding internal/daemon — isolated below)
        # IN-08 (03-REVIEW.md): `set -e` does not propagate failures out of
        # a process substitution — `mapfile -t pkgs < <(go list ... | grep
        # ...)` succeeds regardless of go list's exit status, so a partial
        # emission before a failure would silently test a subset of packages
        # under a green check. Materialize the list first so go list's exit
        # code is checked by set -e before anything consumes it.
        run: task test:unit

      # GOLDEN-01 (02-REVIEW-2.md): the go tool ignores any directory named
      # "testdata" when expanding "./..." — `go list ./...` above therefore
      # NEVER discovers testdata/golden, and every "full suite green" signal
      # produced by the step above silently omits the golden parity suite
      # (TestGoldenParity, the CLI==MCP byte-identity harness, the
      # behavioral corpora, etc.). This step makes that reachable and
      # explicit rather than a suite everyone believes runs but never does.
      - name: Test golden parity suite (testdata/golden, NOT covered by go list ./...)
        run: task test:golden

      # FIXT-01 (D-08 cheap half): the corpus coverage guard reconciles the
      # three COMMITTED documents (manifest, observations, selection) against
      # each other — no fetched corpora, no indexing, so it is safe on every
      # CI run. internal/corpora IS already reached by the test:unit package
      # expansion above, but this explicitly named step guards against a
      # future refactor of that filtered `go list` line silently dropping it
      # too — the same rationale test:integration documents above — and this
      # check is the one thing standing between a stale coverage claim and a
      # green build.
      - name: Corpus coverage claim (committed record)
        run: task corpora:verify

      # D-17/GOLDEN-01 belt-and-braces: test/integration IS already reached
      # by `go list ./...` above (it's a normal package, not testdata/), but
      # an explicit named step guards against a future refactor of that
      # filtered `go list` line silently dropping it too — the same
      # rationale the golden-suite step above already documents.
      - name: Test subprocess integration harness (test/integration)
        run: task test:integration

      # VRFY-01/VRFY-04 (v0.3.0 Phase 1): the wire-level regression oracle
      # spawns the real binary over real stdio and byte-compares normalized
      # transcripts against testdata/wireoracle/transcripts/*.golden — a
      # required PR leg from the moment it lands, never relaxed or
      # re-baselined during the Phase 2 SDK swap.
      - name: Test wire oracle (test/wireoracle)
        run: task test:wireoracle

      - name: Test internal/daemon (isolated, -count=1)
        # internal/daemon's TestSoak + flush-lock tests are a documented,
        # PRE-EXISTING flake under full-suite parallel load (STATE.md,
        # 08-CONTEXT.md "Flake note"). Isolating them into their own
        # -count=1 step is the documented handling — the tests are NOT
        # removed or skipped, just run without contention from the rest of
        # the suite.
        run: task test:daemon

      # WR-03 (03-REVIEW.md): the watcher-on-MCP-default phase's entire
      # surface is goroutine lifecycles (serveWatchStart's spawn/teardown,
      # RunWithRetry's cancel-vs-sleep select, Debouncer.fireWG accounting,
      # the two-session convergence soak) — and the soak tests' iteration
      # counts are explicitly sized for CI "under -race", an assumption no
      # step verified until now. Targeted at the concurrency packages (plus
      # internal/cli, whose serveWatchStart tests exercise the same
      # goroutine seams) rather than the full suite, keeping the added wall
      # time bounded; -p 1 preserves the same no-parallel-package-contention
      # isolation the internal/daemon step above documents. The goleak gate
      # catches leaks, not races — the two are complementary.
      - name: Test concurrency packages under the race detector (-race)
        run: task test:race

      # Native Windows is not a supported platform (quick task 260807-gho);
      # Windows users run the linux binary under WSL2. The two GOOS=windows
      # vet steps that used to live here — one typechecking graphstore's
      # windows lock classifier, one typechecking internal/daemon's windows
      # PPID watchdog behind a mingw-w64 cross-CGO toolchain — guarded
      # windows-tagged files that no longer exist. Re-adding either means
      # reversing the platform decision recorded in README.md's Supported
      # platforms section.

  govulncheck:
    name: govulncheck (DIST-03, blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Deliberately its own job/step — NEVER combined with SBOM generation
      # (RESEARCH anti-pattern). This project's SBOM generation lives in
      # release.yml's `assemble` job (per-binary SBOM at release time),
      # entirely separate from this call-graph-aware vulnerability gate.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          repo-checkout: false

  # tool-vuln (VULN-01/02/03): govulncheck -mode=binary over the four tool
  # binaries built from go.tool.mod/go.tool-lint.mod — the 357 measured
  # third-party modules that execute as credentialed CI tooling (repository
  # write access and secrets) and were previously scanned by nothing
  # (Taskfile.yml's `vuln` target used to be a no-op duplicate of the
  # govulncheck job above, D-05). This job deliberately does NOT replace the
  # govulncheck job above, which keeps covering the main module in source
  # mode, unchanged, and stays BLOCKING. -mode=binary is symbol-level, not
  # call-graph-aware — a materially weaker guarantee than that source-mode
  # gate's — so a reader must not generalize its call-graph framing onto
  # this job.
  #
  # ADVISORY, not blocking (D-04 superseded — see 04-01-SUMMARY.md): this
  # job was designed blocking and demoted after its own first real run
  # found that `goreleaser`'s binary carries a real, permanently-unfixed,
  # symbol-reachable match for GO-2026-5932 (golang.org/x/crypto/openpgp,
  # reached via goreleaser/cmd -> pipe/ko -> google/ko ->
  # sigstore/cosign/oci -> sigstore/rekor/pkg/pki/pgp; upstream unmaintained,
  # Fixed in: N/A). Shipped blocking, this job would have been permanently
  # red from its first run on real in-scope tooling. `task vuln` reports
  # every finding (including that one) and always exits 0; `task
  # vuln:selftest` is the exception — it proves DETECTION still fires
  # against a known-vulnerable target and is allowed to fail this job if
  # that detection mechanism itself regresses.
  #
  # Making this job (or its selftest) a branch-protection required context
  # is a separate, out-of-repo ruleset change this plan does not perform.
  tool-vuln:
    name: tool-vuln (VULN-01/02/03, advisory)
    runs-on: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Tool-modfile vulnerability scan (advisory — reports, never fails the build)
        run: task vuln

      - name: Non-vacuity proof the advisory scan can still detect (VULN-02, may fail this job on a detection regression)
        run: task vuln:selftest

  reproducibility:
    name: reproducibility (double-build hash-diff, DIST-04)
    runs-on: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Install zig (linux/arm64 cross-target leg only)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.1"

      - name: Compute determinism inputs
        id: repro
        run: |
          set -euo pipefail
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: linux/amd64 double build (BLOCKING — canonical target, D-03)
        # Mirrors .goreleaser.yaml's own reproducibility flags exactly
        # (-trimpath, -buildid=, mod-time pinned via SOURCE_DATE_EPOCH) so
        # this gate actually proves what release.yml will produce is
        # deterministic, per 08-RESEARCH.md's Double-build reproducibility
        # gate code example.
        env:
          SOURCE_DATE_EPOCH: ${{ steps.repro.outputs.epoch }}
          COMMIT: ${{ steps.repro.outputs.commit }}
        run: task check:reproducibility

      - name: linux/arm64 double build (REPORTED ONLY, non-blocking — D-03 cross-target)
        # D-03: only linux/amd64 is the hard block. CGo cross-linked
        # artifacts (via zig here) are harder to guarantee bit-identical
        # across toolchains, so this leg is explicitly reported, never
        # silently folded into a single all-green check
        # (08-CONTEXT.md prohibition: "MUST NOT make the double-build gate
        # silently green across all targets").
        continue-on-error: true
        env:
          SOURCE_DATE_EPOCH: ${{ steps.repro.outputs.epoch }}
          COMMIT: ${{ steps.repro.outputs.commit }}
        run: task check:reproducibility:arm64

  perf-regression:
    name: perf regression gate (PERF-02, INDX-06)
    runs-on: ubuntu-latest
    # CODEGRAPH_BENCH_RUNNER labels THIS job's own measurement so
    # internal/bench.CheckRegression's runner check (Phase 10, plan 10-06)
    # has something to compare against the committed baseline's "runner":
    # "ubuntu-latest" — without this, the current run's Runner field would
    # be empty, which the check refuses just as hard as a genuine mismatch
    # (an unrecorded identity is not a wildcard). scratch_fs needs no
    # equivalent here: tools/bench/runner's -scratch-fs flag defaults to
    # "disk", matching the baseline, with no env var required.
    env:
      CODEGRAPH_BENCH_RUNNER: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Perf-regression gate (offline synthetic 120k-file corpus)
        # tools/bench/runner -mode regression builds+runs gencorpus's
        # deterministic, network-free synthetic corpus (D-04: never clones
        # a remote repo) and gates the Go binary's from-scratch index
        # throughput/query-latency/cold-start against the committed
        # tools/bench/baseline.json (PERF-02 tolerance bands) plus the
        # absolute peak-RSS ceiling (INDX-06). Non-zero exit fails the job.
        #
        # -trials 3 is the runner's own default; it is stated here so the
        # measurement procedure is visible at the call site rather than
        # only in a Go constant. It medians over three independent
        # measurement sessions because one session — even after the inner
        # median-of-5 — is a single draw from a distribution wide enough to
        # flip this verdict: three CI observations of the same corpus
        # spread 2.4% against a 10.0% budget
        # (perf-gate-throughput-regress). Cost: this job runs roughly 3x
        # longer than the single-session version it replaces. It is a
        # parallel job and blocks nothing else.
        #
        # The baseline this gates against MUST have been recorded on this
        # same ubuntu-latest runner class — bench.yml's `rebless` job is
        # the supported way to produce one. internal/bench.CheckRegression
        # now refuses a GOOS/GOARCH, runner, OR scratch_fs mismatch
        # outright (Phase 10, plan 10-06), so a baseline from elsewhere
        # fails loudly here instead of reporting a fictitious regression —
        # exactly the failure class a same-day, four-configuration
        # investigation (tools/bench/BASELINE.md) confirmed this runner
        # class is the right one to stay on, not migrate off.
        run: task bench:regression

  # actionlint: this phase's guarantees now live in FOUR workflow files
  # (ci.yml, release.yml, release-please.yml, pr-title.yml) — a static
  # schema/expression-type/injection checker over all of them is mandatory,
  # not optional, given this repo's own documented "guard present but never
  # fires" failure mode (Phase-8 CR-01/WR-02). actionlint catches schema
  # errors, untyped expressions, and injection-shaped run: blocks before
  # merge. Built from go.tool-lint.mod at a pinned version via the shared
  # install-task/Taskfile bootstrap (Phase 10, D-03/D-04) rather than a
  # fourth-party Action or a bare `go install @pin` — see go.tool-lint.mod's
  # own header for why actionlint is isolated from go.tool.mod's task/
  # goreleaser tool directives.
  actionlint:
    name: actionlint (workflow static analysis)
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Run actionlint
        run: task lint:actions

  transcript-freeze:
    name: transcript-freeze
    # D-03 (v0.3.0 Phase 1): pull-request-only, because the guard's
    # merge-base diff is only meaningful against a PR's base ref — a plain
    # push to main has no comparable base for this check.
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      # Base ref reaches the shell only through this step-level env: entry,
      # never interpolated into the run: body — matching this workflow's
      # existing env-indirection discipline (T-06-01).
      - name: Anti-regeneration guard (D-03, advisory since 03-02)
        env:
          TRANSCRIPT_FREEZE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: task check:transcript-freeze

  goreleaser-check:
    name: goreleaser check (config validation, DIST-01)
    runs-on: namespace-profile-linux-amd64-2x4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Run goreleaser check
        run: task check:goreleaser
