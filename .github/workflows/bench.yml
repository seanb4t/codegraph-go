# On-demand/scheduled benchmark workflow. Three dispatchable jobs, none of
# which ever blocks a merge:
#
#   - publish:    publishes absolute Go throughput / query-latency / peak-RSS
#                 numbers, measuring only the freshly-built Go binary
#                 (BENCH-01/BENCH-03).
#   - regression: the perf regression check (PERF-02, INDX-06): `task
#                 bench:regression` against the committed
#                 tools/bench/baseline.json, nightly and on dispatch.
#   - rebless:    records a CANDIDATE tools/bench/baseline.json for the
#                 regression job, on the same runner class that job runs
#                 on. It never writes to the repository — it publishes the
#                 number for a human to review and commit.
#
# This workflow is deliberately NOT triggered on pull_request/push.
# Docs/BENCHMARKS.md (Plan 08-09) is refreshed from the publish job's
# output.
#
# Why the rebless job has to run on the SAME runner class as the regression job
# (perf-gate-throughput-regress): throughput from this harness is dominated
# by hardware class, not just GOOS/GOARCH. Measured on one physical Apple
# Silicon machine, synthetic corpus, identical code — darwin/arm64 native
# 12,816 files/s, linux/arm64 container 38,558 files/s, GitHub-hosted
# linux/amd64 runner ~11,400 files/s. A ~3x spread between two OSes on the
# same hardware, with the CI runner slower than both. So a baseline
# reblessed on a maintainer's Linux box satisfies internal/bench's
# GOOS/GOARCH guard and is still a meaningless yardstick for the gate.
#
# rebless runs on ubuntu-latest, matching the regression job below
# (10-04-PLAN RESOLUTION): a full same-day, same-methodology investigation
# considered moving both rebless and the gate to a Namespace profile, and
# found every alternative configuration measured WORSE session-to-session
# stability than the incumbent ubuntu-latest + disk-backed scratch pairing
# (0.35% disagreement, 28.6x headroom against the 10% tolerance — tighter
# than the historical reference, not stale). See
# tools/bench/BASELINE.md's "Staleness and the ubuntu-latest+disk control"
# section for the full investigation: a CPU-count A/B (refuted "more
# CPU"), a tmpfs experiment (refuted "I/O-bound variance" — tmpfs made
# BOTH runner classes worse), and this same-day control (confirmed the
# incumbent frame, not a stale one). tools/bench/runner's -scratch-fs/
# ScratchFS machinery added during that investigation stays (it is what
# made the control cheap to run), even though the runner class itself
# did not move.
#
# publish stays on the Namespace profile (namespace-profile-linux-
# amd64-4x8) DESPITE rebless moving back to ubuntu-latest — a deliberate,
# asymmetric choice, not an oversight. publish is non-gating and reports
# absolute per-corpus numbers for the freshly-built Go binary alone — it
# never needs to match rebless's runner class, only its own prior runs.
# Namespace measures
# noticeably faster (this investigation's control found Namespace+disk
# roughly 20.8% faster than ubuntu-latest+disk on the synthetic corpus),
# so leaving this non-blocking, non-gated, purely-informational job on
# the faster profile costs nothing and saves real wall-clock time on
# every dispatch.
#
# RSS scope note (08-RESEARCH.md Pattern 1): peak RSS is measured at the OS
# level via bench.PeakRSSBytes(cmd.ProcessState), which is only meaningfully
# comparable on Linux/macOS — this workflow runs on Linux only, consistent
# with that scoping. Windows RSS measurement is out of scope.
#
# Security note: every third-party Action is pinned to a full commit SHA.

name: bench

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: publish
        options:
          - publish
          - regression
          - rebless
          - both
          - cpu-diag
          - scratch-fs-compare
          - disk-control-github
      trials:
        description: "rebless / scratch-fs-compare / disk-control-github: independent measurement sessions to median over"
        type: choice
        default: "3"
        options:
          - "3"
          - "5"
          - "7"
  schedule:
    # Weekly, Monday 06:00 UTC: publish. Nightly, 05:00 UTC: regression.
    # Each job names its own cron in its `if:`. Scheduled runs never gate a
    # PR or push, and they never run the rebless job: recording a baseline
    # is an act of judgement, not something a cron should decide to do.
    - cron: "0 6 * * 1"
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  publish:
    name: benchmark publish (BENCH-01/BENCH-03, non-blocking)
    runs-on: namespace-profile-linux-amd64-4x8
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || inputs.job == 'publish' || inputs.job == 'both'
    env:
      CODEGRAPH_BENCH_RUNNER: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Build Go codegraph binary
        run: go build -o codegraph-bench ./cmd/codegraph

      - name: Run benchmark
        # Measures ONLY the freshly-built Go binary over
        # tools/bench/realcorpus's pinned real-repo manifest (weft-go,
        # cockroachdb/pebble), producing absolute per-repo Metrics JSON.
        # This step publishes and never gates: the regression job below
        # runs CheckRegression against the committed
        # tools/bench/baseline.json. A slower number here must
        # never fail this workflow — only a genuinely broken measurement
        # does. publish mode has no baseline-overwriting flag at all, so
        # the D-13/D-01 no-Taskfile-wrapping exception documented above the
        # rebless job is inherited context for this job, not a live risk —
        # the exception itself still governs rebless.
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode publish \
            -go-binary "$(pwd)/codegraph-bench" \
            | tee publish-results.json

      - name: Publish results to job summary
        run: |
          {
            echo "## Benchmark publish results (BENCH-01/BENCH-03)"
            echo ""
            echo '```json'
            cat publish-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-results
          path: publish-results.json
          if-no-files-found: error

  regression:
    name: perf regression check (PERF-02, INDX-06, nightly, non-blocking)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || inputs.job == 'regression'
    # CODEGRAPH_BENCH_RUNNER labels THIS job's own measurement so
    # internal/bench.CheckRegression's runner check (Phase 10, plan 10-06)
    # has something to compare against the committed baseline's "runner":
    # "ubuntu-latest" — without this, the current run's Runner field would
    # be empty, which the check refuses just as hard as a genuine mismatch
    # (an unrecorded identity is not a wildcard). scratch_fs needs no
    # equivalent here: tools/bench/runner's -scratch-fs flag defaults to
    # "disk", matching the baseline, with no env var required.
    env:
      CODEGRAPH_BENCH_RUNNER: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # bench:baseline-fresh reads the date of the last commit that
          # changed the baseline; a shallow clone reports its boundary.
          fetch-depth: 0

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"

      # #105: a baseline older than 90 days, or recorded on another runner,
      # fails here with a message that names the rebless job.
      - name: Baseline age and runner check
        run: task bench:baseline-fresh

      - name: Perf-regression gate (offline synthetic 120k-file corpus)
        # tools/bench/runner -mode regression builds+runs gencorpus's
        # deterministic, network-free synthetic corpus (D-04: never clones
        # a remote repo) and gates the Go binary's from-scratch index
        # throughput/query-latency/cold-start against the committed
        # tools/bench/baseline.json (PERF-02 tolerance bands) plus the
        # absolute peak-RSS ceiling (INDX-06). Non-zero exit fails the job.
        #
        # -trials 3 is the runner's own default; it is stated here so the
        # measurement procedure is visible at the call site rather than
        # only in a Go constant. It medians over three independent
        # measurement sessions because one session — even after the inner
        # median-of-5 — is a single draw from a distribution wide enough to
        # flip this verdict. Runs of the same code on different
        # ubuntu-latest machines still land further apart than the 10.0%
        # budget, so this check runs here and gates no pull request.
        #
        # The baseline this gates against MUST have been recorded on this
        # same ubuntu-latest runner class — bench.yml's `rebless` job is
        # the supported way to produce one. internal/bench.CheckRegression
        # now refuses a GOOS/GOARCH, runner, OR scratch_fs mismatch
        # outright (Phase 10, plan 10-06), so a baseline from elsewhere
        # fails loudly here instead of reporting a fictitious regression —
        # exactly the failure class a same-day, four-configuration
        # investigation (tools/bench/BASELINE.md) confirmed this runner
        # class is the right one to stay on, not migrate off.
        run: task bench:regression

  # D-13 / D-01 EXCEPTION, documented here on purpose: this job's three
  # `go run ./tools/bench/runner` invocations (this file only) are NOT
  # wrapped in Taskfile.yml targets, unlike every other CI step in this
  # repo. `-rebless` is the ONLY flag that overwrites baseline.json, and a
  # wrong-platform baseline has already produced a stable, entirely
  # fictitious 10.6% "regression" that survived three rounds of triage
  # before anyone ran the control (tools/bench/BASELINE.md). Keeping all
  # three `go run` bodies inline — rather than behind a `task bench:*`
  # target a contributor could tab-complete into — keeps `-rebless`
  # reachable only through this manually-dispatched, no-write-token job.
  # D-14's `task bench:regression` (added separately) wraps the read-only
  # gate invocation and never touches this flag.
  rebless:
    name: record candidate perf baseline (PERF-02, manual only)
    runs-on: ubuntu-latest
    # workflow_dispatch only — never on the weekly schedule. Also note this
    # job takes `contents: read` from the workflow-level permissions block
    # and asks for nothing more: it deliberately has no write token, so it
    # CANNOT push a baseline even if a future edit tried to. The candidate
    # reaches the repository through a human reading the number below and
    # committing the artifact by hand.
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'rebless' || inputs.job == 'both')
    env:
      CODEGRAPH_BENCH_RUNNER: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go
          go-cache: "true"

      - name: Record candidate baseline on this runner
        # -rebless is the ONLY writer of baseline.json by design (D-05) and
        # stays so here: this step invokes it, it does not reimplement it.
        # What it writes is the checkout's WORKING COPY, which is thrown
        # away with the runner — publishing it below is a separate act.
        #
        # -seed/-count are passed explicitly rather than relied on as
        # defaults so this command reads as the documented reproduction of
        # tools/bench/BASELINE.md, and so a future default change cannot
        # silently record a candidate against a different corpus than the
        # gate measures.
        #
        # -runner is passed explicitly (in addition to the job-level
        # CODEGRAPH_BENCH_RUNNER env this step already inherits) so the
        # written candidate carries the field on its own terms rather than
        # relying on env inheritance alone.
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode regression -rebless \
            -baseline tools/bench/baseline.json \
            -seed 42 -count 120000 \
            -trials "$TRIALS" \
            -runner "$CODEGRAPH_BENCH_RUNNER"

      - name: Publish candidate to job summary
        # The human-review surface. A maintainer reads the delta here
        # BEFORE anything lands, which is precisely what nobody could do
        # when a darwin/arm64 baseline was silently gating a linux runner.
        run: |
          set -euo pipefail
          git show HEAD:tools/bench/baseline.json > /tmp/baseline-committed.json
          {
            echo "## Candidate perf baseline (PERF-02)"
            echo ""
            echo "Recorded on \`${RUNNER_OS}\` / \`$(uname -m)\`, runner image \`${ImageOS:-unknown}\`, runner label \`${CODEGRAPH_BENCH_RUNNER}\`."
            echo ""
            echo "**Nothing has been committed.** Download the \`baseline-candidate\`"
            echo "artifact and commit it as \`tools/bench/baseline.json\` in its own PR,"
            echo "isolated from unrelated changes, per CONTEXT.md D-05."
            echo ""
            echo "| metric | committed | candidate | change |"
            echo "|---|---:|---:|---|"
            jq -r -s '
              def pct($a; $b): if ($a // 0) == 0 then "n/a"
                               else ((($b - $a) / $a) * 100 | . * 100 | round / 100 | tostring) + "%" end;
              .[0] as $old | .[1] as $new |
              [
                ["platform", ($old.goos + "/" + $old.goarch), ($new.goos + "/" + $new.goarch),
                  (if ($old.goos == $new.goos and $old.goarch == $new.goarch) then "unchanged" else "**CHANGED**" end)],
                ["corpus", $old.repo, $new.repo,
                  (if $old.repo == $new.repo then "unchanged" else "**CHANGED**" end)],
                ["runner", ($old.runner // "unattributed"), ($new.runner // "unattributed"),
                  (if (($old.runner // "") == ($new.runner // "")) then "unchanged" else "**CHANGED**" end)],
                ["median_of_trials", ($old.median_of_trials // 0 | tostring), ($new.median_of_trials // 0 | tostring), ""],
                ["files_per_sec", ($old.files_per_sec | tostring), ($new.files_per_sec | tostring), pct($old.files_per_sec; $new.files_per_sec)],
                ["peak_rss_bytes", ($old.peak_rss_bytes | tostring), ($new.peak_rss_bytes | tostring), pct($old.peak_rss_bytes; $new.peak_rss_bytes)],
                ["query_latency_median_ms", ($old.query_latency_median_ms | tostring), ($new.query_latency_median_ms | tostring), pct($old.query_latency_median_ms; $new.query_latency_median_ms)],
                ["cold_start_ms", ($old.cold_start_ms | tostring), ($new.cold_start_ms | tostring), pct($old.cold_start_ms; $new.cold_start_ms)]
              ] | .[] | "| " + join(" | ") + " |"
            ' /tmp/baseline-committed.json tools/bench/baseline.json
            echo ""
            echo "<details><summary>Candidate baseline.json</summary>"
            echo ""
            echo '```json'
            cat tools/bench/baseline.json
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate baseline artifact
        # Uploaded BEFORE the reproducibility check below, and with
        # if-no-files-found: error, so a maintainer always gets the exact
        # bytes to review even when the check that follows fails them.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-candidate
          path: tools/bench/baseline.json
          if-no-files-found: error

      - name: Verify the candidate survives the gate on this runner class
        # A baseline nobody ever ran the gate against is what produced this
        # job in the first place. Take a SECOND, independent measurement on
        # the same runner and gate it against the candidate: if the
        # candidate is not reproducible within the PERF-02 tolerance bands
        # minutes after being recorded on the same machine, it is a tail
        # draw, not a baseline, and must not be committed. Failing this
        # step fails the job on purpose.
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode regression \
            -baseline tools/bench/baseline.json \
            -seed 42 -count 120000 \
            -trials "$TRIALS" \
            -ceiling-bytes 4294967296

  # CPU/memory/storage topology diagnostic (10-04-PLAN, Rule 2 deviation).
  # NOT a gate and NOT part of the rebless/publish flow — neither job
  # below ever touches baseline.json. Folded into this already-registered
  # workflow rather than a new standalone file so it can be dispatched from
  # a feature branch: GitHub only allows workflow_dispatch against
  # workflow files already present on the default branch, and a brand-new
  # workflow file doesn't qualify until it has been merged there.
  #
  # TWO jobs, one per runner class, both gated by the same `job: cpu-diag`
  # dispatch input so a single dispatch produces a side-by-side A/B: an
  # initial pass (this plan, prior commit) refuted the "Namespace
  # oversubscribes host CPUs" hypothesis — runtime.NumCPU() already
  # matched nproc and an unlimited cgroup quota there. What's still
  # unexplained is a same-work/same-memory/different-wall-clock signature
  # (peak RSS stable at 0.56% session-to-session, throughput swinging
  # 4.36%+), which is the classic signature of I/O-bound variance, not
  # CPU contention. These two jobs exist to compare CPU generation, RAM,
  # and real storage throughput between ubuntu-latest and
  # namespace-profile-linux-amd64-4x8 rather than assume either.
  cpu-diag-github:
    name: "CPU/mem/storage topology diagnostic (10-04-PLAN, non-blocking) — ubuntu-latest"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'cpu-diag'
    env:
      RUNNER_LABEL: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go task
          go-cache: "true"

      - name: Run CPU/memory/storage topology diagnostic
        # task diag:cpu is the single definition (D-01/D-02) — this step
        # invokes it, it does not duplicate its command bodies.
        run: |
          set -euo pipefail
          task diag:cpu | tee diag-cpu-output.txt

      - name: Run tmpfs sizing diagnostic
        run: |
          set -euo pipefail
          task diag:storage-fit | tee diag-storage-fit-output.txt

      - name: Publish diagnostic to job summary
        run: |
          {
            echo "## CPU/memory/storage topology diagnostic (10-04-PLAN)"
            echo ""
            echo "Dispatched runs-on label: \`${RUNNER_LABEL}\`."
            echo ""
            echo '```'
            cat diag-cpu-output.txt
            echo ""
            cat diag-storage-fit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cpu-diag-namespace:
    name: "CPU/mem/storage topology diagnostic (10-04-PLAN, non-blocking) — namespace-profile-linux-amd64-4x8"
    runs-on: namespace-profile-linux-amd64-4x8
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'cpu-diag'
    env:
      RUNNER_LABEL: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go task

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Run CPU/memory/storage topology diagnostic
        run: |
          set -euo pipefail
          task diag:cpu | tee diag-cpu-output.txt

      - name: Run tmpfs sizing diagnostic
        run: |
          set -euo pipefail
          task diag:storage-fit | tee diag-storage-fit-output.txt

      - name: Publish diagnostic to job summary
        run: |
          {
            echo "## CPU/memory/storage topology diagnostic (10-04-PLAN)"
            echo ""
            echo "Dispatched runs-on label: \`${RUNNER_LABEL}\`."
            echo ""
            echo '```'
            cat diag-cpu-output.txt
            echo ""
            cat diag-storage-fit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-tmpfs-fix A/B re-measurement (10-04-PLAN, Rule 2 deviation).
  # READ-ONLY with respect to the committed baseline: -rebless here writes
  # to a THROWAWAY /tmp path, never tools/bench/baseline.json. D-13 stays
  # intact — this is an inline `go run ... -rebless -baseline /tmp/...`
  # invocation (the same documented D-01 exception bench.yml's rebless job
  # already uses), never a Taskfile target, so -rebless never sits behind
  # tab-completion. Exists to answer, with real numbers, whether pointing
  # the regression scratch dir at tmpfs (commit 47eff33) actually
  # collapsed the 4.36% Namespace session-to-session throughput variance
  # measured before the fix — on BOTH runner classes, so the comparison
  # stays apples-to-apples per D-09.
  scratch-fs-compare-github:
    name: "Post-tmpfs-fix re-measurement (10-04-PLAN, non-blocking, read-only) — ubuntu-latest"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'scratch-fs-compare'
    env:
      RUNNER_LABEL: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go
          go-cache: "true"

      - name: Re-measure at -trials 7 against a throwaway baseline path
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode regression -rebless \
            -baseline /tmp/scratch-fs-compare.json \
            -seed 42 -count 120000 \
            -trials "$TRIALS" \
            -runner "$RUNNER_LABEL" \
            2>&1 | tee scratch-fs-compare-output.txt
          echo "--- candidate ---" >> scratch-fs-compare-output.txt
          cat /tmp/scratch-fs-compare.json >> scratch-fs-compare-output.txt

      - name: Publish to job summary
        run: |
          {
            echo "## Post-tmpfs-fix re-measurement (10-04-PLAN) — ${RUNNER_LABEL}"
            echo ""
            echo '```'
            cat scratch-fs-compare-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scratch-fs-compare-namespace:
    name: "Post-tmpfs-fix re-measurement (10-04-PLAN, non-blocking, read-only) — namespace-profile-linux-amd64-4x8"
    runs-on: namespace-profile-linux-amd64-4x8
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'scratch-fs-compare'
    env:
      RUNNER_LABEL: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Re-measure at -trials 7 against a throwaway baseline path
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode regression -rebless \
            -baseline /tmp/scratch-fs-compare.json \
            -seed 42 -count 120000 \
            -trials "$TRIALS" \
            -runner "$RUNNER_LABEL" \
            2>&1 | tee scratch-fs-compare-output.txt
          echo "--- candidate ---" >> scratch-fs-compare-output.txt
          cat /tmp/scratch-fs-compare.json >> scratch-fs-compare-output.txt

      - name: Publish to job summary
        run: |
          {
            echo "## Post-tmpfs-fix re-measurement (10-04-PLAN) — ${RUNNER_LABEL}"
            echo ""
            echo '```'
            cat scratch-fs-compare-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Disk-scratch CONTROL measurement on ubuntu-latest (10-04-PLAN, Rule 2
  # deviation). READ-ONLY with respect to the committed baseline:
  # -rebless here writes to a throwaway /tmp path, never
  # tools/bench/baseline.json. Same D-01 exception, D-13 unaffected.
  #
  # Exists to close a gap in this plan's own reasoning: the only
  # historical "ubuntu-latest + disk" number on record (0.65% session
  # disagreement, ~15x headroom) was measured weeks ago in Phase 9, under
  # a different methodology, on a fleet that may itself have drifted.
  # Comparing today's tmpfs numbers against that stale reference would be
  # exactly the missing-control mistake that produced this repo's
  # original fictitious 10.6% "regression" (tools/bench/BASELINE.md) —
  # so this job re-measures the PRE-tmpfs configuration (disk-backed
  # scratch) TODAY, on the same runner class, using the SAME methodology
  # as every other measurement this pass. -scratch-fs disk (added in
  # d680f71) forces this WITHOUT reverting 47eff33's tmpfs-preferring
  # default — the default stays live and untouched; this job just pins
  # the older behavior explicitly for a same-day comparison.
  disk-control-github:
    name: "Disk-scratch control re-measurement (10-04-PLAN, non-blocking, read-only) — ubuntu-latest"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'disk-control-github'
    env:
      RUNNER_LABEL: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go
          go-cache: "true"

      - name: Re-measure at -trials 7 with disk-backed scratch, against a throwaway baseline path
        # -scratch-fs disk pins the pre-tmpfs configuration explicitly
        # (d680f71) — the flag itself is what makes this "least invasive":
        # no revert of 47eff33 required, and the tmpfs-preferring default
        # stays exactly as it is for every other invocation in this file.
        env:
          TRIALS: ${{ inputs.trials }}
        run: |
          set -euo pipefail
          go run ./tools/bench/runner -mode regression -rebless \
            -baseline /tmp/disk-control.json \
            -seed 42 -count 120000 \
            -trials "$TRIALS" \
            -runner "$RUNNER_LABEL" \
            -scratch-fs disk \
            2>&1 | tee disk-control-output.txt
          echo "--- candidate ---" >> disk-control-output.txt
          cat /tmp/disk-control.json >> disk-control-output.txt

      - name: Publish to job summary
        run: |
          {
            echo "## Disk-scratch control re-measurement (10-04-PLAN) — ${RUNNER_LABEL}"
            echo ""
            echo '```'
            cat disk-control-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
