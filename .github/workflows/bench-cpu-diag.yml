# CPU-topology diagnostic workflow (10-04-PLAN, Rule 2 deviation).
#
# NOT a gate — never referenced by ci.yml or bench.yml, never affects a
# merge or a baseline. It exists to answer one question before pinning a
# worker count in tools/bench/runner: does this Namespace profile expose
# more host-visible CPUs (runtime.NumCPU()) than its cgroup CPU quota
# actually grants? tools/bench/runner never passes --workers to `codegraph
# index`, so the extraction pool defaults to runtime.NumCPU()
# (internal/indexer/extract.go, pipeline.go, sync.go) — if that number
# exceeds the real quota, Go oversubscribes the container and the resulting
# scheduler contention is indistinguishable, from the bench numbers alone,
# from genuine session-to-session throughput noise.
#
# workflow_dispatch only, on purpose: this is a one-off (or occasional,
# re-runnable-on-demand) investigation tool, not something that should run
# on every push or PR.
name: bench-cpu-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-diag:
    name: CPU topology diagnostic (10-04-PLAN, non-blocking)
    runs-on: namespace-profile-linux-amd64-4x8
    env:
      RUNNER_LABEL: namespace-profile-linux-amd64-4x8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: go

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Run CPU-topology diagnostic
        # task diag:cpu is the single definition (D-01/D-02) — this step
        # invokes it, it does not duplicate its command bodies.
        run: |
          set -euo pipefail
          task diag:cpu | tee diag-cpu-output.txt

      - name: Publish diagnostic to job summary
        run: |
          {
            echo "## CPU-topology diagnostic (10-04-PLAN)"
            echo ""
            echo "Dispatched runs-on label: \`${RUNNER_LABEL}\`."
            echo ""
            echo '```'
            cat diag-cpu-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
