# GATE-01..GATE-03: a pull request that changes shipped code (cmd/** or
# internal/**, excluding *_test.go and testdata/) must add a changelog fragment
# (.changes/unreleased/*.yaml) or carry a reasoned
# `<!-- changelog-exempt: <reason> -->` marker in its body.
#
# dorny/paths-filter reads the pull request's file list through the REST API
# and sets two outputs: `code` (the pull request changes shipped code) and
# `fragment` (it adds a fragment). `task check:fragment-required` reads both, the
# pull request's changed-file count and the body. It fails unless both
# outputs are exactly true or false, so a filter that did not run fails the
# gate. It fails at 3,000 changed files or more, because the REST listing
# stops there. The filter step has no continue-on-error, so a filter failure
# fails the gate too.
#
# pull_request_target, with no checkout of the pull request's code: the policy
# that judges a pull request is always the one on main. The base checkout
# below provides only the Taskfile and the tools. Untrusted input (the PR
# body) reaches the shell only through the environment.
#
# The workflow posts no comment and holds only read scopes (D-03). The check
# log is the whole of the guidance, and the exit status is the verdict.
#
# The job's `name:` is the ruleset's required-check context string. Keep it
# `fragment-required`.
name: Fragment Required

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment-required:
    name: fragment-required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out policy from the base branch
        # No `ref:` on purpose: this checks out the base, not the PR head.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Every pattern of a filter must match a file (`every`).
      - name: Filter the changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '{cmd,internal}/**'
              - '!**/*_test.go'
              - '!**/testdata/**'
            fragment:
              - added: '.changes/unreleased/*.yaml'

      # No cache is read or written under pull_request_target.
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: task uv
          cache: "false"

      - name: Evaluate fragment policy
        env:
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          FRAGMENT_ADDED: ${{ steps.filter.outputs.fragment }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          # Untrusted input reaches the shell via the environment only.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: task check:fragment-required
