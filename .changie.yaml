# CHANGELOG.md is generated by `changie merge` from .changes/header.tpl.md
# plus every .changes/v*.md file, newest first. Never hand-edit
# CHANGELOG.md or a .changes/v*.md file — both are tool-owned output.
#
# Record a user-visible change with:
#   task changie -- new -k <Kind> -b "<sentence>" -m PR=<n>
# -m PR=<n> is optional.
#
# Kinds, their auto bumps, the PR field and the three format strings
# below are locked by CHG-01 (01-CONTEXT.md D-10) — this file copies
# that design, it does not redesign it. PR is optional per 02-CONTEXT
# D-13, which supersedes D-11: every fragment of a milestone would
# carry the same milestone-PR number, so a fragment may omit it.
# changeFormat's PR conditional renders such an entry without a link,
# and minInt still refuses PR=0.
#
# newlines has four keys. afterChangelogHeader separates the header
# from the newest version. beforeKind, afterKind and endOfVersion make
# a batched version file match the shape of the seeds: a blank line
# after the version heading, around each kind heading, and at the end.
# That final blank line keeps every merged `## [` heading at the start
# of a line; without it, `changie merge` glues the next heading onto
# the last bullet and the release PR's required `test` check goes red.
# The keys act only on files changie writes. The seeded .changes/v*.md
# baseline files (byte-sliced from the historical CHANGELOG.md) are
# untouched, so `changie merge --dry-run` stays byte-identical to
# CHANGELOG.md (check:changie leg 3). D-13 (Phase 5, 05-01)
# supersedes Phase 1 D-02's single-override rule (05-RESEARCH.md
# Pitfall 1).
#
# fragmentFileFormat adds sub-second precision to changie v1.26.0's
# default (seconds-only) template: measured at planning time, the
# default silently overwrote a same-kind fragment written in the same
# second (01-RESEARCH.md / 01-CONTEXT.md Claude's Discretion).
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.Version}}](https://github.com/seanb4t/codegraph-go/releases/tag/{{.Version}}) — {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}{{if .Custom.PR}} ([#{{.Custom.PR}}](https://github.com/seanb4t/codegraph-go/pull/{{.Custom.PR}})){{end}}'
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405.000000000"}}'
kinds:
  - label: Breaking
    auto: minor        # pre-1.0: breaking bumps minor. Flip to major at 1.0.
  - label: Features
    auto: minor
  - label: Fixes
    auto: patch
  - label: Performance
    auto: patch
  - label: Dependencies
    auto: patch
custom:
  - key: PR
    type: int
    minInt: 1
    optional: true
newlines:
  afterChangelogHeader: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 2
