# Every tool that builds, tests, lints and releases this repository, for local use and CI.
# Install them with `mise install`, and the git hooks with `hk install --mise`. After any change
# to [tools], run `mise lock --platform linux-x64,linux-arm64,macos-arm64` (hk publishes no
# macos-x64 build) and commit mise.lock.
[tools]
# The `go` line of go.mod must not exceed this toolchain.
go = "1.26.10"
node = "24.22.1"
pnpm = "11.23.0"
uv = "0.13.5"
task = "3.52.0"
goreleaser = "2.17.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
changie = "1.26.0"
golangci-lint = "2.13.2"
# Runs the Go tests with JUnit output and the slowest-test report; never with --rerun-fails.
gotestsum = "1.13.0"
actionlint = "1.7.12"
# GitHub Actions security linter; lint:actions runs it after actionlint.
zizmor = "1.31.1"
buf = "1.72.0"
# Must equal go.mod's google.golang.org/protobuf version (TestProtocGenGoMatchesProtobufRuntime).
protoc-gen-go = "1.36.11"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.20.0"
cosign = "3.1.4"
syft = "1.55.0"
# The linux cross-compile C toolchain (`zig cc`); linux-cross-canary.yml proves this version.
zig = "0.15.1"
# hk.pkl imports the hk package at the same version.
hk = "2.5.0"
# `openspec update` writes the /opsx:* commands and openspec-* skills for the CLI version that
# runs it. Run it after a bump and commit what it writes.
"npm:@fission-ai/openspec" = "1.14.2"
# Reference tools for `task eval:semantic`. They run in development and CI only and never ship.
"github:scip-code/scip-go" = "0.2.9"
"github:scip-code/scip" = "0.10.0"
"npm:@sourcegraph/scip-typescript" = "0.5.2"
java = "temurin-25.0.5+8.0.LTS"

# The jars of the scip-javac compiler plugin. `task eval:semantic` passes them to javac.
[tools."http:scip-javac"]
version = "0.13.2"
url = "https://repo1.maven.org/maven2/org/scip-code/scip-javac/0.13.2/scip-javac-0.13.2.jar"
format = "raw"

[tools."http:scip-shared"]
version = "0.13.2"
url = "https://repo1.maven.org/maven2/org/scip-code/scip-shared/0.13.2/scip-shared-0.13.2.jar"
format = "raw"

[tools."http:scip-java-bindings"]
version = "0.10.0"
url = "https://repo1.maven.org/maven2/org/scip-code/scip-java-bindings/0.10.0/scip-java-bindings-0.10.0.jar"
format = "raw"

[tools."http:protobuf-java"]
version = "4.34.2"
url = "https://repo1.maven.org/maven2/com/google/protobuf/protobuf-java/4.34.2/protobuf-java-4.34.2.jar"
format = "raw"

[env]
# A go.mod that asks for a newer Go fails the build instead of downloading another toolchain.
GOTOOLCHAIN = "local"
