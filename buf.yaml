# buf.yaml (v2) roots a single buf module at the repo root so both proto
# surfaces this repo maintains — internal/schema/graph.proto (existing,
# hand-authored codegen never previously regenerated by a checked-in
# invocation) and internal/uiproto/uiv1/ui.proto (new this plan) — resolve
# under one workspace and `buf generate` regenerates both in one run
# (RPC-01, BLD-04; 01-CONTEXT.md). Additive-only field numbering (D-02a)
# is enforced by convention and doc comments in both .proto files, not by
# a buf breaking-change or lint gate — neither is configured here.
version: v2
modules:
  - path: .
