# strictDepBuilds (D-14, BLD-05): pnpm exits non-zero on install if any
# dependency in the tree carries an unreviewed lifecycle/build script,
# rather than exiting 0 with an "Ignored build scripts" warning. Set
# BEFORE the first `pnpm install` so the very first dependency tree that
# lands is already gated (02-01-PLAN.md Task 1 step d).
#
# allowBuilds is populated below by `pnpm approve-builds`, which records
# denials as `false` rather than omitting the key entirely — this file
# states both halves (approved and denied) once populated.
#
# 02-07: `pnpm approve-builds --all` reports "There are no packages awaiting
# approval" for this dependency tree (02-01-SUMMARY.md, 02-05-SUMMARY.md) and
# — confirmed empirically in 02-07 — does not write anything to this file
# when nothing is pending, leaving the key absent rather than an explicit
# empty map. `task web:deps:strict` (BLD-05) treats total absence as a named
# failure distinct from a committed empty map, so the empty map below is
# written by hand once, here, to record "approval was checked and there is
# nothing to approve" as committed config, per ROADMAP's own instruction
# that approval state belongs in committed config, never in per-machine
# interactive state. Re-run `pnpm approve-builds --all` if a future
# dependency actually needs approval — it will populate real entries here.
strictDepBuilds: true
allowBuilds: {}

# 02-07 (BLD-06): forces the `cookie` transitive dependency pulled in by
# @sveltejs/kit@2.70.3 past GHSA-pxg6-pf52-xh8x (cookie <0.7.0 accepts
# out-of-bounds characters in cookie name/path/domain — advisory 1103907,
# severity low, dev-only). @sveltejs/kit's own published dependency range
# is still `cookie: ^0.6.0` as of this writing (verified against
# @sveltejs/kit@latest 02-07) — upstream has not bumped it — so a plain
# `pnpm update` cannot reach the patched line; this override forces
# resolution to >=0.7.2 without waiting on that upstream bump. Verified:
# `pnpm audit` reports zero advisories after this override, and `pnpm
# build` / `svelte-check` are unaffected — cookie 0.6->0.7 is a
# parsing-strictness fix, not an API change SvelteKit's usage depends on.
# Revisit (loosen or drop) once @sveltejs/kit ships its own bump past
# cookie@0.7.0.
overrides:
  cookie@<0.7.0: ^0.7.2
